# golangci-lint v2 config — hardened union for a2ahub.
#
# `make check` (root Makefile) refuses to run if this file exists but
# golangci-lint is not installed — a configured gate that silently skips is
# a hole, not a gate (spec 01-foundation.md §T5).
#
# This is the union of a2ahub's original baseline (errcheck/govet/ineffassign/
# staticcheck/unused/revive) with sporo's hardened set (gosec/errorlint/
# bodyclose/nilerr/nolintlint/…) — P4 of the publish-prep epic (spec
# 04-lint-coverage.md).
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - asciicheck
    - bodyclose
    - copyloopvar
    - errorlint
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - gomoddirectives
    - goprintffuncname
    - gosec
    - makezero
    - nakedret
    - nilerr
    - nolintlint
    - depguard
  settings:
    # depguard — ADR-023 (docs/decisions.md) supersedes ADR-001's "May
    # import" column: this is now the single MACHINE-ENFORCED home for the
    # internal/ import boundary; ADR-001's column survives as historical
    # record, renamed to point here. One rule per internal/ package (plus
    # internal/agentprompt and internal/viewvocab, which ADR-001 never rowed),
    # `list-mode: strict` (deny unless allowed — an omitted entry is a
    # refusal, not a gap), `files: ["**/internal/<pkg>/*.go", "!$test"]` so
    # a package's own test files are exempt (scripts/check-cross-layer-test-
    # import-ceiling.sh separately ceilings that exemption; see its own
    # header for why a hand-typed exclusion is not this repo's shape).
    # $gostd covers the standard library; every other entry is either a
    # third-party module (mirroring ADR-002's approved set, or named as a
    # deviation where it is not — see internal-html below) or an exact-
    # matched (trailing `$`) internal/ package. The `$` suffix is load-
    # bearing: several package names are string-prefixes of a sibling
    # (internal/operation ⊂ internal/operational ⊂
    # internal/operationalsource; internal/contract ⊂
    # internal/contractwiring; internal/space ⊂ internal/spacenotify) and
    # depguard's own allow-matching is prefix-based without it.
    #
    # This config is the RECONCILED graph, not a transcription of ADR-001's
    # per-row data — 13 of its 22 internal/ rows had drifted from the code
    # (6 pure stale grants, pruned below; the rest either name a package
    # ADR-001 predates, granted here, or reverse a declared edge that the
    # code never built, corrected here). scripts/check-import-rule-
    # coverage.sh is the separate, permanent check for the half depguard
    # cannot see for itself: a rule with no corresponding row, and an allow
    # entry no file actually uses.
    depguard:
      rules:
        internal-artifact:
          files:
            - "**/internal/artifact/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/oklog/ulid/v2
            - gopkg.in/yaml.v3
        internal-schema:
          files:
            - "**/internal/schema/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/santhosh-tekuri/jsonschema/v6
            - github.com/santhosh-tekuri/jsonschema/v6/kind
            - github.com/ydnikolaev/a2ahub/schemas
            - gopkg.in/yaml.v3
        internal-fold:
          files:
            - "**/internal/fold/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/internal/artifact$
        internal-sensitive:
          files:
            - "**/internal/sensitive/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
        internal-validate:
          files:
            - "**/internal/validate/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/schemas
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/contract$
            - github.com/ydnikolaev/a2ahub/internal/fold$
            - github.com/ydnikolaev/a2ahub/internal/provenance$
            - github.com/ydnikolaev/a2ahub/internal/schema$
            - github.com/ydnikolaev/a2ahub/internal/sensitive$
            - github.com/ydnikolaev/a2ahub/internal/version$
        internal-workreport:
          files:
            - "**/internal/workreport/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/internal/operation$
            - github.com/ydnikolaev/a2ahub/internal/provenance$
        internal-operational:
          files:
            - "**/internal/operational/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/internal/sensitive$
            - github.com/ydnikolaev/a2ahub/internal/workreport$
        internal-contract:
          files:
            - "**/internal/contract/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/operation$
            - github.com/ydnikolaev/a2ahub/internal/version$
        internal-host:
