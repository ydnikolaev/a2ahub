            - github.com/ydnikolaev/a2ahub/internal/workreport$
        internal-datatransport:
          files:
            - "**/internal/datatransport/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/internal/datapackage$
        internal-datapackage:
          files:
            - "**/internal/datapackage/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - golang.org/x/sys/unix
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/schema$
        internal-cache:
          files:
            - "**/internal/cache/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/avatar$
            - github.com/ydnikolaev/a2ahub/internal/contract$
            - github.com/ydnikolaev/a2ahub/internal/datapackage$
            - github.com/ydnikolaev/a2ahub/internal/fold$
            - github.com/ydnikolaev/a2ahub/internal/host$
            - github.com/ydnikolaev/a2ahub/internal/notes$
            - github.com/ydnikolaev/a2ahub/internal/pendency$
            - github.com/ydnikolaev/a2ahub/internal/provenance$
            - github.com/ydnikolaev/a2ahub/internal/release$
            - github.com/ydnikolaev/a2ahub/internal/schema$
            - github.com/ydnikolaev/a2ahub/internal/sensitive$
            - github.com/ydnikolaev/a2ahub/internal/space$
            - github.com/ydnikolaev/a2ahub/internal/version$
            - github.com/ydnikolaev/a2ahub/internal/workreport$
        internal-template:
          files:
            - "**/internal/template/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/schemas
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/schema$
            - github.com/ydnikolaev/a2ahub/internal/space$
        internal-notes:
          files:
            - "**/internal/notes/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/release$
            - github.com/ydnikolaev/a2ahub/internal/schema$
            - github.com/ydnikolaev/a2ahub/internal/version$
        internal-surface:
          files:
            - "**/internal/surface/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
        internal-notification:
          files:
            - "**/internal/notification/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/cache$
            - github.com/ydnikolaev/a2ahub/internal/space$
        internal-contractwiring:
          files:
            - "**/internal/contractwiring/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/cache$
            - github.com/ydnikolaev/a2ahub/internal/contract$
            - github.com/ydnikolaev/a2ahub/internal/fold$
            - github.com/ydnikolaev/a2ahub/internal/host$
            - github.com/ydnikolaev/a2ahub/internal/space$
            - github.com/ydnikolaev/a2ahub/internal/template$
            - github.com/ydnikolaev/a2ahub/internal/validate$
        internal-cli:
          files:
            - "**/internal/cli/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/releasenotes
            - github.com/ydnikolaev/a2ahub/schemas
            - github.com/ydnikolaev/a2ahub/skill
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/agentid$
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/cache$
            - github.com/ydnikolaev/a2ahub/internal/contract$
            - github.com/ydnikolaev/a2ahub/internal/datapackage$
            - github.com/ydnikolaev/a2ahub/internal/feedback$
            - github.com/ydnikolaev/a2ahub/internal/fold$
            - github.com/ydnikolaev/a2ahub/internal/ghauth$
            - github.com/ydnikolaev/a2ahub/internal/host$
            - github.com/ydnikolaev/a2ahub/internal/html$
            - github.com/ydnikolaev/a2ahub/internal/localserver$
            - github.com/ydnikolaev/a2ahub/internal/notes$
            - github.com/ydnikolaev/a2ahub/internal/notification$
            - github.com/ydnikolaev/a2ahub/internal/operation$
            - github.com/ydnikolaev/a2ahub/internal/operational$
            - github.com/ydnikolaev/a2ahub/internal/release$
            - github.com/ydnikolaev/a2ahub/internal/schema$
            - github.com/ydnikolaev/a2ahub/internal/skillcoverage$
            - github.com/ydnikolaev/a2ahub/internal/space$
            - github.com/ydnikolaev/a2ahub/internal/spacenotify$
            - github.com/ydnikolaev/a2ahub/internal/surface$
            - github.com/ydnikolaev/a2ahub/internal/template$
            - github.com/ydnikolaev/a2ahub/internal/validate$
            - github.com/ydnikolaev/a2ahub/internal/version$
            - github.com/ydnikolaev/a2ahub/internal/workcheckpoint$
            - github.com/ydnikolaev/a2ahub/internal/workreport$
        internal-mcp:
          files:
            - "**/internal/mcp/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/releasenotes
            - github.com/ydnikolaev/a2ahub/skill
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/agentid$
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/cache$
            - github.com/ydnikolaev/a2ahub/internal/contract$
            - github.com/ydnikolaev/a2ahub/internal/datapackage$
            - github.com/ydnikolaev/a2ahub/internal/fold$
            - github.com/ydnikolaev/a2ahub/internal/host$
            - github.com/ydnikolaev/a2ahub/internal/notes$
            - github.com/ydnikolaev/a2ahub/internal/operation$
            - github.com/ydnikolaev/a2ahub/internal/release$
            - github.com/ydnikolaev/a2ahub/internal/schema$
            - github.com/ydnikolaev/a2ahub/internal/space$
            - github.com/ydnikolaev/a2ahub/internal/template$
            - github.com/ydnikolaev/a2ahub/internal/validate$
            - github.com/ydnikolaev/a2ahub/internal/version$
            - github.com/ydnikolaev/a2ahub/internal/workreport$
          deny:
            - pkg: github.com/ydnikolaev/a2ahub/internal/cli$
              desc: >-
                ADR-023 supersedes ADR-001's mcp cell: the forbidden package, never an allowed one — see docs/decisions.md
        internal-html:
          files:
            - "**/internal/html/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/releasenotes
            - github.com/ydnikolaev/a2ahub/skill
            - github.com/yuin/goldmark
            - github.com/yuin/goldmark/ast
            - github.com/yuin/goldmark/extension
            - github.com/yuin/goldmark/parser
            - github.com/yuin/goldmark/renderer
            - github.com/yuin/goldmark/text
            - github.com/yuin/goldmark/util
            - gopkg.in/yaml.v3
            - github.com/ydnikolaev/a2ahub/internal/agentprompt$
            - github.com/ydnikolaev/a2ahub/internal/artifact$
            - github.com/ydnikolaev/a2ahub/internal/cache$
            - github.com/ydnikolaev/a2ahub/internal/contract$
            - github.com/ydnikolaev/a2ahub/internal/datapackage$
            - github.com/ydnikolaev/a2ahub/internal/fold$
            - github.com/ydnikolaev/a2ahub/internal/notes$
            - github.com/ydnikolaev/a2ahub/internal/operational$
            - github.com/ydnikolaev/a2ahub/internal/provenance$
            - github.com/ydnikolaev/a2ahub/internal/space$
            - github.com/ydnikolaev/a2ahub/internal/viewvocab$
            - github.com/ydnikolaev/a2ahub/internal/workreport$
        internal-localserver:
          files:
            - "**/internal/localserver/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/internal/operational$
        internal-agentprompt:
          files:
            - "**/internal/agentprompt/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/ydnikolaev/a2ahub/internal/fold$
        internal-viewvocab:
          files:
            - "**/internal/viewvocab/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
        # The never-built validator-backlog:478 rule, now built: ADR-001's
        # Rules paragraph states "core packages never import cli/mcp/
        # localserver" as a RULE, not a per-row fact, and nothing enforced
        # the DIRECTION before this — internal-cli/internal-mcp/internal-
        # localserver above each enumerate what THAT package may import,
        # but say nothing about who may import THEM. The 2026-08-18
        # internal/contractwiring inversion (three cli.New*Adapter calls
        # carried down into a package below cli) is what found the hole;
        # `internal/livee2e/templateplanner.go` was HEAD's one live
        # instance (fixed by this same phase, now importing internal/
        # template directly instead). Lax mode (deny-only) rather than a
        # 19-package enumeration: every internal/ file except cli's, mcp's,
        # localserver's own and internal/livee2e's build-tagged `_live.go`
        # scenario drivers (the one legitimate exception — they exist to
        # drive the real binary in-process under `//go:build livee2e`) is
        # denied these three imports outright.
        internal-frontend-boundary:
          files:
            - "**/internal/**/*.go"
            - "!$test"
            - "!**/internal/cli/**"
            - "!**/internal/mcp/**"
            - "!**/internal/localserver/**"
            - "!**/internal/livee2e/*_live.go"
          list-mode: lax
          deny:
            - pkg: github.com/ydnikolaev/a2ahub/internal/cli$
              desc: >-
                core packages never import internal/cli (ADR-001's Rules
                paragraph; ADR-023 makes it machine-enforced) — DI belongs
                at cmd/a2a, never below.
            - pkg: github.com/ydnikolaev/a2ahub/internal/mcp$
              desc: >-
                core packages never import internal/mcp (ADR-001's Rules
                paragraph; ADR-023 makes it machine-enforced).
            - pkg: github.com/ydnikolaev/a2ahub/internal/localserver$
              desc: >-
                core packages never import internal/localserver (ADR-001's
                Rules paragraph; ADR-023 makes it machine-enforced) —
                localserver is the sole loopback HTTP exception, never a
                dependency of something below it.
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: unused-parameter
        - name: unreachable-code
    gosec:
      excludes:
        - G301 # 0755 dirs — a2ahub writes user-facing project/staging/mirror
               # directories that are meant to be readable, not secrets.
        - G306 # 0644 files — same: staged drafts / cache / space mirrors are
               # meant to be readable, 0600 would be wrong for this use case.
    nakedret:
      max-func-lines: 30
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [revive]
      # gosec: the handful of gosec findings inside _test.go are all
      # test-fixture-only (a test computing a path under its own t.TempDir(),
      # seeding math/rand deterministically for a property test, or an
      # httptest handler echoing the request path back into a LOCAL test
      # response) — none of them touch real attacker-controlled input.
      # gosec stays fully live in production (non-test) code.
      - path: _test\.go
        linters: [gosec]
      # G204 accepted execution seams. The executable is either a fixed
      # platform/git binary, a locally verified release/helper path, or the
      # explicit cmd:<argv> credential feature. Exact file paths keep a new
      # execution site anywhere else red; scripts/check-gosec-scope.sh has the
      # outside-allowlist teeth.
      # internal/ghauth/ghauth.go: the `gh auth token` probe, moved here from
      # internal/space/credential.go when internal/release turned out to need
      # the same token and neither layer could import the other. Same seam,
      # same fixed argv (`gh auth token`, resolved via exec.LookPath, never a
      # shell) — only its address changed.
      # internal/cli/cmd_notify_setup.go: the setup flow's two exec seams, both
      # fixed argv against a LookPath-resolved binary and never a shell — `gh
      # secret set/list` (the secret is sealed by gh, which owns the NaCl
      # crypto this binary has no dependency for) and `stty -echo` around the
      # TTY token prompt. Same shape as internal/ghauth's own `gh auth token`.
      - path: ^(cmd/a2a/notifications_platform\.go|internal/cache/mirror\.go|internal/cli/(cmd_contract|cmd_html|cmd_notify_setup|cmd_statusline|cmd_update|cmd_validate_ci|contract_git)\.go|internal/ghauth/ghauth\.go|internal/host/github\.go|internal/mcp/tools_contract\.go|internal/release/selfcheck\.go|internal/space/(credential|mirror)\.go)$
        text: "G204:"
        linters: [gosec]
      # cmd/a2a/feedback_freshness.go: AC3's hub-of-record freshness probe
      # (agent-exchange P9 wave D2). Three fixed git argvs — rev-parse
      # --is-inside-work-tree, fetch --no-tags --depth=1 <hub> main, ls-tree
      # -r --name-only FETCH_HEAD — never a shell, mirroring the argv
      # docs/runbooks/feedback-sync.sh already runs rather than deriving a
      # second answer to "has the hub moved".
      #
      # G702 (taint) is listed as well as G204 because hubURL arrives from
      # A2A_FEEDBACK_HUB_URL, and `git fetch` reads `<helper>::<arg>` as a
      # transport helper. feedbackHubURLIsFetchable refuses `::` outright and
      # admits only https/http/git@ URLs and absolute paths, BEFORE the value
      # reaches an argv; gosec's taint pass cannot see that guard, which is
      # what this entry is for.
      #
      # Sized honestly, because it was measured rather than assumed: with the
      # guard disabled, git itself still refuses (`transport 'ext' not
      # allowed`, since protocol.ext.allow defaults to none). The guard is a
      # second line whose value is that it does not depend on a git default an
      # environment can change, and that its refusal names what the operator
      # actually typed. TestResolveFeedbackFreshness_RefusesATransportHelperHub
      # is what keeps it honest.
      - path: ^cmd/a2a/feedback_freshness\.go$
        text: "G(204|702):"
        linters: [gosec]
      # Test support binaries shell only to the fixture's own git repositories.
      - path: ^testkit/(fakegithub/fakegithub|spacefixture/spacefixture)\.go$
        text: "G204:"
        linters: [gosec]
      # internal/lane is the P12 lane deriver: harness-only, never linked into
      # cmd/a2a, and it reads ONLY this repository's own gate scripts, Makefile,
      # verify.sh and telemetry to answer "which validation phases can this diff
      # reach". Its filesystem reads and its one `git ls-files` (fixed argv, no
      # shell) are deliberately funnelled through the single file below so this
      # allowlist grows by ONE reviewed path instead of the six call sites the
      # reads are spread across — see fsread.go's own header for why that seam
      # exists and why its two-line `path := …; os.ReadFile(path)` shape is
      # load-bearing (collapsing it to one line makes gosec silent, which is a
      # blind spot dressed up as compliance, not a fix).
      - path: ^internal/lane/fsread\.go$
        text: "G(204|304):"
        linters: [gosec]
      # G304 accepted file seams. These functions receive paths already rooted
      # in project config, a mirror/staging checkout, a release cache, or an
      # explicitly selected local input. This is deliberately an exact-file
      # allowlist, not the former repository-global suppression.
      # internal/cli/cmd_notify.go reads `space.yaml` from the same
      # already-resolved root cmd_validate_ci.go does, one line above it in
      # this same allowlist, for the same reason: the space-CI notification
      # projection runs in a checkout and takes its facts from the repository.
      - path: ^(cmd/a2a/wire\.go|internal/(artifact/digesttree|cache/(cursor|marker|mirror|statusline_refresh)|cli/(adapters|cmd_init|cmd_notify|cmd_notify_setup|cmd_skill|cmd_validate_ci)|coveragepolicy/policy|e2e/coverage|feedback/(ledger|triage)|html/assemble|mcp/(adapters|wire)|notification/files|release/(cache|cohort|detail|download|verifier)|space/(config|mirror|mirrorlock)|surface/link|template/contract_scaffold)\.go)$
        text: "G304:"
        linters: [gosec]
      # nilerr: a2ahub's validate/adapter layer returns validation FAILURES as
      # DATA ("return violations, nil") by design — a schema/legality/spec
      # violation is not a Go error, it's the successful result of running the
      # check. Scoping nilerr off these specific files keeps it live
      # everywhere else, so a REAL nil-on-error bug still reds.
      - path: internal/validate/engine\.go
        linters: [nilerr]
      - path: internal/validate/consumes\.go
        linters: [nilerr]
      - path: internal/cli/adapters\.go
        linters: [nilerr]
      - path: internal/mcp/adapters\.go
        linters: [nilerr]
      - path: internal/cli/cmd_validate_ci\.go
        linters: [nilerr]

# No display caps — print EVERY finding, not golangci's default first-50-per-
# linter / first-3-same. The gate exit code already reds on any issue; this just
# keeps the output honest (no silent truncation) — matches sporo.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable: [gofmt]
