# Product-repo CI (spec 01-foundation.md §T5): runs `make check` — the
# gate the root Makefile already defines (gofmt/vet/test once go.mod
# exists, plus the pre-existing repo gates feature-lint/epic-drift). The
# only project-specific step is `make check` itself; the Makefile's steps
# are never reimplemented inline here.
#
# golangci-lint provisioning is a toolchain-setup step (like the Go setup
# above it), not a project step: ADR-002 lists golangci-lint as a tool
# that never enters go.mod (a binary the gate invokes), and the Makefile's
# `check` target intentionally fails loudly if .golangci.yml exists but
# the binary is missing — so CI must provision it or `make check` always
# reds once this phase lands.
name: CI

# A bare `push:` fires on EVERY branch and EVERY tag. Cutting a release pushes
# the candidate branch, then main, then the tag — three pushes of ONE commit —
# so the full ceiling ran three times on the same SHA, twice for nothing. On
# 2026-08-12 that was seven concurrent runs against one commit across the two
# repos, and the compute is not free.
#
# Tags were excluded on that reasoning too — a tag points at a commit main
# already carries, so the tag run could only repeat main's verdict. THAT
# PREMISE NO LONGER HOLDS and the tags are back; see "TAGS ARE BACK" below,
# which is the same fact read after K4 moved the ceiling off push.
#
# The candidate branches stay IN, deliberately. That run happens BEFORE
# promotion, which is the only moment its verdict can still stop a release —
# and it earned its keep the same day, catching a stamp defect that every local
# gate had passed.
#
# The weekly `schedule` is the SAFETY NET for the path gate below, and it is
# deliberately singular. A filter that silently never fires looks exactly like
# a filter that correctly never fires, and the only thing that tells them
# apart is an execution that does not depend on the filter. `scripts/ci-changes.sh`
# scopes it to the PUBLIC repository alone (spec 13 AC2): two repositories
# would re-add roughly 104 macOS runs a year to learn one repository's worth
# of information.
#
# TAGS ARE BACK, and the reason is the cadence change below rather than a
# reversal. They were dropped because "a tag names a commit main already
# carries", which was true while a push to main ran the ceiling. It no longer
# does: a push runs the DERIVED LANE and the ceiling runs at the ship
# boundary. The tag IS that boundary.
on:
  push:
    branches:
      - main
      - 'a2a-candidate/**'
    tags:
      - 'v*.*.*'
  pull_request:
  schedule:
    # The macOS path-gate's weekly safety net (K1, AC2).
    - cron: '17 6 * * 1'
    # The ceiling's new home (K4, AC8). Push no longer buys it, so this is
    # what keeps `main` from going a week unproven. §3.3 accepts up to 24
    # hours of latency on that verdict and records the acceptance as the
    # operator's, not the implementer's.
    - cron: '23 2 * * *'
  # The input exists because the spec asked for two contradictory things from
  # this one trigger, and shipping either alone makes the other unexecutable.
  # AC8 puts the CEILING on workflow_dispatch; §5 rung 5 and §5.1 check 10 say
  # a per-wave dispatch must run the DERIVED LANE, "never the ceiling", and
  # price it at single-digit minutes rather than fifteen. Both are reasonable
  # and they are about different occasions: proving a tree, versus observing
  # what a wave changed about selection. So the occasion is an input, and the
  # default is the expensive, safe one.
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier this dispatch buys'
        type: choice
        default: ceiling
        options:
          - ceiling
          - lane

# Superseded runs stop (P13 K6, AC6). 689 commits in twelve days, pushed in
# bursts, and every intermediate push held a runner to completion while the
# tip was already being pushed on top of it.
#
# The trade is real and is stated rather than hidden: intermediate commits
# stop being proven, only the tip is. That is the intent at this commit rate,
# but it changes what the history guarantees, so it is written down where the
# setting lives.
#
# The group is scoped by `github.workflow`, which is what keeps `Release` out
# of it: cancelling a half-finished goreleaser or Sigstore run is worse than
# paying for it. A tag or candidate ref is unique, so nothing cancels there
# either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The changed-file set is resolved ONCE, here, and every expensive job
  # downstream gates on an output of this job rather than on a decision of its
  # own (spec 13 §3.2, rung 0, AC16). The decision itself lives in
  # scripts/ci-changes.sh, which has its own --teeth and runs at a terminal;
  # a `${{ }}` expression has neither property, and actionlint was MEASURED
  # on 2026-08-12 saying nothing at all about a job with no path condition.
  changes:
    # timeout-minutes: a new job identity, so scripts/lib/job-timeouts.tsv has
    # no measured p99 for it yet and this is the artefact's stated floor. It
    # is one API read and a shell script; the next --p99 regeneration replaces
    # this with a measurement.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.resolve.outputs.macos }}
      resolved: ${{ steps.resolve.outputs.resolved }}
      files: ${{ steps.resolve.outputs.files }}
      tier: ${{ steps.resolve.outputs.tier }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve the changed-file set and the tier it justifies
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_SCHEDULE: ${{ github.event.schedule }}
          CI_DISPATCH_TIER: ${{ inputs.tier }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_AFTER_SHA: ${{ github.sha }}
        run: bash scripts/ci-changes.sh

  # THE CEILING, now at the ship boundary instead of on every push.
  #
  # `.claude/rules/check-convention.md` has carried the cadence since P12 —
  # the derived lane is the COMMIT gate, the ceiling is the SHIP gate — and
  # CI obeyed none of it: `make check` ran on every push, on every branch, in
  # two repositories, while the derivation that prices it existed, was gated,
  # was measured, and was invoked by hand at a terminal.
  #
  # Which tier a run buys is resolved ONCE in scripts/ci-changes.sh, so this
  # condition is a single comparison against one output rather than a policy
  # spelled out in `${{ }}` (AC16). What it resolves to, and why, is
  # documented beside the code that decides it.
  #
  # The old condition this replaces skipped `check` on a push to public main
  # because a promotion re-ran the ceiling on a SHA the candidate had already
  # proven. That case is subsumed: a push to main now buys the lane in EITHER
  # repository, and the candidate ref still buys the ceiling.
  check:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    #
    # 28 is ABOVE what the artefact's sizing rule currently derives (17, from
    # a p99 of 642 s), and that is deliberate rather than stale.
    #
    # The artefact's window is the PINNED, closed one AC12 replays —
    # 2026-08-01..2026-08-11 — and the four longest `check` runs ever observed
    # (1313 / 1239 / 1114 / 1064 s) fall on 08-12, outside it. All four
    # concluded SUCCESS. Sizing this at 17 would cancel a run this project has
    # watched pass, which is exactly the error review A5 caught in the first
    # draft of the spec.
    #
    # So the two windows want different things and both are right: AC12 needs
    # a closed window to replay, AC3 needs the worst tail ever seen. The gate
    # (check-runner-economics.sh, RULE 3) asserts a FLOOR — at or above 1.5x
    # p99 — so it cannot catch an over-provisioned value, and AC3's "a stale
    # timeout is a red line" guarantee is therefore ONE-DIRECTIONAL. Named
    # here because a later reader comparing this number to the artefact will
    # otherwise assume drift.
    timeout-minutes: 28
    needs: changes
    if: needs.changes.outputs.tier == 'ceiling'
    runs-on: ubuntu-latest
    env:
      # setup-go restores this exact build cache; verify.sh accepts an external
      # cache only on GitHub and only at this checkout-owned CI path.
      GOCACHE: ${{ github.workspace }}/.a2a/cache/ci-go-build
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install validation tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # ripgrep: scripts/check-operational-confidence.sh is written against
          # it and a bare GitHub runner does not ship it. Undeclared, its absence
          # was SILENT — the gate reported twenty-seven normative ids as
          # undefined, about a plan file that was present and correct, and this
          # workflow was red on it for forty consecutive runs while releases
          # were cut straight through. The gate now refuses up front when rg is
          # missing; this line is the other half, so it is not missing.
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          rg --version | head -1

      - name: Resolve module inputs
        run: go mod download

      - name: make check
        run: make check

      - name: skill-drift (folded in — P13 K5/AC5, it billed a whole minute for 24s of work)
        run: bash scripts/ci-skill-drift.sh

  # THE DERIVED LANE — the commit gate, and the half of P12 that CI never
  # learned (AC8, AC9).
  #
  # `make lane` intersects each validation phase's own `lane-inputs:`
  # declaration with the changed-file set, so a docs-only commit stops buying
  # evidence that cannot judge it. The set comes from the `changes` job rather
  # than being recomputed here: ONE derivation, two consumers, which is P12's
  # own rule applied to P12's blind spot.
  #
  # It calls lane-run-STRICT, and that is AC9. `scripts/verify.sh
  # --require-nonempty` refuses an empty or unresolvable input set instead of
  # exiting zero having run nothing — a green tick with no gate behind it. The
  # target and the refusal shipped in v0.20.0 and NO workflow called them,
  # which is a fix that exists while the exposure stays open. This is the
  # caller.
  #
  # Note what a Go edit still costs: `logic-e2e` declares `**/*.go`, so any Go
  # change selects the whole conformance matrix. This does not make code
  # cheaper; it stops a docs commit from paying for the Go tiers.
  lane:
    # timeout-minutes: the lane's ceiling is the ceiling's own budget — it can
    # select every phase `check` runs, minus what the diff cannot reach.
    timeout-minutes: 28
    needs: changes
    if: needs.changes.outputs.tier == 'lane'
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.a2a/cache/ci-go-build
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install validation tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          rg --version | head -1

      - name: Resolve module inputs
        run: go mod download

      - name: make lane-run-strict
        env:
          LANE_FILES: ${{ needs.changes.outputs.files }}
        run: make lane-run-strict

      - name: skill-drift (folded in — P13 K5/AC5, it billed a whole minute for 24s of work)
        run: bash scripts/ci-skill-drift.sh

  # THE 2650-EQUIVALENT-MINUTE JOB (spec 13 F1/F2), now reachable only from a
  # diff that can change its verdict.
  #
  # It ran on every push and every pull request in both repositories, at a ×10
  # runner multiplier, for ~52 s of Swift work — 55.6% of a twelve-day bill.
  # Over the same window, ZERO commits touched integrations/macos-notifier/,
  # against 689 commits total. Every one of those minutes proved something
  # that had not changed.
  #
  # The gate is a JOB, never `on.push.paths:` — spec 13 §3.1 states why, and
  # it is the obvious wrong fix somebody will reach for again: a trigger-level
  # filter skips the WHOLE workflow, `check` included, so a change to
  # internal/ would merge ungated.
  #
  # Its other two triggers are already covered and are NOT re-added here:
  # tags are `release.yml`'s own `macos-notifier` job (which builds the
  # shipped artifact), and the weekly net is the `schedule` above, resolved
  # inside ci-changes.sh so this `if:` stays a single reference (AC16).
  macos-notifier:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test and package the ad-hoc companion
        env:
          VERSION: 0.0.0
          SIGNING_MODE: adhoc
          OUTPUT_DIR: ${{ runner.temp }}/a2a-notifier
        run: |
          swift --version
          integrations/macos-notifier/scripts/test.sh
          integrations/macos-notifier/scripts/package-release.sh
