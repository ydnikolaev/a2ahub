# The dumb, unbypassable backstop for the publish boundary. The rich gate
# (scripts/classify-guard.sh, wired into `make check` / `make check-validators`)
# already runs in the CI job above via `make check`; this job re-asserts the one
# invariant that matters with self-contained bash that does NOT depend on the
# local script or the Makefile — the repo tracks no private (harness) path. A
# local `--no-verify` can skip a git hook; it cannot skip CI.
#
# Keep the denylist below in sync with scripts/classify-guard.sh's DENY_* arrays.
#
# TODO(P6): add docs/ to the denylist once its untrack lands (publish-prep P6).
# It is deliberately NOT flagged here yet — docs/ is a PENDING bucket (tracked,
# classified, untracking deferred) per publish-prep P1.
name: classify-guard

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs stop (P13 K6, AC6). 689 commits in twelve days, pushed in
# bursts, and every intermediate push held a runner to completion while the
# tip was already being pushed on top of it.
#
# The trade is real and is stated rather than hidden: intermediate commits
# stop being proven, only the tip is. That is the intent at this commit rate,
# but it changes what the history guarantees, so it is written down where the
# setting lives.
#
# The group is scoped by `github.workflow`, which is what keeps `Release` out
# of it: cancelling a half-finished goreleaser or Sigstore run is worse than
# paying for it. A tag or candidate ref is unique, so nothing cancels there
# either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-private-paths:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: record private source scope
        if: github.repository != 'ydnikolaev/a2ahub'
        run: echo "Private source repository intentionally carries private-only paths; public projection is checked after publication."
      - name: assert no private path is tracked
        # This backstop validates the published projection. The private source
        # repository intentionally tracks private-only dependabot configuration.
        if: github.repository == 'ydnikolaev/a2ahub'
        run: |
          set -euo pipefail
          # scripts/ is matched as a DENY list, not an allow list, and it
          # mirrors the STRIP set in docs/runbooks/publish-to-public.sh —
          # the thing that actually decides what reaches this repo.
          #
          # It used to be an allow list of the four then-public scripts, kept
          # "in sync" with scripts/classify-guard.sh by hand. It rotted the
          # first time a new public script shipped: P33 added
          # release-preflight.sh, the local gate stayed green, and this job
          # failed the push. An allow list of public files has to be edited
          # every time the product grows; a deny list of private ones only
          # changes when the privacy boundary itself moves.
          #
          # .github/dependabot.yml is in the deny set for a different reason
          # than the rest: it is not secret, it simply cannot function here
          # (public main is force-pushed, so a merged bump is destroyed and
          # reopened forever). Dependabot runs on the private repo instead. If
          # this file reappears here, the publish filter regressed.
          # `scripts/lib/` is NOT a private directory, and as of 2026-08-12
          # NOTHING under it is: `gate-lib.sh` was published because SEVEN
          # tracked gates in REPO_GATES source it and died without it in the
          # filtered candidate. `lane-ungated.txt` is a PUBLIC validator file —
          # scripts/classify-guard.sh lists it in PUBLIC_VALIDATOR_FILES, and
          # scripts/check-lane-declarations.sh (which ships) cannot run without
          # it. This pattern said `lib/` and went red on the v0.19.9 tag for a
          # file that is supposed to be here.
          #
          # release-loop-2026-08 P5 tried to DERIVE this list rather than
          # hand-type it, and could not: this step only ever runs against the
          # PUBLIC checkout (`if: github.repository == 'ydnikolaev/a2ahub'`,
          # above), where `docs/runbooks/publish-to-public.sh` — the one place
          # the private-only script set is declared — does not exist, having
          # been stripped by the very filter this backstop exists to double-
          # check. There is nothing present at runtime to derive FROM. A
          # `.gitignore`-based derivation was tried too and rejected: this
          # repo's own `.gitignore` un-ignores every one of these scripts (so
          # they can be tracked here, in the private dev repo, ahead of being
          # stripped at publish) — it does not distinguish "private, stripped
          # later" from "public, stays" at all, so it cannot stand in for the
          # publisher's STRIP set either.
          #
          # So this stays a hand-typed literal, corrected to name every script
          # `docs/runbooks/publish-to-public.sh`'s STRIP=( ) block currently
          # strips (was missing 5 of 6). It is no longer the "fourth
          # restatement of one list" — P5's derivation of
          # scripts/classify-guard.sh's PRIVATE_ONLY_FILES from that same
          # STRIP set removed the third copy, so this is now the ONLY other
          # reader, not one of a rotting set. It can still drift from STRIP by
          # hand, same as before; nothing here removes that risk, only the
          # duplication one layer down.
          priv=$(git ls-files | grep -E '^(\.agents|\.claude|\.codex|\.mate)/|^(AGENTS\.md|CLAUDE\.md)$|^\.github/dependabot\.yml$|^scripts/check-feature-lint\.sh$|^scripts/check-feedback-corpus\.sh$|^scripts/check-skill-citations\.sh$|^scripts/check-spec-verify-refs\.sh$|^scripts/check-dashboard-props\.sh$|^scripts/check-card-content\.sh$' || true)
          if [ -n "$priv" ]; then
            echo "::error::private (harness) paths tracked in the public repo:"
            echo "$priv"
            exit 1
          fi
          echo "OK — no private path tracked (docs/ PENDING bucket not yet checked here — TODO(P6))."
