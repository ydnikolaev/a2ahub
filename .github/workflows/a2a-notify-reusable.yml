# The SSOT space-notification workflow (space-notify-2026-08 P5, spec 05
# §T5). ONE home for the `a2a notify render` + `a2a notify send` invocation
# — the pinned module version co-located in one versioned unit, exactly the
# shape a2a-validate-reusable.yml already established for the SAME reasons
# (read that file's own header first). A space references this file by a
# release-tag-pinned path and carries NO notification logic, NO pinned
# binary and NO fetch-token secret of its own.
#
# Integrity: a space downloads the SIGNED release binary `a2a-linux-amd64`
# and verifies its keyless Sigstore bundle before it reaches $PATH — the
# same certificate identity and OIDC issuer a2a-validate-reusable.yml's own
# Integrity paragraph names, and the same pair internal/release's
# KeylessCosignVerifier pins for `a2a update` (judge-the-thing-2026-08 P8).
# Still no A2A_BINARY_FETCH_TOKEN: the assets are public and the proof is a
# public transparency-log entry, not a shared secret.
#
# `pull_request_target` is FORBIDDEN as a trigger here, and always will be:
# that event runs with the BASE repo's secrets against a HEAD that can be a
# fork's arbitrary code — a fork-authored commit could read TG_BOT_TOKEN out
# from under the caller. This workflow is `workflow_call`-only; the caller
# decides push/dispatch (see space-template's own a2a-notify.yml header).
#
# TG_BOT_TOKEN is an EXPLICIT secret input, never `secrets: inherit` —
# a2ahub is public and a space repo may not be, so an explicit declaration
# is what makes the token's path readable in code review (spec 05 US-5).
name: a2a-notify-reusable

on:
  workflow_call:
    inputs:
      a2a-ref:
        # The module version this unit pins — the co-located version that
        # moves as a whole when the caller bumps the workflow tag/SHA
        # (Dependabot for the tag; a2ahub's own release for this default).
        description: "A published release tag whose signed a2a-linux-amd64 asset this job downloads and verifies (e.g. v0.25.3). Empty is REFUSED here — unlike a2a-validate-reusable.yml, where empty means dogfood."
        required: false
        type: string
        # MUST equal the tag being cut — same discipline as
        # a2a-validate-reusable.yml's own `a2a-ref` default. Held equal by
        # TestReusableRefDefaultMatchesTheNewestAuthoredVersion
        # (internal/notes) offline, and by assert_ref_default_matches
        # (scripts/release-preflight.sh), both extended to cover this file.
        default: "v0.25.7"
      space-path:
        description: "Working directory of the space content (default: repo root). Mirrors the validator's own input."
        required: false
        type: string
        default: "."
      limit:
        # `type: string`, not `number` (spec 07): only a string has an
        # empty MEMBER that can mean "the operator set nothing" — an unset
        # `number` input resolves to `0`, which the CLI refuses. The
        # digest-coalescing threshold's default still belongs to the
        # `notify render --limit` CLI flag (spec 03) — this input is
        # forwarded only when the operator set a positive value, so the
        # value has exactly one home; the step below tests that property,
        # not emptiness.
        description: "The digest-coalescing threshold for the automatic (push/base) path. An empty string means the --limit flag is not passed at all, and `a2a notify render`'s own default (5) applies."
        required: false
        type: string
        default: ""
      base:
        description: "The commit a workflow_dispatch run measures the range from. Absent, the dispatch path falls back to the single-commit form. Ignored entirely when `artifacts` is set."
        required: false
        type: string
        default: ""
      artifacts:
        description: "Comma-separated artifact ids to send INSTEAD OF a push range — bypasses --base and the event filter entirely. workflow_dispatch-only; the push path never sets this."
        required: false
        type: string
        default: ""
      dry-run:
        description: "Render and print the exact payloads; send nothing."
        required: false
        type: boolean
        default: false
    secrets:
      TG_BOT_TOKEN:
        description: "The Telegram bot token a route's `secret` field names (spacenotify.DeclaredSecret). Optional: a space with no configured routes needs no secret at all."
        required: false

jobs:
  notify:
    # timeout-minutes: no measured basis exists yet — this is a brand-new
    # job identity with zero completed runs, so scripts/lib/job-timeouts.tsv
    # (REGENERATED from GitHub's own API, never hand-edited — see that
    # file's own header) carries no row for it. check-runner-economics.sh's
    # own header names this exact situation (ci.yml's `changes` job) and
    # decides it explicitly: an unmeasured identity passes RULE 3 with a
    # named warning rather than a fabricated bound. 10 minutes mirrors
    # a2a-validate-reusable.yml's own `validate` job, which downloads and
    # cosign-verifies the same signed release asset plus a network call and
    # is the closest measured analogue (see that job's row in
    # job-timeouts.tsv); RULE 4's 60-minute cap still applies
    # unconditionally.
    timeout-minutes: 10
    name: notify
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the checkout and calls the
    # Telegram API — no host API calls at all. A reusable workflow can only
    # DOWNGRADE the caller's token, so the caller must itself grant at least
    # this (spec 05 "Permissions").
    permissions:
      contents: read
    steps:
      - name: Checkout space content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history for TWO reasons (spec 05): `notify render`'s
          # `--base` shells out to `git diff <base>...HEAD`, AND the
          # folding assembly orders events by commit — a shallow clone
          # would silently misorder or empty either one.
          fetch-depth: 0

      # cosign verifies the downloaded binary's keyless signature. Same
      # action, same SHA pin, as the release workflow that PRODUCES the
      # signature — deliberately, so the two ends of this chain cannot
      # drift apart. Unguarded (no `if:`): unlike a2a-validate-reusable.yml,
      # notify has no dogfood branch (D5/D3, spec 08 §T5), so there is no
      # value of a2a-ref for which cosign is unwanted.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.0

      # The push range and its fallback (spec 05 "The push range, and its
      # fallback"). Computed as its OWN step, separate from the
      # render/send step below, so the fallback reason is captured once and
      # stated in the job summary rather than inferred — a silently
      # widened or silently empty range is the same class of defect as a
      # gate that skips green.
      - name: Determine the push range
        id: range
        if: inputs.artifacts == ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"

          # A root commit (no parent at all) cannot form a "$SHA^..$SHA"
          # range. Rare — the very first commit of a brand-new repository —
          # but the fallback-of-fallback is stated, not silently produced
          # as an empty or wrong range.
          root_commit=0
          if ! git rev-parse -q --verify "$SHA^" >/dev/null 2>&1; then
            root_commit=1
          fi

          # emit writes this step's outputs in ONE redirect (shellcheck
          # SC2129: several individual `>>` appends to the same file in a
          # row is exactly the "a print cannot red" shape one layer down —
          # a single block makes the write atomic and silences nothing).
          emit() { # $1 = mode, $2 = base (may be empty), $3 = range-note
            {
              echo "mode=$1"
              if [ -n "$2" ]; then
                echo "base=$2"
              fi
              echo "range-note=$3"
            } >>"$GITHUB_OUTPUT"
          }

          emit_single_commit() { # $1 = why
            if [ "$root_commit" -eq 1 ]; then
              emit "all" "" "$1, and $SHA has no parent (root commit) — rendering every qualifying artifact instead of a single-commit range"
            else
              emit "base" "$SHA^" "$1 — single-commit fallback ($SHA^..$SHA)"
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_BASE" ]; then
              emit "base" "$DISPATCH_BASE" "workflow_dispatch with an explicit base ($DISPATCH_BASE..$SHA)"
            else
              emit_single_commit "workflow_dispatch with no base input"
            fi
            exit 0
          fi

          # push event.
          if [ "$BEFORE" = "$zero" ]; then
            emit_single_commit "branch's first push (before is all-zero)"
            exit 0
          fi
          if git cat-file -e "$BEFORE" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$SHA" 2>/dev/null; then
            emit "base" "$BEFORE" "ordinary push ($BEFORE..$SHA)"
          else
            emit_single_commit "force-push (before is not an ancestor of sha)"
          fi

      - name: Install a2a
        env:
          A2A_REF: ${{ inputs.a2a-ref }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/a2a-notify-bin"

          # Unlike a2a-validate-reusable.yml, this workflow has no dogfood
          # build path (D5, spec 08 §T5 "The sentinel") — an empty a2a-ref
          # cannot mean "build from the caller's checkout" here, so it is
          # refused BY NAME before any network call, rather than 404ing
          # silently three retries later.
          if [ -z "$A2A_REF" ]; then
            echo "::error::a2a-notify-reusable.yml: a2a-ref must name a released version — unlike a2a-validate-reusable.yml, this workflow has no dogfood build path" >&2
            exit 2
          fi

          mkdir -p "$bin"

          # linux-amd64 is hardcoded against this job's own `runs-on:
          # ubuntu-latest`. If that ever becomes an arm64 runner the
          # download 404s and the job reds on that answer WITHOUT retrying it
          # (see the loop below) — which is the right failure for a
          # wrong-architecture binary, and better than deriving an arch string
          # that could resolve to something that runs but is not what anybody
          # chose.
          asset="a2a-linux-amd64"
          base="https://github.com/ydnikolaev/a2ahub/releases/download/$A2A_REF"

          # Retried on the NETWORK half only — TRUE since 2026-08-23, and
          # merely intended before that. `curl -f` exits 22 on an HTTP error,
          # and a 404 for a wrong a2a-ref or a wrong-architecture asset is an
          # ANSWER, not a transient: retrying it bought three attempts, two
          # warnings that said "retrying" when the cause was permanent, and
          # ~30 s of sleep before the real reason appeared. It also made the
          # comment above — "404s and the job reds loudly on the first line" —
          # false for as long as both stood.
          downloaded=0
          for attempt in 1 2 3; do
            rc=0
            curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset" &&
              curl -fsSL -o "$RUNNER_TEMP/$asset.cosign.bundle" "$base/$asset.cosign.bundle" || rc=$?
            if [ "$rc" -eq 0 ]; then
              downloaded=1
              break
            fi
            if [ "$rc" -eq 22 ]; then
              echo "::error::a2a $A2A_REF: the release CDN answered with an HTTP error for $asset — an answer, not a transient. Check that a2a-ref names a published release carrying that asset." >&2
              exit 1
            fi
            # No warning and no sleep on the last attempt: there is nothing
            # left to retry, and saying "retrying" there was a lie that also
            # cost 15 s.
            [ "$attempt" -lt 3 ] || break
            echo "::warning::a2a download attempt $attempt/3 failed (curl exit $rc); retrying" >&2
            sleep $((attempt * 5))
          done
          if [ "$downloaded" -ne 1 ]; then
            # UNMEASURED — see a2a-validate-reusable.yml's twin for why the
            # token and the "what did not happen" sentence are load bearing.
            # Here the consequence is different and worth naming separately:
            # nothing was sent, so a notification an operator is waiting for is
            # missing rather than delayed (release-cost-2026-08 P3).
            echo "::error::UNMEASURED: could not download a2a $A2A_REF after 3 attempts — NO NOTIFICATION WAS SENT. Nothing is wrong with this space's routes or artifacts; the a2ahub release CDN did not answer, so the notifier never ran. Re-run this job." >&2
            exit 1
          fi

          # The identity and issuer are the SAME PAIR internal/release's
          # KeylessCosignVerifier pins for `a2a update` (cosign.go:122 and
          # :27). They are written here rather than derived because the
          # verifier lives INSIDE the binary being verified — this is the
          # one place in the system that cannot ask a2a to check a2a.
          #
          # Not gated, not retried, and it runs BEFORE the binary is put
          # anywhere executable: an unverified asset never reaches $bin.
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$asset.cosign.bundle" \
            --certificate-identity-regexp '^https://github\.com/ydnikolaev/a2ahub/\.github/workflows/release\.yml@refs/tags/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$RUNNER_TEMP/$asset"

          install -m 0755 "$RUNNER_TEMP/$asset" "$bin/a2a"
          echo "$bin" >>"$GITHUB_PATH"

      - name: a2a notify render | send
        id: notify
        env:
          SPACE_PATH: ${{ inputs.space-path }}
          RANGE_MODE: ${{ steps.range.outputs.mode }}
          RANGE_BASE: ${{ steps.range.outputs.base }}
          RANGE_NOTE: ${{ steps.range.outputs.range-note }}
          ARTIFACTS: ${{ inputs.artifacts }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry-run }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          set -euo pipefail
          cd "$SPACE_PATH"

          # limit's own guard (spec 07 §T5 "what the guard does, per
          # value") — TWO stages, not one, and validated ONCE regardless of
          # which range mode below actually forwards it: an EMPTY LIMIT (the
          # golden path, and the only case that happens today) is silently
          # skipped; a POSITIVE integer is accepted; anything else non-empty
          # (`0`, a negative number, non-numeric) is refused HERE, before
          # `a2a` is ever invoked. A collapsed one-stage `[ "$LIMIT" -gt 0 ]`
          # would kill the golden (empty) path under `set -euo pipefail`
          # with bash's own "integer expression expected" — the exact
          # failure this two-stage form exists to avoid.
          limit_arg=()
          if [ -n "$LIMIT" ]; then
            case "$LIMIT" in
              *[!0-9]*)
                limit_is_positive=0
                ;;
              *)
                if [ "$LIMIT" -gt 0 ]; then limit_is_positive=1; else limit_is_positive=0; fi
                ;;
            esac
            if [ "$limit_is_positive" -eq 1 ]; then
              limit_arg=(--limit "$LIMIT")
            else
              echo "::error::a2a-notify-reusable.yml: limit=\"$LIMIT\" is not a positive integer — refusing to invoke 'a2a notify render' with it (this is the notify workflow's own input validation, not this space's content)" >&2
              exit 2
            fi
          fi

          summary_range_note="$RANGE_NOTE"
          render_args=(notify render)
          if [ -n "$ARTIFACTS" ]; then
            # Requirement 1 (spec 05): artifacts selects by id and bypasses
            # both the range and the event filter.
            render_args+=(--only "$ARTIFACTS")
            summary_range_note="explicit artifacts: $ARTIFACTS (range and event filter bypassed)"
          elif [ "$RANGE_MODE" = "all" ]; then
            render_args+=(--all)
          else
            render_args+=(--base "$RANGE_BASE")
            render_args+=("${limit_arg[@]}")
          fi

          # BUILD/INSTALL is retried above; RENDER is not — an unknown
          # --only id (requirement 2) or a manifest error is this space's
          # own content, and must fail the job loudly and immediately,
          # naming what it refused (a2a notify render's own stderr).
          #
          # Exit-code attribution (spec 07 §T5 "the report's second half"):
          # 2 = the WORKFLOW built a bad invocation — an ::error:: names the
          # notify workflow (not the space) as at fault; 1 = this space's
          # own content, and the CLI's own stderr (already on the console,
          # unredirected) is left unchanged. Either way the job still reds.
          rendered="$(mktemp)"
          set +e
          a2a "${render_args[@]}" >"$rendered"
          render_status=$?
          set -e
          if [ "$render_status" -eq 2 ]; then
            echo "::error::a2a-notify-reusable.yml built an invalid 'a2a notify render' invocation (exit 2 = a usage error) — this is a bug in the notify workflow, not this space's content. Please file against a2ahub." >&2
            exit "$render_status"
          elif [ "$render_status" -ne 0 ]; then
            exit "$render_status"
          fi

          send_args=(notify send)
          if [ "$DRY_RUN" = "true" ]; then
            send_args+=(--dry-run)
          fi

          # Exit code read from a bare statement, never through a pipe
          # (.claude/rules/check-convention.md "Reading a gate's result" —
          # the four-release scar this repo already paid for that mistake
          # once).
          records="$(mktemp)"
          set +e
          a2a "${send_args[@]}" <"$rendered" >"$records"
          status=$?
          set -e

          {
            echo "### a2a notify"
            echo
            echo "range: $summary_range_note"
            echo
            if jq -e 'length > 0' "$records" >/dev/null 2>&1; then
              echo "| artifact | class | chat | renderer | outcome |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.artifact) | \(.class) | \(.chat) | \(.renderer) | \(.outcome) |"' "$records"
              if jq -e 'map(select(.outcome == "dry-run")) | length > 0' "$records" >/dev/null 2>&1; then
                echo
                echo "#### dry-run payloads (the exact bytes a live send would put on the wire)"
                # A 4-backtick fence, not 3: an agent prompt commonly carries
                # its own \`\`\`-fenced code block (the payload's own <pre><code>
                # content), which would otherwise close this fence early and
                # garble the one thing dry-run exists to let a reviewer see.
                jq -r '.[] | select(.outcome == "dry-run") | "**\(.artifact)** (\(.renderer)):\n\n````\n\(.payload)\n````\n"' "$records"
              fi
              if jq -e 'map(select(.outcome == "failed")) | length > 0' "$records" >/dev/null 2>&1; then
                echo
                echo "#### failures"
                jq -r '.[] | select(.outcome == "failed") | "- \(.artifact): \(.error)"' "$records"
              fi
            else
              echo "0 messages — no routes configured, or nothing qualified."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          exit "$status"
