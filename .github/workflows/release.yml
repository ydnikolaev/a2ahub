# Release (publish-prep-2026-07 P2 — REPLACES P16's release.yml, keeps the
# FILENAME so the future sigstore-cosign backlog verifier's OIDC identity
# path `.../release.yml@refs/tags/<tag>` still resolves). Cuts a GitHub
# release with GoReleaser whenever a `v*.*.*` tag lands.
#
# §7 OPTION 1 preserved (publish-prep-2026-07 spec 02 §7, plan P2): the
# .goreleaser.yaml this workflow drives still produces the raw
# `a2a-<os>-<arch>` binary + `SHA256SUMS` + a per-asset `.cosign.bundle`
# ALONGSIDE the new human-facing tar.gz/zip archives — the two LIVE
# consumers (`a2a update` / internal/release.Download, and the getvisa space
# CI gate's `gh release download --pattern 'a2a-linux-amd64'`) keep working
# unchanged.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # goreleaser creates the GitHub Release
  id-token: write # mint the OIDC token for keyless Sigstore signing (cosign + attestations)
  attestations: write # persist the build-provenance attestation to GitHub

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # GoReleaser's changelog needs the full history, not the default shallow clone.
          fetch-depth: 0

      # Refuse to publish a tag whose agent-facing release notes are missing
      # (P31 AC-915.1). releasenotes/<version>.yaml is the authored, embedded
      # payload that `a2a whatsnew` and the post-update digest render; a release
      # with no notes file ships a binary that can say nothing about itself.
      # This runs before any publish side-effect, so a missing file is a loud
      # fail in the Actions log, not a half-published release.
      - name: Assert release notes exist for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="releasenotes/${version}.yaml"
          if [ ! -f "$notes" ]; then
            echo "::error::missing ${notes} — author the release directives before tagging ${GITHUB_REF_NAME} (P31 §5)"
            exit 1
          fi
          echo "release notes present: ${notes}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # cosign is NOT preinstalled on the runner — the .goreleaser.yaml `signs`
      # block (keyless per-asset sign-blob) fails without it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # syft is NOT preinstalled either — the `sboms` block needs it. The
      # download-syft sub-action is lighter than the full sbom-action when
      # goreleaser only needs the binary.
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-notifier:
    needs: goreleaser
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and ad-hoc sign the macOS companion
        env:
          VERSION: ${{ github.ref_name }}
          SIGNING_MODE: adhoc
        run: |
          swift --version
          VERSION="${VERSION#v}" integrations/macos-notifier/scripts/package-release.sh

      - name: Upload macOS companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "integrations/macos-notifier/dist/a2a-notifier-${version}.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  vscode-notifier:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json

      - name: Package VSIX with the release version
        working-directory: integrations/vscode
        run: |
          npm ci
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm run check
          npm run package:vsix

      - name: Upload VS Code companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            integrations/vscode/dist/a2ahub-notifications.vsix \
            --repo "$GITHUB_REPOSITORY" --clobber

  cohort:
    needs: [goreleaser, macos-notifier, vscode-notifier]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Assemble and sign the coordinated release cohort
        env:
          GH_TOKEN: ${{ github.token }}
          # `codesign -d` reports this literal identity for an ad-hoc signature.
          # The app is still hash-bound to this Sigstore-signed cohort.
          MACOS_TEAM_ID: "not set"
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist
          cp "releasenotes/${version}.yaml" "dist/release-notes-${version}.yaml"
          scripts/build-release-cohort.sh dist "$version" "$MACOS_TEAM_ID"

          : > dist/SHA256SUMS
          while IFS= read -r asset; do
            name="$(basename "$asset")"
            case "$name" in
              SHA256SUMS|*.cosign.bundle) continue ;;
            esac
            sha256sum "$asset" | sed 's#  dist/#  #' >> dist/SHA256SUMS
          done < <(find dist -maxdepth 1 -type f | sort)

          for asset in \
            "dist/a2a-notifier-${version}.zip" \
            dist/a2ahub-notifications.vsix \
            "dist/release-notes-${version}.yaml" \
            dist/release-cohort.json \
            dist/SHA256SUMS
          do
            cosign sign-blob --bundle="${asset}.cosign.bundle" "$asset" --yes
          done

          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/SHA256SUMS dist/SHA256SUMS.cosign.bundle \
            dist/release-cohort.json dist/release-cohort.json.cosign.bundle \
            "dist/a2a-notifier-${version}.zip.cosign.bundle" \
            dist/a2ahub-notifications.vsix.cosign.bundle \
            "dist/release-notes-${version}.yaml" \
            "dist/release-notes-${version}.yaml.cosign.bundle"

      # The final checksum set now covers the Go binaries, both companions,
      # and the standalone future What’s New asset.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: ./dist/SHA256SUMS
