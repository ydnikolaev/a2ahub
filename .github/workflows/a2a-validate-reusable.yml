# The SSOT space-validation workflow (P33, spec 33 §T3). ONE home for the
# V3 write-funnel gate: install a2a + the exact `validate --ci` invocation +
# the pinned version, co-located in one versioned unit. A space references
# this file by a release-tag-pinned path (see the space-template caller) and carries
# NO validation logic and NO fetch-token secret of its own — the
# private-era copy/token/manual-pin design (spec 09 §T5) is dead (spec 33 §1).
#
# Integrity: a space downloads the SIGNED release binary `a2a-linux-amd64` and
# verifies its keyless Sigstore bundle before running it — the same certificate
# identity and OIDC issuer `internal/release`'s KeylessCosignVerifier pins for
# `a2a update`. Still no A2A_BINARY_FETCH_TOKEN: the assets are public and the
# proof is a public transparency-log entry, not a shared secret.
#
# This REPLACES spec 33 §2 mechanism #1 (GOSUMDB via `go install @<ver>`), and
# the replacement is like-for-like on the property that mattered. GOSUMDB's
# virtue was never "a checksum" — it was that the checksum lives in an
# append-only PUBLIC log anyone can monitor. A checksum fetched from the same
# release as the binary would have been a downgrade dressed as a swap: whoever
# can replace the asset replaces the sums file beside it. Rekor plus the
# workflow's OIDC identity is the same CLASS of guarantee — publicly logged,
# verifiable by a third party after the fact.
#
# It also SHRINKS the supply chain rather than trading it: `go install` made
# every space's pull request resolve, verify and compile a2ahub's whole module
# graph — 34 external modules, 380 go.sum lines, including 56 sigstore/in-toto
# packages that `validate --ci` never executes. One signed artifact replaces
# all of it, and cosign moves from the BUILD path to the VERIFY path.
#
# The dogfood path (empty `a2a-ref`) still compiles from the caller's checkout
# and is deliberately unsigned — there is no release to sign, that is the point
# of the canary.
#
# The status-check CONTEXT a branch-protection rule binds to is
# `<caller-job-name> / validate` — e.g. `a2a-validate / validate` when the
# caller names its job `a2a-validate`. The flat `a2a-validate` context of the
# copied design does NOT survive the move to a reusable workflow (GitHub
# nested-job naming); the branch-protection required check is renamed once,
# as an operator step (spec 33 §2/§8 AC-101.2 amendment, BRANCH-PROTECTION.md).
# Renaming the `validate` job below silently changes that context — do not.
name: a2a-validate-reusable

on:
  workflow_call:
    inputs:
      mode:
        description: "v3-pr (changed files + diff-authz) | v3-full-repo (post-merge audit)."
        required: true
        type: string
      base:
        description: "The PR base SHA — required for mode=v3-pr, ignored for v3-full-repo."
        required: false
        type: string
        default: ""
      a2a-ref:
        # The module version this unit pins — the co-located version that
        # moves as a whole when the caller bumps the workflow SHA (Dependabot).
        # Bumped in lockstep with each a2ahub release tag. The empty-string
        # sentinel means "build ./cmd/a2a from the caller's own checkout" —
        # used ONLY by a2ahub's dogfood, so the canary exercises the PR's
        # current code, never a released version (spec 33 §T3, AC-930.2).
        description: "a2a module version to `go run` (e.g. v0.8.0); empty = local ./cmd/a2a (a2ahub dogfood only)."
        required: false
        type: string
        # MUST equal the tag being cut. `make release-preflight VERSION=vX.Y.Z`
        # asserts exactly that (assert_ref_default_matches) because leaving
        # it behind is not a cosmetic slip: a space pins the WORKFLOW by tag and
        # inherits this default for the VALIDATOR, so a stale value means every
        # space silently validates with an old binary while believing it runs the
        # one it pinned. v0.7.0 shipped with this still at v0.5.0 — so every
        # space at @v0.7.0 validated with a binary that predated the v0.6.4
        # diff-authz fix, keeping an authorization bypass the notes called closed.
        #
        # It happened AGAIN at v0.10.0, and that is why an offline gate now
        # exists beside the preflight: the tag shipped with this still at
        # v0.9.1, so `r22d222/a2a` — pinned @v0.10.0, passing no `a2a-ref` of
        # its own — ran the v0.9.1 validator at its merge gate and enforced
        # NONE of v0.10.0's own CI-side work (space.yaml validation, event/v1
        # validation, the producer stamp, thread-required). The preflight would
        # have said so; it takes an explicit VERSION and a network call, so it
        # is opt-in and out-of-band, and an opt-in gate is one somebody skips.
        # internal/notes' TestReusableRefDefaultMatchesTheNewestAuthoredVersion
        # holds this value equal to the newest authored release-notes
        # version on every `make check`, offline.
        default: "v0.25.3"
      space-path:
        description: "Working directory of the space content to validate (default: repo root)."
        required: false
        type: string
        default: "."

jobs:
  validate:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 10
    # This job name is the second half of the branch-protection context
    # `<caller-job> / validate`. It is a load-bearing literal — see header.
    name: validate
    runs-on: ubuntu-latest
    # Least-privilege (spec 09 §10.5, reinterpreted for a public product):
    # contents:read to check out the space; pull-requests:read so V3's G1/G2
    # policy branch can query approving reviews via the host API. A reusable
    # workflow can only DOWNGRADE the caller's token — the caller must itself
    # grant at least these (its ~5-line workflow declares them).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout space content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: v3-pr shells out to `git diff <base>...HEAD`.
          fetch-depth: 0
          # In PR mode, check out the PR's OWN HEAD — never the merge ref.
          #
          # actions/checkout defaults to `refs/pull/<n>/merge` on a
          # pull_request event, which is the branch already merged into the
          # CURRENT base. `base` below is `pull_request.base.sha`, the base as
          # of when the event fired. Those two drift apart the moment anybody
          # else merges, and then `git diff base...HEAD` sweeps in every
          # commit that landed on main in between — attributing another
          # system's files to THIS pull request's author.
          #
          # That is not theoretical and it is not rare. Observed live on
          # 2026-07-26: PR #838 changed four files, all under `alpha/`, its
          # parent was exactly base.sha — and the gate refused it with two
          # diff-authz violations naming `bravo/`, because bravo had merged
          # while it was open. For two systems writing concurrently, which is
          # the entire point of a space, a legitimate write gets refused
          # whenever the counterparty happens to merge first. The refusal is
          # loud, specific, and wrong, which is the worst combination.
          #
          # Checking out head.sha makes `base...HEAD` mean what diff-authz
          # actually asks: what did THIS author change, relative to where they
          # forked. The merge result is not the question — the space's
          # post-merge audit (mode=v3-full-repo, on push) is what validates
          # main as a whole.
          ref: ${{ inputs.mode == 'v3-pr' && github.event.pull_request.head.sha || '' }}

      # Go is needed ONLY by the dogfood path below, which builds ./cmd/a2a
      # from the caller's own checkout. A space downloads a signed release
      # binary instead and never compiles anything, so setting Go up for it
      # would be pure cost.
      - name: Set up Go (dogfood only — a space downloads a signed binary)
        if: inputs.a2a-ref == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to a2a's own toolchain (go.mod `go 1.26.6`); bumped with
          # the release. A space repo has no go.mod, so go-version-file is not
          # usable here — the version is named explicitly.
          go-version: "1.26.6"

      # cosign verifies the downloaded binary's keyless signature. Same action,
      # same SHA pin, as the release workflow that PRODUCES the signature —
      # deliberately, so the two ends of this chain cannot drift apart.
      - name: Install cosign (space path only)
        if: inputs.a2a-ref != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.0

      - name: a2a validate --ci
        env:
          # V3 policy reads approving reviews via the host API.
          GH_TOKEN: ${{ github.token }}
          A2A_MODE: ${{ inputs.mode }}
          A2A_BASE: ${{ inputs.base }}
          # The PR's AUTHOR — never GITHUB_ACTOR, which is whoever triggered
          # the run. diff-authz asks "is every changed path inside the author's
          # own section", so resolving the author from the trigger makes the
          # verdict depend on who pressed the button:
          #   - false RED: a maintainer re-running a contributor's PR sees it
          #     checked against the MAINTAINER's section;
          #   - false GREEN (the serious one): a PR from system B illegally
          #     touching system A's section PASSES when someone from A
          #     re-triggers it — the single-writer boundary defeated by asking
          #     "could you re-run CI?".
          # A reusable workflow inherits the caller's `github` context, so the
          # real author is available here with no new caller input — every
          # space gets the fix by bumping the version ref alone (P33's promise).
          # Read via env, never interpolated into the shell (injection).
          A2A_AUTHOR: ${{ github.event.pull_request.user.login }}
          A2A_REF: ${{ inputs.a2a-ref }}
          SPACE_PATH: ${{ inputs.space-path }}
        run: |
          set -euo pipefail
          cd "$SPACE_PATH"
          report="$(mktemp)"
          args=(validate --ci --mode="$A2A_MODE")
          if [ "$A2A_MODE" = "v3-pr" ]; then
            if [ -z "$A2A_BASE" ]; then
              echo "::error::mode=v3-pr requires the 'base' input (the PR base SHA)" >&2
              exit 2
            fi
            args+=(--base "$A2A_BASE")
            if [ -n "${A2A_AUTHOR:-}" ]; then
              args+=(--author "$A2A_AUTHOR")
            fi
          fi
          # BUILD AND RUN ARE SEPARATE STEPS, AND ONLY THE BUILD IS RETRIED.
          #
          # `go run <module>@<ver>` fused two failures with the same exit code:
          # "the supply chain could not be read" and "this space is invalid".
          # A single transient GOSUMDB tile read therefore reddened a space's
          # REQUIRED merge gate. Observed 2026-08-13 in r22d222/a2a's own
          # `space update` run (job 94482003298):
          #
          #   in-toto-golang@v0.11.0/in_toto/runlib.go:15:2:
          #   github.com/shibumi/go-pathspec@v1.3.0: verifying module: reading
          #   https://sum.golang.org/tile/8/0/x028/581: stream error;
          #   INTERNAL_ERROR; received from peer
          #
          # The same module downloads cleanly on a retry — the failure was the
          # network, and the space was fine. Every space PR resolves a2ahub's
          # whole module graph through the proxy and verifies each module
          # against sum.golang.org, so this was one flaky read away from a red
          # gate on every space, on every pull request, forever.
          #
          # That retry survives the 2026-08-18 move off `go install`, and it
          # still wraps the NETWORK half alone. What changed is what it is
          # retrying: a CDN download rather than a module-graph resolution.
          # The verification below is outside the loop for the same reason the
          # validator always was — a genuinely bad artifact reds once, never
          # three times.
          bin="$RUNNER_TEMP/a2a-validate-bin"
          mkdir -p "$bin"
          if [ -n "$A2A_REF" ]; then
            # Spaces: the signed release binary, verified before it runs.
            #
            # linux-amd64 is hardcoded against this job's own `runs-on:
            # ubuntu-latest`. If that ever becomes an arm64 runner the download
            # 404s and the job reds loudly on the first line — which is the
            # right failure for a wrong-architecture binary, and better than
            # deriving an arch string that could resolve to something that runs
            # but is not what anybody chose.
            asset="a2a-linux-amd64"
            base="https://github.com/ydnikolaev/a2ahub/releases/download/$A2A_REF"

            # The NETWORK half retries; nothing below it does. A download that
            # cannot complete is the internet, a signature that does not verify
            # is not — and retrying a verification failure would turn one loud
            # refusal into three and teach the reader to scroll past it.
            downloaded=0
            for attempt in 1 2 3; do
              if curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset" &&
                 curl -fsSL -o "$RUNNER_TEMP/$asset.cosign.bundle" "$base/$asset.cosign.bundle"; then
                downloaded=1
                break
              fi
              echo "::warning::a2a download attempt $attempt/3 failed; retrying" >&2
              sleep $((attempt * 5))
            done
            if [ "$downloaded" -ne 1 ]; then
              echo "::error::could not download a2a $A2A_REF after 3 attempts — this is the release CDN, not this space's content" >&2
              exit 1
            fi

            # The identity and issuer are the SAME PAIR internal/release's
            # KeylessCosignVerifier pins for `a2a update` (cosign.go:122 and
            # :27). They are written here rather than derived because the
            # verifier lives INSIDE the binary being verified — this is the one
            # place in the system that cannot ask a2a to check a2a.
            #
            # Not gateable, not retried, and it runs BEFORE the binary is put
            # anywhere executable: an unverified asset never reaches $bin.
            cosign verify-blob \
              --bundle "$RUNNER_TEMP/$asset.cosign.bundle" \
              --certificate-identity-regexp '^https://github\.com/ydnikolaev/a2ahub/\.github/workflows/release\.yml@refs/tags/' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$RUNNER_TEMP/$asset"

            install -m 0755 "$RUNNER_TEMP/$asset" "$bin/a2a"
          else
            # a2ahub dogfood: the caller checkout IS a2ahub — build current code.
            GOBIN="$bin" go install "$GITHUB_WORKSPACE/cmd/a2a"
          fi
          set +e
          "$bin/a2a" "${args[@]}" >"$report"
          status=$?
          set -e
          cat "$report"

          # Preserve the canonical JSON as structured evidence and project each
          # rejecting violation into a GitHub annotation. Human logs are not an
          # assertion API: live E2E reads the check-run annotations by
          # code+path. Escape workflow-command metacharacters because paths are
          # inbound repository data.
          if jq -e . "$report" >/dev/null 2>&1; then
            {
              echo "### a2a validation report"
              echo '```json'
              cat "$report"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            jq -r '
              (.artifacts[]? as $a
                | $a.result.violations[]?
                | select(.severity == "reject")
                | [.code, $a.path, .severity, (.artifact_id // ""), .message]),
              (.diff_authz_violations[]?
                | [.code, (.path // "space.yaml"), .severity, (.artifact_id // ""), .message])
              | @tsv
            ' "$report" | while IFS=$'\t' read -r code path severity artifact_id message; do
              path="${path//'%'/'%25'}"; path="${path//$'\r'/'%0D'}"; path="${path//$'\n'/'%0A'}"
              message="${message//'%'/'%25'}"; message="${message//$'\r'/'%0D'}"; message="${message//$'\n'/'%0A'}"
              echo "::error file=$path::[$code] severity=$severity artifact_id=$artifact_id $message"
            done
          fi
          exit "$status"
