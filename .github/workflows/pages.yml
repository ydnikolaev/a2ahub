# Builds the Astro product site and agent documentation, then deploys the
# static output to the custom-domain GitHub Pages surface at https://a2ahub.dev.
# Zero runtime and zero automatic third-party requests. Action SHAs
# are pinned (workflow-lint enforces it), versions verified against their
# releases. Repo Settings → Pages → Source must be set to "GitHub Actions" once.
name: Pages

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "web/**"
      - "ui/**"
      - "skill/a2ahub/**"
      - "internal/html/testdata/demo.json"
      - "releasenotes/**"
      - "scripts/install.sh"
      - "SECURITY.md"
      - ".sporo/exports/a2a.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Changelog generation includes only release notes backed by a tag.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npx playwright install --with-deps chromium
        working-directory: web

      - run: npm run check:quality
        working-directory: web

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
