# Builds the Astro product site and agent documentation, then deploys the
# static output to the custom-domain GitHub Pages surface at https://a2ahub.dev.
# Zero runtime and zero automatic third-party requests. Action SHAs
# are pinned (workflow-lint enforces it), versions verified against their
# releases. Repo Settings → Pages → Source must be set to "GitHub Actions" once.
name: Pages

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "web/**"
      - "ui/**"
      - "skill/a2ahub/**"
      - "internal/html/testdata/demo.json"
      - "releasenotes/**"
      - "scripts/install.sh"
      - "SECURITY.md"
      - ".sporo/exports/a2a.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 32
    # Pages is enabled on the PUBLIC repository and nowhere else, so this job
    # ran 31 times in the private one and failed 30 of them (P13 F10, ~40
    # equivalent minutes). A job that cannot succeed where it runs is not a
    # flaky gate — it is a job with no verdict to give, billing for the
    # attempt and adding a red line to a run list people then learn to ignore.
    #
    # The literal names the PUBLIC repo deliberately, which is the same
    # direction codeql.yml and classify-guard.yml already use and the same
    # inversion wave R8 applied to ci.yml: the public repo is the one ADR-014
    # does not move. If it were ever renamed, this goes FALSE and the deploy
    # simply stops — visible, and cheap. The other direction would have it go
    # TRUE in a repository with no Pages site, which is where it started.
    if: github.repository == 'ydnikolaev/a2ahub'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Changelog generation includes only release notes backed by a tag.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Pages proves a clean checkout can generate and validate the exact
      # static artifact it publishes. Browser quality audits are the local
      # release gate; repeating 27 Lighthouse runs here only delays deploys
      # and burns hosted-runner minutes without changing the output.
      - run: npm run check
        working-directory: web

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
