# Public-repository merge policy and quarantined feedback intake (P25/P48).
#
# SECURITY — READ BEFORE EDITING:
#   This is intentionally `pull_request_target`, because a valid fork feedback
#   PR needs a base-repository token to label the PR and arm auto-merge. The
#   read-only `policy` job therefore NEVER checks out or executes PR-head
#   content. It reads the changed-file metadata and, only for an exact
#   one-file feedback PR, one blob through the GitHub API. That blob is DATA
#   passed to a pinned released validator. The write-capable `arm-feedback`
#   job receives only closed-enum outputs from `policy`; it never reads the
#   PR head.
#
# `merge-policy` is deliberately universal rather than path-filtered. GitHub
# required checks are branch-wide: a path-filtered required check remains
# "Expected" forever on unrelated PRs. Branch protection can therefore require
# this job for every PR while the job applies the special intake contract only
# when feedback/inbox/** is touched.
name: feedback-intake

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

env:
  # First published release carrying the P48 hidden-content boundary. Bump
  # alongside any later change to `a2a feedback validate --ci`.
  A2A_INTAKE_VERSION: "0.15.0"
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  policy:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    name: validate-feedback-policy
    runs-on: ubuntu-latest
    outputs:
      is-feedback: ${{ steps.guard.outputs.is-feedback }}
      change: ${{ steps.guard.outputs.change }}
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      # THIS WORKFLOW CHECKS NOTHING OUT, ANYWHERE, AND THAT ABSOLUTE IS THE
      # SECURITY PROPERTY — not "it checks out only safe things".
      #
      # `internal/e2e`'s TestFeedbackIntakeHasAUniversalReadOnlyMergePolicy
      # enforces it as a flat string ban on the checkout action's name, which
      # is why no comment here can spell that name either. It is right to be
      # blunt, and an earlier draft of this gate was wrong to work around it.
      #
      # That draft added a base-only checkout to obtain the policy script,
      # reasoning that the base tree is trusted. It is. What is NOT trusted is
      # the WORKING DIRECTORY once a checkout has populated it: a step below
      # writes a PR-controlled blob to a PR-derived path inside that same
      # directory, and two steps later the job runs the policy script from it.
      # A path that escaped the record grammar would have been arbitrary code
      # execution from a fork — and the grammar check was per-LINE at the time,
      # which a path containing a newline passes.
      #
      # So the script arrives the same way every other input does — as DATA,
      # through the API — and lands in RUNNER_TEMP, which is outside the
      # workspace the PR blob is written into. Nothing PR-controlled can reach
      # it by any path.
      #
      # THE REF IS THE DEFAULT BRANCH, DELIBERATELY, AND NOT THE PR's BASE.
      # Verified against GitHub's current event reference on 2026-08-13: under
      # `pull_request_target`, GITHUB_SHA is "last commit on default branch"
      # and GITHUB_REF is "Default branch" — NOT the pull request's base. That
      # distinction is load-bearing after P15's rollover, when feedback pull
      # requests target `feedback-hub`: the hub is an ORPHAN branch carrying 26
      # records and a README, with no `scripts/` directory at all. A fetch
      # pinned to the PR's base would 404 on every record the moment the
      # rollover completes, and would do it thirty days after this commit.
      - name: Fetch the policy script from the base repository (no checkout, ever)
        env:
          POLICY_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/contents/scripts/feedback-intake-policy.sh?ref=${POLICY_REF}" \
            --jq '.content' | base64 -d > "$RUNNER_TEMP/policy.sh"
          test -s "$RUNNER_TEMP/policy.sh"

      - name: Classify change and guard the quarantine boundary
        id: guard
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --slurp \
            | jq 'add' \
            | bash "$RUNNER_TEMP/policy.sh" classify \
            | tee -a "$GITHUB_OUTPUT"

      - name: Fetch pinned a2a release binary
        if: steps.guard.outputs.is-feedback == 'true'
        run: |
          set -euo pipefail
          gh release download "v${A2A_INTAKE_VERSION}" \
            --repo "${REPO}" \
            --pattern 'a2a-linux-amd64' \
            --output ./a2a
          chmod +x ./a2a

      - name: Fetch the single PR file blob (no checkout of PR head)
        if: steps.guard.outputs.is-feedback == 'true'
        env:
          FILE_PATH: ${{ steps.guard.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FILE_PATH")"
          gh api "repos/${REPO}/contents/${FILE_PATH}?ref=${PR_HEAD_SHA}" \
            --jq '.content' \
            | base64 -d > "$FILE_PATH"

      # P15 AC11's other half. A triage verdict MODIFIES an existing record, and
      # the base version is fetched so the diff can be judged: only `status`
      # and `resolution` may move. That is the per-path merge rule the feedback
      # runbook has always stated — the reporter owns the body, triage owns the
      # verdict — enforced here instead of trusted.
      - name: Fetch the base version of a modified record and judge the diff
        if: steps.guard.outputs.change == 'modified'
        env:
          FILE_PATH: ${{ steps.guard.outputs.path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/contents/${FILE_PATH}?ref=${BASE_SHA}" \
            --jq '.content' | base64 -d > /tmp/record-base.yaml
          bash "$RUNNER_TEMP/policy.sh" verdict-diff \
            /tmp/record-base.yaml "$FILE_PATH"

      - name: Validate quarantined feedback data
        if: steps.guard.outputs.is-feedback == 'true'
        env:
          FILE_PATH: ${{ steps.guard.outputs.path }}
        run: ./a2a feedback validate --ci "$FILE_PATH"

      # The validator has already enforced the schema's closed enum. Requiring
      # exactly one source line also closes the earlier first-key/last-key
      # extraction ambiguity before this value crosses into a write-capable job.
      - name: Extract the closed-enum feedback kind
        if: steps.guard.outputs.is-feedback == 'true'
        id: kind
        env:
          FILE_PATH: ${{ steps.guard.outputs.path }}
        run: |
          set -euo pipefail
          count=$(grep -cE '^kind:[[:space:]]*' "$FILE_PATH" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::merge-policy: expected exactly one top-level kind field, got $count" >&2
            exit 1
          fi
          kind=$(grep -E '^kind:[[:space:]]*' "$FILE_PATH" \
            | sed -E 's/^kind:[[:space:]]*//; s/[[:space:]]+#.*$//; s/[[:space:]]*$//' \
            | tr -d "\"'\r")
          case "$kind" in
            bug|feature|docs|friction|protocol) ;;
            *)
              echo "::error::merge-policy: unexpected validated kind $kind" >&2
              exit 1
              ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  arm-feedback:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    name: arm-feedback
    needs: policy
    if: needs.policy.outputs.is-feedback == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      KIND: ${{ needs.policy.outputs.kind }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure and apply labels
        run: |
          set -euo pipefail
          case "$KIND" in
            bug|feature|docs|friction|protocol) ;;
            *) echo "::error::arm-feedback: invalid kind output" >&2; exit 1 ;;
          esac
          gh label create "feedback" \
            --repo "${REPO}" \
            --color "5319E7" \
            --description "Agent feedback intake" \
            --force
          gh label create "feedback:${KIND}" \
            --repo "${REPO}" \
            --color "BFDADC" \
            --description "Agent feedback: ${KIND}" \
            --force
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
            --add-label "feedback,feedback:${KIND}"

      # Auto-merge only arms this already-validated feedback PR. Repository
      # protection and its required checks still decide whether it may merge.
      - name: Enable auto-merge (squash)
        run: |
          set -euo pipefail
          node_id=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.node_id')
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                  clientMutationId
                }
              }' \
            -f id="${node_id}"

  # The stable branch-protection context deliberately completes AFTER the
  # conditional write job. While arm-feedback enables auto-merge this required
  # check is still pending, which is the state GitHub's auto-merge API expects.
  # Ordinary code PRs skip arm-feedback and still receive this universal,
  # read-only verdict without ever acquiring write privilege.
  merge-policy:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    name: merge-policy
    needs: [policy, arm-feedback]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POLICY_RESULT: ${{ needs.policy.result }}
      IS_FEEDBACK: ${{ needs.policy.outputs.is-feedback }}
      ARM_RESULT: ${{ needs.arm-feedback.result }}
    steps:
      - name: Publish the branch-wide merge verdict
        run: |
          set -euo pipefail
          if [ "$POLICY_RESULT" != "success" ]; then
            echo "::error::merge-policy: read-only validation did not succeed (got $POLICY_RESULT)" >&2
            exit 1
          fi
          if [ "$IS_FEEDBACK" = "true" ]; then
            if [ "$ARM_RESULT" != "success" ]; then
              echo "::error::merge-policy: validated feedback was not armed (got $ARM_RESULT)" >&2
              exit 1
            fi
          elif [ "$ARM_RESULT" != "skipped" ]; then
            echo "::error::merge-policy: ordinary PR unexpectedly entered the write job (got $ARM_RESULT)" >&2
            exit 1
          fi
