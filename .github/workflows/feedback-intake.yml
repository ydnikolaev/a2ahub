# Public-repository merge policy and quarantined feedback intake (P25/P48).
#
# SECURITY — READ BEFORE EDITING:
#   This is intentionally `pull_request_target`, because a valid fork feedback
#   PR needs a base-repository token to label the PR and arm auto-merge. The
#   read-only `policy` job therefore NEVER checks out or executes PR-head
#   content. It reads the changed-file metadata and, only for an exact
#   one-file feedback PR, one blob through the GitHub API. That blob is DATA
#   passed to a pinned released validator. The write-capable `arm-feedback`
#   job receives only closed-enum outputs from `policy`; it never reads the
#   PR head.
#
# `merge-policy` is deliberately universal rather than path-filtered. GitHub
# required checks are branch-wide: a path-filtered required check remains
# "Expected" forever on unrelated PRs. Branch protection can therefore require
# this job for every PR while the job applies the special intake contract only
# when feedback/inbox/** is touched.
name: feedback-intake

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

env:
  # First published release carrying the P48 hidden-content boundary. Bump
  # alongside any later change to `a2a feedback validate --ci`.
  A2A_INTAKE_VERSION: "0.15.0"
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  policy:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    name: validate-feedback-policy
    runs-on: ubuntu-latest
    outputs:
      is-feedback: ${{ steps.guard.outputs.is-feedback }}
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - name: Classify change and guard the quarantine boundary
        id: guard
        run: |
          set -euo pipefail
          files_json=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --slurp | jq 'add')
          count=$(jq 'length' <<<"$files_json")
          feedback_count=$(jq \
            '[.[] | select(.filename | startswith("feedback/inbox/"))] | length' \
            <<<"$files_json")

          if [ "$feedback_count" -eq 0 ]; then
            echo "is-feedback=false" >> "$GITHUB_OUTPUT"
            echo "merge-policy: ordinary code/documentation PR; no intake privilege granted."
            exit 0
          fi

          if [ "$count" -ne 1 ] || [ "$feedback_count" -ne 1 ]; then
            echo "::error::merge-policy: a PR touching feedback/inbox must contain exactly one changed file" >&2
            exit 1
          fi

          status=$(jq -r '.[0].status' <<<"$files_json")
          filename=$(jq -r '.[0].filename' <<<"$files_json")
          if [ "$status" != "added" ]; then
            echo "::error::merge-policy: feedback file must be added (got status=$status) for $filename" >&2
            exit 1
          fi
          if ! grep -qE '^feedback/inbox/fb-[0-9]{8}-[0-9a-f]{6}\.yaml$' <<<"$filename"; then
            echo "::error::merge-policy: unexpected path $filename" >&2
            exit 1
          fi

          echo "is-feedback=true" >> "$GITHUB_OUTPUT"
          echo "path=$filename" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned a2a release binary
        if: steps.guard.outputs.is-feedback == 'true'
        run: |
          set -euo pipefail
          gh release download "v${A2A_INTAKE_VERSION}" \
            --repo "${REPO}" \
            --pattern 'a2a-linux-amd64' \
            --output ./a2a
          chmod +x ./a2a

      - name: Fetch the single PR file blob (no checkout of PR head)
        if: steps.guard.outputs.is-feedback == 'true'
        env:
          FILE_PATH: ${{ steps.guard.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FILE_PATH")"
          gh api "repos/${REPO}/contents/${FILE_PATH}?ref=${PR_HEAD_SHA}" \
            --jq '.content' \
            | base64 -d > "$FILE_PATH"

      - name: Validate quarantined feedback data
        if: steps.guard.outputs.is-feedback == 'true'
        env:
          FILE_PATH: ${{ steps.guard.outputs.path }}
        run: ./a2a feedback validate --ci "$FILE_PATH"

      # The validator has already enforced the schema's closed enum. Requiring
      # exactly one source line also closes the earlier first-key/last-key
      # extraction ambiguity before this value crosses into a write-capable job.
      - name: Extract the closed-enum feedback kind
        if: steps.guard.outputs.is-feedback == 'true'
        id: kind
        env:
          FILE_PATH: ${{ steps.guard.outputs.path }}
        run: |
          set -euo pipefail
          count=$(grep -cE '^kind:[[:space:]]*' "$FILE_PATH" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::merge-policy: expected exactly one top-level kind field, got $count" >&2
            exit 1
          fi
          kind=$(grep -E '^kind:[[:space:]]*' "$FILE_PATH" \
            | sed -E 's/^kind:[[:space:]]*//; s/[[:space:]]+#.*$//; s/[[:space:]]*$//' \
            | tr -d "\"'\r")
          case "$kind" in
            bug|feature|docs|friction|protocol) ;;
            *)
              echo "::error::merge-policy: unexpected validated kind $kind" >&2
              exit 1
              ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  arm-feedback:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    name: arm-feedback
    needs: policy
    if: needs.policy.outputs.is-feedback == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      KIND: ${{ needs.policy.outputs.kind }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Ensure and apply labels
        run: |
          set -euo pipefail
          case "$KIND" in
            bug|feature|docs|friction|protocol) ;;
            *) echo "::error::arm-feedback: invalid kind output" >&2; exit 1 ;;
          esac
          gh label create "feedback" \
            --repo "${REPO}" \
            --color "5319E7" \
            --description "Agent feedback intake" \
            --force
          gh label create "feedback:${KIND}" \
            --repo "${REPO}" \
            --color "BFDADC" \
            --description "Agent feedback: ${KIND}" \
            --force
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
            --add-label "feedback,feedback:${KIND}"

      # Auto-merge only arms this already-validated feedback PR. Repository
      # protection and its required checks still decide whether it may merge.
      - name: Enable auto-merge (squash)
        run: |
          set -euo pipefail
          node_id=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.node_id')
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                  clientMutationId
                }
              }' \
            -f id="${node_id}"

  # The stable branch-protection context deliberately completes AFTER the
  # conditional write job. While arm-feedback enables auto-merge this required
  # check is still pending, which is the state GitHub's auto-merge API expects.
  # Ordinary code PRs skip arm-feedback and still receive this universal,
  # read-only verdict without ever acquiring write privilege.
  merge-policy:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    name: merge-policy
    needs: [policy, arm-feedback]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POLICY_RESULT: ${{ needs.policy.result }}
      IS_FEEDBACK: ${{ needs.policy.outputs.is-feedback }}
      ARM_RESULT: ${{ needs.arm-feedback.result }}
    steps:
      - name: Publish the branch-wide merge verdict
        run: |
          set -euo pipefail
          if [ "$POLICY_RESULT" != "success" ]; then
            echo "::error::merge-policy: read-only validation did not succeed (got $POLICY_RESULT)" >&2
            exit 1
          fi
          if [ "$IS_FEEDBACK" = "true" ]; then
            if [ "$ARM_RESULT" != "success" ]; then
              echo "::error::merge-policy: validated feedback was not armed (got $ARM_RESULT)" >&2
              exit 1
            fi
          elif [ "$ARM_RESULT" != "skipped" ]; then
            echo "::error::merge-policy: ordinary PR unexpectedly entered the write job (got $ARM_RESULT)" >&2
            exit 1
          fi
