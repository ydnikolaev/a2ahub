# CodeQL static security analysis for Go — free code scanning for public repos, results in the
# Security tab. Runs on push/PR to main and weekly (catches newly-published query patterns
# against unchanged code).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC

# Superseded runs stop (P13 K6, AC6). 689 commits in twelve days, pushed in
# bursts, and every intermediate push held a runner to completion while the
# tip was already being pushed on top of it.
#
# The trade is real and is stated rather than hidden: intermediate commits
# stop being proven, only the tip is. That is the intent at this commit rate,
# but it changes what the history guarantees, so it is written down where the
# setting lives.
#
# The group is scoped by `github.workflow`, which is what keeps `Release` out
# of it: cancelling a half-finished goreleaser or Sigstore run is worse than
# paying for it. A tag or candidate ref is unique, so nothing cancels there
# either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      GOWORK: "off" # analyze the fresh-checkout build, never a workspace's replacements
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: record private source scope
        if: github.repository != 'ydnikolaev/a2ahub'
        run: echo "CodeQL upload is a public-repository gate; private source CI uses gosec, govulncheck, and gitleaks."
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.repository == 'ydnikolaev/a2ahub'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        if: github.repository == 'ydnikolaev/a2ahub'
        with:
          languages: go
      - uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        if: github.repository == 'ydnikolaev/a2ahub'
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        if: github.repository == 'ydnikolaev/a2ahub'
