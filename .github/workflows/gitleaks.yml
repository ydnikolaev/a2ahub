# Secret scanning. Closes the classify gate's honest gap: that gate keeps whole harness/docs
# dirs private, but can't catch a secret pasted INTO a public file — gitleaks does, across the
# working tree and full history (fetch-depth: 0).
#
# THIS RUNS THE BINARY, NOT `gitleaks/gitleaks-action`, AND THE REASON IS AN
# OUTAGE NOBODY NOTICED FOR A WEEK.
#
# The Action is free for USER-owned repositories and licensed for
# ORGANIZATION-owned ones. ADR-014 moved a2ahub-private into the `r22d222`
# org, and from that moment this job failed on every single push:
#
#     [r22d222] is an organization. License key is required.
#     🛑 missing gitleaks license.
#
# So the secret scanner was DOWN on the repository where all code lands first,
# failing loudly in the run list, for a week, while releases were cut straight
# through. It was found on 2026-08-13 only because P13 K4 put the derived lane
# in CI and somebody read the resulting run list — the same shape as Pages
# failing 30 times out of 31 in the same repository, and the same reason it
# survived: a job that fails on every run is a job people learn to scroll past.
#
# The SCANNER is MIT-licensed; only the Action wrapper is gated. Running it
# directly costs one download, removes a third-party action from a security
# path, and works in both repositories regardless of who owns them.
#
# The download is PINNED BY DIGEST, not by tag. A release asset is mutable in
# the sense that matters here — the tag can be moved — and this is a binary
# that reads every secret-shaped string in the history. `workflow-lint` pins
# every `uses:` to a 40-hex SHA for exactly this reason; a `run:`-fetched
# binary needs its own equivalent, so the checksum is asserted before the
# archive is opened and the job dies if it does not match.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs stop (P13 K6, AC6). 689 commits in twelve days, pushed in
# bursts, and every intermediate push held a runner to completion while the
# tip was already being pushed on top of it.
#
# The trade is real and is stated rather than hidden: intermediate commits
# stop being proven, only the tip is. That is the intent at this commit rate,
# but it changes what the history guarantees, so it is written down where the
# setting lives.
#
# The group is scoped by `github.workflow`, which is what keeps `Release` out
# of it: cancelling a half-finished goreleaser or Sigstore run is worse than
# paying for it. A tag or candidate ref is unique, so nothing cancels there
# either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    # timeout-minutes: measured basis in scripts/lib/job-timeouts.tsv (P13 AC3).
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned by digest, not by tag)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history and the working tree
        run: |
          set -euo pipefail
          # `git` scans every commit reachable here — fetch-depth: 0 above is
          # what makes that the WHOLE history rather than the tip. `dir` then
          # scans the checked-out tree, which catches a secret that is present
          # in the working state but not in any commit's diff (a file added and
          # amended, for instance).
          #
          # --redact so a finding does not print the secret into a public log,
          # which would turn the detector into a second disclosure.
          # --config is EXPLICIT, not left to auto-detection. The local
          # verification that produced this repo's allowlist was run with it,
          # and a scan that silently used a different (or no) config would be
          # answering a different question from the one that was checked.
          gitleaks git --config .gitleaks.toml --redact --verbose .
          gitleaks dir --config .gitleaks.toml --redact --verbose .
