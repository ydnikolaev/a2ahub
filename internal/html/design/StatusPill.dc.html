<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="{{ pillStyle }}">{{ text }}</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:60},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Blocking · p1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;blocking&quot;,&quot;blockingStrong&quot;,&quot;attention&quot;,&quot;healthy&quot;,&quot;neutral&quot;,&quot;agent&quot;,&quot;outline&quot;],&quot;default&quot;:&quot;blocking&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mono&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;small&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TONES = {
  blocking: { bg: "var(--blocking-tint)", fg: "var(--blocking-ink)" },
  blockingStrong: { bg: "var(--red)", fg: "var(--surface)" },
  attention: { bg: "var(--attention-tint)", fg: "var(--attention-ink)" },
  healthy: { bg: "var(--healthy-tint)", fg: "var(--healthy-ink)" },
  neutral: { bg: "var(--hairline)", fg: "var(--body)" },
  agent: { bg: "var(--teal-tint)", fg: "var(--focus)" },
  outline: { bg: "var(--surface)", fg: "var(--muted)", ring: "inset 0 0 0 1px var(--border-strong)" }
};
class Component extends DCLogic {
  renderVals() {
    const t = TONES[this.props.tone] || TONES.neutral;
    const mono = this.props.mono ? "font-family:'IBM Plex Mono',ui-monospace,monospace; " : "font-family:'Onest',sans-serif; ";
    return {
      text: this.props.text ?? "",
      pillStyle: "display:inline-block; " + mono + "font-size:" + (this.props.size === "small" ? 13 : 14) + "px; font-weight:600; line-height:1.3; border-radius:6px; padding:" + (t.ring ? "3px 10px" : "4px 11px") + "; background:" + t.bg + "; color:" + t.fg + "; box-shadow:" + (t.ring || "none") + "; white-space:nowrap;"
    };
  }
}

</script>
</body>
</html>
