<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<table style="width:100%; border-collapse:collapse; font-family:'Onest',sans-serif; font-size:15px; line-height:1.5;">
  <tbody>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
      <tr>
        <td style="{{ r.labelStyle }}">{{ r.label }}</td>
        <td style="{{ r.valueStyle }}">{{ r.value }}</td>
      </tr>
    </sc-for>
  </tbody>
</table>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:220},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{label: string; value: string; mono?: boolean; muted?: boolean}&gt;&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const rows = Array.isArray(this.props.rows) ? this.props.rows : [];
    const last = rows.length - 1;
    return {
      rows: rows.map((r, i) => {
        const line = i === last ? "none" : "1px solid var(--hairline)";
        return {
          label: r.label,
          value: r.value,
          labelStyle: "padding:9px 14px 9px 0; color:var(--muted); white-space:nowrap; vertical-align:top; border-bottom:" + line + ";",
          valueStyle: "padding:9px 0; text-align:right; vertical-align:top; overflow-wrap:anywhere; border-bottom:" + line + ";" + (r.mono ? " font-family:'IBM Plex Mono',ui-monospace,monospace;" : "") + (r.muted ? " color:var(--muted);" : "")
        };
      })
    };
  }
}

</script>
</body>
</html>
