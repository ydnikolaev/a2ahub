schema: space/v1
space: replace-with-space-id
min_binary_version: 0.25.6            # write FLOOR (D-013/CC-085): a writer
                                      # older than this refuses its own write.
                                      # A SEPARATE axis from the CI validator
                                      # version, which lives in the
                                      # reusable-workflow ref, not here.
                                      # (`a2a space init` sets this to the
                                      # scaffolding binary's own version.)
                                      #
                                      # KNOW WHAT THIS DOES NOT DO. The check
                                      # runs in the WRITER's binary, not in the
                                      # space's CI — nothing server-side reads
                                      # this field. So it binds a binary that
                                      # honours it, and a binary that does not
                                      # populate the field simply is not gated:
                                      # before 0.9.0 that was every lifecycle
                                      # and contract verb, `submit` alone
                                      # carried the floor. Raising this stops
                                      # 0.9.0+ writers below the floor and
                                      # every version's `submit`; it cannot
                                      # retroactively gate an older binary's
                                      # `contract publish`.
gates: default                    # G1-G5 per §3.7; operator refines at space creation
participants: []                  # zero participants at template time (AC-101.1
                                   # green-on-empty) — added one at a time via each
                                   # system's onboarding PR (US-102, §9.2 step 2)
notification_routes: []           # operator fills in chat/webhook routes at creation.
                                   #
                                   # AVOID THE 2026-08-27 INCIDENT (answers-that-hold-2026-08
                                   # spec 11): a route naming `events: [human-gate, blocking]`
                                   # alone — this template's OWN `a2a notify setup` default —
                                   # silently drops every ordinary contract publish and
                                   # announcement, because `published` is deliberately excluded
                                   # from that default. Widen with a `kind:` selector instead of
                                   # turning `published` on for every note:
                                   #
                                   #   - channel: telegram
                                   #     chat: "<chat id from `a2a notify discover`>"
                                   #     events: [human-gate, blocking, published]
                                   #     kind: [contract, announcement]
                                   #
                                   # This surfaces exactly a contract publish and an
                                   # announcement addressed to a participant — the day's own
                                   # traffic — without also selecting every requirement/
                                   # question/work_request note `published` alone would.
vendored: []
