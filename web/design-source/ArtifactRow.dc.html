<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<button type="button" class="a2a-pick" onClick="{{ select }}" style="{{ rowStyle }}">
  <span style="display:flex; align-items:flex-start; gap:8px; flex-wrap:nowrap; margin-bottom:9px;">
    <span style="flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:6px;">
      <dc-import name="TypeBadge" type="{{ type }}" size="small" hint-size="140px,24px"></dc-import>
      <!-- Lifecycle state, then why it needs a human. The state was missing
           entirely: a card said "p2" without ever saying whether the document
           had been acknowledged, was in progress or already answered. -->
      <sc-if value="{{ hasState }}" hint-placeholder-val="{{ true }}">
        <dc-import name="StatusPill" text="{{ state }}" tone="{{ stateTone }}" size="small" hint-size="100px,24px"></dc-import>
      </sc-if>
      <sc-if value="{{ hasStatus }}" hint-placeholder-val="{{ true }}">
        <dc-import name="StatusPill" text="{{ status }}" tone="{{ tone }}" why="{{ statusWhy }}" size="small" hint-size="110px,24px"></dc-import>
      </sc-if>
    </span>
    <span style="{{ timeStyle }}">{{ time }}</span>
  </span>
  <span style="display:block; font-size:19px; line-height:1.35; font-weight:600; color:var(--text); margin-bottom:9px; overflow-wrap:anywhere;">{{ title }}</span>
  <span style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-right:18px; font-size:15px; color:var(--muted);">
    <span style="{{ fromMonoStyle }}">{{ fromMono }}</span>
    <span>{{ from }}</span>
    <span style="color:var(--border-strong);">→</span>
    <span style="{{ toMonoStyle }}">{{ toMono }}</span>
    <span>{{ to }}</span>
    <span style="color:var(--border-strong);">·</span>
    <span style="overflow-wrap:anywhere;">{{ meta }}</span>
  </span>
  <sc-if value="{{ hasFreshness }}" hint-placeholder-val="{{ true }}">
    <!-- This card is itself a button, so the dot stays a span rather than an
         invalid nested button. Hover and tap expose the same popover as the
         full card; tap stops before it selects the document underneath. -->
    <span data-row-freshness role="img" aria-label="{{ freshnessHint }}" title="{{ freshnessHint }}" onMouseEnter="{{ openFreshness }}" onMouseLeave="{{ closeFreshness }}" onClick="{{ toggleFreshness }}" style="{{ freshnessWrapStyle }}">
      <span aria-hidden="true" style="{{ freshnessDotStyle }}"></span>
      <sc-if value="{{ freshnessOpen }}" hint-placeholder-val="{{ false }}">
        <span role="tooltip" style="{{ freshnessBubbleStyle }}">{{ freshnessHint }}</span>
      </sc-if>
    </span>
  </sc-if>
</button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:150},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;work_request&quot;,&quot;question&quot;,&quot;decision&quot;,&quot;handoff&quot;,&quot;requirement&quot;,&quot;response&quot;,&quot;announcement&quot;,&quot;contract&quot;],&quot;default&quot;:&quot;work_request&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Prevent duplicate payment capture after a worker retry&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Blocking · p1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;blocking&quot;,&quot;blockingStrong&quot;,&quot;attention&quot;,&quot;healthy&quot;,&quot;neutral&quot;,&quot;agent&quot;,&quot;outline&quot;],&quot;default&quot;:&quot;blocking&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;statusWhy&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2 days overdue&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;from&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;checkout&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;to&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;you&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fromCode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;toCode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;checkout-core&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;syncAge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;только что&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;syncStale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;fromSelf&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;toSelf&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
function mono(name) { return String(name || "?").slice(0, 2).toUpperCase(); }
class Component extends DCLogic {
  state = { freshnessOpen: false };

  componentDidMount() {
    this.closeOnEscape = (ev) => {
      if (ev.key === "Escape" && this.state.freshnessOpen) this.setState({ freshnessOpen: false });
    };
    window.addEventListener("keydown", this.closeOnEscape);
  }

  componentWillUnmount() {
    window.removeEventListener("keydown", this.closeOnEscape);
  }

  renderVals() {
    const p = this.props;
    const selected = !!p.selected;
    const urgent = p.tone === "blocking" || p.tone === "blockingStrong";
    const avatar = (isSelf) => "flex:0 0 auto; width:24px; height:24px; border-radius:99px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; font-weight:600; flex:0 0 auto; " + (isSelf ? "background:var(--teal-solid); color:var(--on-solid);" : "background:var(--border); color:var(--body);");
    return {
      type: p.type,
      title: p.title ?? "",
      status: p.status ?? "",
      tone: p.tone || "neutral",
      // The sentence behind a label that raises a question, shown on the pill
      // itself. Empty for the labels that need none.
      statusWhy: p.statusWhy ?? "",
      hasStatus: !!p.status,
      state: p.state ?? "",
      stateTone: p.stateTone || "neutral",
      hasState: !!p.state,
      time: p.time ?? "",
      // Dates use the same human-facing type as the version timeline below;
      // identifiers keep the mono face, calendar labels do not.
      timeStyle: "flex:0 0 auto; text-align:right; font-family:'Onest',sans-serif; font-size:14px; white-space:nowrap;" + (urgent ? " font-weight:600; color:var(--red);" : " color:var(--muted);"),
      from: p.from ?? "",
      to: p.to ?? "",
      meta: p.meta ?? "",
      hasFreshness: !!p.syncAge,
      freshnessHint: p.syncStale
        ? ((document.documentElement.lang === "ru" ? "Локальная копия спейса может отставать от репозитория. Последняя синхронизация: " : "The local space copy may lag behind the repository. Last synced: ") + (p.syncAge || (document.documentElement.lang === "ru" ? "неизвестно" : "unknown")) + ".")
        : ((document.documentElement.lang === "ru" ? "Локальная копия спейса актуальна. Последняя синхронизация: " : "The local space copy is current. Last synced: ") + (p.syncAge || (document.documentElement.lang === "ru" ? "неизвестно" : "unknown")) + "."),
      freshnessOpen: this.state.freshnessOpen,
      freshnessWrapStyle: "position:absolute; right:18px; bottom:18px; z-index:3; width:13px; height:13px; display:flex; align-items:center; justify-content:center; cursor:help;",
      freshnessDotStyle: "width:9px; height:9px; flex:0 0 9px; display:inline-block; border-radius:99px; background:" + (p.syncStale ? "var(--ochre)" : "var(--healthy-ink)") + "; box-shadow:0 0 0 3px " + (p.syncStale ? "var(--attention-tint)" : "var(--healthy-tint)") + ";",
      freshnessBubbleStyle: "position:absolute; z-index:400; right:0; bottom:calc(100% + 9px); width:min(300px,74vw); background:var(--inverse); color:var(--on-inverse-2); border-radius:12px; padding:11px 13px; font-family:'Onest',sans-serif; font-size:14px; line-height:1.5; font-weight:400; text-align:left; box-shadow:0 14px 34px rgba(33,30,23,.34); white-space:normal; pointer-events:none;",
      openFreshness: () => this.setState({ freshnessOpen: true }),
      closeFreshness: () => this.setState({ freshnessOpen: false }),
      toggleFreshness: (ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        if (ev && ev.preventDefault) ev.preventDefault();
        this.setState(s => ({ freshnessOpen: !s.freshnessOpen }));
      },
      fromMono: p.fromCode || mono(p.from),
      toMono: p.toCode || mono(p.to),
      fromMonoStyle: avatar(p.fromSelf),
      toMonoStyle: avatar(p.toSelf),
      select: p.onSelect || (() => {}),
      // The open row is simply the one at full strength. A ring around it sat
      // on top of a type badge, a state pill, a bold title and a participant
      // line, and competed with all four; stepping the others back says the
      // same thing without adding a shape. The stylesheet's .a2a-pick:hover
      // brings a stepped-back row back to full while the pointer is on it.
      rowStyle: "position:relative; display:block; width:100%; box-sizing:border-box; text-align:left; font-family:'Onest',sans-serif; background:var(--surface); border:0; border-radius:14px; padding:16px 18px; cursor:pointer; box-shadow:" +
        (selected ? "0 2px 10px -4px rgba(33,30,23,.22)" : "0 1px 2px rgba(33,30,23,.06)") + ";" +
        (selected ? "" : " --a2a-pick:.5;")
    };
  }
}

</script>
</body>
</html>
