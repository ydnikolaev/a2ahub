<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article class="a2a-pick" data-card-summary="item" style="{{ rowStyle }}">
<button type="button" onClick="{{ select }}" aria-label="{{ openLabel }}" style="display:block; width:100%; padding:0; border:0; background:transparent; color:inherit; text-align:left; font:inherit; cursor:pointer;">
  <!-- Three tiers, which is the v0.22.0 row: what it is and when, what it is
       called, who is handing it to whom. Everything a reader needs to SCAN is
       above the fold of a single row; everything they need to READ is in the
       pane beside the list. The row grew to seven tiers by giving each fact
       its own line — badge, then title, then pills, then parties, then a
       freshness line, then a technical disclosure — which doubled its height
       (229px against the donor's 125px, measured on axon) and cut the list
       from five visible rows to three. -->
  <span data-item-row-fact="identity" data-card-fact="item:identity" style="display:flex; align-items:flex-start; gap:8px; flex-wrap:nowrap; margin-bottom:9px;">
    <span style="flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:6px;">
      <dc-import name="TypeBadge" type="{{ type }}" size="small" hint-size="140px,24px"></dc-import>
      <!-- display:contents so the pills join the badge's flex line rather than
           forming a block of their own — the marker stays for the fact order. -->
      <span data-item-row-fact="lifecycle" style="display:contents;"><sc-if value="{{ hasState }}" hint-placeholder-val="{{ true }}"><dc-import name="StatusPill" result="{{ stateResult }}" size="small" hint-size="120px,24px"></dc-import></sc-if><sc-if value="{{ hasOutcome }}" hint-placeholder-val="{{ true }}"><dc-import name="StatusPill" result="{{ outcomeResult }}" size="small" hint-size="120px,24px"></dc-import></sc-if><sc-if value="{{ hasPriority }}" hint-placeholder-val="{{ false }}"><dc-import name="StatusPill" text="{{ priority }}" tone="neutral" size="small" hint-size="60px,24px"></dc-import></sc-if></span>
    </span>
    <span style="{{ timeStyle }}">{{ time }}</span>
  </span>
  <span data-item-row-fact="title" style="display:block; font-size:var(--font-card-title-md); line-height:var(--line-card-title-md); font-weight:600; color:var(--text); margin-bottom:9px; overflow-wrap:anywhere;">{{ title }}</span>
  <!-- The freshness dot rides the actor line instead of claiming a tier: it is
       one glyph, and a line of its own cost more height than it carries. -->
  <span data-item-row-fact="parties" style="display:flex; align-items:center; gap:7px; flex-wrap:wrap; color:var(--muted); font-size:14px; line-height:1.5;"><span style="{{ fromMonoStyle }}">{{ fromMono }}</span><span>{{ from }}</span><span>→</span><span style="{{ toMonoStyle }}">{{ toMono }}</span><span>{{ to }}</span><span>·</span><span style="overflow-wrap:anywhere;">{{ meta }}</span><span data-item-row-fact="snapshot" style="display:contents;"><sc-if value="{{ hasFreshness }}" hint-placeholder-val="{{ true }}"><dc-import name="FreshnessDot" result="{{ freshnessResult }}" age="{{ syncAge }}" compact="{{ true }}" hint-size="12px,12px"></dc-import></sc-if></span></span>
</button>
<!-- The technical disclosure belongs to the DETAIL surface, not to a list
     row: a row the reader is scanning should not carry a control that
     expands it. ArtifactDetail renders the same facts in the pane. -->
</article>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:440},&quot;type&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;work_request&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Prevent duplicate payment capture after a worker retry&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stateResult&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;outcomeResult&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;lifecycleKnown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lifecycleUnknownText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;priority&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gateResult&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;20.08.2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;from&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;atlas&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;to&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;checkout&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fromCode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;toCode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;checkout-core&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;syncAge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;freshnessResult&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;fromSelf&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;toSelf&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;reasonSentence&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Checkout owns the next move.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;waitingOnLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Whose turn&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;waitingOn&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;checkout&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;expectedMoveLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Expected move&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;expectedMove&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;accept&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;terminalText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;archivedText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;yourMoveText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;gatePendingText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;urgencyText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;summary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;operationalItems&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;array&quot;},&quot;noneRecorded&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;notRecorded&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;snapshotUnavailable&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;snapshotUnknownText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pendingMergeText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;technicalLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Technical detail&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;technicalWhy&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ruleLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rule identity&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ruleIdentity&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;technicalEvidence&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;openLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Open item&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
function mono(name) { return String(name || "?").slice(0, 2).toUpperCase(); }
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const selected = !!p.selected;
    const avatar = (isSelf) => "flex:0 0 auto; width:24px; height:24px; border-radius:99px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; font-weight:600; flex:0 0 auto; " + (isSelf ? "background:var(--teal-solid); color:var(--on-solid);" : "background:var(--border); color:var(--body);");
    return {
      type: p.type,
      title: p.title ?? "",
      stateResult: p.stateResult || null,
      hasState: !!p.stateResult,
      outcomeResult: p.outcomeResult || null,
      hasOutcome: !!p.outcomeResult,
      // The row's own compact urgency signal (specs/05-exchange.md §1 "row"
      // row): the carried priority value alone, as a plain StatusPill, the
      // same shape TimelineArtifactCard already ships. The joined
      // "priority p3; blocking: no; overdue: no" sentence stays a pane/
      // technical-detail fact — it is not reconstructed here.
      hasPriority: !!p.priority,
      priority: p.priority || "",
      lifecycleKnown: p.lifecycleKnown !== false,
      lifecycleUnknown: p.lifecycleKnown === false,
      lifecycleUnknownText: p.lifecycleUnknownText || "",
      gateResult: p.gateResult || null,
      hasGate: !!p.gateResult,
      lacksGate: !p.gateResult,
      time: p.time ?? "",
      // Dates use the same human-facing type as the version timeline below;
      // identifiers keep the mono face, calendar labels do not.
      timeStyle: "flex:0 0 auto; text-align:right; font-family:'Onest',sans-serif; font-size:14px; white-space:nowrap; color:var(--muted);",
      from: p.from ?? "",
      to: p.to ?? "",
      meta: p.meta ?? "",
      hasFreshness: !!p.freshnessResult,
      freshnessResult: p.freshnessResult || null,
      syncAge: p.syncAge || "",
      reasonSentence: p.reasonSentence || "",
      waitingOnLabel: p.waitingOnLabel || "",
      waitingOn: p.waitingOn || "",
      expectedMoveLabel: p.expectedMoveLabel || "",
      expectedMove: p.expectedMove || "",
      terminalText: p.terminalText || "",
      archivedText: p.archivedText || "",
      yourMoveText: p.yourMoveText || "",
      gatePendingText: p.gatePendingText || "",
      urgencyText: p.urgencyText || "",
      summary: p.summary || "",
      operationalItems: p.operationalItems || [],
      hasOperational: !!(p.operationalItems && p.operationalItems.length),
      lacksOperational: !(p.operationalItems && p.operationalItems.length),
      noneRecorded: p.noneRecorded || "",
      notRecorded: p.notRecorded || "",
      snapshotUnavailable: p.snapshotUnavailable || "",
      hasSnapshotUnavailable: !!p.snapshotUnavailable,
      snapshotUnknownText: p.snapshotUnknownText || "",
      hasSnapshotUnknown: !!p.snapshotUnknownText,
      pendingMergeText: p.pendingMergeText || "",
      hasPendingMerge: !!p.pendingMergeText,
      technicalLabel: p.technicalLabel || "",
      technicalWhy: p.technicalWhy || "",
      ruleLabel: p.ruleLabel || "",
      ruleIdentity: p.ruleIdentity || "",
      technicalEvidence: p.technicalEvidence || "",
      hasTechnical: !!(p.technicalWhy || p.ruleIdentity || p.technicalEvidence),
      openLabel: p.openLabel || "",
      fromMono: p.fromCode || mono(p.from),
      toMono: p.toCode || mono(p.to),
      fromMonoStyle: avatar(p.fromSelf),
      toMonoStyle: avatar(p.toSelf),
      select: p.onSelect || (() => {}),
      // Selection changes only the container treatment. Text, badges and
      // avatars stay fully opaque so their contrast is independent of state.
      rowStyle: "position:relative; display:block; width:100%; box-sizing:border-box; text-align:left; font-family:'Onest',sans-serif; border:0; border-radius:var(--radius-card); padding:var(--padding-list-card-block) var(--padding-list-card-inline); cursor:pointer;" +
        (selected
          ? " --a2a-pick-shadow:0 3px 12px -4px rgba(33,30,23,.24), inset 0 0 0 1px var(--border-strong); --a2a-pick-active-shadow:var(--a2a-pick-shadow);"
          : " --a2a-pick-surface:var(--surface-inactive-card); --a2a-pick-shadow:var(--shadow-inactive-card);")
    };
  }
}

</script>
</body>
</html>
