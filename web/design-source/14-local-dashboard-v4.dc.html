<head>

<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="VocabularyResolver" hint-size="0,0"></dc-import>
<helmet>
<title>a2a html — local dashboard (v4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* A2A_PREVIEW_TOKENS_START — generated from ui/tokens.css */
/* a2ahub design v4 — semantic token layer.
 * One file for Astro, the Go HTML renderer and a future Nuxt UI.
 * :root = light (default). html[data-theme="dark"] re-points the same names —
 * no markup, class or component change is needed to switch themes.
 * Hue carries meaning: teal = agent path, ochre = human gate / drift,
 * red = literal blockage or failure, green = verified, plum = decision.
 * Never make colour the only signal: every status also carries a word and a shape.
 */

:root {
  --canvas: #F1EEE6;
  --page: #FAF7F0;
  --surface: #FFFFFF;
  --sink: #E8E3D7;
  --border: #E4DFD2;
  --border-strong: #CBC2AB;
  --hairline: #F1EEE6;
  --text: #211E17;
  --body: #453F31;
  /* Secondary copy still carries meaning. Keep every text token at AA
   * contrast on the darkest light-theme surface it can legitimately sit on
   * (--border); decorative strokes use opacity instead of a weak text ink. */
  --muted: #655E4A;
  --faint: #655E4A;
  --logo-dim: #6F6853;
  --inverse: #211E17;
  --inverse-2: #2A261D;
  --inverse-3: #33302A;
  --inverse-line: #3A342A;
  --on-inverse: #F3EFE4;
  --on-inverse-2: #E8E3D4;
  --on-inverse-muted: #C4BCA6;
  --on-inverse-faint: #A8A08A;
  --on-dark: #FAF7F0;
  --on-solid: #FFFFFF;
  --teal-solid: #175E6B;
  --teal-ink: #175E6B;
  --teal-ink-hover: #114953;
  --teal-tint: #EDF4F5;
  --teal-strong-ink: #0E3F48;
  --teal-on-dark: #8FD0DB;
  --teal-hairline: #BFD9DD;
  --focus: #175E6B;
  --ochre: #9A5C08;
  --attention-tint: #FBF4E4;
  --attention-ink: #7A5A14;
  --attention-strong: #5E4410;
  --attention-line: #E8CE94;
  --red: #AC382A;
  --blocking-tint: #F8E9E5;
  --blocking-ink: #8C2B1F;
  --blocking-strong: #5E2A22;
  --blocking-line: #E0B3AB;
  --green: #3B7548;
  --healthy-tint: #E9F1E8;
  --healthy-ink: #2F5E3A;
  --healthy-strong: #24492D;
  --plum: #7A3B62;
  /* One semantic accent per document family. Lifecycle rendering, causal
   * links and badges all consume these aliases instead of redefining colours
   * on each surface. */
  --type-work-request-accent: var(--teal-solid);
  --type-question-accent: var(--attention-strong);
  --type-decision-accent: var(--plum);
  --type-handoff-accent: var(--green);
  --type-requirement-accent: var(--body);
  --type-response-accent: var(--teal-ink);
  --type-announcement-accent: var(--body);
  --type-contract-accent: var(--teal-ink);
  --selection: #D7E8EA;
  --attn-bg: #33291A;
  --attn-ink: #E2A33C;
  --code-chip: #1B2A2D;
  --primary: #211E17;
  --on-primary: #FAF7F0;
  --header-bg: rgba(241,238,230,.94);
  --shadow-card: 0 1px 2px rgba(33,30,23,.06);
  /* Elevation, by ROLE rather than by hand. Every surface that lifts off the
   * page used to type its own rgba(33,30,23,α) — the light theme's ink, written
   * as a literal — which meant the dark theme could not reach it: the block
   * below re-points the ink for everything EXCEPT a colour that was copied
   * instead of referenced. A selected row on the dark page kept casting a warm
   * light-mode shadow, and did so in eighteen files at once. Roles, not
   * values, so a surface asks for what it IS and the theme answers. */
  --shadow-panel: 0 1px 3px rgba(33,30,23,.08), 0 18px 40px -28px rgba(33,30,23,.5);
  --shadow-popover: 0 16px 40px -12px rgba(33,30,23,.42);
  --shadow-selected-card: 0 3px 12px -4px rgba(33,30,23,.24);
  --shadow-tooltip: 0 18px 40px -18px rgba(33,30,23,.34);
  --shadow-modal: 0 24px 70px -22px rgba(33,30,23,.65);
  /* The scrim is a FILL, not a shadow: it dims the page behind a dialog. It
   * lives here because it is the same ink question, and it is the one value a
   * modal must not invent for itself. */
  --scrim: rgba(33,30,23,.5);
  /* Shared shape scale: nested controls step inward while identity chips get
   * the softer silhouette needed around circular avatars. */
  --radius-control: 10px;
  --radius-chip: 12px;
  --radius-inner: 8px;
  --radius-badge: 6px;
  --radius-nested: 11px;
  --radius-card: 14px;
  --radius-panel: 18px;
  /* Semantic surface and rhythm roles. Components use these aliases instead
   * of inventing nearby beige/white shades or one-off section gaps. */
  --surface-card: var(--surface);
  --surface-section: var(--page);
  --surface-workbench: var(--map-canvas);
  --space-section: 24px;
  --space-section-strong: 30px;
  --space-grid: 18px;
  --space-stack: 14px;
  --space-inline: 10px;
  --space-after-section-heading: 16px;
  --space-card-tags-to-author: 16px;
  --space-card-author-to-title: 15px;
  --space-card-title-to-content: 18px;
  /* The selected record must be obvious in a dense master/detail list without
   * reducing the contrast of its contents. Inactive cards step onto the page
   * surface and keep a strong inset boundary; hover and keyboard focus restore
   * the normal card surface and shadow. */
  --surface-inactive-card: var(--page);
  --border-inactive-card: var(--border-strong);
  --shadow-inactive-card: inset 0 0 0 1px var(--border-inactive-card);
  /* Shared container insets. Block and inline values stay separate so a
   * responsive component can change its layout without re-declaring the
   * design scale. */
  --padding-panel-block: 26px;
  --padding-panel-inline: 28px;
  --padding-card-block: 20px;
  --padding-card-inline: 22px;
  --padding-list-card-block: 16px;
  --padding-list-card-inline: 18px;
  --padding-nested-block: 13px;
  --padding-nested-inline: 15px;
  --padding-modal-backdrop: 24px;
  /* One display scale for the title of the selected thing in every
   * master/detail surface. A thread, document, contract or map detail is the
   * same level in the reading hierarchy even when its container differs. */
  --font-detail-title: 28px;
  --line-detail-title: 1.25;
  --tracking-detail-title: -0.015em;
  /* Card hierarchy has three deliberate tiers: selected detail, normal list
   * card and compact attention teaser. Section headings sit between a page
   * title and a card title and never introduce a fourth card tier. */
  --font-card-title-md: 19px;
  --line-card-title-md: 1.35;
  --font-card-title-sm: 17px;
  --line-card-title-sm: 1.35;
  --font-section-title: 22px;
  --line-section-title: 1.3;
  --font-section-subtitle: 15px;
  --line-section-subtitle: 1.5;
  --font-subheading: 16px;
  --line-subheading: 1.35;
  --font-meta: 14px;
  --line-meta: 1.45;
  /* TypeBadge and StatusPill share one geometry contract. Outlined variants
   * lose one pixel of padding on every edge because their inset ring occupies
   * that space, keeping the outer box identical to a solid badge. */
  --font-badge-default: 14px;
  --font-badge-small: 13px;
  --line-badge: 1.3;
  --padding-badge-solid-block: 4px;
  --padding-badge-solid-inline: 11px;
  --padding-badge-outline-block: 3px;
  --padding-badge-outline-inline: 10px;
  /* Diagram field: deliberately distinct from both the page canvas and the
   * white component surface, without introducing another semantic hue. */
  --map-canvas: #EAE6DC;
  --map-grid: rgba(111,104,83,.13);
}
html[data-theme="dark"] {
  --canvas: #16140F;
  --page: #1D1A14;
  --surface: #24211A;
  --sink: #2E2A21;
  --border: #3B3529;
  --border-strong: #4E4736;
  --hairline: #302B22;
  --text: #F4F0E4;
  --body: #DAD3C0;
  --muted: #ADA48C;
  --faint: #918973;
  --logo-dim: #948C75;
  --inverse: #0E0D09;
  --inverse-2: #1A1812;
  --inverse-3: #2E2A21;
  --inverse-line: #3B3529;
  --on-inverse: #F3EFE4;
  --on-inverse-2: #E8E3D4;
  --on-inverse-muted: #C4BCA6;
  --on-inverse-faint: #A8A08A;
  --on-dark: #FAF7F0;
  --on-solid: #0E0D09;
  --teal-solid: #3594A7;
  --teal-ink: #8FD0DB;
  --teal-ink-hover: #B4E2EA;
  --teal-tint: #123039;
  --teal-strong-ink: #C7E9EF;
  --teal-on-dark: #8FD0DB;
  --teal-hairline: #2C5A63;
  --focus: #8FD0DB;
  --ochre: #D9902A;
  --attention-tint: #3A2D12;
  --attention-ink: #E8C579;
  --attention-strong: #F4DDAA;
  --attention-line: #6B5320;
  --red: #E8786C;
  --blocking-tint: #3C1E19;
  --blocking-ink: #F0A79A;
  --blocking-strong: #F7C9C1;
  --blocking-line: #6E3229;
  --green: #5FA773;
  --healthy-tint: #1B2E20;
  --healthy-ink: #94CFA3;
  --healthy-strong: #BCE3C6;
  --plum: #B981A0;
  --selection: #1E4A52;
  --attn-bg: #3A2D12;
  --attn-ink: #E2A33C;
  --code-chip: #12262A;
  --primary: #EDE7D8;
  --on-primary: #16140F;
  --header-bg: rgba(22,20,15,.94);
  --shadow-card: 0 1px 2px rgba(0,0,0,.4);
  /* Dark elevation is black, not tinted ink, and carries more alpha: on a
   * #16140F page a warm shadow reads as a smudge, and a faint one disappears
   * entirely. Same roles, same geometry, so nothing shifts but the colour. */
  --shadow-panel: 0 1px 3px rgba(0,0,0,.5), 0 18px 40px -28px rgba(0,0,0,.75);
  --shadow-popover: 0 16px 40px -12px rgba(0,0,0,.7);
  --shadow-selected-card: 0 3px 12px -4px rgba(0,0,0,.6);
  --shadow-tooltip: 0 18px 40px -18px rgba(0,0,0,.68);
  --shadow-modal: 0 24px 70px -22px rgba(0,0,0,.8);
  --scrim: rgba(0,0,0,.66);
  --map-canvas: #191711;
  --map-grid: rgba(173,164,140,.11);
}
/* A2A_PREVIEW_TOKENS_END */
html[data-theme="dark"] header { backdrop-filter: blur(8px); }
body { margin: 0; background:var(--canvas); color:var(--text); font-family: "Onest", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; -webkit-font-smoothing: antialiased; }
.a2a-detail-title { font-size:var(--font-detail-title); line-height:var(--line-detail-title); font-weight:600; letter-spacing:var(--tracking-detail-title); overflow-wrap:anywhere; text-wrap:balance; }
.artifact-markdown h1 { margin:0 0 12px; font-size:var(--font-card-title-md); line-height:var(--line-card-title-md); font-weight:600; letter-spacing:normal; color:var(--text); overflow-wrap:anywhere; text-wrap:pretty; }
a { color:var(--teal-ink); text-underline-offset: 3px; }
a:hover { color:var(--teal-ink-hover); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
::selection { background:var(--selection); }
.ssot-doc-body { color:var(--body); font-size:16px; line-height:1.7; }
.ssot-doc-body > :first-child { margin-top:0; }
.ssot-doc-body > :last-child { margin-bottom:0; }
.ssot-doc-body h2,.ssot-doc-body h3,.ssot-doc-body h4 { color:var(--text); line-height:1.2; letter-spacing:-.02em; }
.ssot-doc-body h2 { margin:32px 0 12px; padding-top:26px; border-top:1px solid var(--hairline); font-size:25px; }
.ssot-doc-body h2:first-child { margin-top:0; padding-top:0; border-top:0; }
.ssot-doc-body h3 { margin:25px 0 9px; font-size:20px; }
.ssot-doc-body p { margin:0 0 15px; }
.ssot-doc-body ul,.ssot-doc-body ol { padding-left:22px; }
.ssot-doc-body pre { max-width:100%; overflow:auto; padding:14px 16px; border-radius:10px; background:var(--inverse); color:var(--on-inverse-2); font:14px/1.65 'IBM Plex Mono',monospace; }
.ssot-doc-body > pre[data-doc-frontmatter] { margin:0 0 24px; padding:18px 20px; white-space:pre-wrap; border-left:3px solid var(--teal-solid); box-shadow:0 10px 28px -22px rgba(33,30,23,.7); }
.ssot-doc-body blockquote { margin:20px 0; padding:14px 18px; border-left:3px solid var(--teal-solid); border-radius:0 10px 10px 0; background:var(--teal-tint); color:var(--body); }
.ssot-doc-body code:not(pre code) { padding:2px 5px; border-radius:5px; background:var(--sink); font:0.9em/1.5 'IBM Plex Mono',monospace; }
.ssot-doc-body table { width:100%; display:block; overflow-x:auto; margin:16px 0 22px; border:1px solid var(--border); border-radius:10px; border-collapse:separate; border-spacing:0; font-size:14px; }
.ssot-doc-body th,.ssot-doc-body td { min-width:120px; padding:10px 12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
.ssot-doc-body tr:last-child td { border-bottom:0; }
.a2a-fade-scroll { display:block; min-width:0; max-width:100%; box-sizing:border-box; overflow-x:auto; overscroll-behavior-inline:contain; scrollbar-width:none; -ms-overflow-style:none; -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%); mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent 100%); }
.a2a-fade-scroll::-webkit-scrollbar,.a2a-sticky-rail::-webkit-scrollbar { display:none; }
.a2a-sticky-rail { scrollbar-width:none; -ms-overflow-style:none; }


</style>
</helmet>

<!-- This scoped layout style deliberately lives inside x-dc, outside Helmet.
     The production builder removes Helmet (external font links and preview
     metadata) before embedding the offline dashboard, while preserving the
     page root byte-for-byte. Keeping the responsive composition here makes
     the approved design source the only owner of the layout in both preview
     and production. -->
<style>
.a2a-topbar { box-sizing:border-box; }
@media (max-width:700px) {
  /* This responsive shell belongs to the shipped dashboard style, not the
     preview-only Helmet. A grid gives the header two explicit rows: identity
     and controls above, the active view plus More below. */
  .a2a-topbar { width:calc(100% - 32px) !important; display:grid !important; grid-template-columns:auto minmax(0,1fr) auto; gap:8px !important; padding:10px 0 8px !important; }
  .a2a-topbar-main { display:contents !important; }
  .a2a-topbar-main > button { grid-column:1; grid-row:1; }
  .a2a-self-chip { display:none !important; }
  .a2a-topbar-actions { grid-column:3; grid-row:1; margin-left:0 !important; }
  .a2a-topnav { grid-column:1 / -1; grid-row:2; width:100% !important; max-width:100%; min-width:0 !important; box-sizing:border-box; flex:none !important; justify-content:flex-start; }
  .a2a-release-meta-row { grid-template-columns:minmax(0,1fr) !important; }
  .a2a-release-affects { text-align:left !important; }
  .a2a-sticky-rail { position:static !important; max-height:none !important; overflow:visible !important; }
}
.a2a-overview-command-shell { --overview-columns:minmax(0,3fr) minmax(320px,2fr); }
.a2a-overview-command-heading { display:grid; grid-template-columns:var(--overview-columns); column-gap:var(--space-grid); align-items:start; margin-bottom:var(--space-grid); }
.a2a-overview-operational-heading { grid-column:1; min-width:0; padding:2px 0 0; }
.a2a-overview-section-title { margin:0 0 4px; font-size:var(--font-section-title); line-height:var(--line-section-title); font-weight:600; letter-spacing:-.01em; color:var(--text); }
.a2a-overview-section-subtitle { margin:0; font-size:var(--font-section-subtitle); line-height:var(--line-section-subtitle); color:var(--muted); }
.a2a-overview-command-grid { position:relative; display:grid; grid-template-columns:var(--overview-columns); grid-template-rows:auto auto minmax(0,1fr); grid-template-areas:"operational kpis" "operational inventory" "operational attention"; gap:var(--space-grid); align-items:start; margin-bottom:var(--space-section-strong); }
.a2a-overview-operational { grid-area:operational; min-width:0; box-sizing:border-box; }
.a2a-overview-operational-scroll { min-width:0; overflow:visible; }
.a2a-overview-operational-list { display:flex; flex-direction:column; gap:var(--space-grid); margin:0 0 var(--space-grid); }
.a2a-overview-process { min-width:0; }
.a2a-overview-process-card { min-width:0; border:1px solid var(--border); border-radius:var(--radius-card); background:var(--surface); overflow:hidden; }
.a2a-overview-snapshot { grid-column:2; min-width:0; display:flex; align-items:center; justify-content:flex-end; padding-top:6px; }
.a2a-overview-kpis { grid-area:kpis; min-width:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-grid); align-items:stretch; }
.a2a-overview-inventory { grid-area:inventory; min-width:0; }
.a2a-overview-attention { grid-area:attention; position:sticky; top:84px; min-width:0; align-self:start; }
@media (max-width:960px) {
  .a2a-overview-command-heading { grid-template-columns:minmax(0,1fr); }
  .a2a-overview-operational-heading { grid-column:1; }
  .a2a-overview-snapshot { grid-column:1; justify-content:flex-start; padding-top:0; margin-top:var(--space-inline); }
  .a2a-overview-command-grid { grid-template-columns:minmax(0,1fr); grid-template-rows:auto; grid-template-areas:"operational" "kpis" "inventory" "attention"; }
  .a2a-overview-attention { position:static; }
}
@media (max-width:700px) {
  .a2a-overview-kpis { grid-template-columns:minmax(0,1fr); }
}
.sc-host[data-sc-name="DashboardShell"],
.sc-host[data-sc-name="Overview"],
.sc-host[data-sc-name="ExchangeView"],
.sc-host[data-sc-name="ThreadsView"],
.sc-host[data-sc-name="ContractsView"],
.sc-host[data-sc-name="MapView"],
.sc-host[data-sc-name="SpacesView"],
.sc-host[data-sc-name="VersionsView"],
.sc-host[data-sc-name="DocsView"],
.sc-host[data-sc-name="GuideView"],
.sc-host[data-sc-name="Modal"] { display:contents; }
.sc-host[data-sc-name="DashboardLive"] { display:none; }
</style>

<div data-screen-label="Local dashboard v4" style="min-height:100vh; display:flex; flex-direction:column;">

  <dc-import name="DashboardShell" ctx="{{ shellTopCtx }}" hint-size="100%,84px"></dc-import>
  <sc-if value="{{ hasPageHeader }}" hint-placeholder-val="{{ false }}"><dc-import name="DashboardLive" data="{{ liveData }}" on-hydrate="{{ hydrateDashboard }}" on-state="{{ setLiveTransport }}" on-ready="{{ setRefresh }}" hint-size="0,0"></dc-import></sc-if>

  <!-- 70px of air under the last row was a footer-sized gap on every screen
       whose columns end early. The footer already carries its own top border
       and padding; this only needs enough to keep the last card off it. -->
  <main style="flex:1 1 auto; min-width:0; width:min(1240px, 100% - 56px); margin:0 auto; padding:26px 0 24px; box-sizing:border-box;">

    <dc-import name="DashboardShell" ctx="{{ shellPageCtx }}" hint-size="100%,160px"></dc-import>

    <sc-if value="{{ isOverview }}" hint-placeholder-val="{{ false }}">
      <dc-import name="Overview" ctx="{{ overviewCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>

    <sc-if value="{{ isWork }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ExchangeView" ctx="{{ exchangeCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>

    <sc-if value="{{ isThreads }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ThreadsView" ctx="{{ threadsCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>

    <sc-if value="{{ isContracts }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ContractsView" ctx="{{ contractsCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>

    <sc-if value="{{ isNetwork }}" hint-placeholder-val="{{ false }}">
      <dc-import name="MapView" ctx="{{ mapCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>

    <sc-if value="{{ isSpaces }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SpacesView" ctx="{{ spacesCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>

    <sc-if value="{{ isVersions }}" hint-placeholder-val="{{ false }}">
      <dc-import name="VersionsView" ctx="{{ versionsCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>

    <sc-if value="{{ isDocs }}" hint-placeholder-val="{{ false }}">
      <dc-import name="DocsView" ctx="{{ docsCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>

    <sc-if value="{{ isGuide }}" hint-placeholder-val="{{ false }}">
      <dc-import name="GuideView" ctx="{{ guideCtx }}" hint-size="100%,700px"></dc-import>
    </sc-if>


  </main>

  <dc-import name="Modal" ctx="{{ modalCtx }}" hint-size="100%,0"></dc-import>

  <dc-import name="DashboardShell" ctx="{{ shellFooterCtx }}" hint-size="100%,104px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const DASHBOARD_EN = {
    views:["Overview","Exchange","Threads","Contracts","Map","Spaces","Versions","Docs","Guide"],
    backOverview:"Back to Overview", viewsLabel:"Views", more:"More", localeGroup:"Interface language", space:"Space",
    errorTitle:"Could not read demo data", errorPrefix:"The dashboard is a read-only projection of", errorSuffix:". Missing facts are never inferred.",
    openWork:"Open Exchange", direction:"Show", typeFilter:"Type",
    spaceHealth:"Space health", spaceHealthTitle:"How current this page is",
    spaceHealthSub:"Everything on these screens is read from a local copy of each space, taken once when this file was written. This is when that copy was last refreshed, and what each space expects of your binary.",
    spaceHealthFlagsTitle:"Worth a look", spaceHealthFlagsText:"Recorded by committed events, or a problem reading the local copy. A flag is a reason to look, not a verdict.",

function encodeOpaqueTuple(values) {
  const raw = encodeURIComponent(JSON.stringify(values)).replace(/%([0-9A-F]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  let out = "";
  for (let i = 0; i < raw.length; i += 3) {
    const a = raw.charCodeAt(i), b = i + 1 < raw.length ? raw.charCodeAt(i + 1) : 0, c = i + 2 < raw.length ? raw.charCodeAt(i + 2) : 0;
    const block = (a << 16) | (b << 8) | c;
    out += alphabet[(block >> 18) & 63] + alphabet[(block >> 12) & 63] + (i + 1 < raw.length ? alphabet[(block >> 6) & 63] : "=") + (i + 2 < raw.length ? alphabet[block & 63] : "=");
  }
  return out.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeOpaqueTuple(value) {
  try {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
    let input = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
    while (input.length % 4) input += "=";
    let raw = "";
    for (let i = 0; i < input.length; i += 4) {
      const a = alphabet.indexOf(input[i]), b = alphabet.indexOf(input[i + 1]);
      const c = input[i + 2] === "=" ? 0 : alphabet.indexOf(input[i + 2]);
      const d = input[i + 3] === "=" ? 0 : alphabet.indexOf(input[i + 3]);
      if (a < 0 || b < 0 || c < 0 || d < 0) return null;
      const block = (a << 18) | (b << 12) | (c << 6) | d;
      raw += String.fromCharCode((block >> 16) & 255);
      if (input[i + 2] !== "=") raw += String.fromCharCode((block >> 8) & 255);
      if (input[i + 3] !== "=") raw += String.fromCharCode(block & 255);
    }
    return JSON.parse(decodeURIComponent([...raw].map(ch => "%" + ch.charCodeAt(0).toString(16).padStart(2, "0")).join("")));
  } catch (e) { return null; }
}

      Overview: ["patch", "navigate", "cardID", "cardAccent", "openCard", "closeCard", "openAggregate"],
      ExchangeView: ["patch", "navigate", "cardID", "cardAccent", "openCard", "closeCard"],
      ThreadsView: ["patch", "navigate", "cardID", "cardAccent", "openCard", "closeCard"],
      ContractsView: ["patch", "navigate", "copy", "sourceURL", "cardID", "cardAccent", "openCard"],
      MapView: ["patch", "navigate", "cardID", "cardAccent", "openCard"],
      SpacesView: ["cardID", "cardAccent", "openCard"], VersionsView: ["patch", "copy"], DocsView: ["patch"], GuideView: []
    }[name] || [];
    return Object.fromEntries(allowed.map(key => [key, actions[key]]));
  }

  viewContext(name) {
    return { data: this.state.data, locale: this.state.locale, ui: this.uiSlice(name), actions: this.viewActions(name) };
  }

  renderVals() {
    const data = this.state.data;
    const locale = this.state.locale;
    const shellActions = {
      patch: patch => this.setState(patch), navigate: (view, extra) => this.go(view, extra),
      setTheme: theme => this.applyTheme(theme), setLocale: value => this.applyLocale(value),
      refresh: typeof this.state.refresh === "function" ? this.state.refresh : null,
      cardID: (kind, source) => this.cardID(kind, source), cardAccent: (family, identity) => this.cardAccent(family, identity),
      openCard: (kind, id, accent) => this.openCard(kind, id, accent)
    };
    const modalActions = {
      patch: patch => this.setState(patch), navigate: (view, extra) => this.go(view, extra),
      closeCard: () => this.closeCard(),
      cardID: (kind, source) => this.cardID(kind, source), cardAccent: (family, identity) => this.cardAccent(family, identity),
      openCard: (kind, id, accent) => this.openCard(kind, id, accent), openAggregate: key => this.openAggregate(key),
      copy: text => this.copy(text), sourceURL: (space, path, revision) => this.sourceURL(space, path, revision)
    };
    return {
      hasPageHeader: !!data && !this.state.error,
      isOverview: !!data && this.state.view === "overview", isWork: !!data && this.state.view === "work",
      isThreads: !!data && this.state.view === "threads", isContracts: !!data && this.state.view === "contracts",
      isNetwork: !!data && this.state.view === "network", isSpaces: !!data && this.state.view === "spaces",
      isVersions: !!data && this.state.view === "versions", isDocs: !!data && this.state.view === "docs",
      isGuide: !!data && this.state.view === "guide",
      shellTopCtx: { data, locale, ui: this.uiSlice("DashboardShell", { variant:"top" }), actions: shellActions },
      shellPageCtx: { data, locale, ui: this.uiSlice("DashboardShell", { variant:"page" }), actions: shellActions },
      shellFooterCtx: { data, locale, ui: this.uiSlice("DashboardShell", { variant:"footer" }), actions: shellActions },
      modalCtx: { data, locale, ui: this.uiSlice("Modal", { cardManifest:A2A_CARD_MANIFEST, goneCard:this.state.goneCard, retainedCardData:this.state.retainedCardData }), actions: modalActions },
      overviewCtx: this.viewContext("Overview"), exchangeCtx: this.viewContext("ExchangeView"), threadsCtx: this.viewContext("ThreadsView"),
      contractsCtx: this.viewContext("ContractsView"), mapCtx: this.viewContext("MapView"), spacesCtx: this.viewContext("SpacesView"),
      versionsCtx: this.viewContext("VersionsView"), docsCtx: this.viewContext("DocsView"), guideCtx: this.viewContext("GuideView"),
      liveData: data,
      hydrateDashboard: candidate => this.hydrate(candidate),
      setLiveTransport: liveTransport => this.setState({ liveTransport }),
      setRefresh: refresh => this.setState({ refresh })
    };
  }
}
</script>
</body>
