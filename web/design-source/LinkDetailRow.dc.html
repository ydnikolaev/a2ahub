<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article data-link-detail-row="true" style="min-width:0; background:var(--surface-section); border-radius:12px; padding:14px 15px; box-shadow:inset 0 0 0 1px var(--hairline);">
  <div style="display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:9px;">
    <sc-if value="{{ row.hasType }}" hint-placeholder-val="{{ false }}">
      <dc-import name="TypeBadge" type="{{ row.type }}" size="small" hint-size="140px,24px"></dc-import>
    </sc-if>
    <sc-if value="{{ row.hasStateTag }}" hint-placeholder-val="{{ false }}">
      <dc-import name="StatusPill" text="{{ row.stateText }}" tone="{{ row.stateTone }}" size="small" hint-size="100px,24px"></dc-import>
    </sc-if>
    <dc-import name="StatusPill" text="{{ row.pillText }}" tone="{{ row.pillTone }}" why="{{ row.pillWhy }}" size="small" hint-size="100px,24px"></dc-import>
  </div>
  <div style="font-size:15px; line-height:1.4; font-weight:600; color:var(--text); overflow-wrap:anywhere; text-wrap:pretty;">{{ row.head }}</div>
  <div style="margin-top:5px; font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:13px; line-height:1.55; color:var(--muted); overflow-wrap:anywhere;">{{ row.detail }}</div>
  <sc-if value="{{ row.hasActions }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; padding-top:11px; border-top:1px solid var(--hairline);">
      <sc-if value="{{ row.canOpen }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ row.open }}" style="display:inline-flex; align-items:center; gap:7px; min-height:34px; border:0; border-radius:var(--radius-control); padding:7px 10px; color:var(--teal-ink); background:var(--teal-tint); font-family:'Onest',sans-serif; font-size:14px; line-height:1.3; font-weight:600; cursor:pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
          <span>{{ row.openLabel }}</span>
        </button>
      </sc-if>
      <sc-if value="{{ row.canOpenDoc }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ row.openDoc }}" style="display:inline-flex; align-items:center; gap:7px; min-height:34px; border:0; border-radius:var(--radius-control); padding:7px 10px; color:var(--body); background:transparent; box-shadow:inset 0 0 0 1px var(--border); font-family:'Onest',sans-serif; font-size:14px; line-height:1.3; font-weight:600; cursor:pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
          <span>{{ row.docLabel }}</span>
        </button>
      </sc-if>
    </div>
  </sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:210},&quot;row&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const row = this.props.row || {};
    return { row: Object.assign({}, row, { hasActions: !!(row.canOpen || row.canOpenDoc) }) };
  }
}
</script>
</body>
</html>
