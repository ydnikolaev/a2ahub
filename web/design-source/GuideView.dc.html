<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section aria-label="{{ guideAria }}" data-screen-label="Guide">

        <!-- The first section answers the two questions a newcomer arrives
             with: what can travel through a2a, and how to tell us when the
             product itself should change. -->
        <div data-guide-primary style="display:grid; grid-template-columns:repeat(auto-fit,minmax(min(350px,100%),1fr)); gap:var(--space-grid); margin-bottom:var(--space-grid); align-items:stretch;">
          <section style="min-width:0; background:var(--surface); border-radius:var(--radius-panel); padding:var(--padding-panel-block) var(--padding-panel-inline); box-shadow:var(--shadow-card);">
            <h2 style="margin:0 0 8px; font-size:var(--font-section-title); line-height:var(--line-section-title); font-weight:600;">{{ artifactTypesTitle }}</h2>
            <p style="margin:0 0 16px; font-size:16px; line-height:1.6; color:var(--muted);">{{ artifactTypesText }}</p>
            <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px;">
              <sc-for list="{{ artifactTypes }}" as="t" hint-placeholder-count="8">
                <div style="min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:8px; background:var(--page); border-radius:var(--radius-nested); padding:var(--padding-nested-block) var(--padding-nested-inline);">
                  <dc-import name="TypeBadge" type="{{ t.key }}" size="small" hint-size="130px,24px"></dc-import>
                  <span style="font-size:14px; line-height:1.45; color:var(--muted);">{{ t.description }}</span>
                </div>
              </sc-for>
            </div>
          </section>
          <section data-guide-feedback style="position:relative; isolation:isolate; overflow:hidden; min-width:0; background:var(--surface); border-radius:var(--radius-panel); padding:var(--space-grid); box-shadow:var(--shadow-card);">
            <!-- Decorative Lucide Bot. It deliberately slips beyond the card
                 edge: the quiet cropped silhouette fills the collapsed state,
                 while the opaque prompt surface can grow over it unchanged. -->
            <svg data-guide-feedback-robot aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; z-index:0; right:-64px; bottom:-82px; width:min(380px,68%); height:auto; color:var(--teal-solid); opacity:.18; pointer-events:none;">
              <path d="M12 8V4H8"></path>
              <rect width="16" height="12" x="4" y="8" rx="2"></rect>
              <path d="M2 14h2"></path>
              <path d="M20 14h2"></path>
              <path d="M15 13v2"></path>
              <path d="M9 13v2"></path>
            </svg>
            <div style="position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column;">
              <dc-import name="EmptyState" title="{{ feedbackTitle }}" text="{{ feedbackText }}" size="panel" hint-size="100%,230px"></dc-import>
              <div style="margin-top:auto; padding:16px 4px 4px;">
                <dc-import name="AgentPrompt" det="{{ feedbackPrompt }}" hint-size="100%,44px"></dc-import>
                <div style="display:flex; align-items:center; gap:9px 14px; flex-wrap:wrap; margin-top:15px; padding-top:14px; border-top:1px solid var(--hairline); font-size:14px;">
                  <a href="https://ydnikolaev.github.io/a2ahub/" style="text-decoration:none;">a2ahub.dev</a>
                  <a href="https://github.com/ydnikolaev/a2ahub" style="text-decoration:none;">{{ githubRepoLabel }}</a>
                </div>
              </div>
            </div>
          </section>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:var(--space-grid); margin-bottom:var(--space-grid);">
          <sc-for list="{{ guideFeatures }}" as="f" hint-placeholder-count="10">
            <article style="background:var(--surface); border-radius:var(--radius-card); padding:var(--padding-card-block) var(--padding-card-inline); box-shadow:var(--shadow-card);">
              <span style="display:inline-flex; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--teal-ink); background:var(--teal-tint); border-radius:7px; padding:5px 9px; margin-bottom:14px;">{{ f.tag }}</span>
              <h2 style="margin:0 0 8px; font-size:var(--font-card-title-md); line-height:var(--line-card-title-md); font-weight:600;">{{ f.title }}</h2>
              <p style="margin:0; font-size:16px; line-height:1.6; color:var(--muted);">{{ f.body }}</p>
            </article>
          </sc-for>
        </div>

        <!-- Status reference and reading guide are peers: the left column
             names the vocabulary, the right explains where it appears. -->
        <div data-guide-reference style="display:grid; grid-template-columns:repeat(auto-fit,minmax(min(430px,100%),1fr)); gap:var(--space-grid); align-items:start;">
          <section style="min-width:0; background:var(--surface); border-radius:var(--radius-panel); padding:var(--padding-panel-block) var(--padding-panel-inline); box-shadow:var(--shadow-card);">
            <h2 style="margin:0 0 8px; font-size:var(--font-section-title); line-height:var(--line-section-title); font-weight:600;">{{ lifecycleTitle }}</h2>
            <p style="margin:0 0 16px; font-size:16px; line-height:1.6; color:var(--muted);">{{ lifecycleText }}</p>
            <div style="display:grid; gap:8px;">
              <sc-for list="{{ statusGuide }}" as="s" hint-placeholder-count="14">
                <div data-guide-status-card="true" style="display:flex; flex-direction:column; align-items:flex-start; gap:8px; background:var(--page); border-radius:var(--radius-nested); padding:var(--padding-nested-block) var(--padding-nested-inline);">
                  <dc-import name="StatusPill" text="{{ s.key }}" tone="{{ s.tone }}" size="small" hint-size="118px,24px"></dc-import>
                  <span style="display:block; width:100%; min-width:0; font-size:14px; line-height:1.5; color:var(--muted);">{{ s.description }}</span>
                </div>
              </sc-for>
            </div>
            <p style="margin:16px 0 0; padding-top:14px; border-top:1px solid var(--hairline); font-size:15px; line-height:1.6; color:var(--muted);">{{ lifecycleFoot }}</p>
          </section>
          <!-- This panel had drifted onto a hand-typed two-layer shadow (the
               light theme's ink, rgba(33,30,23,...), which dark theme's
               --shadow-panel re-points but a literal never does) while its two
               siblings above (artifact types, lifecycle reference) already sat
               on --shadow-card. Same rank in the grid, same role -- all three
               now agree. -->
          <section style="min-width:0; background:var(--surface); border-radius:var(--radius-panel); padding:var(--padding-panel-block) var(--padding-panel-inline); box-shadow:var(--shadow-card);">
              <h2 style="margin:0 0 12px; font-size:var(--font-section-title); line-height:var(--line-section-title); font-weight:600;">{{ readingGuideTitle }}</h2>
              <div style="display:grid; gap:8px;">
                <sc-for list="{{ guideReadingRows }}" as="r" hint-placeholder-count="4">
                  <div data-guide-reading-card="true" style="background:var(--page); border-radius:var(--radius-nested); padding:var(--padding-nested-block) var(--padding-nested-inline);">
                    <div style="margin:0 0 6px; font-size:var(--font-subheading); line-height:var(--line-subheading); font-weight:600;">{{ r.label }}</div>
                    <div style="width:100%; font-size:15px; line-height:1.6; color:var(--body);">{{ r.text }}</div>
                  </div>
                </sc-for>
              </div>
          </section>
        </div>
      </section>
</x-dc>

      handoff:{ code:"XH", label:"Handoff", description:"A transfer of responsibility or a ready result to the next system." },
      response:{ code:"XS", label:"Response", description:"A direct answer linked to the request or question it addresses; the requester still verifies or disputes it." },

const STATE_TONE = {
  published:"healthy", verified:"healthy", satisfied:"healthy", approved:"healthy", closed:"healthy",

function stateTone(value) {

}
