<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span data-status-key="{{ statusKey }}" data-vocabulary-cue="{{ cueAttribute }}" class="{{ toneClass }}" style="{{ wrapStyle }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onClick="{{ tap }}">
  <span style="{{ pillStyle }}"><sc-if value="{{ hasCue }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true">{{ cue }}</span></sc-if><span>{{ text }}</span></span>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <span role="tooltip" style="{{ bubbleStyle }}">{{ why }}</span>
  </sc-if>
</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:60},&quot;result&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;staticText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;staticTone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Blocking · p1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;blocking&quot;,&quot;blockingStrong&quot;,&quot;attention&quot;,&quot;healthy&quot;,&quot;neutral&quot;,&quot;agent&quot;,&quot;outline&quot;],&quot;default&quot;:&quot;blocking&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mono&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;small&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;why&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TONES = {
  blocking: { bg: "var(--blocking-tint)", fg: "var(--blocking-ink)" },
  blockingStrong: { bg: "var(--red)", fg: "var(--surface)" },
  attention: { bg: "var(--attention-tint)", fg: "var(--attention-ink)" },
  healthy: { bg: "var(--healthy-tint)", fg: "var(--healthy-ink)" },
  neutral: { bg: "var(--hairline)", fg: "var(--body)" },
  agent: { bg: "var(--teal-tint)", fg: "var(--focus)" },
  outline: { bg: "var(--surface)", fg: "var(--muted)", ring: "inset 0 0 0 1px var(--border-strong)" }
};
// A pill can carry `why`: the sentence behind the label, shown on hover over
// the pill itself. "тормозите вы" states a fact and immediately raises the
// question the label has no room for — who stopped, and what starts them
// again — and a reader should not have to hunt for a separate "?" to ask it.
//
// Hover AND tap, never hover alone: the design rules forbid hover-only
// information, and half the pills live inside a row button where a focusable
// element would be invalid markup. A tap on the pill opens the same bubble and
// does not select the row underneath it.
class Component extends DCLogic {
  state = { open: false, pos: "" };

  componentDidMount() {
    // A bubble positioned against the viewport has to go the moment the page
    // moves under it. Cheap to keep: every handler returns immediately unless
    // this particular pill is the open one.
    this.gone = () => { if (this.state.open) this.setState({ open: false }); };
    this.esc = (ev) => { if (ev.key === "Escape" && this.state.open) this.setState({ open: false }); };
    window.addEventListener("scroll", this.gone, true);
    window.addEventListener("resize", this.gone);
    window.addEventListener("keydown", this.esc);
  }

  componentWillUnmount() {
    window.removeEventListener("scroll", this.gone, true);
    window.removeEventListener("resize", this.gone);
    window.removeEventListener("keydown", this.esc);
  }

  // FIXED, not absolute: pills sit inside cards with their own overflow and
  // inside a horizontally scrolling map, where an absolutely positioned bubble
  // is clipped instead of shown. The flip keeps it on screen near an edge.
  show(el) {
    if (!el) return;
    const r = el.getBoundingClientRect();
    const width = Math.min(320, window.innerWidth * 0.76);
    const left = Math.max(12, Math.min(r.left, window.innerWidth - width - 12));
    const below = window.innerHeight - r.bottom > 170;
    this.setState({
      open: true,
      pos: below
        ? "left:" + Math.round(left) + "px; top:" + Math.round(r.bottom + 7) + "px;"
        : "left:" + Math.round(left) + "px; bottom:" + Math.round(window.innerHeight - r.top + 7) + "px;"
    });
  }

  renderVals() {
    const result = this.props.result && typeof this.props.result === "object" ? this.props.result : null;
    const resolver = globalThis.A2A_VOCABULARY_RESOLVER;
    const presentation = result && resolver && resolver.presentation ? resolver.presentation(result) : null;
    const toneClass = result ? String(result.toneClass || "") : "";
    const t = presentation
      ? { bg:presentation.pillBackground, fg:presentation.pillForeground, ring:presentation.pillRing }
      : (result ? TONES.neutral : (TONES[this.props.staticTone || this.props.tone] || TONES.neutral));
    const mono = this.props.mono ? "font-family:'IBM Plex Mono',ui-monospace,monospace; " : "font-family:'Onest',sans-serif; ";
    const lang = document.documentElement.lang === "ru" ? "ru" : "en";
    const glossary = globalThis.A2A_GLOSSARY;
    const staticText = this.props.staticText || this.props.text;
    const entry = !result && glossary && glossary.entry ? glossary.entry("statuses", staticText, lang) : null;
    const raw = String(result ? result.label || "" : (staticText == null ? "" : staticText));
    let translated = raw;
    if (entry && lang === "ru") {
      const enGlossary = globalThis.A2A_GLOSSARY && globalThis.A2A_GLOSSARY.entry
        ? globalThis.A2A_GLOSSARY.entry("statuses", entry.key, "en")
        : null;
      const candidates = [entry.key, enGlossary && enGlossary.label].filter(Boolean).sort((a, b) => b.length - a.length);
      const low = raw.toLowerCase();
      for (const candidate of candidates) {
        const c = String(candidate).toLowerCase();
        if (low === c) { translated = entry.label; break; }
        if (low.indexOf(c + " ") === 0 || low.indexOf(c + " ·") === 0) {
          translated = entry.label + raw.slice(c.length);
          break;
        }
      }
    }
    const why = result ? String(result.explanation || "") : (this.props.why || (entry ? entry.description : ""));
    const cue = result ? String(result.cue || "") : "";
    return {
      statusKey: raw,
      text: translated,
      toneClass,
      cue,
      cueAttribute: result ? String(result.cueAttribute || cue) : "",
      hasCue: !!cue,
      why,
      open: !!why && this.state.open,
      wrapStyle: "display:inline-flex; position:relative;" + (why ? " cursor:help;" : ""),
      pillStyle: "display:inline-flex; align-items:center; gap:5px; " + mono + "font-size:" + (this.props.size === "small" ? "var(--font-badge-small)" : "var(--font-badge-default)") + "; font-weight:600; line-height:var(--line-badge); border-radius:var(--radius-badge); padding:" + (t.ring ? "var(--padding-badge-outline-block) var(--padding-badge-outline-inline)" : "var(--padding-badge-solid-block) var(--padding-badge-solid-inline)") + "; background:" + t.bg + "; color:" + t.fg + "; box-shadow:" + (t.ring || "none") + "; white-space:nowrap;" +
        (why ? " text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; text-decoration-color:currentColor;" : ""),
      bubbleStyle: "position:fixed; z-index:950; " + this.state.pos + " width:min(320px, 76vw); background:var(--inverse); color:var(--on-inverse-2); border-radius:var(--radius-chip); padding:12px 14px; font-family:'Onest',sans-serif; font-size:14px; line-height:1.55; font-weight:400; text-align:left; box-shadow:0 14px 34px rgba(33,30,23,.34); white-space:normal; pointer-events:none;",
      enter: why ? (ev) => this.show(ev && ev.currentTarget) : (() => {}),
      leave: why ? () => this.setState({ open: false }) : (() => {}),
      // The pill sits inside the row button on most screens, so a tap must not
      // also pick the row: the reader asked about the badge, not the document.
      tap: why ? (ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        if (ev && ev.preventDefault) ev.preventDefault();
        this.show(ev && ev.currentTarget);
      } : (() => {})
    };
  }
}

</script>
</body>
</html>
