<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section aria-label="{{ docsAria }}" data-screen-label="Docs">

        <sc-if value="{{ noDocs }}" hint-placeholder-val="{{ false }}">
          <dc-import name="EmptyState" title="{{ emptyDocsTitle }}" text="{{ emptyDocsText }}" hint="a2a skill install" size="page" hint-size="100%,380px"></dc-import>
        </sc-if>

        <sc-if value="{{ hasDocs }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start;">
          <aside class="a2a-sticky-rail" style="position:sticky; top:88px; max-height:calc(100vh - 104px); overflow:auto; flex:1 1 240px; min-width:240px; display:flex; flex-direction:column; gap:12px;">
            <div style="background:var(--surface); border-radius:var(--radius-card); padding:var(--padding-list-card-block) var(--padding-list-card-inline); box-shadow:var(--shadow-card);">
              <label for="a2adocsearch" style="display:block; font-size:15px; font-weight:600; margin-bottom:8px;">{{ docSearchLabel }}</label>
              <input id="a2adocsearch" type="search" value="{{ docQuery }}" onInput="{{ onDocQuery }}" placeholder="{{ docSearchPlaceholder }}" style="width:100%; box-sizing:border-box; font-family:'Onest',sans-serif; font-size:16px; color:var(--text); background:var(--canvas); border:0; border-radius:9px; padding:11px 13px;">
              <div style="margin-top:8px; font-size:15px; color:var(--muted);">{{ docSearchNote }}</div>
            </div>
            <nav aria-label="{{ docsAria }}" style="background:var(--surface); border-radius:var(--radius-card); padding:8px 10px 12px; box-shadow:var(--shadow-card);">
              <sc-for list="{{ docGroups }}" as="g" hint-placeholder-count="5">
                <div style="padding:10px 6px 4px;">
                  <div style="font-size:15px; font-weight:600; color:var(--muted); padding:0 6px 6px;">{{ g.name }}</div>
                  <div style="display:flex; flex-direction:column; gap:2px;">
                    <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
                      <button type="button" onClick="{{ it.go }}" style="{{ it.style }}">{{ it.label }}</button>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
              <sc-if value="{{ docNoMatches }}" hint-placeholder-val="{{ false }}">
                <div style="padding:12px 12px 8px; font-size:15px; line-height:1.55; color:var(--muted);">{{ docNoMatchText }}</div>
              </sc-if>
            </nav>
          </aside>

          <article style="flex:4 1 420px; min-width:0;">
            <div style="background:var(--surface); border-radius:var(--radius-panel); padding:var(--padding-panel-block) var(--padding-panel-inline); box-shadow:0 1px 3px rgba(33,30,23,.08), 0 18px 40px -28px rgba(33,30,23,.5);">
              <div style="display:flex; align-items:flex-start; gap:10px; flex-wrap:nowrap; margin-bottom:14px;">
                <span style="flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:6px;">
                  <dc-import name="StatusPill" text="{{ docGroupLabel }}" tone="agent" size="small" hint-size="90px,24px"></dc-import>
                  <dc-import name="StatusPill" text="{{ docSourceLabel }}" tone="outline" size="small" hint-size="150px,24px"></dc-import>
                </span>
                <span style="flex:0 0 auto; font-size:15px; color:var(--muted); text-align:right;">{{ docEmbeddedNote }}</span>
              </div>
              <h2 style="margin:0 0 18px; font-size:32px; line-height:1.15; font-weight:600; letter-spacing:-0.02em; overflow-wrap:anywhere;">{{ docTitle }}</h2>
              <div data-doc-toc style="margin-bottom:20px;"></div>
              <div data-doc-body data-doc-id="{{ docId }}" class="ssot-doc-body"><div style="font-size:16px; color:var(--muted);">{{ loadingDocLabel }}</div></div>
            </div>
          </article>
        </div>
        </sc-if>
      </section>
</x-dc>

  "getting-started":"Начало работы", overview:"Обзор", "work-loops":"Рабочие циклы", threads:"Треды: одна задача, один тред",
  "contract-versions":"Версии контрактов и sunset", commands:"Команды CLI и MCP", notifications:"Нативные уведомления",

const GUIDE_GROUP_RU = { Start:"Начало", Concepts:"Концепции", Reference:"Справочник", Authoring:"Типы документов", Help:"Помощь" };

class Component extends DCLogic {
  syncContext() {
    const ctx = this.props && this.props.ctx || {};
    this.state = Object.assign({ data: ctx.data || null, locale: ctx.locale === "ru" ? "ru" : "en" }, ctx.ui || {});
    return ctx;
  }

  setState(update) {
    const ctx = this.props && this.props.ctx || {};
    const current = Object.assign({}, this.state || {}, { data: ctx.data || null, locale: ctx.locale === "ru" ? "ru" : "en" }, ctx.ui || {});
    const patch = typeof update === "function" ? update(current) : update;
    this.state = Object.assign({}, current, patch || {});
    if (ctx.actions && ctx.actions.patch) ctx.actions.patch(patch || {});
  }

  go(view, extra) { const actions = (this.props && this.props.ctx && this.props.ctx.actions) || {}; if (actions.navigate) actions.navigate(view, extra); }
  closeContractFile() { const actions = (this.props && this.props.ctx && this.props.ctx.actions) || {}; if (actions.closeContractFile) actions.closeContractFile(); }
  applyTheme(theme) { const actions = (this.props && this.props.ctx && this.props.ctx.actions) || {}; if (actions.setTheme) actions.setTheme(theme); }
  applyLocale(locale) { const actions = (this.props && this.props.ctx && this.props.ctx.actions) || {}; if (actions.setLocale) actions.setLocale(locale); }
  copy(text) { const actions = (this.props && this.props.ctx && this.props.ctx.actions) || {}; if (actions.copy) actions.copy(text); }

  docCorpus() {
    if (Array.isArray(window.A2A_DOCS) && window.A2A_DOCS.length && !Array.isArray(window.A2A_DOCS[0])) {
      return window.A2A_DOCS.map(d => ({ id:d.id, group:d.group, title:d.title, src:d.source || "", html:d.html || "" }));
    }
    if (window.A2A_DOC_BODIES) {
      return Object.keys(window.A2A_DOC_BODIES).map(id => {
        const d = window.A2A_DOC_BODIES[id];
        return { id, group:d.group, title:d.title, src:d.source || "", html:d.html || "" };
      });
    }
    return [];
  }

  docsVals(ru, c) {
    const corpus = this.docCorpus().length ? this.docCorpus() : GUIDE_DOCS.map(([id, group, title, src]) => ({ id, group, title, src, html: "" }));
    const q = String(this.state.docQ || "").trim().toLowerCase();
    const label = (d) => ru ? (GUIDE_RU[d.id] || d.title) : d.title;
    const groupLabel = (g) => ru ? (GUIDE_GROUP_RU[g] || g) : g;
    const matches = (d) => !q || (label(d) + " " + d.title + " " + d.group + " " + d.src).toLowerCase().includes(q);
    const shown = corpus.filter(matches);
    const cur = corpus.find(d => d.id === this.state.doc) || corpus[0] || null;
    const groups = [];
    shown.forEach(d => {
      let g = groups.find(x => x.raw === d.group);
      if (!g) { g = { raw: d.group, name: groupLabel(d.group), items: [] }; groups.push(g); }
      g.items.push({
        label: label(d),
        style: "font-family:'Onest',sans-serif; font-size:15px; line-height:1.4; font-weight:600; text-align:left; border:0; cursor:pointer; padding:9px 10px; border-radius:8px; " +
          (cur && cur.id === d.id ? "background:var(--teal-tint); color:var(--teal-ink);" : "background:transparent; color:var(--body);"),
        go: () => this.setState({ doc: d.id })
      });
    });
    return {
      docsTitle: c.docs, docsSub: c.docsSub,
      hasDocs: corpus.length > 0, noDocs: corpus.length === 0,
      emptyDocsTitle: c.emptyDocsTitle, emptyDocsText: c.emptyDocsText,
      docSearchLabel: c.docSearch, docSearchPlaceholder: c.docSearchPlaceholder,
      docQuery: this.state.docQ,
      onDocQuery: (e) => this.setState({ docQ: e.target.value }),
      docSearchNote: q
        ? (ru ? "нашлось разделов: " + shown.length + " из " + corpus.length : shown.length + " of " + corpus.length + " sections match")
        : (ru ? "разделов в корпусе: " + corpus.length : corpus.length + " sections in this corpus"),
      docGroups: groups,
      docNoMatches: shown.length === 0,
      docNoMatchText: c.docNoMatch,
      docId: cur ? cur.id : "",
      docTitle: cur ? label(cur) : "",
      docGroupLabel: cur ? groupLabel(cur.group) : "",
      docSourceLabel: cur ? cur.src : "",
      docEmbeddedNote: c.docEmbedded,
      loadingDocLabel: c.loadingDoc
    };
  }

  renderVals() {
    const ctx = this.syncContext();
    let d = ctx.data;
