<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="position:relative; display:inline-flex; vertical-align:middle;">
  <button type="button" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onFocus="{{ enter }}" onBlur="{{ leave }}" onClick="{{ toggle }}" aria-expanded="{{ expanded }}" aria-label="{{ ariaLabel }}" style="{{ dotStyle }}">?</button>
  <dc-import name="InfoTooltip" text="{{ text }}" open="{{ open }}" anchor="{{ anchorNode }}" on-dismiss="{{ closeHint }}" hint-size="0,0"></dc-import>
</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:200},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;What this label means, in one sentence.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// HintDot explains ONE label in one sentence, in place. The dashboard is full
// of protocol vocabulary a reader has no reason to know on first contact
// (writer floor, drift, pinned major, escape hatch) and the alternative to a
// hint is either a wall of prose nobody reads or a term nobody understands.
//
// Hover is the one visual interaction everywhere on the dashboard. Focus and
// tap expose the same sentence on keyboards and touch screens, so hover is the
// common path without becoming the only path. Escape and an outside click
// close it.
class Component extends DCLogic {
  // The bubble itself — its placement, its show/hide, its dismiss listeners —
  // moved into InfoTooltip (shared with StatusPill/TypeBadge/FreshnessDot/
  // EventSignal). This component keeps only what stays local: whether it is
  // open (drives the dot's own hover-state fill and aria-expanded) and which
  // button the bubble should anchor to.
  state = { open: false };

  renderVals() {
    const ru = document.documentElement.lang === "ru";
    return {
      text: this.props.text || "",
      open: this.state.open,
      expanded: this.state.open ? "true" : "false",
      ariaLabel: ru ? "Что это значит" : "What this means",
      dotStyle: "display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; flex:0 0 17px; border:0; border-radius:99px; cursor:pointer; font-family:'Onest',sans-serif; font-size:11px; font-weight:600; line-height:1; padding:0; " +
        (this.state.open
          ? "background:var(--inverse); color:var(--on-inverse);"
          : "background:var(--sink); color:var(--muted);"),
      anchorNode: this.anchorNode || null,
      enter: (ev) => { this.anchorNode = ev && ev.currentTarget; this.setState({ open: true }); },
      leave: () => this.setState({ open: false }),
      closeHint: () => this.setState({ open: false }),
      toggle: (ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        const btn = ev && ev.currentTarget;
        if (btn) { this.anchorNode = btn; this.setState({ open: true }); }
      }
    };
  }
}

</script>
</body>
</html>
