<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="position:relative; display:inline-flex; vertical-align:middle;">
  <button type="button" onClick="{{ toggle }}" aria-expanded="{{ expanded }}" aria-label="{{ ariaLabel }}" style="{{ dotStyle }}">?</button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <span role="tooltip" style="position:absolute; top:calc(100% + 8px); left:0; z-index:150; width:min(300px, 74vw); background:var(--inverse); color:var(--on-inverse-2); border-radius:12px; padding:12px 14px; font-family:'Onest',sans-serif; font-size:14px; line-height:1.55; font-weight:400; text-align:left; box-shadow:0 14px 34px rgba(33,30,23,.34); white-space:normal;">{{ text }}</span>
  </sc-if>
</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:200},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;What this label means, in one sentence.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// HintDot explains ONE label in one sentence, in place. The dashboard is full
// of protocol vocabulary a reader has no reason to know on first contact
// (writer floor, drift, pinned major, escape hatch) and the alternative to a
// hint is either a wall of prose nobody reads or a term nobody understands.
//
// Click, not hover: the design rules forbid hover-only information, and a
// tap-sized target works the same on a phone. Escape and an outside click
// close it.
class Component extends DCLogic {
  state = { open: false };

  componentDidMount() {
    this.away = (ev) => {
      if (!this.state.open) return;
      if (this.host && this.host.contains && this.host.contains(ev.target)) return;
      this.setState({ open: false });
    };
    this.esc = (ev) => { if (ev.key === "Escape" && this.state.open) this.setState({ open: false }); };
    document.addEventListener("click", this.away, true);
    window.addEventListener("keydown", this.esc);
  }

  componentWillUnmount() {
    document.removeEventListener("click", this.away, true);
    window.removeEventListener("keydown", this.esc);
  }

  renderVals() {
    const ru = document.documentElement.lang === "ru";
    return {
      text: this.props.text || "",
      open: this.state.open,
      expanded: this.state.open ? "true" : "false",
      ariaLabel: ru ? "Что это значит" : "What this means",
      dotStyle: "display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; flex:0 0 17px; border:0; border-radius:99px; cursor:pointer; font-family:'Onest',sans-serif; font-size:11px; font-weight:600; line-height:1; padding:0; " +
        (this.state.open
          ? "background:var(--inverse); color:var(--on-inverse);"
          : "background:var(--sink); color:var(--muted);"),
      toggle: (ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        if (ev && ev.currentTarget) this.host = ev.currentTarget.parentElement;
        this.setState(s => ({ open: !s.open }));
      }
    };
  }
}

</script>
</body>
</html>
