<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span data-freshness-dot data-vocabulary-cue="{{ cueAttribute }}" class="{{ toneClass }}" style="position:relative; display:inline-flex; align-items:center; gap:7px; flex:0 0 auto;">
  <button type="button" onMouseEnter="{{ openHint }}" onMouseLeave="{{ closeHint }}" onFocus="{{ openHint }}" onBlur="{{ closeHint }}" aria-label="{{ hint }}" aria-expanded="{{ expanded }}" style="{{ dotStyle }}"><sc-if value="{{ hasCue }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-size:8px; line-height:1; color:currentColor;">{{ cue }}</span></sc-if></button>
  <sc-if value="{{ verbose }}" hint-placeholder-val="{{ false }}"><span style="font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:13px; line-height:1.5; color:var(--attention-ink);">{{ verboseText }}</span></sc-if>
  <dc-import name="InfoTooltip" text="{{ hint }}" open="{{ open }}" anchor="{{ anchorNode }}" on-dismiss="{{ closeHint }}" hint-size="0,0"></dc-import>
</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:150},&quot;result&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;stale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;age&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;только что&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
// One freshness grammar everywhere an exchange is shown. Current snapshots
// stay quiet until asked; stale snapshots name the warning in text. Hover and
// keyboard focus expose the same explanation without turning the signal into
// a click action.
class Component extends DCLogic {
  // The bubble itself — its placement, its show/hide, its dismiss listeners —
  // moved into InfoTooltip (shared with StatusPill/TypeBadge/HintDot/
  // EventSignal). This component keeps only the dot's own state: whether it
  // is open (drives aria-expanded) and which button the bubble should anchor
  // to.
  state = { open: false };

  renderVals() {
    const ru = document.documentElement.lang === "ru";
    const result = this.props.result && typeof this.props.result === "object" ? this.props.result : null;
    const stale = !result && !!this.props.stale;
    const age = this.props.age || (ru ? "неизвестно" : "unknown");
    const defaultHint = stale
      ? (ru ? "Локальная копия спейса может отставать от репозитория. Последняя синхронизация: " + age + "." : "The local space copy may lag behind the repository. Last synced: " + age + ".")
      : (ru ? "Локальная копия спейса актуальна. Последняя синхронизация: " + age + "." : "The local space copy is current. Last synced: " + age + ".");
    const hint = result ? String(result.explanation || result.label || "") + (this.props.age ? " · " + age : "") : (this.props.hint || defaultHint);
    const resolver = globalThis.A2A_VOCABULARY_RESOLVER;
    const presentation = result && resolver && resolver.presentation ? resolver.presentation(result) : null;
    const toneClass = result ? String(result.toneClass || "") : "";
    const palette = presentation
      ? [presentation.dotForeground, presentation.dotBackground]
      : (stale ? ["var(--ochre)","var(--attention-tint)"] : ["var(--healthy-ink)","var(--healthy-tint)"]);
    const cue = result ? String(result.cue || "") : "";
    return {
      hint,
      verbose: (!!result || stale) && !this.props.compact,
      verboseText: result ? String(result.label || "") + (this.props.age ? " · " + age : "") : (ru ? "устаревшая копия · " : "stale copy · ") + age,
      toneClass,
      cue,
      cueAttribute: result ? String(result.cueAttribute || cue) : "",
      hasCue: !!cue,
      open: this.state.open,
      expanded: this.state.open ? "true" : "false",
      dotStyle: "width:13px; height:13px; flex:0 0 13px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:99px; padding:0; cursor:help; background:" + palette[0] + "; color:var(--surface); box-shadow:0 0 0 3px " + palette[1] + ";",
      anchorNode: this.anchorNode || null,
      openHint: (ev) => {
        this.anchorNode = ev && ev.currentTarget;
        this.setState({ open: true });
      },
      closeHint: () => this.setState({ open: false })
    };
  }
}

</script>
</body>
</html>
