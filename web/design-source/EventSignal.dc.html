<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span data-event-signal style="position:relative; display:inline-flex; flex:0 0 auto;">
  <button type="button" onMouseEnter="{{ openHint }}" onMouseLeave="{{ closeHint }}" onFocus="{{ openHint }}" onBlur="{{ closeHint }}" aria-label="{{ label }}" aria-expanded="{{ expanded }}" style="{{ buttonStyle }}">
    <sc-if value="{{ positive }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg></sc-if>
    <sc-if value="{{ negative }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10"></path><path d="M17 7 7 17"></path></svg></sc-if>
    <sc-if value="{{ caution }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M7 12h10"></path></svg></sc-if>
    <sc-if value="{{ neutral }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="3.25"></circle></svg></sc-if>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="{{ bubbleStyle }}">{{ label }}</span></sc-if>
</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:100},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;positive&quot;,&quot;negative&quot;,&quot;caution&quot;,&quot;neutral&quot;],&quot;default&quot;:&quot;positive&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Successful transition&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// A compact second reading channel for lifecycle events. Shape and a short
// hover/focus label carry the meaning as well as colour, so red/green never
// become the only way to distinguish an accepted move from a rejected one.
const TONES = {
  positive: { fg: "var(--healthy-ink)", bg: "var(--healthy-tint)", ring: "var(--healthy-ink)" },
  negative: { fg: "var(--red)", bg: "var(--blocking-tint)", ring: "var(--blocking-line)" },
  caution: { fg: "var(--attention-strong)", bg: "var(--attention-tint)", ring: "var(--attention-line)" },
  neutral: { fg: "var(--muted)", bg: "var(--sink)", ring: "var(--border)" }
};
class Component extends DCLogic {
  state = { open: false, pos: "" };

  show(btn) {
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    const width = Math.min(260, window.innerWidth * 0.72);
    const left = Math.max(12, Math.min(r.right - width, window.innerWidth - width - 12));
    const below = window.innerHeight - r.bottom > 120;
    this.setState({
      open: true,
      pos: below
        ? "left:" + Math.round(left) + "px; top:" + Math.round(r.bottom + 7) + "px;"
        : "left:" + Math.round(left) + "px; bottom:" + Math.round(window.innerHeight - r.top + 7) + "px;"
    });
  }

  renderVals() {
    const tone = TONES[this.props.tone] ? this.props.tone : "neutral";
    const t = TONES[tone];
    const label = this.props.label || "";
    return {
      label,
      positive: tone === "positive",
      negative: tone === "negative",
      caution: tone === "caution",
      neutral: tone === "neutral",
      open: !!label && this.state.open,
      expanded: this.state.open ? "true" : "false",
      buttonStyle: "width:20px; height:20px; padding:0; border:0; border-radius:99px; display:inline-flex; align-items:center; justify-content:center; color:" + t.fg + "; background:" + t.bg + "; box-shadow:inset 0 0 0 1px " + t.ring + "; cursor:help;",
      bubbleStyle: "position:fixed; z-index:950; " + this.state.pos + " width:min(260px,72vw); background:var(--inverse); color:var(--on-inverse-2); border-radius:11px; padding:9px 11px; font-family:'Onest',sans-serif; font-size:13px; line-height:1.45; font-weight:400; text-align:left; box-shadow:0 14px 34px rgba(33,30,23,.34); white-space:normal; pointer-events:none;",
      openHint: label ? (ev) => this.show(ev && ev.currentTarget) : (() => {}),
      closeHint: () => this.setState({ open: false })
    };
  }
}

</script>
</body>
</html>
