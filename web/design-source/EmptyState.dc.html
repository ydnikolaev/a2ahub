<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ boxStyle }}">
  <div aria-hidden="true" style="display:flex; align-items:center; justify-content:center; color:var(--logo-dim);">
    <span class="a2a-empty-bot" style="display:flex;">
      <svg width="{{ botSize }}" height="{{ botSize }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
    </span>
    <span style="{{ wireStyle }}">
      <span style="{{ wireLineStyle }}"></span>
      <span class="a2a-empty-spark" style="{{ sparkStyle }}"></span>
    </span>
    <span class="a2a-empty-bot a2a-empty-bot--b" style="display:flex; transform:scaleX(-1);">
      <svg width="{{ botSize }}" height="{{ botSize }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>
    </span>
  </div>
  <div style="{{ titleStyle }}">{{ title }}</div>
  <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}">
    <p style="{{ textStyle }}">{{ text }}</p>
  </sc-if>
  <sc-if value="{{ hasHint }}" hint-placeholder-val="{{ false }}">
    <span style="{{ hintStyle }}">{{ hint }}</span>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:320},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;No contracts yet&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nothing has been registered in this scope.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;page&quot;,&quot;panel&quot;],&quot;default&quot;:&quot;panel&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// EmptyState is the ONE "there is nothing here" surface. Every list, detail
// pane and panel that can legitimately be empty renders it instead of inventing
// a zero, a blank card or a stray unrelated record — the same honesty rule the
// dashboard applies to unavailable facts, expressed visually.
//
// The two bots and the link between them are the product's own picture: work
// moves between agents, and an empty screen means nothing is in flight, not
// that something failed. Motion is decorative; ui/tokens.css stills it under
// prefers-reduced-motion.
// TWO sizes, and the choice is decided by the container, never by taste:
//
//   page  — the empty state IS the screen. Nothing in scope at all, so it takes
//           the full width alone and the artwork carries the page.
//   panel — it sits inside one column of a two-column layout, beside a list
//           that does have content.
//
// There were four before, picked ad hoc per call site, and the same "nothing
// here" arrived at three different scales on three different screens. If a new
// context seems to need a third size, the container is wrong, not this list.
const SIZES = {
  page: { pad: "76px 32px", bot: 52, wire: 116, title: 23, text: 17, gap: 22 },
  panel: { pad: "34px 24px", bot: 26, wire: 54, title: 17, text: 15, gap: 13 }
};
class Component extends DCLogic {
  renderVals() {
    const s = SIZES[this.props.size] || SIZES.panel;
    return {
      title: this.props.title || "",
      text: this.props.text || "",
      hint: this.props.hint || "",
      hasText: !!this.props.text,
      hasHint: !!this.props.hint,
      botSize: s.bot,
      boxStyle: "display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:" + s.gap + "px; padding:" + s.pad + "; background:var(--page); border-radius:16px; box-shadow:inset 0 0 0 1px var(--border);",
      wireStyle: "position:relative; flex:0 0 auto; width:" + s.wire + "px; height:" + s.bot + "px; display:flex; align-items:center; margin:0 6px;",
      wireLineStyle: "width:100%; height:0; border-top:2px dashed var(--border-strong);",
      sparkStyle: "position:absolute; left:0; top:50%; width:7px; height:7px; margin-top:-3.5px; border-radius:99px; background:var(--teal-solid); --a2a-empty-travel:" + (s.wire - 7) + "px;",
      titleStyle: "font-size:" + s.title + "px; line-height:1.35; font-weight:600; color:var(--text); max-width:46ch; text-wrap:balance;",
      textStyle: "margin:0; font-size:" + s.text + "px; line-height:1.6; color:var(--muted); max-width:52ch;",
      hintStyle: "font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:13px; color:var(--faint); background:var(--canvas); border-radius:7px; padding:6px 10px; overflow-wrap:anywhere; max-width:100%;"
    };
  }
}

</script>
</body>
</html>
