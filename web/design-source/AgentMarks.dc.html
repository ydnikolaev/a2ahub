<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex; flex-wrap:wrap; align-items:center; gap:14px 24px; color:var(--muted);">
  <span style="font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); white-space:nowrap;">{{ label }}</span>
  <div style="display:flex; flex-wrap:wrap; align-items:center; gap:20px; color:var(--muted);">
      <dc-import name="AgentIcon" id="claude-code" size="21" hint-size="21px,21px"></dc-import>
      <dc-import name="AgentIcon" id="codex" size="21" hint-size="21px,21px"></dc-import>
      <dc-import name="AgentIcon" id="cursor" size="20" hint-size="20px,20px"></dc-import>
      <dc-import name="AgentIcon" id="github-copilot" size="22" hint-size="22px,22px"></dc-import>
      <dc-import name="AgentIcon" id="gemini-cli" size="21" hint-size="21px,21px"></dc-import>
      <dc-import name="AgentIcon" id="windsurf" size="21" hint-size="21px,21px"></dc-import>
    </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:70},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Works with any agent&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { label:this.props.label || "Works with any agent" }; }
}
</script>
</body>
</html>
