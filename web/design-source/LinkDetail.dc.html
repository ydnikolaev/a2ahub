<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:var(--surface); border-radius:14px; padding:15px 17px 16px; box-shadow:0 14px 34px rgba(33,30,23,.22), inset 0 0 0 1px var(--border); font-family:'Onest',sans-serif;">
  <div style="position:sticky; top:-1px; z-index:2; background:var(--surface); display:flex; align-items:flex-start; gap:10px; flex-wrap:nowrap; padding:4px 0 8px; margin-bottom:2px;">
    <span style="flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:9px; flex-wrap:wrap; row-gap:5px;">
      <span style="font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; color:var(--text); overflow-wrap:anywhere;">{{ det.title }}</span>
      <span style="font-size:12px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.07em;">{{ det.kindLabel }}</span>
    </span>
    <button type="button" onClick="{{ det.close }}" aria-label="{{ closeLabel }}" style="flex:0 0 auto; font-family:'Onest',sans-serif; font-size:15px; line-height:1; color:var(--muted); background:transparent; border:0; cursor:pointer; padding:3px 4px;">✕</button>
  </div>
  <div style="font-size:15px; line-height:1.6; color:var(--body); max-width:84ch;">{{ det.lead }}</div>
  <sc-if value="{{ det.hasNote }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:9px; font-size:14px; line-height:1.55; color:var(--muted); background:var(--page); border-radius:10px; padding:9px 11px;">{{ det.note }}</div>
  </sc-if>
  <sc-if value="{{ det.hasRows }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:12px;">
      <div style="font-size:13px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.07em; margin-bottom:7px;">{{ det.rowsLabel }}</div>
      <div style="display:flex; flex-direction:column; gap:7px;">
        <sc-for list="{{ det.rows }}" as="r" hint-placeholder-count="2">
          <button type="button" onClick="{{ r.open }}" style="{{ r.style }}">
            <span style="display:flex; align-items:flex-start; gap:8px; flex-wrap:nowrap; margin-bottom:3px;">
              <span style="flex:1 1 auto; min-width:0; font-size:14px; font-weight:600; color:var(--text); overflow-wrap:anywhere;">{{ r.head }}</span>
              <span style="flex:0 0 auto;"><dc-import name="StatusPill" text="{{ r.pillText }}" tone="{{ r.pillTone }}" size="small" hint-size="70px,22px"></dc-import></span>
            </span>
            <span style="display:block; font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.5; color:var(--muted); overflow-wrap:anywhere;">{{ r.detail }}</span>
            <sc-if value="{{ r.canOpen }}" hint-placeholder-val="{{ false }}">
              <span style="display:block; margin-top:5px; font-size:14px; font-weight:600; color:var(--teal-ink);">{{ r.openLabel }}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ det.hasRows2 }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:12px;">
      <div style="font-size:13px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.07em; margin-bottom:7px;">{{ det.rows2Label }}</div>
      <div style="display:flex; flex-direction:column; gap:7px;">
        <sc-for list="{{ det.rows2 }}" as="r" hint-placeholder-count="2">
          <button type="button" onClick="{{ r.open }}" style="{{ r.style }}">
            <span style="display:flex; align-items:flex-start; gap:8px; flex-wrap:nowrap; margin-bottom:3px;">
              <span style="flex:1 1 auto; min-width:0; font-size:14px; font-weight:600; color:var(--text); overflow-wrap:anywhere;">{{ r.head }}</span>
              <span style="flex:0 0 auto;"><dc-import name="StatusPill" text="{{ r.pillText }}" tone="{{ r.pillTone }}" size="small" hint-size="70px,22px"></dc-import></span>
            </span>
            <span style="display:block; font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.5; color:var(--muted); overflow-wrap:anywhere;">{{ r.detail }}</span>
            <sc-if value="{{ r.canOpen }}" hint-placeholder-val="{{ false }}">
              <span style="display:block; margin-top:5px; font-size:14px; font-weight:600; color:var(--teal-ink);">{{ r.openLabel }}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:420},&quot;det&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() { return { det:this.props.det || {}, closeLabel:document.documentElement.lang === "ru" ? "Закрыть подробности" : "Close detail" }; }
}
</script>
</body>
</html>
