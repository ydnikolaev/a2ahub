<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-link-detail="true" style="background:var(--surface-card); border-radius:var(--radius-panel); padding:var(--padding-panel-block) var(--padding-panel-inline); box-shadow:0 20px 54px -20px rgba(33,30,23,.48), inset 0 0 0 1px var(--border); font-family:'Onest',sans-serif;">
  <div style="position:sticky; top:0; z-index:12; background:var(--surface-card); display:flex; align-items:flex-start; gap:var(--space-stack); flex-wrap:nowrap; margin:calc(-1 * var(--padding-panel-block)) calc(-1 * var(--padding-panel-inline)) 18px; padding:var(--padding-panel-block) var(--padding-panel-inline) 16px; border-radius:var(--radius-panel) var(--radius-panel) 0 0; border-bottom:1px solid var(--hairline); box-shadow:0 8px 12px -14px rgba(33,30,23,.5);">
    <div style="flex:1 1 auto; min-width:0;">
      <div class="a2a-detail-title" style="font-family:'IBM Plex Mono',ui-monospace,monospace; color:var(--text);">{{ det.title }}</div>
      <div style="display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:10px;">
        <sc-for list="{{ det.tags }}" as="tag" hint-placeholder-count="3">
          <dc-import name="StatusPill" text="{{ tag.text }}" tone="{{ tag.tone }}" size="small" hint-size="110px,24px"></dc-import>
        </sc-for>
      </div>
    </div>
    <button type="button" onClick="{{ det.close }}" aria-label="{{ closeLabel }}" title="{{ closeLabel }}" style="width:38px; height:38px; flex:0 0 38px; display:flex; align-items:center; justify-content:center; padding:0; border:0; border-radius:var(--radius-control); color:var(--muted); background:var(--surface-section); box-shadow:inset 0 0 0 1px var(--border); cursor:pointer; line-height:0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    </button>
  </div>
  <div style="font-size:var(--font-section-subtitle); line-height:var(--line-section-subtitle); color:var(--body); max-width:84ch; background:var(--surface-section); border-radius:var(--radius-nested); padding:var(--padding-nested-block) var(--padding-nested-inline); box-shadow:inset 0 0 0 1px var(--hairline);">{{ det.lead }}</div>
  <!-- The facts the sentence above used to carry as prose. A reader scanning
       for "which version is pinned" should not have to parse a paragraph. -->
  <sc-if value="{{ det.hasFacts }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:var(--space-section);">
      <dc-import name="SectionHeading" title="{{ det.factsLabel }}" hint="" hint-size="100%,32px"></dc-import>
      <div style="background:var(--surface-section); border-radius:var(--radius-nested); padding:3px var(--padding-nested-inline); box-shadow:inset 0 0 0 1px var(--hairline);">
        <dc-import name="FactTable" rows="{{ det.facts }}" hint-size="100%,180px"></dc-import>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ det.hasNote }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:var(--space-stack); font-size:14px; line-height:1.55; color:var(--muted); background:var(--surface-section); border-radius:var(--radius-nested); padding:var(--padding-nested-block) var(--padding-nested-inline); box-shadow:inset 0 0 0 1px var(--hairline);">{{ det.note }}</div>
  </sc-if>
  <sc-if value="{{ det.hasRows }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:var(--space-section);">
      <dc-import name="SectionHeading" title="{{ det.rowsLabel }}" hint="" hint-size="100%,32px"></dc-import>
      <div style="display:flex; flex-direction:column; gap:var(--space-inline);">
        <sc-for list="{{ det.rows }}" as="r" hint-placeholder-count="2">
          <dc-import name="LinkDetailRow" row="{{ r }}" hint-size="100%,180px"></dc-import>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ det.hasRows2 }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:var(--space-section);">
      <dc-import name="SectionHeading" title="{{ det.rows2Label }}" hint="" hint-size="100%,32px"></dc-import>
      <div style="display:flex; flex-direction:column; gap:var(--space-inline);">
        <sc-for list="{{ det.rows2 }}" as="r" hint-placeholder-count="2">
          <dc-import name="LinkDetailRow" row="{{ r }}" hint-size="100%,180px"></dc-import>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:420},&quot;det&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() { return { det:this.props.det || {}, closeLabel:document.documentElement.lang === "ru" ? "Закрыть подробности" : "Close detail" }; }
}
</script>
</body>
</html>
