<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1,&quot;height&quot;:1}}">
const A2A_VOCABULARY_POLICY = Object.freeze({ ALL: "emphatic" });

const A2A_VOCABULARY_TONE_CLASSES = Object.freeze({
  "needs-you": "tone-needs-you",
  "waiting-them": "tone-waiting-them",
  "progressing": "tone-progressing",
  "settled": "tone-settled",
  "broken": "tone-broken",
  "unknown": "tone-unknown"
});

const A2A_VOCABULARY_PRESENTATIONS = Object.freeze({
  "tone-needs-you": Object.freeze({ pillBackground:"var(--blocking-tint)", pillForeground:"var(--blocking-ink)", pillRing:"", dotForeground:"var(--red)", dotBackground:"var(--blocking-tint)", markerColor:"var(--red)", signalTone:"caution" }),
  "tone-waiting-them": Object.freeze({ pillBackground:"var(--attention-tint)", pillForeground:"var(--attention-ink)", pillRing:"", dotForeground:"var(--ochre)", dotBackground:"var(--attention-tint)", markerColor:"var(--ochre)", signalTone:"caution" }),
  "tone-progressing": Object.freeze({ pillBackground:"var(--teal-tint)", pillForeground:"var(--focus)", pillRing:"", dotForeground:"var(--teal-ink)", dotBackground:"var(--teal-tint)", markerColor:"var(--teal-ink)", signalTone:"neutral" }),
  "tone-settled": Object.freeze({ pillBackground:"var(--healthy-tint)", pillForeground:"var(--healthy-ink)", pillRing:"", dotForeground:"var(--healthy-ink)", dotBackground:"var(--healthy-tint)", markerColor:"var(--green)", signalTone:"positive" }),
  "tone-broken": Object.freeze({ pillBackground:"var(--red)", pillForeground:"var(--surface)", pillRing:"", dotForeground:"var(--red)", dotBackground:"var(--blocking-tint)", markerColor:"var(--red)", signalTone:"negative" }),
  "tone-unknown": Object.freeze({ pillBackground:"var(--hairline)", pillForeground:"var(--body)", pillRing:"", dotForeground:"var(--border-strong)", dotBackground:"var(--hairline)", markerColor:"var(--border-strong)", signalTone:"neutral" }),
  "tone-neutral": Object.freeze({ pillBackground:"var(--hairline)", pillForeground:"var(--body)", pillRing:"", dotForeground:"var(--border-strong)", dotBackground:"var(--hairline)", markerColor:"var(--border-strong)", signalTone:"neutral" })
});

function vocabularyPresentation(result) {
  const toneClass = result && String(result.toneClass || "");
  return A2A_VOCABULARY_PRESENTATIONS[toneClass] || A2A_VOCABULARY_PRESENTATIONS[A2A_VOCABULARY_TONE_CLASSES.unknown];
}

function lookupVocabulary(data, family, value, locale, policy) {
  const table = data && data.vocabulary || {};
  const entries = Array.isArray(table.entries) ? table.entries : [];
  const fallback = table.unknown || {};
  const entry = entries.find(candidate => candidate && candidate.family === family && candidate.value === value);
  const selected = entry || fallback;
  const ru = locale === "ru";
  const activePolicy = policy || A2A_VOCABULARY_POLICY;
  const treatment = Object.prototype.hasOwnProperty.call(activePolicy, family)
    ? activePolicy[family]
    : (activePolicy.ALL || "emphatic");
  const toneClass = treatment === "neutral"
    ? "tone-neutral"
    : (A2A_VOCABULARY_TONE_CLASSES[selected.tone] || A2A_VOCABULARY_TONE_CLASSES.unknown);
  const cue = String(selected.cue || fallback.cue || "");
  return Object.freeze({
    label: String(ru ? selected.labelRU || "" : selected.labelEN || ""),
    // The actor's form of the same value, for a row that names a person and
    // then says what they did. Carried only by transitions; everything else
    // falls back to the label, so a caller can read `past` unconditionally
    // without a second lookup and without inventing a verb of its own.
    past: String((ru ? selected.pastRU : selected.pastEN) || (ru ? selected.labelRU : selected.labelEN) || ""),
    explanation: String(ru ? selected.explanationRU || "" : selected.explanationEN || ""),
    cue,
    cueAttribute: cue,
    toneClass
  });
}

function knowsVocabulary(data, family, value) {
  const entries = data && data.vocabulary && data.vocabulary.entries;
  return Array.isArray(entries) && entries.some(candidate =>
    candidate && candidate.family === family && candidate.value === value
  );
}

const A2A_VOCABULARY_RESOLVER = Object.freeze({
  lookup: lookupVocabulary,
  knows: knowsVocabulary,
  presentation: vocabularyPresentation,
  defaultPolicy: A2A_VOCABULARY_POLICY
});
globalThis.A2A_VOCABULARY_RESOLVER = A2A_VOCABULARY_RESOLVER;

class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
