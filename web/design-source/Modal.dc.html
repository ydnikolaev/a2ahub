<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
  <sc-if value="{{ cardOpen }}" hint-placeholder-val="{{ false }}">
    <div data-card-modal onClick="{{ dismissCard }}" style="position:fixed; inset:0; z-index:500; overflow:auto; overflow-anchor:none; display:flex; align-items:flex-start; padding:var(--padding-modal-backdrop); background:rgba(33,30,23,.5); font-family:'Onest',sans-serif;">
      <article ref="{{ cardHostRef }}" tabindex="-1" role="dialog" aria-modal="true" aria-label="{{ cardAriaLabel }}" style="width:min(980px,100%); margin:auto; border-radius:var(--radius-panel); outline:none; padding:var(--padding-card-block) var(--padding-card-inline); background:var(--surface); color:var(--text); box-shadow:0 24px 70px -22px rgba(33,30,23,.65);">
        <div style="display:flex; justify-content:flex-end; margin-bottom:12px;"><button type="button" onClick="{{ closeCard }}" aria-label="{{ cardCloseLabel }}" style="display:flex; align-items:center; justify-content:center; width:38px; height:38px; border:1px solid var(--border); border-radius:var(--radius-control); background:var(--surface-section); color:var(--muted); font-size:19px; cursor:pointer;">✕</button></div>
        <sc-if value="{{ cardGone }}" hint-placeholder-val="{{ false }}"><div data-card-gone role="status" style="margin-bottom:14px; padding:var(--padding-card-block) var(--padding-card-inline); border-radius:var(--radius-card); background:var(--attention-tint); color:var(--attention-ink);">{{ cardGoneText }}</div></sc-if>
        <sc-if value="{{ cardUnavailable }}" hint-placeholder-val="{{ false }}"><div data-card-unavailable style="padding:var(--padding-card-block) var(--padding-card-inline); border-radius:var(--radius-card); background:var(--surface-section); color:var(--body);">{{ cardUnavailableText }}</div></sc-if>
        <sc-if value="{{ cardArtifactDetail }}" hint-placeholder-val="{{ false }}"><dc-import name="ArtifactDetail" ctx="{{ cardCtx }}" hint-size="100%,720px"></dc-import></sc-if>
        <sc-if value="{{ cardThreadsView }}" hint-placeholder-val="{{ false }}"><dc-import name="ThreadsView" ctx="{{ cardCtx }}" hint-size="100%,720px"></dc-import></sc-if>
        <sc-if value="{{ cardContractsView }}" hint-placeholder-val="{{ false }}"><dc-import name="ContractsView" ctx="{{ cardCtx }}" hint-size="100%,720px"></dc-import></sc-if>
        <sc-if value="{{ cardExchangeView }}" hint-placeholder-val="{{ false }}"><dc-import name="ExchangeView" ctx="{{ cardCtx }}" hint-size="100%,720px"></dc-import></sc-if>
        <sc-if value="{{ cardSpacesView }}" hint-placeholder-val="{{ false }}"><dc-import name="SpacesView" ctx="{{ cardCtx }}" hint-size="100%,720px"></dc-import></sc-if>
        <sc-if value="{{ cardOverview }}" hint-placeholder-val="{{ false }}"><dc-import name="Overview" ctx="{{ cardCtx }}" hint-size="100%,720px"></dc-import></sc-if>
      </article>
    </div>
  </sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:900},&quot;ctx&quot;:{&quot;editor&quot;:&quot;object&quot;,&quot;default&quot;:{},&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  currentContext() { return this.props && this.props.ctx || {}; }

  closeCard() {
    const actions = this.currentContext().actions || {};
    if (actions.closeCard) actions.closeCard();
  }

  componentDidMount() {
    this.onEscape = ev => {
      const ui = this.currentContext().ui || {};
      if (ev.key === "Tab" && ui.card) { this.trapCardTab(ev); return; }
      if (ev.key !== "Escape") return;
      if (ui.card) { this.closeCard(); return; }
    };
    window.addEventListener("keydown", this.onEscape);
    this.wasCardOpen = false;
    this.componentDidUpdate();
  }

  componentWillUnmount() {
    window.removeEventListener("keydown", this.onEscape);
    this.unlockBody();
  }

  componentDidUpdate() {
    const open = !!(this.currentContext().ui || {}).card;
    if (open && !this.wasCardOpen) {
      this.cardOpener = document.activeElement;
      this.lockBody();
      if (typeof requestAnimationFrame === "function") requestAnimationFrame(() => { if (this.cardHost && this.cardHost.focus) this.cardHost.focus(); });
    } else if (!open && this.wasCardOpen) {
      this.unlockBody();
      const opener = this.cardOpener;
      this.cardOpener = null;
      if (opener && opener.focus && typeof requestAnimationFrame === "function") requestAnimationFrame(() => opener.focus());
    }
    this.wasCardOpen = open;
  }

  lockBody() {
    if (this.bodyOverflow !== undefined || !document.body || !document.body.style) return;
    this.bodyOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
  }

  unlockBody() {
    if (this.bodyOverflow === undefined || !document.body || !document.body.style) return;
    document.body.style.overflow = this.bodyOverflow;
    this.bodyOverflow = undefined;
  }

  trapCardTab(ev) {
    if (!this.cardHost || !this.cardHost.querySelectorAll) return;
    const focusable = Array.from(this.cardHost.querySelectorAll("button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex='-1'])"));
    if (!focusable.length) { if (ev.preventDefault) ev.preventDefault(); if (this.cardHost.focus) this.cardHost.focus(); return; }
    const first = focusable[0], last = focusable[focusable.length - 1], active = document.activeElement;
    if (active === this.cardHost || (this.cardHost.contains && !this.cardHost.contains(active))) { if (ev.preventDefault) ev.preventDefault(); const target = ev.shiftKey ? last : first; if (target.focus) target.focus(); }
    else if (ev.shiftKey && active === first) { if (ev.preventDefault) ev.preventDefault(); if (last.focus) last.focus(); }
    else if (!ev.shiftKey && active === last) { if (ev.preventDefault) ev.preventDefault(); if (first.focus) first.focus(); }
  }

  renderVals() {
    const ctx = this.currentContext();
    const ui = ctx.ui || {};
    const card = ui.card || null;
    const manifest = ui.cardManifest && Array.isArray(ui.cardManifest.cards) ? ui.cardManifest.cards : [];
    const cardRow = card ? manifest.find(row => row.kind === card.kind) : null;
    const cardGone = !!card && ui.goneCard === true;
    const cardData = cardGone ? ui.retainedCardData : ctx.data;
    const ru = ctx.locale === "ru";
    return {
      cardOpen:!!card,
      cardGone,
      cardGoneText:cardGone ? (ru ? "Этой карточки больше нет в текущих данных. Она остаётся открытой, чтобы вы могли закончить чтение." : "This card is no longer present in the current data. It remains open so you can finish reading.") : "",
      cardUnavailable:!!card && !cardRow,
      cardUnavailableText:ru ? "Эта карточка недоступна в текущем снимке." : "This card is unavailable in the current snapshot.",
      cardAriaLabel:ru ? "Карточка дашборда" : "Dashboard card",
      cardCloseLabel:ru ? "Закрыть карточку" : "Close card",
      cardArtifactDetail:!!cardRow && cardRow.component === "ArtifactDetail",
      cardThreadsView:!!cardRow && cardRow.component === "ThreadsView",
      cardContractsView:!!cardRow && cardRow.component === "ContractsView",
      cardExchangeView:!!cardRow && cardRow.component === "ExchangeView",
      cardSpacesView:!!cardRow && cardRow.component === "SpacesView",
      cardOverview:!!cardRow && cardRow.component === "Overview",
      cardCtx:{ data:cardData, locale:ctx.locale, ui:{ card }, actions:ctx.actions || {} },
      cardHostRef:node => { this.cardHost = node; },
      closeCard:() => this.closeCard(),
      dismissCard:ev => { if (ev && ev.target === ev.currentTarget) this.closeCard(); }
    };
  }
}
</script>
</body>
</html>
