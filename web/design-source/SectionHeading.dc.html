<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-section-heading="true" style="display:flex; align-items:baseline; justify-content:space-between; gap:6px 14px; flex-wrap:wrap; margin-bottom:10px;">
  <div style="min-width:0; font-size:16px; line-height:1.35; font-weight:600; color:var(--text); text-wrap:balance;">{{ title }}</div>
  <sc-if value="{{ hasHint }}" hint-placeholder-val="{{ false }}">
    <div style="font-size:14px; line-height:1.45; color:var(--muted);">{{ hint }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:56},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Тело документа&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      title: this.props.title || "",
      hint: this.props.hint || "",
      hasHint: !!this.props.hint
    };
  }
}
</script>
</body>
</html>
