feedback: v1
id: fb-20260827-a84550
kind: bug
severity: major
title: verify-export against a staged candidate can never match its published version
summary: >-
  `a2a contract verify-export --local <staging> <XC-id>@<version>` is the verb
  the contract-owner loop names for "my published export still matches my code"
  (loops/contract-change.md §8.4), and no tree a producer can hold makes it
  green. The versioned form digests the candidate under the published contract's
  digest profile; for contract-set-v2 that profile covers the descriptor BYTES.
  But publish does not carry the candidate's descriptor through — it stamps
  `schema`, `version` and `generated_from.source_digest` into the frontmatter and
  re-serializes the whole mapping through yaml.Marshal, so the published
  contract.md differs from every candidate that produced it, in the version field
  and in indentation. The shipped template makes the first difference mandatory
  ("THE VERSION FIELD IS NOT YOURS TO SET. Leave it at 0.0.0"); the second is
  undocumented — nothing says the authored descriptor is re-emitted, so a
  generator aiming for byte-parity has no specification to hit. The two
  invariants are closed against each other: a candidate that satisfies publish
  cannot satisfy verify-export, and the operator sees a bare digest pair with no
  named file.
context:
    a2a_version: 0.25.4
    os_arch: darwin/arm64
    surface: cli
    command: a2a contract verify-export --local .a2a/staging/<system>/provides/<slug> <XC-id>@<version>
    agent: >-
      Reproduced with the released 0.25.4 binary; code references are read from
      the a2ahub working tree at c99bf9b5 (dev), so line numbers are indicative
      and the mechanism, not the line, is the claim.
evidence:
    steps:
        - "Publish a contract-set-v2 contract from `.a2a/staging/<system>/provides/<slug>/`, authored from the shipped template (descriptor at version: 0.0.0), then `a2a sync`."
        - "a2a contract verify-export --local .a2a/staging/<system>/provides/<slug> <XC-id>@<published-version> -> exit 1, `digest mismatch: local=sha256:a2ab345a... want=sha256:b1b588f2...`, and ZERO added/removed/changed lines."
        - "a2a contract verify-export --local .a2a/cache/mirrors/<space>/<system>/provides/<slug> <XC-id>@<published-version> -> exit 0, matches. The published tree is the only tree that matches, which is a tautology, not a check."
        - "diff -rq over the two trees -> exactly ONE differing file: contract.md. schema/** and fixtures/** and artifacts/** are byte-identical."
        - "diff over contract.md alone -> `version: 0.0.0` vs the published version, plus 2-space vs 4-space indentation under `generated_from:` and `artifacts:`."
        - "internal/contract/publication_plan.go finalizePublicationDescriptor: setYAMLScalar(root, \"schema\"/\"version\"), setYAMLScalar(generated, \"source_digest\"), then yaml.Marshal(root) — the descriptor is re-emitted, never carried."
        - "cmd/a2a/contract_p6_wiring.go contractLocalSnapshotDigest: for a non-tree-v1 profile it passes core.Descriptor.Raw into BuildCarriedSet, so the descriptor bytes are inside the compared digest."
        - "schemas/templates/v2/contract.md: `version: 0.0.0 # set by \\`a2a contract publish\\`, never by hand` — so the one field guaranteed to differ is the one the template mandates."
    expected: >-
      A producer can point verify-export at a tree they actually keep and learn
      whether the space still serves what their code produces — the question §8.4
      says the verb answers.
    actual: >-
      Only the mirror's own published tree compares equal. Every candidate a
      producer can author differs in contract.md by construction, so the verb
      reports a digest mismatch on a contract that is in fact undrifted.
proposal: >-
  The wanted comparison is already computable and already asserted on both sides
  — it just has no verb. The PUBLISHED descriptor carries
  `generated_from.source_digest`, and the bare form `verify-export --local <dir>
  <XC-id>` (v0.19.8, fb-20260806-eb224e) computes export-source-v1 over a local
  candidate. In the reproduction above it prints sha256:9a6343af..., exactly
  what the published descriptor asserts. So the honest post-publish check is:
  compute export-source-v1 locally and compare it against the PUBLISHED
  descriptor's asserted source_digest — schema and fixture entries only,
  descriptor excluded, precisely the set publish does not rewrite. Make that the
  meaning of `verify-export --local <dir> <XC-id>@<version>`, whose
  descriptor-inclusive comparison is unsatisfiable today, or add
  `--against-published`. Two alternatives also close it: publish writes the
  finalized descriptor back into staging; or the publisher-owned fields and the
  serialization leave the compared digest. Whichever is chosen, say in
  reference/contract-versions.md that the descriptor is re-serialized at publish,
  and that export-source-v1 excludes `artifacts/**` — a declared companion needs
  its own comparison.
