evidence:
    steps:
        - "In the getvisa space, axon has three handoffs folded to accepted whose data-packages pin `contract: XC-seomatrix-regime-corpus@1.0.0#sha256:428ad3d8...` (seomatrix/data/DP-seomatrix-20260818-{p3my,n2yp,jgf1}/manifest.json)."
        - "axon/consumes.yaml lists only XC-seomatrix-c4-export; axon/requires/ holds one requirement that predates the contract and names no contract id."
        - "`a2a doctor` as of 0.23.0 correctly WARNs on the consumer side — the side that already knows."
        - "internal/validate/policy_retire.go:22-25 defines registered consumer as satisfied requirement OR consumes.yaml entry."
        - "`grep -rn 'verification-report\\|data-package' internal/validate` returns nothing: no policy gate reads the delivery path at all."
        - "FindUnadoptedConsumption's doc comment states policy_retire.go does not call it and does not change, and that Piece 2 is the epic's open question."
    expected: "A producer retiring a contract version sees every system a2a's own committed artifacts show consuming it, declared or not, before the retire proceeds."
    actual: "Retire's consumer set is declarations only (policy_retire.go:22-25). Three verify-passed deliveries pinning the contract in the producer's own space make axon a consumer of record nowhere, and a clean ungated retire is available."
proposal: "Add `observed` as a state distinct from `declared`, informing decisions and gating none. (1) RetirePrecondition gains Observed[] — never blocks, but is NAMED in retire's output, so the CLEAN path stops being silently blind: '0 declared consumers, 1 observed (axon: 3 packages, latest 2026-08-18)'. The human retiring then decides with the fact in view, which is all the override path already assumes. (2) `contract deprecate` seeds observed systems into the default `to:`. That needs no inbox change — routing is already consumes.yaml UNION the announcement's `to:` (inbox_deprecation_test.go:41,143). (3) A producer-side doctor row: the same scan from the other identity, 'someone consumes mine and never declared it'. FindUnadoptedConsumption filters on ownSystem and needs a sibling, not a rewrite. (4) Carry the VERSION. Line 471 does `contractID, _ := splitPinnedContractID(doc.Contract)` — the manifest pins id@version#digest and the version is parsed and dropped. Retire is per-version, so 'consumes 1.0.0' is actionable where 'consumes something' is not."
