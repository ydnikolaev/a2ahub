# Feedback authoring skeleton (v1) — materialized by `a2a feedback new <kind>`
# to `.a2a/feedback/<id>.yaml` (§T1, §11 A4). Every field required by
# feedback.schema.json is present with a placeholder or auto-fill value so
# the drafted file is schema-VALID once you replace the placeholders and
# flip `checks.*` to true after honestly clearing every §2.1 gate.
#
# `id` / `context.a2a_version` / `context.os_arch` are filled in by the CLI
# before this file ever reaches disk — the empty strings below are the
# pre-fill placeholders `internal/feedback` overwrites, never hand-edited.
#
# `checks.*` starts all `false` on purpose: the agent must consciously flip
# each one after actually verifying it (I5) — never bulk-set to true.

feedback: v1
id: fb-20260820-0cb8c8 # auto-filled: fb-YYYYMMDD-<6 hex>
kind: protocol # bug | feature | docs | friction | protocol
severity: major # blocker | major | minor
title: an observed consumer should inform retire and deprecate without registering # 8-80 chars, specific
summary: "FindUnadoptedConsumption's own doc comment leaves Piece 2 open as a binary — 'should a verify-passed delivery auto-register?' — and both answers are bad, which is probably why it is still open. Auto-register fabricates the adoption note and inverts the designed verify-then-adopt order; not registering leaves the producer's retire gate blind. There is a third option the binary hides: do not register, and make the producer's DECISION see it. Live case in the getvisa space: axon has a shipped client and three verify-passed deliveries against XC-seomatrix-regime-corpus, and is a registered consumer of nothing. policy_retire.go's own definition is 'satisfied requirement OR consumes.yaml entry' — the delivery path is neither, and internal/validate has zero references to it, so no gate reads it. seomatrix could retire that contract today, cleanly and ungated, out from under a live consumer whose deliveries are committed in their own space. The detection landed in 0.23.0 and is wired to one consumer-side WARN — the side that already knows."
context:
    a2a_version: 0.23.0 # auto-filled
    os_arch: darwin/arm64 # auto-filled (runtime.GOOS/runtime.GOARCH)
    surface: protocol # cli | schema | docs | skill | dashboard | space-ci | protocol
    # command: ""       # optional: the failing/awkward invocation
