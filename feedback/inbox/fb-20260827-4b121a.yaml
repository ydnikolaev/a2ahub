feedback: v1
id: fb-20260827-4b121a
kind: friction
severity: minor
title: validate --ci outside a space names a missing file, not the caller's state
summary: >-
  Run from a participant repository, `a2a validate --ci --mode=v3-full-repo`
  exits 1 with `validate --ci: cannot read space.yaml: open space.yaml: no such
  file or directory`. The message describes a filesystem, not the state the
  caller is in. It does not say that the verb runs against a space-repo checkout,
  it does not say the caller is not in one, and — the part that costs the most —
  it does not say that the caller almost certainly HAS one on disk already, at
  `.a2a/cache/mirrors/<space>/`, put there by `a2a sync`. Read from a participant
  repo the line is indistinguishable from a broken install, and it was in fact
  read that way: a producer concluded the command did not exist, and `a2a
  validate` appears in no Makefile in that repository at all — verified — before
  they eventually found that `cd .a2a/cache/mirrors/<space> && a2a validate --ci`
  works fine. The commands
  reference lists `validate` with no hint of the cwd precondition, so nothing
  before or after the refusal corrects the reading.
context:
    a2a_version: 0.25.4
    os_arch: darwin/arm64
    surface: cli
    command: a2a validate --ci --mode=v3-full-repo
    agent: >-
      Reproduced with the released 0.25.4 binary in a participant repository with
      one connected space and a synced mirror.
evidence:
    steps:
        - "From a participant repository root with a valid .a2a/config.yaml and a synced mirror, run `a2a validate --ci --mode=v3-full-repo`."
        - "Observed: exit 1, `validate --ci: cannot read space.yaml: open space.yaml: no such file or directory`."
        - "`cd .a2a/cache/mirrors/<space> && a2a validate --ci --mode=v3-full-repo` -> works, exit 0 on a clean mirror."
        - "skill/a2ahub/reference/commands.md lists `validate` as `validate a draft (V1/V2)` with no statement that --ci requires a space-repo cwd."
    expected: >-
      The refusal names the state: this verb runs inside a space checkout, you are
      in a participant repository, and your synced mirror is at
      .a2a/cache/mirrors/<space> — or the verb accepts --space <id> and runs there.
    actual: >-
      A missing-file path with no mention of spaces, mirrors, or the required cwd,
      which reads as "this command does not work here".
proposal: >-
  When --ci cannot find ./space.yaml, check whether the cwd is a participant
  project (a loadable .a2a/config.yaml) and say so: name the verb's precondition,
  and name the mirror path for each connected space as the checkout to run it in.
  Better still, accept `--space <id>` and run against that space's synced mirror
  directly, which removes the cd entirely and makes the verb usable from the
  place a producer actually stands. Add the cwd precondition to the commands
  reference's `validate` line either way. Two notes for whoever picks this up.
  This is the same class as the companion fix already shipped for verify-export
  in fb-20260802-10d983 — "the current error describes a filesystem, not the
  state the caller is in" — so it is a recurrence of an accepted defect, not a
  new opinion. And if `--space` is added, consider scoping the walk to the
  caller's own system: a participant gating on `--mode=v3-full-repo` today
  reddens on another participant's broken artifact, which is not a verdict they
  can act on.
checks:
    docs_consulted: true
    grounded_in_real_work: true
    not_space_specific: true
    no_sensitive_content: true
    duplicates_checked: true
resolution: |-
    Accepted, and the value is the RECURRENCE rather than the message.
    CONFIRMED against the code on 2026-08-27: internal/cli/cmd_validate_ci.go:103-106
    reads space.yaml at the repository root and, on any error, prints
    `validate --ci: cannot read space.yaml: %v` and exits 1. The message is
    the os.ReadFile error verbatim. Nothing in it names spaces, mirrors, or
    the cwd precondition, and skill/a2ahub/reference/commands.md carries no
    such precondition on its `validate` line either — so neither the refusal
    nor the reference corrects the reading.

    THE RECURRENCE CLAIM IS TRUE AND IS THE POINT. fb-20260802-10d983
    (friction, shipped in v0.19.8) is the same class in the same words — "the
    current error describes a filesystem, not the state the caller is in" —
    raised against verify-export before its first publish, fixed there, and
    now reappearing untouched in a sibling verb. fb-20260820-a3f169, shipped
    in v0.24.0 six days ago, is a third instance from a third direction: a verb
    reading the one file that proves the checkout and saying the wrong thing
    about its absence. Three point fixes and no rule.

    SO THE ROUTE IS A ROW, NOT A THIRD POINT FIX. What the row has to decide
    is what the invariant even is — "a refusal names the caller's state, not a
    path" is not mechanically checkable as written, and the honest options
    differ in cost: a gate over the refusal strings a verb can emit, a shared
    helper every cwd-precondition verb must route through (which is what
    notify setup's notifyReadSpaceManifest already is, for one file), or a
    narrower rule about os.ReadFile errors reaching a user unwrapped. Picking
    one is design work, and doing it as a fix to this one message would be the
    fourth point fix.

    The report's two secondary notes are carried into the row rather than
    dropped: `--space <id>`, which would remove the cd entirely and make the
    verb usable from where a producer stands; and scoping a `--mode=v3-full-repo`
    walk to the caller's own system, since a participant gating on it today
    reddens on another participant's broken artifact — a verdict they cannot
    act on.

    REFS NAMES docs/backlog.md, so CHECK-C is silent on this row — see
    fb-20260827-bc1f13's resolution for the mechanism.

    SHIPPED 2026-08-29, answers-that-hold-2026-08 P4 (fa3fad8a, a94350b8).
    The refusal from a participant checkout now names the precondition, says
    the cwd is a participant project rather than a space checkout, and names
    each connected space's synced mirror as the checkout to run in. It is
    built through a constructor whose ARITY makes a next-step-less refusal a
    COMPILE ERROR — the invariant is in the type system, because no gate can
    judge whether prose names the caller's state.

    BOTH secondary notes were carried, and one shipped. `--space <id>` is
    live: it runs the same validation against that space's synced mirror with
    no cd, and an unknown id refuses through the same constructor, naming the
    ids that ARE connected. Scoping a --mode=v3-full-repo walk to the caller's
    own system did NOT ship here — it is a different verb's authorization
    question, not a refusal-text one, and it stays in docs/backlog.md.

    A ratchet ships with it (scripts/check-refusal-ratchet.sh): no NEW raw
    err-to-stderr site may appear in internal/cli outside the constructor, and
    the per-file budget may only shrink. The 171 standing sites are debt with a
    size, not this phase's obligation. It went red on its own wave against two
    sibling phases and 14 sites were migrated rather than re-baselined.
status: shipped
