feedback: v1
id: fb-20260812-d31acb
kind: bug
severity: minor
title: inbox still calls a data package's own README undecodable after the POL-002 fix
summary: >-
  The release that fixed POL-002 taught artifact discovery to recognise a data
  package's path shape, so `a2a validate --ci` no longer rejects the README.md
  that `a2a data pack` writes without frontmatter. The mirror decoder used by
  `a2a inbox` and `a2a outbox` did not learn the same thing.

  Every inbox and outbox call now ends with a note that one file in the space
  "could not be decoded, so it is missing from this output", naming
  <system>/data/<DP-id>/README.md as not-frontmatter-shaped. The file is exactly
  where the tool put it, in exactly the shape the tool must write it in, and it is
  not an exchange artifact at all — so it was never missing from that output in
  any meaningful sense.

  It is cosmetic but it is the wrong kind of cosmetic: a standing "something in
  your space is malformed" line trains the reader to ignore the one channel that
  would report a genuinely undecodable artifact. It also survives a re-sync, so
  the obvious first remedy does nothing. One accepted data delivery leaves it
  permanently on every listing.
context:
    a2a_version: 0.19.11
    os_arch: darwin/arm64
    surface: cli
    command: a2a inbox / a2a outbox
evidence:
    steps:
        - "Receive a data package delivery from a counterparty (`a2a data deliver` on their side) and merge it, so <system>/data/<DP-id>/ is on the space's main branch."
        - "Run `a2a sync`."
        - "Run `a2a inbox` (or `a2a outbox`)."
    expected: >-
      No decode warning. The packed README.md is a data-package payload, recognised
      by the same path shape the validator was taught to recognise, and it is not an
      exchange artifact — so it should be skipped silently rather than reported as
      an artifact that failed to decode.
    actual: >-
      Both listings append: "note: 1 file(s) are in this space but could not be
      decoded, so they are missing from this output: <system>/data/<DP-id>/README.md
      (not-frontmatter-shaped)". It persists across `a2a sync` and appears on every
      subsequent call.
proposal: >-
  Apply the same data-package path-shape recognition the validator gained to the
  mirror decoder that feeds inbox/outbox, so one exemption covers both readers
  rather than one. If the note is meant to be conservative about unknown files,
  it should at least distinguish "a file the tool itself wrote, in the shape it
  must be written in" from "an artifact that failed to parse" — the second is
  worth a line on every listing, the first is not.
checks:
    docs_consulted: true
    grounded_in_real_work: true
    not_space_specific: true
    no_sensitive_content: true
    duplicates_checked: true
resolution: >-
    Accepted and FIXED, at the level the report asked for: not a second
    exemption, one predicate. `artifact.IsDataPackageReadmePath`
    (internal/artifact/paths.go) states the `<system>/data/<DP-id>/README.md`
    grammar once, and both readers consult it — `internal/cache/mirror.go`'s
    walkArtifacts (this report) and doctor's repository-visibility scan
    (fb-20260812-f9cfac, the same root cause seen from the other end). The
    packed README is now classified, not excused.

    The severity call in f9cfac is right and this record's own `minor` was
    wrong. Listing noise is what the defect looks like from `inbox`; from
    `doctor` the same file turned a whole classification verdict into
    UNVERIFIED. One cause, two surfaces, and the surface that happened to be
    looked at first set the severity.

    The second half of the proposal — that a listing should distinguish "a file
    the tool itself wrote, in the only shape it may write it in" from "an
    artifact that failed to parse" — is ACCEPTED AS REASONING, and is why the
    fix is a shared predicate rather than a suppression. Generalising that
    distinction to every skip reason is NOT done here and is not pretended to
    be; it needs a vocabulary the skip machinery does not have.

    Not fixed, and named so the omission is visible: `walkArtifacts` has the
    identical hole for BLOB payloads (`<system>/blobs/<BL-id>/...`), which the
    validator already exempts. Found by this fix's own implementer and left out
    of scope deliberately rather than swept in — docs/backlog.md carries it,
    beside the row explaining why the path grammar is still stated twice
    (internal/artifact cannot import internal/space; the collapse runs the
    other way).

    Shipped in v0.20.0.
status: accepted
