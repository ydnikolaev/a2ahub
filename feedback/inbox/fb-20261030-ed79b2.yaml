    duplicates_checked: true
resolution: >-
    Accepted for the backlog. skill/a2ahub/loops/watch.md steps 2 and 4 do tell an agent to
    re-arm on exit 124 from a fresh background command, so each quiet deadline
    costs a turn, and the recipe that re-arms in the shell is not written down.
    Ask 1 (the recipe) is prose and independent of asks 2 and 3. Ask 2 (a wait
    with no outer deadline) depends on ask 3 (exit 3 as soon as a space goes
    unobservable), in the order the report gives. Not built in this triage.
    Update 2026-11-10: ask 1 is done. skill/a2ahub/loops/watch.md step 2 now
    gives a shell loop that re-arms on 124 itself, so a quiet deadline no
    longer costs an agent turn. Asks 2 and 3 are deferred as new wait
    semantics; the record stays accepted for them.
status: accepted
