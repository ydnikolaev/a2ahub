id: fb-20260802-e6d436
kind: feature
proposal: |-
    Give a contract a declared artifact set instead of a fixed pair of
    directories: a manifest beside the schema listing each carried file with a
    role (schema, api, errors, vocabulary, limits, changelog, example, other), a
    digest, and whether it is normative.

    That keeps the integrity story rather than degrading to "any files may
    appear". publish records the digest set, so a consumer can verify what it
    received is what was published; verify-export compares the whole set instead
    of one schema; the compatibility check keeps operating on exactly the entries
    whose role and schema_format make it meaningful, unchanged for everyone else;
    and a dashboard can finally say what a contract carries.

    Two things worth deciding in the open rather than by accident: a size ceiling
    for the set, and whether non-text entries are allowed at all. A contract that
    quietly becomes a binary distribution channel is a different product; a
    contract that cannot carry its own error catalogue is the present problem.
resolution: |-
    PARTIALLY SHIPPED, and the open half is narrower than this record's summary reads.
    Corrected 2026-08-27 against the code rather than against the record's own text.

    WHAT SHIPPED. This record's proposal was "a declared artifact set instead of a fixed
    pair of directories: a manifest beside the schema listing each carried file with a role
    (schema, api, errors, vocabulary, limits, changelog, example, other), a digest, and
    whether it is normative." That is `contract-set-v2`, and it ships: the descriptor's
    closed `artifacts:` inventory carries exactly those roles plus `valid-fixture` and
    `invalid-fixture`, each with a path, a media type and a normative flag
    (`internal/contract/types.go`, `rootForRole` mapping the companion roles to
    `artifacts/`). So "a contract that cannot carry its own error catalogue is the present
    problem" — this record's own closing line — is NO LONGER TRUE.

    WHAT REMAINS. Only the format half: `schema_format` still admits `openapi-3.x` and
    `proto3` while the declared carried set requires a schema and fixtures those formats
    cannot supply, so those contracts have no publishable shape. v0.19.6 made the tool SAY
    so rather than fail obscurely (`a2a template show contract` states the refusal at a
    0.19.0+ floor).

    ROUTE CORRECTED. The ref named
    `docs/features/archive/operational-confidence-2026-08/README.md` — an ARCHIVED epic, so
    the row claimed an owner that no longer exists, and CHECK-C's staleness join skips a
    non-spec ref in silence anyway. Re-pointed at `docs/backlog.md` with route `backlog`:
    no active phase owns the remaining half, and a backlog row that says so beats a ref that
    names a dead home. Giving openapi and proto3 a publishable carried set is a wire-format
    decision nobody has priced. Related: fb-20260806-3539ac.
severity: major
status: accepted
summary: |-
    The envelope's schema_format field admits json-schema-2020-12, openapi-3.x,
    proto3 and other. What a space carries under provides/<slug>/ is schema/**
    plus fixtures/**, and nothing else. So a2a lets a producer declare that its
    contract IS an OpenAPI document while giving that document nowhere to live.

    The same gap hits contracts that are JSON Schema but not ONLY JSON Schema. A
    real interface usually also has a normative error catalogue, an enum or
    vocabulary manifest, declared limits, a changelog, and worked examples beyond
    the compatibility fixtures. A producer holding such material has two bad
    choices: put it under fixtures/, where it is not a fixture and no reader
    expects it, or reference it from outside the space, which breaks the property
    the contract family exists for: that a consumer reading the contract in six
    months has only these files.

    Authoring guidance already tells a producer that everything the schema cannot
    express belongs with the contract. The transport does not yet agree.
title: schema_format admits OpenAPI and proto but only a schema dir can travel
