feedback: v1
id: fb-20260802-e2d28b
kind: feature
proposal: |-
    Not enforcement — a doctor row. Report the space repository's visibility
    alongside the highest classification present among that space's artifacts,
    and warn when the transport is weaker than the label: anything above public
    sitting in a world-readable space.

    Classification stays a human gate, as designed. It simply stops being a
    silent one.

    A stronger variant exists and is deliberately not what this asks for: refuse
    at submit when classification is restricted and the space is public. That
    converts a label into a rule, which is a protocol change and should be
    decided as one. The doctor row only reports what is already true, so it can
    ship without settling that question.
resolution: Verified classification-versus-transport visibility gap; accepted as an advisory doctor diagnostic, not enforcement.
severity: minor
status: accepted
summary: |-
    Every artifact carries classification: public, internal or restricted.
    Nothing in the tool relates that value to the actual confidentiality of the
    space it lands in. The only thing providing confidentiality is the visibility
    of the space repository.

    The result is a contradiction that is easy to reach and hard to notice: a
    space whose repository is world-readable, holding artifacts every one of
    which declares itself internal. Nothing in doctor, validate or submit
    mentions it. Both sides keep writing the label in good faith, and the label
    describes an intention the transport is not implementing.

    Discovering this by accident is the normal path, because nothing in
    day-to-day use puts the repository's visibility next to the classification of
    what is being written into it.

    This is adjacent to contract work rather than part of it, but it lands on the
    same act: publishing a contract is the largest single body of material most
    participants will ever put into a space, and the first one they would regret
    exposing.
title: classification is a label the space transport never honours
