feedback: v1
id: fb-20260806-cd2d11
status: new
kind: docs
severity: minor
title: publication never states its anchor, and never says no git tag is minted
summary: >-
  Publishing a contract mints no git tag, and that is the right design - a
  commit is content-addressed and immovable, a tag can be force-moved, so in a
  system built on immutable published versions a tag would be a movable alias
  to an immovable anchor. Nothing here asks for tags. The gap is that the
  manual never says so where an integrator is looking. The word "tag" does not
  appear in reference/contract-versions.md at all, and the anchoring rule
  appears exactly once, in passing, inside a bullet about RETIREMENT:
  "id@version resolves through the publish event's own commit forever". The
  section describing publication says nothing about what anchors a published
  version. An integrator writing an acceptance criterion reaches for
  release-tag convention by default, because that is what publishing means
  nearly everywhere else. Ours did: our phase's criterion reads "published,
  mirror/tag verified, adopted...", and the tag clause is unsatisfiable against
  a2a's actual model. It survived several planning waves before anyone checked,
  and a less careful pass would have ticked it.
context:
    a2a_version: 0.19.8
    os_arch: darwin/arm64
    surface: docs
    command: a2a contract publish XC-axon-getvisa-ingest --version 1.0.0 --staging <dir>
evidence:
    steps:
        - "Publish a first contract release; it merges and `a2a show <id>` reports published"
        - "gh api repos/<space>/tags --jq '.[].name' -> empty; `git tag --list` in the local mirror -> empty"
        - "grep -rn 'tag' .a2ahub/skill/reference/contract-versions.md -> ZERO hits in the git-tag sense"
        - "grep -rn 'resolves through' .a2ahub/skill/ -> ONE hit, contract-versions.md:58, sitting under the heading 'Retirement removes nothing' - a subsection about retirement, not about what anchors a publication"
        - "The page's own publication sections (the carried set, the descriptor's version field, the authoring floor) describe what publish WRITES and never state what a consumer resolves it BY"
    expected: >-
      The page that explains publication states the anchor: no git tag is minted,
      the publish event's commit is what id@version resolves through, and that is
      deliberate because a tag is movable and a commit is not.
    actual: >-
      The rule is stated once, inside a retirement bullet, and the absence of tags
      is never stated at all - so the reader's default assumption is neither met
      by the text nor contradicted by it.
proposal: >-
  One sentence where publication is described, saying the anchor is the publish
  commit and no tag is minted, with the one-clause reason (a tag is movable, a
  commit is not). The reason matters more than the fact: told only "there is no
  tag", an integrator files a feature request for one; told why, they write the
  right acceptance criterion instead. Worth placing the verifiable substitute in
  the same paragraph - `a2a contract materialize <id>@<version>` diffed against
  the producer's own release tree is what actually proves a publication landed
  intact, and it is a better check than a tag would have been, because it
  compares bytes rather than the existence of a pointer.
checks:
    docs_consulted: true
