feedback: v1
id: fb-20260827-bc1f13
kind: bug
severity: minor
title: verify-export hides the only file that can explain its digest mismatch
summary: >-
  `a2a contract verify-export` reports a digest mismatch and prints nothing that
  names a file, in the common case where the ONLY differing file is contract.md.
  Two independent choices produce that. First, the shared snapshot inspector
  skips the descriptor path when it builds added/removed/changed, and reports
  descriptor differences in a separate `frontmatterChanged` list — correct, since
  a frontmatter delta is field-level, not byte-level. Second, verify-export's
  renderer prints Added, Removed and Changed and then stops; its sibling
  `contract diff` prints the same three plus a `frontmatter <field>` line for
  each entry. So the field is computed, carried through the adapter, given a
  `frontmatter_changed` JSON tag, and then dropped on the floor by the one verb
  whose failure it explains. The operator gets two opaque sha256 values and no
  delta. verify-export also has no `--json`, while `contract diff` does, so the
  structured result the MCP surface returns is unreachable from the CLI — there
  is no way to see the dropped field at all.
context:
    a2a_version: 0.25.4
    os_arch: darwin/arm64
    surface: cli
    command: a2a contract verify-export --local <dir> <XC-id>@<version>
    agent: >-
      Reproduced with the released 0.25.4 binary; code references read from the
      a2ahub tree at c99bf9b5 (dev), so the mechanism is the claim, not the line.
evidence:
    steps:
        - "Run verify-export against a staged candidate whose schema/** and fixtures/** are byte-identical to the published contract and whose contract.md differs only in frontmatter."
        - "Observed: `contract verify-export: digest mismatch: local=sha256:a2ab345a... want=sha256:b1b588f2...` on stderr, and not one line on stdout."
        - "diff -rq over the two trees confirms exactly one differing file, contract.md, so there is a real and nameable delta the verb declines to name."
        - "cmd/a2a/contract_p6_wiring.go inspectContractSnapshots: both loops `continue` on contract.DescriptorPath, then set result.frontmatterChanged = contractFrontmatterChanges(...) from the two descriptors."
        - "internal/cli/cmd_contract.go runDiff prints Added, Removed, Changed AND `frontmatter %s` for each FrontmatterChanged entry."
        - "internal/cli/cmd_contract.go runVerifyExport prints Added, Removed, Changed and then the digest-mismatch line. FrontmatterChanged is never read."
        - "runVerifyExport's flag set declares only --local; there is no --json, so ContractVerifyExportResult.Diff.frontmatter_changed cannot be reached from the CLI by any route."
    expected: >-
      A mismatch names what differs. Where the difference is in the descriptor,
      the frontmatter fields that changed are printed, the same way `contract
      diff` already prints them.
    actual: >-
      Two sha256 values and an empty file list. The one list that would explain
      the verdict is computed and discarded, and no flag exposes it.
proposal: >-
  Copy runDiff's fourth loop into runVerifyExport — `for _, value := range
  result.Diff.FrontmatterChanged { fmt.Fprintf(stdout, "frontmatter %s\n", value)
  }`. That is one loop, on a value already in hand, and it turns an unexplainable
  red into an actionable one. Add `--json` to verify-export for parity with
  `contract diff`, so the structured result the MCP tool already returns is also
  reachable from the CLI. Worth a teeth-style test that a descriptor-only
  difference produces at least one named line on stdout: the current silence is
  indistinguishable from "no delta found", which is what made this look like a
  tooling failure rather than a real mismatch. This is the rendering half of
  fb-20260827-a84550; that report is about there being no satisfiable candidate
  at all, and stays open even if this one ships.
checks:
    docs_consulted: true
    grounded_in_real_work: true
    not_space_specific: true
    no_sensitive_content: true
    duplicates_checked: true
resolution: |-
    Accepted. CONFIRMED against the code at HEAD on 2026-08-27, every claim
    re-checked rather than transcribed from the report or from the intake
    pass's own note.

    runVerifyExport (internal/cli/cmd_contract.go:1738-1747) prints Added,
    Removed and Changed and then the digest-mismatch line on stderr;
    `result.Diff.FrontmatterChanged` is never read. The field is not merely
    uncomputed — it is computed, carried through the adapter
    (cmd/a2a/contract_p6_wiring.go:713 sets it on the verify-export result,
    the same as :706 does for diff) and given a `json:"frontmatter_changed"`
    tag (internal/cli/cmd_contract_p6.go:69). runDiff prints it at
    cmd_contract.go:1316, which is the loop to copy. The flag set declares
    only `--local`, so there is no `--json` and no route to the field at all;
    `contract diff` has one (encodeContractJSON at :1305).

    The report's own proposal is the fix, and it is one loop over a value
    already in hand. Two things it names should not be dropped in the doing:
    the `--json` parity, so the structured result the MCP surface already
    returns is reachable from the CLI; and a teeth-style test that a
    descriptor-only difference produces at least one named line on stdout —
    the current silence is indistinguishable from "no delta found", which is
    what made a real mismatch read as a tooling failure.

    ROUTED to /quick-fix rather than into a phase: no active phase claims
    verify-export, and the two phases that mention it (agent-ops P3, P11) are
    both done. The docs/backlog.md row carries it until the loop runs.

    SUPERSEDED 2026-08-29: answers-that-hold-2026-08's own P3 claimed it after
    all — that spec's §0.5 cites this record by id, and its AC-1/AC-9 are this
    fix. Both asks named above shipped in commit a28e186d: verify-export gained
    --json, and a descriptor-only difference now prints one line per changed
    frontmatter field instead of zero lines on a non-zero exit. status: stays
    `accepted` and not `shipped` because the release carrying it (0.25.7) is
    not cut; the flip belongs to the release, not to the commit.

    REFS NAMES docs/backlog.md AND THAT MAKES ONE GATE QUIET, stated rather
    than left to be discovered. check-feedback-corpus.sh's CHECK-C joins a
    ledger row's refs to a tracker phase only for a ref shaped
    docs/features/<section>/<slug>/specs/<file>; a docs/backlog.md ref is
    silently skipped, so nothing will force this row's verdict to move when
    the fix lands. The row must be closed by hand, or re-pointed at a spec if
    one is ever written.

    This is the RENDERING half of fb-20260827-a84550, as that record says.
    Shipping this one does not close that one: it makes an unsatisfiable
    comparison explain itself, which is worth having on its own.

    SHIPPED in v0.25.7. The flip this record's own SUPERSEDED note deferred —
    "status: stays `accepted` and not `shipped` because the release carrying it
    (0.25.7) is not cut; the flip belongs to the release, not to the commit" —
    is this edit, made while cutting that release. The code did not move again;
    a28e186d is still the commit, RN-02507-8 and RN-02507-9 are the notes, and
    `reference/contract-versions.md` now documents both halves.

    The hand-close this record predicted was needed did happen, and was NOT
    remembered: `check-feedback-corpus` refused the release because this record
    sat `accepted` with no backlog row, which is a different guard from the
    CHECK-C join it correctly said would stay quiet. So the row was closed by a
    gate after all — just not the one it named.
status: shipped
