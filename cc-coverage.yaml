# ---------------------------------------------------------------------------
# uncovered: the OTHER 54 — agent-exchange-2026-08 P11 AC7
#
# The plan defers the full §12 matrix to v2/L4 (15-rollout.md), and this phase
# does not pretend to close it. What AC7 refuses to accept is NOT KNOWING THE
# NUMBER. Measured 2026-08-11: docs/the-plan/plan/12-corner-cases.md declares
# 63 distinct CC-###; `rows:` above records 9; these are the 54 that do not,
# each named, each with a verdict and the evidence behind it.
#
# ENFORCED (internal/e2e.TestCCCoverageGate): rows ∪ uncovered must equal §12's
# own set exactly, with no overlap. A corner case added to the plan tomorrow
# reds the build until somebody classifies it — which is the whole point. A
# published number that nothing maintains rots exactly the way this file's own
# `tier` column rotted while nothing read it (see the header above).
#
# The verdicts, and what each one costs the reader:
#
#   evidence-exists-unrecorded (18) — a REAL test exercises this corner case;
#     it is simply not recorded here. These are the cheap ones, and they are
#     deliberately NOT promoted to `rows:` in this commit: a row in this file
#     is CI-enforced traceability, and promoting one demands the same bar wave
#     C set for tier claims — read the test, confirm it asserts THIS corner
#     case and not an adjacent one. Filed as B43. The evidence field names the
#     test so that work is a verification, not a re-derivation.
#   uncovered-in-scope (19) — genuinely untested, and about behaviour this
#     epic shipped or touched. The honest debt.
#   not-this-epic (14) — genuinely untested, belonging to a capability this
#     epic did not build (the hub, federation, offboarding, the dashboard).
#     Cites what the corpus itself says defers it.
#   not-testable-here (3) — the corner case describes a human or process
#     judgment, not product behaviour a test can drive. Says what would have
#     to exist.
#
# A verdict reading "NOT DETERMINED" inside `reason` is a probe declining to
# guess, and is recorded verbatim rather than rounded to a cleaner answer.
uncovered:
  - cc_id: CC-001
    verdict: evidence-exists-unrecorded
    summary: >-
      Malformed frontmatter (broken YAML) must be refused at
      write/merge/flag time.
    evidence: >-
      internal/artifact/frontmatter_test.go:91
      TestParseFrontmatter_malformedYAML asserts ParseFrontmatter returns
      errors.Is(err, ErrMalformedFrontmatter) for unparseable YAML in the
      frontmatter block; internal/validate/engine.go:169-177 wires that
      exact error into malformedFrontmatterViolation() (POL-002,
      CCRef:"CC-001" in policy.go:110). No test drives broken YAML through
      Engine.ValidateDraft end-to-end (only through the artifact-layer parse
      seam directly) — the wiring itself is read, not exercised by a test at
      that outer layer, but the parsing behavior the CC actually turns on
      is.
    reason: >-
      A real, purpose-named Go test exercises exactly the malformed-YAML
      parse failure the CC describes, and the production code that consumes
      it (engine.go) calls the identical function; the only gap is the outer
      ValidateDraft integration test, which is a tier note, not an absence
      of coverage.
