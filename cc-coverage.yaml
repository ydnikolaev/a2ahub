      the ambiguous multi-emitter registry-closure test in
      internal/validate/registry_test.go, which I initially cited but
      reject: two different checkIDForm branches both record REF-001 there,
      so neither is individually pinned).
    reason: >-
      Direct, git-backed CI test whose sole point is ID/placement mismatch →
      REF-001; I opened it and traced the exact assertion.
