# prose-coverage.yaml — the prose-coverage ledger (agent-exchange-2026-08
# spec 13, §3.1/§4 AC5).
#
# Nothing in this repository used to watch for a capability shipping with no
# prose page. A verb could be added, released, and documented nowhere, and
# every gate stayed green — 0.19.10 put six derived-state fields on every
# read surface and no prose page mentioned any of them (spec 13 §1, the
# audit's headline finding). This file plus scripts/check-prose-coverage.sh
# close that hole the same way schemas/loop-phases.yaml closes the loop-step
# one: DECLARE the universe member, GATE the declaration, never let a member
# with no row pass silently.
#
# ## The universe is ASKED OF THE BINARY, not observed or hand-listed
#
# Three kinds of member, all derived by `scripts/check-prose-coverage.sh`
# from the built binary — never typed here:
#
#   cmd:<name>          every `a2a __catalog`  "## Commands" row's own name
#                        (e.g. `cmd:inbox`, `cmd:contract publish` — a
#                        sub-verb's name is "parent sub", matching the
#                        catalog's own space-joined row, per
#                        cmd/a2a/catalog.go's own "a hyphen used to render
#                        seven undispatchable names" history).
#   tool:<name>          every `a2a __catalog` "## MCP tools" row's own name
#                        (e.g. `tool:a2a_read`).
#   field:<surface>:<key> every (surface, key) pair from
#                        `a2a __catalog --surfaces --json` (e.g.
#                        `field:cli-thread:state_since`). See
#                        cmd/a2a/catalog.go's catalogSurfaces() doc comment
#                        for exactly which five surfaces and why.
#
# Why reflection over an observed run (spec 13 §3.1's own evidence, restated
# here because it is why THIS file's shape is what it is): the six
# derived-state fields are `omitempty`/`omitzero` and populate only from the
# event that produced the state (internal/cache/types.go:93,
# internal/cache/mirror.go:605) — the one binary-tier fixture that reads
# inbox asserts an EMPTY array
# (internal/e2e/testdata/t3/inbox_outbox.txtar:7), and a purpose-built
# in-process test recorded its own first run hitting exactly that empty
# result before it had to switch surfaces to see anything
# (internal/e2e/wave33_verify_test.go:353). A fixture-derived universe would
# be green and blind — the exact defect this ledger exists to end.
#
# ## `surfaces:` — closing half of the residual hole
#
# `--surfaces --json` cannot see a newly added SURFACE (a new command
# serializing a new type not yet in cmd/a2a/catalog.go's catalogSurfaces())
# — that function's own doc comment states this. This file's `surfaces:`
# list is the OTHER half of that guard: the gate compares it against the
# binary's own `--surfaces --json` top-level key set, in BOTH directions. A
# surface catalogSurfaces() adds without a matching entry here reds (a
# capability shipping with no ledger row, silently); a stale entry here
# naming a surface the binary no longer emits reds too (so this list cannot
# just accumulate). Between the two — this file's `surfaces:` list and
# cmd/a2a/catalog.go's own doc comment — the hole is STATED, not silently
# open on either side.
surfaces:
  - cli-inbox
  - cli-outbox
  - cli-show
  - cli-thread
  - mcp-item
#
# ## FLAT key set, not a path set — a real blindness, stated rather than
# hidden (the loop-phases.yaml precedent for naming a file's own gap in its
# own header)
#
# internal/skillcoverage.SurfaceKeys (cmd/a2a/catalog.go's own reflection
# helper) returns a per-surface SET of JSON key names, not a set of paths.
# A generic key name reachable at more than one place in a surface's type
# graph — `name` (OperationalItem.Name, TranscriptEventActor.Name,
# TranscriptWorkReport's own Actor.Name), `kind` (TranscriptEventActor.Kind,
# TranscriptArtifact-adjacent Actor.Kind, TranscriptEntry.Kind), `index`
# (TranscriptVerdict.Index), `version` (Envelope's own version field vs.
# TranscriptEvent's event-version) — collapses several DISTINCT meanings
# into ONE universe member. A `covered:`/`declared:` row against one of
# those keys is a claim about the KEY NAME across the whole surface, not
# about one specific occurrence, and this file's own classification below
# treats the ones it touches accordingly (declaring or covering only where
# the same page genuinely addresses every occurrence the key name reaches,
# and leaving the rest of a collapsed name's occurrences uncovered rather
# than claiming more than was checked). Widening this to a path-keyed
# universe would remove the collapse at the cost of a universe roughly an
# order of magnitude larger — a trade for whoever owns this file next, not
# something this wave reaches for unilaterally, matching loop-phases.yaml's
# own "a decision for whoever owns this file next" precedent for its
# 88-vs-84-cell gap.
#
# ## Reading a member's verdict
#
# Every derived universe member MUST appear in exactly one of the two lists
# below, or the gate reds naming it:
#
#   covered:  -> "<skill-relative page>#<anchor text>" — page and anchor
#               BOTH must exist. The anchor is a literal markdown heading
#               (any level, `#` through `######`) whose text, after the
#               leading `#`s and one space are stripped, equals the anchor
#               text byte-for-byte (matched fixed-string, never a regex —
#               `§`, backticks and parens are exactly what this corpus's
#               headings use). The gate does NOT judge whether the heading's
#               CONTENT actually teaches the field — that is this file's own
#               claim, the same limit loop-phases.yaml's header states for
#               its own `covered:` map ("it cannot itself judge whether a
#               covered/empty call was RIGHT").
#   declared: -> a non-blank reason that is STRUCTURAL: the verb is hidden
#               from the user-facing catalogue, the surface is not
#               agent-facing, the field is machine-only/debug-only (backed
#               by the TYPE'S OWN doc comment, not this file's opinion), or
#               the member is a pure alias of an already-covered one. A
#               reason that READS AS A DEFERRAL — "not documented yet",
#               "later", "soon", "pending", "backlog", "TODO", a bare phase
#               or wave id — is REFUSED by the gate, never merely
#               discouraged: see check-prose-coverage.sh's own header for
#               the exact detection rule. This is the class of "exemption"
#               this ledger exists to make impossible to fake.
#
# A member in NEITHER list is a real, undeclared gap, and the gate reds
# naming it by its full `cmd:`/`tool:`/`field:` key.
#
# ## This ledger is authored against the tree as of 2026-08-12, MID-WAVE
#
# A parallel wave (H5, same epic) is writing the missing prose concurrently
# with this file. Several members below are `covered:` because H5's content
# had already landed in the working tree at the moment this file was
# written (the six derived-state fields' own trap sentences, RN-01910-27's
# offline-triage refusal, RN-01910-6/7/25/30/42/44 — all found ALREADY
# PRESENT during this file's own authoring, contrary to this wave's own
# starting assumption that they would still be red). Most `field:` members
# are left with NO entry at all — genuinely uncovered today, not merely
# unchecked — because the prose corpus teaches CONCEPTS in prose, not
# individual wire-field names as headings, and inventing an anchor for a
# claim this file's author could not actually verify would be exactly the
# fabricated-`declared:` failure mode spec 13 §4 AC5 forbids. The lead
# reconciles this file at the wave boundary once H5's remaining pages land;
# see this epic's wave log for the reds this wave reported at hand-off.

schema: prose-coverage/v1

