declared:
  # -- commands: structural exemptions, each backed by a code fact --------
  cmd:__catalog: "hidden, machine-consumed verb — its own hand-typed synopsis in cmd/a2a/catalog.go says so, and it is deliberately absent from main.go's printUsage; an agent never types it"
  cmd:completion: "prints a shell completion script (bash|zsh|fish) — shell integration mechanics, not a2a exchange semantics an agent needs prose for"
  cmd:dashboard: "a pure alias of `html` — cmd/a2a/wire.go registers both names against the identical synopsis (\"render a self-contained local dashboard ... from the cache\"); covered under `html`, cmd:html above"
  cmd:version: "prints the binary version stamp only — no exchange semantics, no flags, nothing an agent could act on wrongly"

  # -- fields: machine/debug-only, backed by the TYPE's own doc comment ---
  field:cli-inbox:reasons: "internal/cache/types.go's own doc comment: \"debuggability, not part of the guaranteed-stable core fields\" — never a claim an agent should read prose for"
  field:cli-outbox:reasons: "internal/cache/types.go's own doc comment: \"debuggability, not part of the guaranteed-stable core fields\" — never a claim an agent should read prose for"
  field:mcp-item:reasons: "internal/cache/types.go's own doc comment: \"debuggability, not part of the guaranteed-stable core fields\" — never a claim an agent should read prose for"
