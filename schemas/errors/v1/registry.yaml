  - code: POL-022
    class: policy
    title: A handoff body's required section carries no content, or its heading is missing
    applies_to: >-
      internal/validate.checkHandoffSections — `handoff` artifacts only. The
      required section list is DERIVED from schemas/templates/v1/handoff.md's
      own body headings, never a hardcoded list, so a section added there is
      enforced the day it lands.
    severity: reject
    mode_scope: v3-pr
    mode_scope_reason: >-
      ADR-011 D3. A merged handoff's body is immutable and no verb rewrites it,
      so at v3-full-repo this rule could only punish. The four handoffs in the
      real getvisa space are exactly that population.
    path_exempt: undriven, counted, and named in the counted debt row dated 2026-08-21 in docs/validator-backlog.md — 50 registered reject codes are driven by no declared conformance path — which holds the full argument. The state is unproven, not known-broken; retiring this row is one line, declare a path that provokes the refusal and delete this waiver.

  - code: POL-023
    class: policy
    title: A contract invites a runtime pin against an operational half it declares absent
    applies_to: >-
      internal/validate.checkOperationalClaim — contract descriptors declaring
      both x_binding.runtime_pinnable and an x_operational entry with
      state: absent. Either declaration alone is silent.
    severity: warning
    mode_scope: both
    mode_scope_reason: >-
      A warning refuses nothing, so ADR-011 D3's "no rule judges immutable
      history" does not bind it — surfacing the smell on a merged descriptor
      costs nobody an edit they cannot make.

  - code: POL-024
    class: policy
    title: A restricted-classification artifact addresses fewer systems than the space's own active participants
    applies_to: >-
      internal/validate.checkClassificationBilateral (classification.go) —
      envelope classification: restricted (base.schema.json), checked
      against the manifest's ACTIVE participants[] via the Resolver's own
      optional ActiveParticipantLister capability. no-silent-yes-2026-08/P3
      stage 2 (spec 03 §8 AC 4/5, plan/10-security.md:60 "the validator
      enforces 'restricted ⇒ bilateral space'", D3: closes a plan-vs-code
      mismatch rather than minting a new maximum-classification key — see
      DECISIONS.md § D3 for the withdrawn key's own name). Fires when the
      space's ACTIVE participants exceed {from} ∪ to — AND, since
      2026-08-27, when the Resolver cannot even enumerate the space's
      ACTIVE participants at all (DECISIONS.md § D9's own capability-miss
      branch, spec 03 §8 AC 13): D9's text asks UNMEASURED to ride
      "alongside an ordinary reject", not to found a second reject code, so
      a capability miss REUSES this same code rather than the wave-1
      POL-025 this stage minted and then retired (see this file's own
      history for that code — deleted 2026-08-27, unreachable through a
      correctly-wired binary the moment it shipped). A capability-miss
      firing of POL-024 is always paired with POL-026 (severity:
      unmeasured), which is what explains WHY the audience could not be
      confirmed; an audience-exceeds firing carries POL-024 alone.
    severity: reject
    mode_scope: v3-pr
    mode_scope_reason: >-
      ADR-011 D3, the SAME argument REF-017/REF-023/POL-022 already make,
      corrected from this row's own first draft (which read the derivation
      as "always current" and missed what it JUDGES): the ARTIFACT carrying
      classification: restricted is the immutable thing, not the
      participant list. A restricted artifact merged into a space before
      this rule existed — or before a third system joined — has no
      in-protocol repair: committed frontmatter cannot be edited, and no
      verb un-shows history to a system that already has it via git. A
      v3-full-repo audit re-judging it could only punish, never let anyone
      fix it, exactly REF-017's own "committed history is immutable and no
      verb retracts a closed exchange."
    reachability_exempt: >-
      reachability debt, DECLARED not closed (no-silent-yes-2026-08/P3
      stage 2, 2026-08-27): this stage's own allowlist grants
      internal/cli/cmd_space.go and three unrelated test files only (the
      D8 sentinel rename) — no internal/cli/**_test.go, internal/mcp/**_
      test.go or internal/e2e/**_test.go file in scope names this code.
      POL-021's own waiver is the precedent for this shape: the gate stays
      green and BLOCKS the next code from joining this list; the debt is
      counted, not hidden.

  - code: POL-026
    class: policy
    title: The restricted-classification bilateral check could not be evaluated (D9)
    applies_to: >-
      internal/validate.checkClassificationBilateral (classification.go) —
      D9's own UNMEASURED half of the capability-miss pair (DECISIONS.md
      § D9, "UNMEASURED is a SEVERITY, not a fourth verdict"), always
      emitted alongside POL-024 (REUSED, not a second reject code minted
      for this branch — see POL-024's own applies_to for the 2026-08-27
      fold of the wave-1 POL-025 literal back into this pair) on the
      identical finding, never alone. Exempt from obligations 1 (prose) and
      4 (driven) BY CLASS — see this registry's own `severity:` field
      comment above; D9 forecloses UNMEASURED ever blocking a write, so it
      is not "a refusal" in either obligation's own sense.
    severity: unmeasured
    mode_scope: both
    mode_scope_reason: >-
      DELIBERATELY NOT suppressed at v3-full-repo, unlike its own POL-024
      pairing (mode_scope: v3-pr) — the same asymmetry POL-017's own
      registry row already documents for REF-017's sibling case ("POL-017
      is DELIBERATELY NOT suppressed: it is a warning (never flips Valid),
      so the full-repo audit still surfaces the smell without refusing
      anything immutable"). POL-026 can never itself block (D9), so keeping
      it visible at v3-full-repo costs nothing an immutable-history concern
      would object to — it surfaces "this could not be checked" as an
      advisory even where the reject half that WOULD have blocked a fresh
      write is correctly suppressed for an already-merged artifact.
    reachability_exempt: >-
      reachability debt, DECLARED not closed (no-silent-yes-2026-08/P3
      stage 2, 2026-08-27): obligation 2 (reachability) carries no
      severity carve-out (only obligations 1 and 4 exempt `unmeasured` BY
      CLASS — see this registry's own `severity:` comment), so this code
      needs its own written waiver even though it can never itself refuse
      anything. No internal/cli/**_test.go,
      internal/mcp/**_test.go or internal/e2e/**_test.go file in this
      stage's own allowlist names it.

  - code: REF-023
    class: referential
    title: verdicts[] does not name every criterion the parent declares
    applies_to: >-
      internal/validate.checkVerdictCompleteness (verdicts.go) — event/v2
      verify/close `verdicts[]`, checked against the resolved parent's
      declared `acceptance_criteria[]` count (ParentCriteriaCounter). Fires
      when the parent declares N>0 criteria and verdicts[] names fewer than
      N distinct, valid criteria (defects-fix-2026-08 P4, docs/inbox/defects/
      04-the-verification-record-defaults-to-empty.md).
    severity: reject
    mode_scope: v3-pr
    mode_scope_reason: >-
      ADR-011 D3. A merged verify/close event is immutable and no verb
      rewrites its verdicts[], so a post-merge audit against it could only
      punish. getvisa's own two verdicts: [] closes (over 7 and 8 declared
      criteria) are exactly that population.
    path_exempt: undriven, counted, and named in the counted debt row dated 2026-08-21 in docs/validator-backlog.md — 50 registered reject codes are driven by no declared conformance path — which holds the full argument. The state is unproven, not known-broken; retiring this row is one line, declare a path that provokes the refusal and delete this waiver.


  - code: REF-024
    class: referential
    emitted_by: internal/space
    title: A response names a delivered package that has not landed
    applies_to: >-
      internal/space.checkResponseDeliversPossession (delivery_possession.go)
      — envelope/v2 response `delivers[]`, resolved entry by entry through
      space.ResolveDataPackage against origin/main at the write funnel's own
      seat (funnel.go's submitPreparedRequest, before any commit/push), so
      BOTH write surfaces inherit it through funnel.Submit. Fires when a
      response announces a data package the space cannot resolve — the
      delivery's payload pull request has not merged yet, or the id is not a
      DP id at all (judge-the-thing-2026-08 P1, fb-20260808-d5740f). A
      response carrying no `delivers[]` is untouched: `delivered` is the
      ordinary result word for a work_request and the declared conformance
      paths use it with no package anywhere near them.
    severity: reject
    mode_scope: v3-pr
    mode_scope_reason: >-
      ADR-011 D3. The payload's landing is a fact about the MOMENT of the
      write: this refusal lives in the write funnel and never runs
      post-merge at all, and a merged response is immutable — no verb
      rewrites its `delivers[]` — so at full-repo the rule could only
      punish. It also could only punish WRONGLY: the package that was
      unlanded at write time is merged by the time any audit reads it.

  - code: REF-025
    class: referential
    title: Artifact id is present in no connected space
    emitted_by: internal/cache
    applies_to: >-
      the ONE cross-space id-resolution rule no-silent-yes-2026-08/P2a moves
      DOWN into internal/cache per ADR-019 — today stated twice, in
      cmd/a2a/wire.go's resolveTargetSpaceRef and internal/mcp/wire.go's
      SpaceOfArtifacts, the latter's own comment citing the former by name
      (the sixth ADR-019 instance, spec 02 §8 AC 8). The CLI copy FALLS BACK
      to cfg.Spaces[0] when no mirror holds `<id>.md`, so an id in the
      SECOND connected space silently resolves to the FIRST and the verb
      reports "artifact not found" — true of the space it reached and false
      of the space that holds the id. This code replaces that phrase: it
      names the id AND the spaces searched, so a refusal says which spaces
      were actually looked in.
    severity: reject
    mode_scope: v3-pr
    mode_scope_reason: >-
      ADR-011 D3. This is a WRITE-TIME resolution refusal — it decides which
      space a verb acts on before anything is authored, and never runs
      post-merge: a merged artifact is by construction in the space that
      holds it, so a full-repo audit has nothing to resolve and could only
      manufacture a failure against content that was correct when written.
    path_exempt: >-
      UNDRIVABLE BY THE HARNESS, not undeclared — and the distinction is this
      code's whole point. REF-025 fires only when an id is in NO connected
      space, which is unreachable below TWO connected spaces: its own
      applies_to scopes the defect to "the SECOND connected space", and
      cmd/a2a/wire.go's resolveTargetSpaceRef bypasses the walk entirely at
      `len(cfg.Spaces) <= 1`. No tier in this repo can connect two spaces —
      internal/livee2e's checkout model connects exactly one (manifest id
      "livee2e") against one hardcoded DefaultRepo, and SystemA/SystemB are
      two PARTICIPANTS inside it, not two spaces. Filed 2026-08-27 in
      docs/backlog.md ("internal/e2e and internal/livee2e can each connect
      exactly ONE space") with the fix named: a second-origin fixture
      capability in internal/e2e/txtar_test.go's Setup.
      This waiver EXISTS RATHER THAN A PATH on purpose. Obligation 4 parses
      Refusal{Code:} LITERALS and never executes the matrix (see
      docs/validator-backlog.md, 2026-08-27), so a declared path naming this
      code would have COUNTED AS DRIVEN while provably never running —
      manufacturing the exact number no-silent-yes-2026-08's own AC-3
      promised not to move, inside the epic whose thesis is that a green
      answer must mean something. Two implementers in a row declined to write
      it. The behaviour is proven at unit tier with watched-failing mutation
      evidence in internal/cache/spaceresolve_test.go and cmd/a2a/wire_test.go;
      what is missing is acceptance-tier coverage, and this row says so rather
      than pretending otherwise. Retiring it is one line once a second space
      is fixture-able.
