# Error-code registry — the-plan §5.5 validation classes.
#
# One entry per code: {code, class, title, applies_to}.
# class in {schema, referential, lifecycle, policy} (§5.5's four validation
# classes). Code format: <CLASS-ABBR>-<3 digits> (SCH-###, REF-###, LFC-###,
# POL-###) — zero-padded, monotonic per class, append-only, never reused
# once a fixture cites it (like CC-### in §12).
#
# This phase (P2) populates schema-class entries ONLY: T1 (§13.1) is
# schema-structural validation. referential/lifecycle/policy rows need
# runtime context this phase's static fixtures don't have — P3 appends them
# to this same file (schemas/errors/v1/registry.yaml is the authored SSOT,
# per spec 02 Open Q2 resolution).
#
# Every code below is cited by >=1 fixture's <name>.expect.yaml sidecar
# under schemas/**/fixtures/invalid/ (AC-201.7: no orphans, no undefined
# citations).
#
# defects-fix-2026-08/P1 adds three more per-entry fields, declared HERE
# rather than beside the Go `Severity:`/mode literals that also carry this
# information — this file already says, two paragraphs up, that it "is the
# authored SSOT... the Go mapper... loads/mirrors it, never leads it." A
# severity or scope that could disagree between two owners is exactly the
# defect scripts/check-error-codes.sh exists to catch, so ONE of the two
# copies has to be authoritative; this is that copy, matching the choice
# already made for {code, class, title, applies_to}.
#
#   severity: reject|warning — MUST agree with the `Severity: Severity*`
#     literal nearest this code's `Code: "..."` in internal/validate/*.go
#     (non-test), scanned in that order; check-error-codes.sh reds on
#     disagreement. Every schema-class code (SCH-*) is uniformly `reject`
#     (internal/validate/schema_class.go:36 hardcodes it for the whole
#     class — there is no per-code literal to disagree with).
#   mode_scope: v3-pr|v3-full-repo|both — which of `validate --ci`'s two
#     invocation modes this code may return a verdict in (ADR-011 D3,
#     docs/decisions.md). `both` is the default; `v3-pr` and
#     `v3-full-repo` name a code deliberately restricted to one (REF-017's
#     write-gate-only scope; REF-020/REF-021's full-repo-only supersession
#     graph, which a PR's partial event slice cannot evaluate at all).
#   mode_scope_reason: required on every `severity: reject` code scoped
#     `both` (T5's third obligation) — ADR-011's own principle is "a rule
#     that can only be satisfied by editing an immutable artifact must not
#     judge immutable history," so a reject code running post-merge needs a
#     stated reason it does NOT retroactively judge content that was valid
#     when written. Absent is not silently accepted: check-error-codes.sh
#     names the code and reds. Several rows below deliberately carry
#     `severity: reject` / `mode_scope: both` with NO reason — codes added
#     to an already-populated corpus after ADR-011's founding incident
#     (agent-exchange-2026-08 P5/P6, space-notify-2026-08 P1), where the
#     retroactive-judgment risk is real and unresolved. That is this
#     phase's own reported gap, not an oversight to quietly patch here.

entries:
  - code: SCH-001
    class: schema
    title: Required field missing
    applies_to: envelope/v1 (all 8 type schemas), event/v1, manifest/v1, consumes/v1
    severity: reject
    mode_scope: both
    mode_scope_reason: >-
      schema-shape checks re-derive from schemas/published-v1.sha256's frozen
      bytes on every run — the same rule set every existing document was
      authored against, so a full-repo re-check cannot manufacture a new
      failure against content that already satisfied it.
    prose_exempt: shipped before ADR-011 D4 (2026-08-12) minted the prose obligation — enforcing it retroactively is D3's own principle ("a rule that can only be satisfied by editing an immutable [decision] must not judge [it retroactively]") turned on this gate's own history; the code needs prose, but check-error-codes.sh is not the forcing function for a pre-existing gap. Tracked as this phase's own reported debt, not silently closed.

