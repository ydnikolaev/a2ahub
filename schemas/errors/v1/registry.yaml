# Error-code registry — the-plan §5.5 validation classes.
#
# One entry per code: {code, class, title, applies_to}.
# class in {schema, referential, lifecycle, policy} (§5.5's four validation
# classes). Code format: <CLASS-ABBR>-<3 digits> (SCH-###, REF-###, LFC-###,
# POL-###) — zero-padded, monotonic per class, append-only, never reused
# once a fixture cites it (like CC-### in §12).
#
# This phase (P2) populates schema-class entries ONLY: T1 (§13.1) is
# schema-structural validation. referential/lifecycle/policy rows need
# runtime context this phase's static fixtures don't have — P3 appends them
# to this same file (schemas/errors/v1/registry.yaml is the authored SSOT,
# per spec 02 Open Q2 resolution).
#
# Every code below is cited by >=1 fixture's <name>.expect.yaml sidecar
# under schemas/**/fixtures/invalid/ (AC-201.7: no orphans, no undefined
# citations).

entries:
  - code: SCH-001
    class: schema
    title: Required field missing
    applies_to: envelope/v1 (all 8 type schemas), event/v1, manifest/v1, consumes/v1

  - code: SCH-002
    class: schema
    title: Value not permitted by its field's closed enum
    applies_to: envelope/v1 category enums, event/v1 transition enum

  - code: SCH-003
    class: schema
    title: Field present that its type's schema forbids
    applies_to: envelope/v1 decision.schema.json (no `category` field per §5.2.1)

  - code: SCH-004
    class: schema
    title: Exchange type's `to` field does not have exactly one entry
    applies_to: envelope/v1 question/work_request/response/handoff schemas (§3.4.3, X class except decision)

  - code: SCH-005
    class: schema
    title: Conditionally-required field missing for the declared category
    applies_to: envelope/v1 work_request.schema.json (contract-change/process-change requires proposed_change + a pinned refs entry), announcement.schema.json (deprecation requires deprecates)

  - code: SCH-006
    class: schema
    title: Value's JSON type does not match the schema's declared type
    applies_to: any schemas/** schema (e.g. consumes/v1 dependencies[].major must be an integer)

  - code: SCH-007
    class: schema
    title: String value fails its schema pattern (ID grammar, semver, ULID)
    applies_to: envelope/v1 id (§3.3 grammar), event/v1 event (ULID), manifest/v1 min_binary_version (semver)

  - code: SCH-008
    class: schema
    title: interim_behavior missing while blocking is false
    applies_to: envelope/v1 requirement.schema.json, work_request.schema.json (§5.2 `interim_behavior` row, CC-011)

  - code: SCH-009
    class: schema
    title: String value is shorter than the schema's minimum length
    applies_to: any schemas/** schema with minLength (including durable actor names)

  - code: SCH-010
    class: schema
    title: Value is outside its declared numeric or string length bound
    applies_to: any schemas/** schema with minimum, maximum, or maxLength (including announcement/v2 durable work fields)

  - code: SCH-011
    class: schema
    title: Array declared unique contains a duplicate entry
    applies_to: any schemas/** schema with uniqueItems (including announcement/v2 work.waiting_on)

  # --- P3 (internal/schema + internal/validate) additions below ---
  # referential/lifecycle/policy rows this phase adds per spec 02 Open Q2
  # resolution and spec 03 §5/§8 row 5 (single registry, no Go-side
  # duplicate). Every code below is emitted by internal/validate
  # (schemas/errors/v1/registry.yaml stays the SSOT; the Go mapper in
  # internal/validate/schema_class.go, referential.go, authz.go,
  # lifecycle.go, policy.go, engine.go loads/mirrors it, never leads it) —
  # cited by internal/validate's own test corpus (golden fixtures +
  # dedicated unit tests), not by schemas/**/fixtures/invalid/ sidecars
  # (that corpus is schema-class only, P2-owned).

  - code: REF-001
    class: referential
    title: Artifact id does not match its filename
    applies_to: internal/artifact.Validate's ErrIDMismatch guard (§3.3, CC-003)

  - code: REF-002
    class: referential
    title: Artifact id's system component does not match its owning section
    applies_to: internal/artifact.Validate's ErrSectionMismatch guard (§3.3/§4.2, CC-003)

  - code: REF-003
    class: referential
    title: A ref/id does not resolve against the local artifact cache
    applies_to: envelope/v1 refs[].ref (§5.7, §3.8, CC-070)

  - code: REF-004
    class: referential
    title: A pinned ref's digest does not match its resolved target
    applies_to: envelope/v1 refs[].ref pinned with `#digest` (§5.7)

  - code: REF-005
    class: referential
    title: "`from` does not match this system's configured own section"
    applies_to: envelope/v1 `from` (§10.3 authz matrix, CC-002; decision-type exempt per §5.2)

  - code: REF-006
    class: referential
    title: "`to` includes an unknown system, or a system marked `left`"
    applies_to: envelope/v1 `to` (§10.3, CC-008)

  - code: REF-007
    class: referential
    title: A ref is unpinned (neither `@version` nor `#digest`) — drift-prone
    applies_to: envelope/v1 refs[].ref (§3.8) — warning severity, not a reject

  - code: REF-008
    class: referential
    title: A digest-pinned ref's target could not be resolved to verify
    applies_to: envelope/v1 refs[].ref pinned with `#digest` but unresolvable (§5.7) — warning, not a reject ("can't verify" ≠ "verified")

  - code: REF-009
    class: referential
    title: Artifact thread differs from its resolvable parent's thread
    applies_to: envelope thread+parent linkage — a resolvable parent cannot be silently forked into another conversation

  - code: REF-010
    class: referential
    title: Thread names no known artifact and is not legally minted by the artifact's own system
    applies_to: envelope thread introduction when a ThreadResolver can prove the thread does not yet exist

  - code: REF-011
    class: referential
    title: A committed artifact's thread or parent linkage changed after merge
    applies_to: V3 base-to-head comparison for immutable thread/parent linkage

  - code: REF-012
    class: referential
    title: A superseding artifact sits on a different thread from its predecessor
    applies_to: supersede linkage — warning severity because a later renegotiation may intentionally open a new conversation

  - code: REF-013
    class: referential
    title: Space manifest authority map is ambiguous or cannot safely grant write authority
    applies_to: space/v1 participants — unique non-empty systems and top-level sections, active participants with owners, one active system per owner login, and left participants granting no authority

  - code: REF-014
    class: referential
    title: Declared contract sidecar cannot be resolved as the exact expected regular file
    applies_to: envelope/v2 contract carried-set V2/V3 validation for missing, unsafe-mode, or digest-mismatched descriptor and sidecar bytes

  - code: REF-016
    class: referential
    title: Work subject or waiting system is invalid in checkpoint context
    applies_to: envelope/v2 work checkpoint V2/V3 validation when subject_ref is not the same thread or a resolved referenced artifact/contract, or a system wait target is absent from current and historical manifests

  - code: REF-017
    class: referential
    title: Body promises bytes it does not carry — an undeclared digest beside a file listing, with nothing attached
    applies_to: >-
      an envelope body that names a `sha256:` token appearing in no
      attachments[].digest, AND enumerates what reads as a file tree, AND whose
      envelope declares no attachment at all. All three, because only the
      conjunction is a checkable claim to carry bytes; a digest named in prose
      alone is a pin and warns as POL-017 (agent-exchange-2026-08/P4 AC1, as
      amended by ADR-011 2026-08-12 after fb-20260812-e6d189). Scope: refuses at
      the write gate (validate / submit / validate --ci on a pull request) and
      returns no verdict in the post-merge full-repo audit, because a rule
      satisfiable only by editing an immutable artifact must not judge history
      that cannot be repaired.

  - code: REF-018
    class: referential
    title: An unmet[] index does not resolve to an entry in the parent's acceptance_criteria
    applies_to: envelope/v2 response `unmet[]` validated against the parent's declared acceptance_criteria — an index naming a criterion that does not exist is worse than prose, because it reads as precise (agent-exchange-2026-08/P6, AC1)

  - code: REF-019
    class: referential
    title: A verdicts[] index does not resolve to an entry in the parent's acceptance_criteria
    applies_to: event/v2 verify/close `verdicts[].index`, validated against the event's subject's declared acceptance_criteria — REF-018's own rule extended from a response's `unmet[]` to a verifier's `verdicts[]` (agent-exchange-2026-08/P6 wave C, AC7, threat-model.md T5)

  - code: REF-020
    class: referential
    title: A supersession predecessor is claimed by more than one successor
    applies_to: internal/validate.CheckSupersessionGraph — the full-repo supersede-event graph (§3.8 "supersession chains MUST be linear", CC-024); V3 full-repo scan only, never V3-pr (a PR diff cannot see the whole graph)

  - code: REF-021
    class: referential
    title: A supersession chain closes back on itself
    applies_to: internal/validate.CheckSupersessionGraph — the full-repo supersede-event graph, including the degenerate self-supersede 1-node case (§3.8, CC-025); V3 full-repo scan only, never V3-pr

  - code: LFC-001
    class: lifecycle
    title: Event encodes an illegal transition for the subject's current folded state
    applies_to: lifecycle events checked pre-write via the fold seam (§3.5 rule 2, §7, CC-020)

  - code: LFC-002
    class: lifecycle
    title: Event's actor is not authorized for the attempted transition
    applies_to: lifecycle events checked pre-write via the fold seam (§3.5 rule 3, §10.3, §7, CC-021)

  - code: LFC-003
    class: lifecycle
    title: Applicable first-party event is missing its producer evaluation receipt
    applies_to: contextual event validation when produced_by is a2a at or above ClaimReceiptFloor and fold.EvaluateCandidate identifies one scalar receipt scope

  - code: LFC-004
    class: lifecycle
    title: A terminal transition closes a parent carrying an unmet criterion with no residue
    applies_to: internal/validate.checkResidue — a close/withdraw/cancel over a parent whose response declared unmet criteria, with no residue naming where each went. Absent is a refusal rather than a default, because both anchor work_requests were closed weeks early with open items in the closing notes, and a week later those items were on no surface (agent-exchange-2026-08/P6, AC8)

  - code: POL-001
    class: policy
    title: Content matches a forbidden secret/credential pattern
    applies_to: full raw artifact content, envelope + body (§10.4, §13.4, CC-010) — G5 override is flagged only, never granted by this engine

  - code: POL-002
    class: policy
    title: Artifact frontmatter is missing or is not valid YAML
    applies_to: any artifact's `---`-delimited frontmatter block (§5.1, D-009, CC-001)

  - code: POL-003
    class: policy
    title: Artifact exceeds the configured size limit
    applies_to: any artifact's raw bytes (bounded-read guard, CC-006)

  - code: POL-004
    class: policy
    title: Artifact is not valid UTF-8
    applies_to: any artifact's raw bytes (CC-007)

  - code: POL-005
    class: policy
    title: Envelope schema version is outside the one-cycle overlap window this binary understands
    applies_to: envelope/v1 `schema` field (§5.4 last bullet, CC-005) — refuse write, read-only + warning

  - code: POL-006
    class: policy
    title: Retire refused, a registered consumer has not acknowledged the deprecation
    applies_to: internal/validate.CheckRetirePrecondition (§5.4/D-022, CC-081/CC-082/CC-086) — `a2a contract retire`, refused locally unless the human-gated override's full precondition set is met

  - code: POL-007
    class: policy
    title: Declared version bump contradicts computed schema compatibility
    applies_to: internal/validate.CheckComputedCompatibility (§5.4b, D-010, CC-080) — a declared minor/patch whose new schema rejects a fixture valid under the prior version

  - code: POL-008
    class: policy
    title: Computed compatibility could not be evaluated against the prior version's baseline
    applies_to: internal/validate.CheckComputedCompatibility (§5.4b, D-010) — an unparseable prior fixture, an uncompilable schema, or an ambiguous fixture->schema mapping; fail-closed per D-B. Deliberately carries NO CC-### — CC-080 is "a breaking change published as a minor", which is POL-007's case; "the baseline is unusable" has no corner case of its own, and the emitting code leaves CCRef empty to say so

  - code: POL-009
    class: policy
    title: Contract publishes no schema, valid fixtures, or invalid fixtures
    applies_to: internal/validate.CheckContractPublishable (§5.3/§5.4b, D-010) — read by `a2a contract publish`, `a2a_contract publish`, and `validate --ci`. Every format must carry the plan's executable positive and negative examples; only deep fixture validation is format-specific, with §5.4b handing non-JSON-Schema semantics to the owner's own CI

  - code: POL-010
    class: policy
    title: Frontmatter value is still the template's own unfilled placeholder
    applies_to: internal/validate.checkUnfilledPlaceholders — V2 (`a2a submit` / `validate --ci`) ONLY, never V1 (`a2a new`/`a2a validate`). Not because V1 is silent on a placeholder — for the six types whose enum field still carries an unreplaced `<a|b|c>` token, V1 already refuses it as SCH-002, the ordinary JSON-Schema enum keyword — but because POL-010 is a submit-time policy about an UNFILLED PLACEHOLDER GENERALLY, including a prose one V1's schema cannot judge at all, such as `expected_response.shape` holding `<what a good answer looks like>` — a schema-valid string with no enum to violate. Fires when a frontmatter scalar, anywhere in the tree (including nested inside a mapping like `expected_response.shape`, or inside a sequence element like `refs[].ref`), matches `^<.*>$` verbatim — the template's own placeholder grammar, anchored at both ends and nothing more. An earlier narrower form additionally banned inner angle brackets and therefore missed every template's own `title` placeholder — the literal `<human/agent-scannable title, <=120 chars>` all eight templates carry, whose inner `<` comes from "<=120" — and any two-span value such as a `refs[].ref` holding `<id>#<digest>`; internal/validate's corpus test now pins the reported path set per type so that gap cannot reopen. The body is never in scope (free prose legitimately carries angle brackets). Accepted cost — a value that is GENUINELY, deliberately exactly `<foo>` is refused too and must be rephrased — this rule cannot distinguish "still a placeholder" from "a real value that happens to look like one". The message names both remedies, because an OPTIONAL field carrying a placeholder remains schema-valid (`needed_by`, `valid_until`, `env_requirements` — internal/schema does not assert `format`); deletion is correct only when that field is genuinely unused. The send loop separately requires an autonomous +1/+2-day `needed_by` on every response-bearing cross-system ask. For a path through a sequence index `--field` cannot reach it at all, so that case names the file edit instead

  - code: POL-012
    class: policy
    title: Required first-party producer stamp is absent or invalid
    applies_to: committed event validation after the authoritative space floor activates ProducerStampFloor, plus malformed a2a produced_by.version claims

  - code: POL-013
    class: policy
    title: Declared contract carried set is invalid
    applies_to: envelope/v2 contract carried-set V2/V3 validation for profile, role, path, media, bounds, exactness and authoritative-floor failures

  - code: POL-014
    class: policy
    title: Declared conformance suite contradicts itself
    applies_to: internal/validate.ValidateContractConformance for suite-inconsistent JSON Schema valid/invalid fixture outcomes; payload nonconformance and unsupported formats remain operation results

  - code: POL-015
    class: policy
    title: Work checkpoint semantics are invalid
    applies_to: envelope/v2 work checkpoint V2/V3 validation for status/attention isolation, UTC validity bounds, immutable owner/sequence context, first-party session, and classification no-downgrade

  - code: POL-016
    class: policy
    title: First-party actor model or session is unsafe or invalid
    applies_to: a2a events at or above ClaimReceiptFloor; model is 1–96 Unicode scalars and session must be a bounded non-secret identifier

  - code: POL-017
    class: policy
    title: Body enumerates what looks like a file tree while no attachment is declared
    applies_to: a heuristic WARNING, never a refusal — only checkable facts refuse, and "this looks like a file tree" is not one (agent-exchange-2026-08/P4, AC7)

  - code: POL-018
    class: policy
    title: Body hand-rolls a `key = value` block naming a field declared on this envelope's own type
    applies_to: internal/validate.checkDeclarationBlock — reject. The forbidden key set is DERIVED per call from schema.EnvelopeFieldPaths(version, typ), never a hardcoded list, so a field added tomorrow is policed the day it ships (agent-exchange-2026-08/P5, AC3/US-4)

  - code: POL-019
    class: policy
    title: The recipient's declared capabilities exclude a delivery mode this submission requires
    applies_to: internal/validate.CheckCapabilityMismatch — reject. Fires only when the recipient's manifest/v1 participants[].capabilities.delivery is DECLARED and does not contain the required mode; a declared set is a checkable fact, which is what separates this from POL-020 (agent-exchange-2026-08/P5, AC5/US-3)

  - code: POL-020
    class: policy
    title: The recipient's capabilities are undeclared, so a required delivery mode cannot be confirmed
    applies_to: >-
      internal/validate.CheckCapabilityMismatch — a WARNING, never a refusal, on
      POL-017's own rule that only checkable facts refuse. Silence is a live
      state, and must read as neither "can receive anything" nor "can receive
      nothing" (agent-exchange-2026-08/P5, AC5/US-3)
