  - code: LFC-005
    class: lifecycle
    title: Supersede's successor does not satisfy the transition's declared precondition
    applies_to: >-
      internal/fold's two decision-supersede rows (table.go — from
      `rejected` and from `approved`), whose §3.4.4 requirement is a
      SPECIFIC actor ("author of the successor" / "new approved decision
      only") and which shipped as `Role: RoleAny` under scenario names that
      said so out loud: `successor-authorship-unverifiable` and
      `new-approved-decision-only-unverifiable`. The protocol GRANTED the
      act because it could not check the precondition —
      no-silent-yes-2026-08/P6 (D7/D9, US-1). Raised by
      internal/validate.checkLifecycle on VerdictUnauthorizedActor for a
      supersede transition, once the successor's caller-resolved facts
      reach the seam.
      REUSED for BOTH branches — the successor resolved and failing the
      precondition, AND the successor not resolvable at all — per POL-024's
      own 2026-08-27 precedent: D9 asks UNMEASURED to ride "alongside an
      ORDINARY reject", not to found a second reject code. The
      unresolvable branch is always paired with LFC-006, which explains WHY
      it could not be judged; the resolved-and-failing branch carries
      LFC-005 alone.
    severity: reject
    mode_scope: v3-pr
    mode_scope_reason: >-
      ADR-011 D3, the same argument POL-024's own row makes. What this rule
      judges is a SUPERSEDE EVENT already committed to history, and no verb
      un-supersedes: a decision retired before this rule existed has no
      in-protocol repair, so a v3-full-repo audit could only punish, never
      let anyone fix it. The pre-write gate is where the refusal can still
      change an outcome.

  - code: LFC-006
    class: lifecycle
    title: The supersede successor's precondition could not be evaluated (D9)
    applies_to: >-
      internal/validate.checkLifecycle (lifecycle.go) — D9's UNMEASURED half
      of the capability-miss pair (DECISIONS.md § D9, "UNMEASURED is a
      SEVERITY, not a fourth verdict"), always emitted ALONGSIDE LFC-005 on
      the identical finding, never alone. Fires when the Resolver cannot
      resolve the successor artifact named by the supersede event's refs at
      all, so the precondition is unevaluated rather than failed.
      D9's own rule states the direction: on fold's two supersede rows
      today's behaviour is a GRANT, so absence must emit a refusal plus
      UNMEASURED — never a pass. Exempt from obligations 1 (prose) and 4
      (driven) BY CLASS, per this registry's own `severity:` field comment
      and check-error-codes.sh's obligation-4 header; D9 forecloses
      UNMEASURED ever blocking a write, so it is not "a refusal" in either
      obligation's own sense.
    severity: unmeasured
    mode_scope: both
    mode_scope_reason: >-
      DELIBERATELY NOT suppressed at v3-full-repo, the same asymmetry
      POL-026's own row records against its POL-024 pairing. LFC-006 can
      never itself block (D9), so keeping it visible in the post-merge audit
      surfaces "this could not be checked" as an advisory even where the
      reject half that WOULD have blocked a fresh write is correctly scoped
      to v3-pr for an already-merged artifact.

