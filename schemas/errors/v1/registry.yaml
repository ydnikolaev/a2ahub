    applies_to: envelope/v1 (all 8 type schemas), event/v1, manifest/v1, consumes/v1
    severity: reject
    mode_scope: both
    mode_scope_reason: >-
      schema-shape checks re-derive from schemas/published-v1.sha256's frozen
      bytes on every run — the same rule set every existing document was
      authored against, so a full-repo re-check cannot manufacture a new
      failure against content that already satisfied it.
    prose_exempt: shipped before ADR-011 D4 (2026-08-12) minted the prose obligation — enforcing it retroactively is D3's own principle ("a rule that can only be satisfied by editing an immutable [decision] must not judge [it retroactively]") turned on this gate's own history; the code needs prose, but check-error-codes.sh is not the forcing function for a pre-existing gap. Tracked as this phase's own reported debt, not silently closed.
    path_exempt: every conformance path submits a well-formed draft by construction, so no declared path provokes a JSON-Schema violation today. NOT exempt by class — obligation 2's by-class argument is about unit-test bypass and does not transfer to path-driving; a path that submitted a malformed draft WOULD trip this code. One member of the counted debt row dated 2026-08-21 in docs/validator-backlog.md — 50 registered reject codes are driven by no declared conformance path — which holds the full argument.

