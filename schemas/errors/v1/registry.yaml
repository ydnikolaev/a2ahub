# Error-code registry — the-plan §5.5 validation classes.
#
# One entry per code: {code, class, title, applies_to}.
# class in {schema, referential, lifecycle, policy} (§5.5's four validation
# classes). Code format: <CLASS-ABBR>-<3 digits> (SCH-###, REF-###, LFC-###,
# POL-###) — zero-padded, monotonic per class, append-only, never reused
# once a fixture cites it (like CC-### in §12).
#
# This phase (P2) populates schema-class entries ONLY: T1 (§13.1) is
# schema-structural validation. referential/lifecycle/policy rows need
# runtime context this phase's static fixtures don't have — P3 appends them
# to this same file (schemas/errors/v1/registry.yaml is the authored SSOT,
# per spec 02 Open Q2 resolution).
#
# Every code below is cited by >=1 fixture's <name>.expect.yaml sidecar
# under schemas/**/fixtures/invalid/ (AC-201.7: no orphans, no undefined
# citations).
#
# defects-fix-2026-08/P1 adds three more per-entry fields, declared HERE
# rather than beside the Go `Severity:`/mode literals that also carry this
# information — this file already says, two paragraphs up, that it "is the
# authored SSOT... the Go mapper... loads/mirrors it, never leads it." A
# severity or scope that could disagree between two owners is exactly the
# defect scripts/check-error-codes.sh exists to catch, so ONE of the two
# copies has to be authoritative; this is that copy, matching the choice
# already made for {code, class, title, applies_to}.
#
#   severity: reject|warning|unmeasured — MUST agree with the `Severity:
#     Severity*` literal nearest this code's `Code: "..."` in
#     internal/validate/*.go (non-test), scanned in that order;
#     check-error-codes.sh reds on disagreement. Every schema-class code
#     (SCH-*) is uniformly `reject` (internal/validate/schema_class.go:36
#     hardcodes it for the whole class — there is no per-code literal to
#     disagree with).
#
#     `unmeasured` is D9's own third value (no-silent-yes-2026-08/P3,
#     DECISIONS.md § D9 — "UNMEASURED is a SEVERITY, not a fourth verdict"),
#     minted 2026-08-27: a code raised when a rule could not be evaluated at
#     all (a capability miss, an unresolvable participant list), carried
#     alongside an ordinary `reject` wherever the unchecked rule would
#     otherwise silently grant. It can never itself flip `valid` to false
#     (internal/validate/result.go's own isReject, flipped from an
#     exclude-list to an allow-list for exactly this reason) and is
#     therefore, DELIBERATELY, out of scope for obligations 1 (prose) and 4
#     (driven) BY CLASS — the same class-level carve-out `warning` already
#     has for both: a rule that can never block is not "a refusal" in either
#     obligation's own sense (obligation 1's own wording is "a reject-
#     severity code ships with prose"; obligation 4's is "a `severity:
#     reject` code is named by a `Refusal{Code:}` literal"). Neither
#     obligation is reworded to say so a second time — this note is the
#     decision, and scripts/check-error-codes.sh's own obligation-1/4
#     header comments cross-reference it rather than duplicating it.
#   mode_scope: v3-pr|v3-full-repo|both — which of `validate --ci`'s two
#     invocation modes this code may return a verdict in (ADR-011 D3,
#     docs/decisions.md). `both` is the default; `v3-pr` and
#     `v3-full-repo` name a code deliberately restricted to one (REF-017's
#     write-gate-only scope; REF-020/REF-021's full-repo-only supersession
#     graph, which a PR's partial event slice cannot evaluate at all).
#   mode_scope_reason: required on every `severity: reject` code scoped
#     `both` (T5's third obligation) — ADR-011's own principle is "a rule
#     that can only be satisfied by editing an immutable artifact must not
#     judge immutable history," so a reject code running post-merge needs a
#     stated reason it does NOT retroactively judge content that was valid
#     when written. Absent is not silently accepted: check-error-codes.sh
#     names the code and reds. Several rows below deliberately carry
#     `severity: reject` / `mode_scope: both` with NO reason — codes added
#     to an already-populated corpus after ADR-011's founding incident
#     (agent-exchange-2026-08 P5/P6, space-notify-2026-08 P1), where the
#     retroactive-judgment risk is real and unresolved. That is this
#     phase's own reported gap, not an oversight to quietly patch here.
#
# judge-the-thing-2026-08/P11 adds ONE more optional per-entry field, in the
# same place and for the same reason as the three above.
#
#   path_exempt (a stated waiver, no fixed vocabulary) — this
#     `severity: reject` code is named by no `Refusal{Code: "..."}` literal
#     inside a conformance path internal/livee2e actually drives, and here
#     is the reason. Required on every undriven reject code:
#     check-error-codes.sh's fourth obligation names the code and reds
#     otherwise, and a blank or whitespace-only value reds exactly like an
#     absent one — silence must not be spellable. It is a WAIVER, never a
#     claim about state: the driven set is derived from the catalogue's own
#     literals, so nothing here asks to be trusted, and a waiver left on a
#     code that HAS since been driven reds as a paid debt.
#
#     50 rows below carry one today, each citing a single counted debt row
#     in docs/validator-backlog.md that holds the full argument (the shape
#     REF-003's own reachability waiver already uses — "a counted debt
#     row... not a silence"). The gate prints that count on every run and it
#     must equal the number of waiver rows in this file, which is what makes
#     it a burn-down anyone can re-derive rather than a number to believe.
#     Retiring one is a one-line commit: declare a path in internal/livee2e
#     that provokes the refusal, then delete the waiver.
#
#     Deliberately spelled without its colon in this header, so that the
#     count above stays exactly the count of REAL waiver rows.

