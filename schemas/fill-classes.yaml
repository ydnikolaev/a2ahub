# fill-classes.yaml — who is allowed to put a value in each schema field.
#
# The rule this table exists to make enforceable: WHAT THE TOOL ESTABLISHES,
# AN AGENT MAY NOT TYPE. A field the environment resolves, or Go code mints,
# is not a field an agent gets to assert — and the defect that motivated the
# whole table is `actor.name`, where an OS username reached a slot meant for a
# detected agent identity and nothing said which one it was.
#
# One row per field path per (family, version, type). The gate over it is in
# internal/schema/fillclasses_test.go and has three parts; this file is the
# declaration the first one reads.
#
# ## The five classes
#
#   TOOL       Go code mints it. No authoring surface may accept it.
#   DETECTED   resolved from the environment. Overridable ONLY with the record
#              saying it was overridden — see P3's D5: the rule is "may not be
#              typed SILENTLY", not "may not be typed".
#   AUTHOR     the agent must supply intent. This is the only class where an
#              empty value is the agent's problem rather than the tool's.
#   CONFIG     the manifest, project config or harness supplies it, with an
#              explicit override available.
#   DEFAULTED  a template or schema default stands unless overridden.
#
# **The fifth class is DEFAULTED, not NEGOTIATED.** Spec 03's §T2 lists
# `NEGOTIATED` and the spec declares itself to be "that matrix made
# enforceable" — but Matrix A (docs/inbox/agent-exchange-review/02-ground.md,
# §"One row per field") defines DEFAULTED, uses it six times, and contains no
# NEGOTIATED anywhere. The source the spec names wins over the spec's own
# summary of it; the amendment is recorded in specs/03-fill-classes.md.
#
# ## Where each row came from, honestly
#
# 34 rows are Matrix A's own classification, each backed there by a file:line
# citation of the code that does the filling. The rest are derived by the
# rules below, and are the ones a later phase should challenge first:
#
#   actor.*            -> DETECTED  (the whole point of the table)
#
# One derived row was CORRECTED by this phase's own test rather than kept:
# Matrix A classifies `envelope/v1/base.actor.session` AUTHOR, and calls it,
# in its own prose, an "UNCLEAR field: typed by hand today, derivable by the
# system, and in fact already derived elsewhere in the same codebase for a
# different feature". Typed-by-hand is the DEFECT, not the classification —
# `agentid.Detect` already resolves the session and the value is thrown away
# before it reaches an envelope. P3's own wave C is what carries it through,
# so the table declares what the field IS (DETECTED) rather than what a
# broken authoring path currently forces.
#   produced_by.*      -> TOOL
#   schema, id, type, created, at, ulid, event, migrated_from, thread, since
#                      -> TOOL      (minted or stamped, never typed)
#   space, from, system -> CONFIG    (resolved from configuration, overridable)
#   everything else    -> AUTHOR
#
# Six derived rows were CORRECTED on 2026-08-08 by a post-phase audit that
# read the writer for each, and they are worth naming because they show what
# a derived row is worth:
#
#   migrated_from (v1)      AUTHOR -> TOOL       v2 already said TOOL; one
#                                                field cannot have two classes
#   thread (v1, v2)         TOOL -> DEFAULTED    cmd_new.go honours --thread and
#                                                mints only when absent
#   priority, blocking (v2) AUTHOR -> DEFAULTED  the v2 templates carry the same
#                                                literals v1's DEFAULTED rows cite
#   event.state (v1, v2)    AUTHOR -> TOOL       lifecycleReceiptState computes it
#                                                from the fold; no flag supplies it
#
# A derived row is a CLAIM, not a finding. P4, P5 and P6 each add fields here
# and should correct any row their own evidence contradicts — that is cheaper
# than re-deriving the classification, and it is why the table is a file
# rather than a convention.
#
# ## Unreachable, deliberately (spec 03 §8 AC5)
#
# An AUTHOR field must be reachable from an authoring surface — a template
# placeholder, or `a2a new --field` — or it carries a reason here instead. The
# gate is internal/schema/fillclasses_reachability_test.go's
# TestEveryAuthorFieldIsReachableOrDeclaredUnreachable, which probes the real
# `internal/template.Render` (the function `a2a new --field` calls), not a
# second copy of its rule. Same grammar as loop-phases.yaml's `empty:` map: a
# key naming the field ("<family>/v<N>/<type>/<field>", the row's own group
# with the field path appended), a value that is the reason, not a label.
#
# This is deliberately measured, not assumed: the gate was run BEFORE this
# list was written and named exactly ten. Both the ten rows and the two
# recurring root causes ("the append pass writes one scalar node, so an
# array/object-typed field it did not already carry is refused" and "no
# shipped template happens to carry this key, so there is no placeholder to
# descend into or hand-edit") are named per row below rather than assumed
# from spec 03's own two-field guess, which undercounted. The map below had
# ELEVEN keys after `envelope/v2/contract.generated_from` joined the ten
# already measured, when the same wave's own `$ref` bug-fix
# (EnvelopeFieldType resolving local `#/$defs/` refs, see that row) stopped
# the field from looking reachable on the strength of a bug and put it
# here instead.
#
# It has TWENTY-ONE now, after `schemas/envelope/v2/contract.schema.json`
# gained `x_binding` (specs/05-declared-nature.md, 2026-08-10 amendment):
# four more of `x_binding`'s own leaves, same family and same reasoning as
# `binding`'s four below — the parent field itself carries no row, because
# `x_binding` is oneOf(the literal `none`, an object of four required
# leaves) and the append pass reaches the sentinel branch: `a2a new contract
# --field x_binding=none` is a real, valid authoring act. Only the long form
# needs a hand-edit, and templates/v2/contract.md carries that block only as
# commented-out (`#`) guidance, in the same register as `generated_from`
# above it — COMMENTED BY DESIGN, for the identical reason this file's
# header already records for `binding`: a live block with placeholder
# booleans (`adoptable`, `runtime_pinnable`) cannot be schema-valid, and a
# live block with real `false` literals would still make every fresh
# contract author a declaration nobody made (P-1).
#
# It was SEVENTEEN before that, after `schemas/templates/v2/work_request.md` shipped
# (specs/04-possession.md §11, 2026-08-10 amendment): three rows fell OUT —
# `envelope/v2/base.acceptance_criteria`, `.expected_response` and
# `.expected_response.shape` were exactly the "contingent, not permanent" row
# this comment used to flag, and the new template is the future v2 template
# that carries them, so they are deleted rather than left stale — and NINE
# joined, in two families.
#
# Five for `attachments` and four of its leaves (`role`, `conforms_to`,
# `verification`, `retention`): the template embeds `attachments:` only as a
# commented-out guidance block (never a live key), by design — `ref`,
# `digest` and `expires_at` are written by `a2a attach` from real bytes at
# attach time, so a placeholder entry would be a fake attachment the author
# would have to notice and delete.
#
# Four for `binding`'s leaves — and NOT for `binding` itself, which this gate
# proved reachable when the row was written on an assumption: the field is
# oneOf(the literal `none`, an object of four required leaves), so the append
# pass reaches the sentinel and `a2a new work_request --field binding=none` is
# a real authoring act. Only the long form needs a hand-edit.
#
# THAT FAMILY IS A REVERSAL WORTH READING BEFORE THE NEXT PERSON RE-DERIVES
# IT. The wave first shipped a LIVE
# `binding:` block, on the reasoning that the field is the reason the template
# forks at all. Two things falsified that in the same run. AC-401.1
# (`internal/cli`'s TestNewDraftsEveryTypeV1Valid — every fresh draft is
# V1-valid on placeholder-only fills) went red on `binding.adoptable` and
# `binding.runtime_pinnable`: both boolean, and no placeholder literal for a
# boolean is schema-valid. And the schema's own text says absence means
# `undeclared`, DISTINCT from a declared `none` (P-1) — so a live block makes
# `a2a new` author a declaration nobody made, which is exactly the defect B3
# closed for enum placeholders, one generation later and one level out. The
# tempting middle (a live block with literal `false` booleans) renders VALID
# and is still both of those faults, so green would have been the wrong test.
# The template forks for `schema: envelope/v2` — which is what unlocks
# `attachments[]` and makes `a2a attach` reachable at all
# (internal/cli/cmd_attach.go refuses any draft that is not v2) — not for a
# live `binding:` key.
#
# `envelope/v2/base.expected_response.by` stays: the new template's
# `expected_response:` block carries `shape`, not `by`, so that one sub-key is
# still reached by neither surface.
#
# `envelope/v1/contract.generated_from` (and its two sub-keys) are commented
# out of templates/v1/contract.md as guidance, not structurally impossible —
# uncommenting the block would make all three reachable as template
# placeholders. Neither is "merely inconvenient" today, though: as shipped,
# nothing reaches either.
unreachable:
  envelope/v2/response/residue: >-
    residue[] is an array of {criterion|criterion_index, carried_to} objects and
    no authoring surface reaches it: --field writes one scalar node and the
    schema refuses it for an array (the same refusal envelope/v1/base/origin
    records), and a live template placeholder would make every fresh response
    author a carried-forward criterion nobody carried (P-1). Unlike unmet and
    blocked_by, which defects-fix-2026-08 P2 gave purpose-built flags, residue
    has none yet — it is written by a successor-aware surface that does not
    exist, and inventing a flag for it before that surface does would be the
    same shape as the schema-with-no-authoring-path this epic exists to end.
  envelope/v2/response/residue[].criterion: >-
    Same as residue above: it is a member of that unreachable array, not a
    separately-addressable field.
  envelope/v2/response/residue[].criterion_index: >-
    Same as residue above.
  envelope/v2/response/residue[].carried_to: >-
    Same as residue above.
  envelope/v1/base/origin: >-
    origin is array-typed on the base schema (envelope/v1/base.schema.json);
    the append pass (internal/template's applyFills) only ever writes one
    yaml.ScalarNode for a --field key absent from the template, which the
    schema refuses for an array. No v1 template embeds an `origin:` key as a
    placeholder either, so neither authoring surface reaches it.
  envelope/v1/base/expected_response.by: >-
    expected_response.shape is a placeholder in three v1 templates (question,
    requirement, work_request), but none of them embeds an
    `expected_response.by` sub-key. --field's dotted-path pass only descends
    into a key the rendered mapping already carries (map-only, no
    key-creation — see internal/template's resolveDottedPath), and the
    top-level append pass only ever creates a new TOP-LEVEL key, never a
    nested one, so a sub-key no template wrote can never be reached.
  envelope/v1/contract/generated_from: >-
    generated_from is object-typed on the v1 contract schema, so the append
    pass's one-scalar-node write is refused for it. templates/v1/contract.md
    carries the shape only as a commented-out (`#`) guidance block, never as
    a live YAML key, so there is no placeholder to hand-edit either.
  envelope/v1/contract/generated_from.tool: >-
    templates/v1/contract.md's `generated_from:` block is commented out, so
    there is no live `generated_from` mapping for --field's dotted-path pass
    to descend into, and the parent object cannot be appended to create one
    (see this table's generated_from row).
  envelope/v1/contract/generated_from.source_digest: >-
    Same cause as generated_from.tool: the parent `generated_from:` block in
    templates/v1/contract.md is commented out, so there is no live key to
    descend into, and the parent object cannot be appended.
  envelope/v2/base/origin: >-
    Same cause as envelope/v1/base.origin: origin is array-typed on the v2
    base schema, the append pass writes one scalar node, and none of the
    three shipped v2 templates (announcement, contract, work_request) embeds
    an `origin:` key.
  envelope/v2/base/expected_response.by: >-
    expected_response.shape is a placeholder in templates/v2/work_request.md
    (P4 wave closing `a2a new work_request` on envelope/v2, carried verbatim
    from the v1 template — specs/04-possession.md §11), but that block does
    not embed a `by:` sub-key, and neither does any other shipped v2
    template. --field's dotted-path pass only descends into a key the
    rendered mapping already carries (map-only, no key-creation — see
    internal/template's resolveDottedPath), so a sub-key no template wrote
    can never be reached.
  envelope/v2/work_request/attachments: >-
    attachments is array-typed on envelope/v2/work_request.schema.json, so
    the append pass's one-scalar-node write (internal/template's applyFills)
    is refused for it exactly as for origin above. templates/v2/work_request.md
    embeds `attachments:` only as a commented-out (`#`) guidance block, never
    as a live YAML key — deliberately: ref/digest/expires_at are written by
    `a2a attach` from real bytes at attach time, so a placeholder entry here
    would be a fake attachment the author would have to notice and delete.
    Neither authoring surface (a template placeholder, or `--field
    attachments=...`) reaches it as a result.
  envelope/v2/work_request/attachments[].role: >-
    Same commented-out block as attachments above, so there is no live
    `attachments:` sequence to descend into. pathPresent's `[]` handling can
    descend into a non-empty rendered sequence's items when one exists (it is
    not a parser limitation), but no sequence is ever rendered here, and
    --field's dotted-path pass never descends into a sequence index at all
    (internal/template's resolveDottedPath doc comment) — so role is
    unreachable by choice, not by parser limitation. `a2a attach` is the
    surface that authors it, from the file being attached.
  envelope/v2/work_request/attachments[].conforms_to: >-
    Same cause as attachments[].role: the parent `attachments:` block in
    templates/v2/work_request.md is commented out, so there is no live
    sequence item to hand-edit and no index for --field to descend into.
    `a2a attach` authors it, from the file being attached.
  envelope/v2/work_request/attachments[].verification: >-
    Same cause as attachments[].role: no live `attachments:` sequence.
    `a2a attach` authors it, from the verdict being asked for.
  envelope/v2/work_request/attachments[].retention: >-
    Same cause as attachments[].role: no live `attachments:` sequence.
    `a2a attach` authors it, from how long the bytes are kept.
  envelope/v2/work_request/binding.artifact_class: >-
    The LONG FORM is not reachable, though the field itself is: `binding` is
    oneOf(the literal `none`, an object of four required leaves), and the
    append pass reaches the sentinel branch — `a2a new work_request --field
    binding=none` is a real, valid authoring act, so `binding` carries no row
    here. The object branch is a different matter: templates/v2/work_request.md
    carries the block only as commented-out (`#`) guidance, in the register
    `proposed_change` and `refs` use one generation over, so --field's
    dotted-path pass (map-only, no key creation — internal/template's
    resolveDottedPath) has no live mapping to descend into and the parent
    cannot be appended to create one. Uncommenting the block reaches all four
    leaves; that is a hand-edit, which is not one of AC5's two mechanisms.
    COMMENTED BY DESIGN — see this file's header for why a live block was
    tried, measured and reversed.
  envelope/v2/work_request/binding.compatibility_status: >-
    Same cause as binding.artifact_class: the parent `binding:` block is
    commented out, so there is no live mapping to descend into.
  envelope/v2/work_request/binding.adoptable: >-
    Same cause as binding.artifact_class: the parent `binding:` block is
    commented out. Boolean-typed, so it is additionally the leaf that proved
    the point — a placeholder literal for it cannot be schema-valid, which is
    how the live-block attempt was caught rather than shipped.
  envelope/v2/work_request/binding.runtime_pinnable: >-
    Same cause as binding.adoptable: the parent `binding:` block is commented
    out, and the field is boolean-typed.
  envelope/v2/contract/generated_from: >-
    Object-typed, so the append pass's one-scalar-node write is refused, and
    templates/v2/contract.md carries no `generated_from:` key to descend into.
    This row is here BECAUSE OF A DEFECT THIS WAVE FIXED, and the sequence is
    worth keeping: the field is declared as {"$ref": "#/$defs/generatedFrom"}
    rather than an inline `type`, and EnvelopeFieldType read only the inline
    key — so it answered "" , the array/object refusal never fired, and
    `--field generated_from=probe` SUCCEEDED, writing a bare scalar into a
    slot the schema declares as an object with required sub-fields. The draft
    then failed at validate, far from the surface that had accepted it.
    EnvelopeFieldType now resolves local `#/$defs/` refs, the refusal fires,
    and the field takes its honest place here. Without that fix this table
    would have recorded it as reachable on the strength of the bug.
  envelope/v2/contract/x_binding.artifact_class: >-
    The LONG FORM is not reachable, though the field itself is: `x_binding`
    is oneOf(the literal `none`, an object of four required leaves), and the
    append pass reaches the sentinel branch — `a2a new contract --field
    x_binding=none` is a real, valid authoring act, so `x_binding` carries no
    row here. The object branch is a different matter: templates/v2/contract.md
    carries the block only as commented-out (`#`) guidance, in the same
    register `generated_from` uses one property above it, so --field's
    dotted-path pass (map-only, no key creation — internal/template's
    resolveDottedPath) has no live mapping to descend into and the parent
    cannot be appended to create one. Uncommenting the block reaches all four
    leaves; that is a hand-edit, which is not one of AC5's two mechanisms.
    COMMENTED BY DESIGN — see this file's header for why a live block was
    tried, measured and reversed for `binding`, the sibling field this one
    mirrors.
  envelope/v2/contract/x_binding.compatibility_status: >-
    Same cause as x_binding.artifact_class: the parent `x_binding:` block is
    commented out, so there is no live mapping to descend into.
  envelope/v2/contract/x_binding.adoptable: >-
    Same cause as x_binding.artifact_class: the parent `x_binding:` block is
    commented out. Boolean-typed, so a placeholder literal for it could never
    have been schema-valid either, exactly as `binding.adoptable` proved for
    work_request.
  envelope/v2/contract/x_binding.runtime_pinnable: >-
    Same cause as x_binding.adoptable: the parent `x_binding:` block is
    commented out, and the field is boolean-typed.
  envelope/v2/contract/x_operational: >-
    P5 2026-08-10 (specs/05-declared-nature.md's AC1 discharge half):
    array-typed, so the append pass's one-scalar-node write (internal/
    template's applyFills) is refused for it exactly as for attachments/
    origin above. templates/v2/contract.md carries `x_operational:` only as
    a commented-out (`#`) guidance block, in the same register as
    `x_binding` one property above it — deliberately: a live block would
    make every fresh contract author a declaration nobody made (P-1, this
    file's own header). Neither authoring surface reaches it as a result.
  envelope/v2/contract/x_operational[].name: >-
    Same cause as x_operational above: no live `x_operational:` sequence to
    descend into. --field's dotted-path pass never descends into a sequence
    index at all (internal/template's resolveDottedPath doc comment), so
    this leaf is unreachable by choice, not by parser limitation. `a2a
    contract activate` names an already-declared item; it does not author
    this leaf.
  envelope/v2/contract/x_operational[].state: >-
    Same cause as x_operational[].name: no live `x_operational:` sequence in
    templates/v2/contract.md to hand-edit or descend into.
  envelope/v2/contract/x_operational[].eta: >-
    Same cause as x_operational[].name: no live `x_operational:` sequence in
    templates/v2/contract.md to hand-edit or descend into.
#
# ## Out of scope, deliberately
#
# Four schema families in the corpus carry no authoring path: nothing renders
# a template for them and no agent fills their fields one at a time. Their
# fields are listed in `out_of_scope` below rather than classified AUTHOR
# wholesale, because calling 62 fields "the agent must supply intent" when no
# agent ever touches them would be coverage without meaning.

schema: fill-classes/v1

out_of_scope:
  - family: release-notes
    reason: authored by a release cutter as a whole document, not filled field by field; its gate is the schema plus roadmap-release-decisions
  - family: known-issues
    reason: a standing operator-maintained list, edited as prose; no template, no --field path
  - family: data-package
    reason: emitted by `a2a data pack` in full; every field is TOOL by construction and no surface offers a fill
  - family: verification-report
    reason: emitted by the verifier; same shape as data-package

fields:
  envelope/v1/base:
