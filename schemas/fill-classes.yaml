    # P4 attachments[]. Wave A classified every leaf AUTHOR by this table's
    # stated default, with a note saying to re-derive once wave D's writer
    # landed. It has, so this is the re-derivation.
    #
    # Three of the seven are established by `a2a attach` from the bytes
    # themselves and an agent typing one would be FABRICATING it, which is
    # the whole line this table draws: `ref` and `digest` are the content
    # address, and `expires_at` is resolved from the retention at attach
    # time (a duration is a recipe; the date is the fact, and only the
    # writer knows the anchor). The other four are what the author actually
    # decides — what this is for, what it conforms to, what verdict is being
    # asked for, and how long it is kept.
    attachments: AUTHOR
    attachments[].ref: TOOL
    attachments[].digest: TOOL
    attachments[].expires_at: TOOL
    attachments[].role: AUTHOR
    attachments[].conforms_to: AUTHOR
    attachments[].verification: AUTHOR
    attachments[].retention: AUTHOR
    # P5 D1/Q2: binding. What an artifact IS and whether it is adoptable or
    # pinnable is intent only the producer holds — nothing mints an
    # artifact_class, a compatibility_status, or an adopt/pin verdict from
    # bytes or the clock the way `a2a attach` mints ref/digest/expires_at
    # above. AUTHOR by this table's stated default; no minting writer exists
    # for any of the five leaves, so unlike attachments[] there is nothing to
    # re-derive once one lands.
    binding: AUTHOR
    binding.artifact_class: AUTHOR
    binding.compatibility_status: AUTHOR
    binding.adoptable: AUTHOR
    binding.runtime_pinnable: AUTHOR
  envelope/v2/response:
    type: TOOL
    id: TOOL
    parent: AUTHOR
    result: AUTHOR
    to: AUTHOR
    # P6 incompleteness fields. None of these five is minted or environment-
