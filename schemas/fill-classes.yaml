    id: TOOL
    type: TOOL
    title: AUTHOR
    space: CONFIG
    from: CONFIG
    to: AUTHOR
    actor: DETECTED
    actor.kind: DETECTED
    actor.name: DETECTED
    actor.model: DETECTED
    actor.session: DETECTED
