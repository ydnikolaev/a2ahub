# Feedback authoring skeleton (v1) — the scaffolded side of the NEGATIVE pair.
# Its twin below is comment-free AND carries a genuinely rewritten `summary`.
# Every reader must still report `summary` — and only `summary` — as differing.

feedback: v1
id: fb-20260819-66ff77 # auto-filled: fb-YYYYMMDD-<6 hex>
kind: bug # bug | feature | docs | friction | protocol
severity: blocker # blocker | major | minor
title: "the reporter's own words, as filed" # 8-80 chars, specific
summary: "The summary the reporter actually filed, which no verdict and no normalization is allowed to rewrite."
context:
    a2a_version: 0.23.0 # auto-filled
    os_arch: darwin/arm64 # auto-filled
    surface: cli
evidence:
    steps:
        - "File the record." # 1-10 concrete repro steps
    expected: "the body is preserved"
    actual: "the body was rewritten"
checks:
    docs_consulted: true
    grounded_in_real_work: true
    not_space_specific: true
    no_sensitive_content: true
    duplicates_checked: true
status: new
