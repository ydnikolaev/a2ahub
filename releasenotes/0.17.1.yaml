schema: release-notes/v1
version: "0.17.1"
released: "2026-07-31"
headline: "The local dashboard now opens complete canonical artifact records instead of summary-only placeholders"
changes:
  - id: RN-01701-1
    kind: fix
    impact: normal
    subject: "Work cards mount their real bodies, envelopes, events and references"
    detail: >
      The local HTML dashboard now resolves every visible incoming and outgoing
      row through the same canonical cache projection as `a2a show`. Selecting a
      work card displays its original Markdown body, schema-owned envelope facts,
      lifecycle events, references, digest and sync state instead of reporting
      that no detail record exists. Space-qualified lookups also keep identical
      artifact IDs in different spaces distinct and deterministic.
    affects: ["a2a html", "artifact details", "multi-space dashboards"]
    action:
      scope: local
      why: >
        Update when 0.17.1 is released to inspect complete artifact details in
        generated dashboards; no space or document migration is required.
      detect:
        - "a2a version"
      run:
        - "a2a update --yes"

  - id: RN-01701-2
    kind: fix
    impact: low
    subject: "Passive dashboard snapshots retain canonical attention and move ownership"
    detail: >
      Dashboard-only inbox and outbox snapshots now carry the existing canonical
      action reasons and whose-move projection without advancing the CLI inbox
      cursor. Approval gates, disputes and other real attention signals therefore
      reach severity badges and overview counts, while routine agent work remains
      outside the narrower human-attention queue. Existing inbox, outbox and show
      JSON contracts remain unchanged.
    affects: ["a2a html", "attention badges", "overview"]
    action:
      scope: none
      why: >
        No configuration or data migration is required.

  - id: RN-01701-3
    kind: feat
    impact: normal
    subject: "The dashboard tells you when there is nothing to see, and a thread that is finished says so"
    detail: >
      Every list and detail pane that can legitimately be empty now renders one
      shared empty state instead of a hollow card, a blank panel or an unrelated
      record borrowed from elsewhere. Overview's detail pane belongs to its own
      queue, so "nothing is waiting on you" no longer sits beside a fully
      rendered document. Thread closure is derived rather than stored: an open
      item whose only remaining affordance is the owner's own escape hatch owes
      nobody a move, so a settled thread reads as settled instead of claiming to
      wait on others forever. Integrity stops being a destination and becomes a
      qualifier at the bottom of Spaces, hidden entirely when there is nothing
      to qualify; the nav slot it frees goes to Docs, which gives the embedded
      documentation corpus the same reading layout the website publishes.
    affects: ["a2a html", "threads", "overview", "spaces", "docs"]
    action:
      scope: none
      why: >
        No configuration or data migration is required.

  - id: RN-01701-4
    kind: feat
    impact: low
    subject: "Versions carries the full changelog, documents open in full, and the Russian interface reads like Russian"
    detail: >
      The Versions view now projects the complete authored release notes from
      the same source the website publishes, with the update-candidate card
      hidden when no candidate exists. Any artifact can be opened as it exists
      on disk — the whole frontmatter as a table plus the verbatim body. On the
      exchange map, Escape and a backdrop click close full width, edge and system
      popovers state their facts in a table rather than a paragraph, and the
      legend holds its layout in both locales. Cyrillic font subsets are embedded,
      so the Russian interface no longer falls back to a system font, and short
      in-place hints explain the protocol vocabulary the screens use.
    affects: ["a2a html", "versions", "exchange map", "ru locale"]
    action:
      scope: none
      why: >
        No configuration or data migration is required.

  - id: RN-01701-5
    kind: feat
    impact: low
    subject: "Dashboard cards, the causal timeline and the Versions surface are legible at a glance"
    detail: >
      Each lifecycle transition on a thread's timeline now carries its own
      colour, document markers are larger than the events between them, and
      clicking a relation focuses the document it names while everything else
      dims. Compact cards show the lifecycle state they were previously silent
      about, every type badge survives both card backgrounds, and compact and
      expanded cards share one header grammar. Work gains a filter by document
      type; Contracts names provider and consumers outright and reads in one
      column. Versions now projects the same surface the published changelog
      does — kind and action filters, copyable detect/run commands, the version
      index and a release timeline. Ages and dates are humanised and localised
      in one place, so a raw Go duration no longer reaches a reader.
    affects: ["a2a html", "threads", "work", "contracts", "versions"]
    action:
      scope: none
      why: >
        No configuration or data migration is required.

  - id: RN-01701-6
    kind: feat
    impact: low
    subject: "The dashboard names each page, speaks the lifecycle in words, and says how current it is"
    detail: >
      Every page heading now carries an icon, Overview is titled Overview and
      states in its description what it used to state in its headline, and its
      counters span the width. Lifecycle transitions reach a Russian reader as
      Russian verbs rather than protocol enums, and the state an author claimed
      is shown as a pill from the one status vocabulary instead of an English
      word in the middle of a sentence. Focusing a document in a thread is
      released by a click on any empty space. A scope with nothing in it shows
      one empty state across the full width instead of two saying the same
      thing. Snapshot freshness moved out of the Overview column into a Space
      health dialog that states the writer floor as the comparison it is —
      what the space requires against the binary you run.
    affects: ["a2a html", "overview", "threads", "contracts", "ru locale"]
    action:
      scope: none
      why: >
        No configuration or data migration is required.

  - id: RN-01701-7
    kind: fix
    impact: low
    subject: "An install with no space connected no longer reads as healthy"
    detail: >
      The dashboard's space-health indicator treated green as its default, so a
      setup with no space connected at all showed the same signal as one where
      every space is current — over a dialog with nothing in it. An unconnected
      scope now takes a neutral indicator and states why it is empty: there is
      nowhere to read from, which is not the same as having nothing to report.
    affects: ["a2a html", "overview"]
    action:
      scope: none
      why: >
        No configuration or data migration is required.

  - id: RN-01701-8
    kind: feat
    impact: low
    subject: "One header line, one scope switcher, one empty state, and Work becomes Exchange"
    detail: >
      The dashboard header listed every connected space as a chip on a second
      row that grew with the number of spaces; scope is now one control that
      stands beside the page it scopes, on the six views where changing it
      changes what is shown, with space freshness at the foot of its own list.
      The Work view is named Exchange, since incoming and outgoing documents in
      flight are an exchange and not a to-do list, and its filters are one
      segmented control (all, incoming, outgoing) plus a type menu that names
      the count behind each type instead of a chip row that wrapped at every
      width; both dropdowns close on Escape or a click outside them. The empty
      state is one component with two container-decided sizes
      rather than four picked per call site, its spark now travels back and
      forth, and a screen with nothing on it shows exactly one of them. Page
      headings are a single block for all nine views, so the air above and
      below a title is the same everywhere. Event lists dropped the event ULIDs
      and artifact digests a reader cannot act on, and the three facts a static
      read deliberately does not check now say so in the reader's own language.
    affects: ["a2a html", "header", "exchange", "empty states", "ru locale"]
    action:
      scope: none
      why: >
        No configuration or data migration is required.

  - id: RN-01701-9
    kind: fix
    impact: low
    subject: "A thread now says whose move it is, by name"
    detail: >
      The thread panel was headed "Whose move" over a sentence explaining how
      the answer is derived, leaving the reader to work the answer out from the
      list below — the one thing the heading existed to save them. It now states
      it: your move, waiting on a named system, or both. The thread list names
      the system too, instead of "waiting on others". Underneath that sat a
      second defect: the demo fixture predates the field that separates "someone
      still owes a move" from "not yet terminal", so decoding it marked every
      open item as owing nothing and the panel rendered with an empty list. Both
      that field and the new list of who is owed are now derived from the facts
      the fixture states rather than trusted to be restated in it. Page
      descriptions were rewritten in each language on its own terms.
    affects: ["a2a html", "threads", "ru locale"]
    action:
      scope: none
      why: >
        No configuration or data migration is required.
