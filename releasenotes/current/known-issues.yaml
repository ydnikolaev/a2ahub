schema: known-issues/v1
issues:
  - id: KI-01900-PROVIDER-TIER-DEFERRED
    kind: known-issue
    impact: normal
    subject: "The current releases shipped with their provider-tier verification deferred, by explicit operator authorization"
    detail: >
      v0.19.0 through v0.19.3 and now v0.19.6 shipped this way, each authorized
      separately for its own candidate, and the count is now machine-refused
      unless the newest record signs for its own position in the streak. Their scenario LOGIC is fully verified: the whole
      catalogue runs locally against a faithful host stand-in over real git
      repositories, and every row that tier may judge passed on the exact
      published candidate. What neither carries is a full live GitHub matrix.
      The rows therefore unverified are the ones only a real provider can
      decide: branch protection blocking a merge until the required check is
      green, enforce_admins binding a participant while skipping an admin, a
      cross-section authorization decision surviving a privileged re-trigger,
      GitHub serving a check computed against a stale ref, a direct push to
      main being refused, the shipped Actions workflow actually running
      `a2a validate --ci`, compound check-run name resolution, a fine-grained
      token's scope non-reporting driving the preflight path, real concurrent
      writes losing nothing, and the space's own CI carrying no unexplained
      failures. The last full matrix that did prove them ran on 2026-08-05,
      against a tree earlier than all five of these releases.
      Read the cost concretely rather than as a formality. v0.19.0 changed the
      contract publication path; v0.19.1 changed the git authentication used by
      every remote call in the write funnel; v0.19.2 and v0.19.3 changed how
      credentials are resolved for reads; v0.19.6 changed `a2a validate --ci`
      itself and the contract publication planner. In every case the deferred
      rows sit over the surfaces that changed — which the runbook names as the
      worst case for this tier, and it was chosen each time with that visible.
      v0.19.6 is the sharpest instance so far: "the shipped Actions workflow
      actually running `a2a validate --ci`" is one of the unproven rows, and
      that command is what this release changed.
      A provider-tier run is scheduled against the newest of these tags, and
      anything it finds ships as a patch release. Five consecutive deferrals
      over the same surfaces is not improving with repetition; the signed count
      in the newest deferral record is the honest measure of how long this has
      been outstanding.
    affects: ["a2a submit", "a2a contract publish", "space mirror", "branch protection", "space CI"]
    action:
      scope: none
      why: >
        Nothing to do. Report anything that misbehaves through `a2a feedback`
        — that channel is what turns a deferred verification into a finding
        rather than a silence.
  - id: KI-MACOS-ADHOC-SIGNING
    kind: known-issue
    impact: normal
    subject: "The macOS companion remains ad-hoc signed and may require manual approval"
    detail: >
      The release cohort authenticates the exact macOS app and ad-hoc signing
      protects its bundle integrity, but the app is not identified or
      notarized through a paid Apple Developer account. A quarantined download
      may require one explicit System Settings → Privacy & Security → Open
      Anyway decision. Interactive Notification Center, Focus, Login Items,
      VS Code trust/profile, and remote-window checks remain release-environment
      evidence rather than claims inferred from hermetic tests.
    affects: ["macOS notifications", "VS Code notifications"]
    action:
      scope: none
      why: >
        Keep Gatekeeper enabled and approve only the A2A Notifier version
        obtained through the verified a2a release cohort.
