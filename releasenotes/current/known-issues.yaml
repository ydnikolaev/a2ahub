schema: known-issues/v1
issues:
  - id: KI-01900-PROVIDER-TIER-DEFERRED
    kind: known-issue
    impact: normal
    subject: "v0.19.0 shipped with its provider-tier verification deferred, by explicit operator authorization"
    detail: >
      This release's scenario LOGIC is fully verified: the whole catalogue runs
      locally against a faithful host stand-in over real git repositories, and
      every row that tier may judge passed on the exact candidate. What it does
      not carry is a full live GitHub matrix, which was deferred deliberately
      because a counterparty was blocked on the contract-publication path this
      release fixes, and waiting was itself the larger risk.
      The rows therefore unverified for this candidate are the ones only a real
      provider can decide: branch protection blocking a merge until the required
      check is green, enforce_admins binding a participant while skipping an
      admin, a cross-section authorization decision surviving a privileged
      re-trigger, GitHub serving a check computed against a stale ref, a direct
      push to main being refused, the shipped Actions workflow actually running
      `a2a validate --ci`, compound check-run name resolution, and the space's
      own CI carrying no unexplained failures. The last full matrix that did
      prove them ran on 2026-08-05 against an EARLIER tree, before this
      release's publication-baseline and fixture corrections.
      A provider-tier run is scheduled against this exact tag, and anything it
      finds ships as a patch release.
    affects: ["a2a submit", "a2a contract publish", "branch protection", "space CI"]
    action:
      scope: none
      why: >
        Nothing to do. Report anything that misbehaves through `a2a feedback`
        — that channel is what turns a deferred verification into a finding
        rather than a silence.
  - id: KI-MACOS-ADHOC-SIGNING
    kind: known-issue
    impact: normal
    subject: "The macOS companion remains ad-hoc signed and may require manual approval"
    detail: >
      The release cohort authenticates the exact macOS app and ad-hoc signing
      protects its bundle integrity, but the app is not identified or
      notarized through a paid Apple Developer account. A quarantined download
      may require one explicit System Settings → Privacy & Security → Open
      Anyway decision. Interactive Notification Center, Focus, Login Items,
      VS Code trust/profile, and remote-window checks remain release-environment
      evidence rather than claims inferred from hermetic tests.
    affects: ["macOS notifications", "VS Code notifications"]
    action:
      scope: none
      why: >
        Keep Gatekeeper enabled and approve only the A2A Notifier version
        obtained through the verified a2a release cohort.
