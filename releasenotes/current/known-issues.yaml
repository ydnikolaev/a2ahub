schema: known-issues/v1
issues:
  - id: KI-01900-PROVIDER-TIER-DEFERRED
    kind: known-issue
    impact: normal
    subject: "The current releases shipped with their provider-tier verification deferred, by explicit operator authorization"
    detail: >
      Every release from v0.19.0 through v0.25.8 shipped this way — TWENTY-SIX
      of them, each authorized separately for its own candidate, and the count is
      machine-refused unless the newest record signs for its own position in the
      streak.

      The number was TEN until 2026-08-13, and the correction is worth stating
      plainly rather than quietly applying: the gate counted deferral RECORDS,
      not releases, so a release that simply omitted the file was invisible to
      the mechanism built to make the streak refusable — and omitting it was
      easier than writing it. Re-keying the gate to releases found three that
      had shipped with no record at all (v0.19.4, v0.19.5, v0.19.11) where one
      was known. Each now carries a retrospective record stating what it is: a
      record of an ABSENCE, carrying no signature, asserting only that no
      decision was written down — never that the tier did not run, which is
      exactly the state no evidence points either way about. Their scenario LOGIC is fully verified: the whole
      catalogue runs locally against a faithful host stand-in over real git
      repositories, and every row that tier may judge passed on the exact
      published candidate. What neither carries is a full live GitHub matrix.
      The rows therefore unverified are the ones only a real provider can
      decide: branch protection blocking a merge until the required check is
      green, enforce_admins binding a participant while skipping an admin, a
      cross-section authorization decision surviving a privileged re-trigger,
      GitHub serving a check computed against a stale ref, a direct push to
      main being refused, the shipped Actions workflow actually running
      `a2a validate --ci`, compound check-run name resolution, a fine-grained
      token's scope non-reporting driving the preflight path, real concurrent
      writes losing nothing, and the space's own CI carrying no unexplained
      failures. The last full matrix that did prove them ran on 2026-08-05,
      against a tree earlier than every one of these twenty-five releases.
      Read the cost concretely rather than as a formality. v0.19.0 changed the
      contract publication path; v0.19.1 changed the git authentication used by
      every remote call in the write funnel; v0.19.2 and v0.19.3 changed how
      credentials are resolved for reads; v0.19.6 changed `a2a validate --ci`
      itself and the contract publication planner. In every case the deferred
      rows sit over the surfaces that changed — which the runbook names as the
      worst case for this tier, and it was chosen each time with that visible.
      v0.19.6 is the sharpest instance so far: "the shipped Actions workflow
      actually running `a2a validate --ci`" is one of the unproven rows, and
      that command is what this release changed. v0.19.9 is the widest: it
      changes how the ACTOR is resolved on every write verb on both the CLI and
      the MCP surface, so what is unproven is the identity recorded by writes
      going through a real provider.
      v0.19.10 is the widest of the nine by a wide margin: it is the whole
      agent-exchange epic, and the surfaces it changes — the write funnel, the
      validator CI runs, the shipped reusable workflow — are exactly the ones
      the unproven rows cover. The delivery-and-verdict loop this release is
      built around has never been driven through a real pull request; it is
      proven against a faithful in-process GitHub double and real local git
      repositories, and never against GitHub itself.
      v0.23.0 and v0.24.0 continue the same shape and are named here rather
      than folded into the count. v0.23.0 changed the write funnel's validation
      on both surfaces — two referential rules moved from the merge check to
      `a2a submit`. v0.24.0 goes further: it adds a refusal AT the funnel seat
      (a response naming a data package that has not landed), adds carried-set
      membership checks at the funnel validator on both surfaces, and rewrites
      the shipped notify workflow's install step to download and verify a signed
      release asset instead of compiling from a module reference. Three of the
      unproven rows sit directly over those changes: a direct push to main being
      refused, the shipped Actions workflow actually running, and the space's own
      CI carrying no unexplained failures. The operator was shown this against
      the diff before authorizing the seventeenth, and chose it knowing that —
      because v0.23.0's notify workflow fails on every space that updated to it,
      and v0.24.0 is the fix, so waiting had its own visible cost.

      v0.25.0 through v0.25.5 are lighter than that worst case, and their
      records say so rather than repeating v0.24.0's framing. v0.25.0 added no
      refusal and moved no floor; v0.25.1 touches no write path at all;
      v0.25.2 restores `a2a update`; v0.25.3 is report-only; **v0.25.4 does not
      change the binary at all** — its whole content is the two reusable
      workflows' own download step — and v0.25.5 is the published website plus
      one dashboard fix.

      **v0.25.6 IS the worst case again, and its record says so instead of
      inheriting the lighter framing above.** It changes both write surfaces and
      the schemas: the legality seam now refuses a supersede it cannot verify
      rather than granting it; a write against an id in a second connected space
      reaches that space; a space whose default branch is not `main` stops being
      pushed to `main` — a change that lands squarely on the write funnel the
      deferred rows sit over; and an MCP call carrying an unknown field is now
      refused rather than silently dropped, which is a BREAKING change for any
      harness that relied on the old silence. The base-branch derivation in
      particular has no live proof at all: no tier in this repository can drive a
      real remote whose default branch is not `main`.
      **v0.25.7 IS the worst case too, and for a second reason v0.25.6 did not
      carry.** It adds a refusal BELOW both write surfaces — a response whose
      envelope schema requires `parent` is now refused by the write funnel
      itself rather than landing as a plain document — so the funnel the
      deferred rows sit over changed again, one release after it last did. It
      refuses a `contract publish` that would silently have taken the landed
      mirror while a staging tree existed, which is the publication path
      v0.19.0's deferral first named. And it changes `a2a validate --ci`: the
      out-of-space refusal is rewritten and `--space <id>` is new. That command
      is verbatim one of the unproven rows — "the shipped Actions workflow
      actually running `a2a validate --ci`" — so for the second time in this
      streak (v0.19.6 was the first) the release changes the exact surface a
      deferred row exists to check.

      Two things bound what that costs. The funnel refusal is derived from the
      envelope schemas' own `required` arrays and is proven against the same
      in-process double and the same real local git repositories every other row
      is; what stays unproven is only whether a REAL provider's merge gate,
      running the v0.25.7 binary the `a2a-ref` default now pins, behaves as the
      local proof says. And the deadline this record itself names has now been
      passed again: `agent-exchange-2026-08` is still `active`, so the tier
      remains unavailable rather than unscheduled, and the release "after it
      closes" is once more not this one.

      What every release still carries on top of that is the sharpest item any of
      them carries: the `a2a-ref` default in the reusable workflows names the tag
      being cut, that IS the binary a space's merge gate runs, and a tag is
      immutable.

      THE REASON CHANGED AT v0.25.8, and saying so is the point of this
      paragraph. Twenty-five records deferred to "the release after
      `agent-exchange-2026-08` closes", because the operator's standing rule
      forbade the real-GitHub tier while that epic was being implemented. **That
      epic closed on 2026-08-29**, so the block is gone and the condition those
      records named is discharged rather than repeated.

      What defers it now is cost and availability, not a rule: the tier needs
      credentials only the operator holds and about an hour of wall clock, and
      it spends real Actions minutes on an account measured that same day at
      2860 equivalent minutes over fifteen days against a 1500/month budget,
      with the spending limit not set. Anything the run finds ships as a patch
      release.

      TWENTY-SIX consecutive deferrals over the same surfaces is not improving
      with repetition, and more than one of them passed a date an earlier record
      had itself named as the deadline; the signed count in the newest deferral
      record is the honest measure of how long this has been outstanding.
    affects: ["a2a submit", "a2a contract publish", "space mirror", "branch protection", "space CI"]
    action:
      scope: none
      why: >
        Nothing to do. Report anything that misbehaves through `a2a feedback`
        — that channel is what turns a deferred verification into a finding
        rather than a silence.
  - id: KI-MACOS-ADHOC-SIGNING
    kind: known-issue
    impact: normal
    subject: "The macOS companion remains ad-hoc signed and may require manual approval"
    detail: >
      The release cohort authenticates the exact macOS app and ad-hoc signing
      protects its bundle integrity, but the app is not identified or
      notarized through a paid Apple Developer account. A quarantined download
      may require one explicit System Settings → Privacy & Security → Open
      Anyway decision. Interactive Notification Center, Focus, Login Items,
      VS Code trust/profile, and remote-window checks remain release-environment
      evidence rather than claims inferred from hermetic tests.
    affects: ["macOS notifications", "VS Code notifications"]
    action:
      scope: none
      why: >
        Keep Gatekeeper enabled and approve only the A2A Notifier version
        obtained through the verified a2a release cohort.
