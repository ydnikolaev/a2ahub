schema: release-notes/v1
version: "0.21.0"
released: "2026-08-13"
headline: "The letterbox comes off the door that gets replaced, and CI stops buying evidence it cannot read"
changes:
  - id: RN-02100-0
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        A report filed by an outside reporter lived on the one branch every
        release overwrites wholesale. Everything downstream — a per-path merge
        rule, a divergence refusal, a 643-line sync, a release-aborting import
        assertion and a preserve pass inside the publisher — existed to stop a
        release from deleting a stranger's bug report.
    impact: high
    subject: "feedback lands on a dedicated branch the publisher never touches"
    detail: >
      Public `main` was two things at once. It was the feedback hub of record —
      the default `a2a feedback submit` target for every shipped binary, with
      status read back over raw.githubusercontent.com against that branch. It
      was also the branch the publisher force-pushes wholesale on every
      release.

      Measured on 2026-08-12, not reasoned about: two open feedback pull
      requests were both MERGEABLE and BEHIND after a publish, both with
      auto-merge armed and neither firing; merging the first put the second
      back into BEHIND. A record submitted after that same publish merged in
      twenty-three seconds. The difference was entirely whether a release
      happened while the record was open.

      Inbound reports now land on `feedback-hub`, an orphan branch of the same
      public repository carrying the corpus and nothing else. The publisher
      touches exactly three refs and has no reason to touch a fourth; branch
      protection makes sure it cannot by accident, and that protection was
      verified by attempting a real force-push and watching it refused.

      The repository does not change, so no binary in the field breaks: only
      the branch moves. The corpus was migrated by COPY, so `main` keeps its
      records for the length of the rollover window, and rollback is repointing
      a constant.
    affects: [feedback]
    action:
      scope: local
      why: "Nothing to run. Reports you filed before this release are still readable at their old address; a current binary files new ones on the hub branch automatically."

  - id: RN-02100-1
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        A blob payload's own frontmatter-bearing file was walked as an envelope
        draft, producing a false "could not be decoded" note and an UNVERIFIED
        visibility verdict — the identical defect that was closed one path over
        for data packages, left open for its twin.
    impact: normal
    subject: "a blob payload is no longer mistaken for a malformed artifact"
    detail: >
      `a2a validate --ci` already carved `<system>/blobs/<BL-id>/…` out of
      artifact discovery. The mirror walk did not, so the same bytes read as a
      broken envelope on the read path while validating cleanly on the write
      path.

      Both readers now ask ONE predicate, `space.BlobForPath`, rather than
      carrying a copy each. The exemption stays scoped to the blob's own
      directory grammar: a genuinely malformed artifact filed elsewhere under
      the same system still reaches discovery and still reds, and a negative
      control test pins that.
    affects: [cli]
    action:
      scope: local
      why: "Update, then re-read: a blob payload that showed as UNVERIFIED will decode."

  - id: RN-02100-2
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        The one diagnostic whose entire job is sending an operator to a failing
        run could not link to it.
    impact: low
    subject: "`a2a doctor` links the failing check run it names"
    detail: >
      GitHub's check-runs API returns `html_url`; the host adapter never
      decoded it, so a `default branch healthy` failure could name the space,
      the branch, the selected check run and its conclusion — good evidence,
      and no link to click.

      The result type now carries the run URL and the doctor row prints it.
      When the provider omits the field the message degrades to exactly what it
      said before, never to an empty link.
    affects: [cli]
    action:
      scope: none
      why: "No action — corrected in the binary."

  - id: RN-02100-3
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        CI ran the ship gate on every push, on every branch, in two
        repositories, while the derivation that prices validation off the
        changed-file set existed, was gated, was measured, and was invoked by
        hand at a terminal. One question, two answers, one of them hard-coded
        in YAML.
    impact: high
    subject: "CI charges what the diff can justify"
    detail: >
      A ten-times-priced macOS runner ran on every push and every pull request
      in both repositories, for about fifty-two seconds of Swift work — 55.3%
      of the measured bill over a twelve-day window, against ZERO commits
      touching the companion it compiles. It is now reachable only from a diff
      that can change its verdict, from a tag, or from one weekly run that
      exists so a filter which silently never fires cannot look like a filter
      that correctly never fires.

      A push now buys the derived lane; the ceiling runs at the ship boundary
      — candidate refs, tags, a nightly schedule and manual dispatch. Pull
      requests keep the ceiling deliberately: moving them would remove
      validating proof from branches that accept external writes, and that is
      gated behind a merge-gate precondition this release does not claim.

      Superseded runs now cancel. A sub-minute gate that billed a whole runner
      minute folds into the job the run already pays for. Pages stops running
      in the repository where Pages is not enabled, where it had failed thirty
      times out of thirty-one.

      Every decision lives in a script with its own self-tests, not in a
      workflow expression: the linter already in the pipeline was measured
      saying nothing at all about a job with no path condition and nothing
      about a missing timeout.
    affects: [ci]
    action:
      scope: none
      why: "A maintainer-side change; nothing to run. A space's own CI is untouched."

  - id: RN-02100-4
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        Two gates were counting the wrong noun and reporting green while the
        thing they exist to catch went past them.
    impact: normal
    subject: "the release-evidence gate counts releases, and the spend is a command"
    detail: >
      The provider-tier gate counted deferral RECORDS, so a release that
      simply omitted the file was invisible to the mechanism built to make
      the streak refusable — and omitting it was easier than writing it.
      Re-keyed to releases, it found three releases that had shipped with
      neither a deferral record nor live-e2e evidence where one was known.

      The CI spend is now re-derivable by one command, replayed offline
      against a persisted raw join rather than re-fetched. Its first act was
      to falsify two claims this project had written down about its own
      billing the day before.

      Re-keying that gate also exposed a defect in the direction nobody was
      watching. It ships to the published projection, but the evidence it
      judges is stripped there — so while it counted records it reported a
      confident "0 outstanding" about a streak it could not see, and counting
      releases would have turned that same blindness into a failure on every
      published candidate. It now declines when its inputs are absent, and
      says which ones.
    affects: [ci]
    action:
      scope: none
      why: "A maintainer-side gate; nothing to run."

  - id: RN-02100-5
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        A gate that walks the tree must not be able to run a job unbounded or
        under-scoped, and a hand-verified invariant is a gate nobody has
        written yet.
    impact: normal
    subject: "a new gate refuses the next ungated expensive runner"
    detail: >
      Every job in every workflow must declare a timeout, sized at or above
      1.5x its measured p99 from a committed artefact and under a
      sixty-minute cap, and a job on a non-ubuntu runner must be reachable
      only through a condition on what the diff touched.

      It caught a real under-scoped timeout on its first run against the
      tree it was written for.
    affects: [ci]
    action:
      scope: none
      why: "A maintainer-side gate; nothing to run."
