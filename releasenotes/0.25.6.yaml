schema: release-notes/v1
version: 0.25.6
released: "2026-08-28"
headline: the tool stops saying yes to what it cannot check
changes:
- id: RN-02506-0
  kind: fix
  impact: high
  subject: a supersede by an unapproved successor is refused instead of granted
  detail: >
    Superseding an `approved` or `rejected` decision was permitted to any member
    of the space. The protocol requires a specific actor — the author of the
    successor, or a successor that is itself approved — and the tool granted the
    act BECAUSE it could not check that requirement, in a lifecycle table row
    whose own scenario name said so out loud.

    The seam now receives the successor's own facts. An unapproved successor is
    refused with `LFC-005`, naming what would make the supersede legal. A
    successor that cannot be resolved at all is refused with `LFC-005` AND
    carries `LFC-006` at severity `unmeasured` — "could not check", never a
    silent pass and never an ordinary failure.

    Both write surfaces behave identically and produce the same refusal text,
    now compared byte-for-byte rather than by substring.
  affects:
  - cli
  - mcp
  action:
    scope: none
    why: >
      Measured before the change: zero supersede events exist across every live
      space mirror, against a denominator of zero decision artifacts. Nothing in
      any known space is affected. A supersede that would now be refused was
      never a supersede anyone performed.
- id: RN-02506-1
  kind: fix
  impact: high
  subject: a write against an id in another connected space reaches that space
  detail: >
    With two or more connected spaces, a verb whose target id lived in the SECOND
    space silently acted on the FIRST, and reported "artifact not found" — true
    of the space it reached, false of the space that holds the id.

    Resolution now walks the connected spaces and acts on the one that holds the
    id. An id in none of them is refused with `REF-025`, naming the id AND every
    space searched, so the message says where the tool actually looked.

    Contract ids and data-package ids are committed at paths this walk cannot
    match and are deliberately routed around it rather than newly refused; that
    they resolve to the first space in a multi-space project is a separate,
    pre-existing gap and is not fixed here.
  affects:
  - cli
  - mcp
  action:
    scope: none
    why: >
      A single-space project behaves exactly as before. Nothing to migrate.
- id: RN-02506-2
  kind: fix
  impact: normal
  subject: three labels the documents already declared are now actually checked
  detail: >
    `format: date` and `format: date-time` were declared on envelope fields and
    never asserted, so `needed_by: "next tuesday"` validated clean. It is now
    refused with `SCH-012`.

    `classification: restricted` promised a bilateral audience and nothing
    enforced it; an artifact addressing fewer systems than the space's active
    participants is refused with `POL-024`, and a resolver that cannot enumerate
    them emits `POL-026` at severity `unmeasured` alongside — the audience is
    reported as unconfirmed, never as confirmed.

    The space scaffolder's placeholder is exempted by VALUE rather than by field,
    so an unedited template still validates while a real placeholder left in a
    submitted document does not.
  affects:
  - cli
  - mcp
  - schemas
  action:
    scope: local
    why: >
      A draft carrying a malformed date, or a restricted artifact addressing too
      few systems, will now be refused at submit where it previously passed. Fix
      the field the refusal names.
    detect:
    - a2a validate
- id: RN-02506-3
  kind: fix
  impact: normal
  subject: '`a2a attach` no longer rewrites a date it was not asked to touch'
  detail: >
    Attaching a document round-tripped the whole frontmatter through a generic
    decode. An unquoted `needed_by: 2026-12-31` came back as
    `2026-12-31T00:00:00Z` — a value the field's own declared format rejects —
    and every other key was reordered alphabetically.

    The frontmatter is now edited in place: the attached entry is added and
    nothing else moves. Both the value and the key order are pinned by a test.
  affects:
  - cli
  action:
    scope: local
    why: >
      A document already rewritten by an earlier `a2a attach` carries a widened
      date and reordered keys. Re-editing the field by hand is enough; nothing
      re-writes it for you.
- id: RN-02506-4
  kind: fix
  impact: high
  subject: a space whose default branch is not `main` is no longer pushed to `main`
  detail: >
    Every space operation that needed a branch used the literal `main`. A space
    whose remote publishes `master`, `trunk`, or anything else was written to a
    branch nobody reads — or refused by the remote — and nothing said why.

    The branch is now DERIVED from the mirror's own `refs/remotes/origin/HEAD`,
    so the tool pushes where the remote says its default is. No manifest key was
    added: the answer already existed in the mirror and was being ignored.

    A remote that publishes no HEAD at all is refused with `REF-026` rather than
    falling back to a guess. `a2a doctor` names the branch it will push to
    before any write is attempted, and says `base branch could not be
    determined (checked "main")` when it cannot — a report, never an assertion.
  affects:
  - cli
  - mcp
  action:
    scope: none
    why: >
      A space whose default branch IS `main` behaves exactly as before. A space
      on another default branch starts working where it previously did not.
    detect:
    - a2a doctor
- id: RN-02506-5
  kind: break
  impact: high
  subject: an MCP tool call carrying an unknown field is refused instead of silently dropping it
  detail: >
    Of roughly thirty places the MCP surface decoded a tool's arguments, two
    refused an unrecognised key and the rest dropped it. A call misspelling
    `expect_pack` as `expectPack` therefore SUCCEEDED, having done less than it
    was asked — the success said nothing about whether the request was honoured.

    Every decode site now refuses an unknown field through one shared helper,
    naming the key, and every published tool schema carries
    `additionalProperties: false` so a client can see the rule before tripping
    it. The two guarantees are different — one closes the wire, the other tells
    the client — and shipping only one leaves the other surface silent.

    Two related corrections ride along. Every property of every tool now carries
    a description, so a field's meaning is read from the tool's own schema
    rather than inferred from a CLI flag that sometimes differs. And
    `a2a_exchange` WITHDRAWS the `refs` property no handler ever read; it was
    advertised and dropped, which is the same defect in its purest form.
  affects:
  - mcp
  action:
    scope: local
    why: >
      A harness that relied on extra fields being ignored now gets an error
      naming the field. That is the point of the change, but it is a behaviour
      change: a new field must ship in the binary before a client may send it,
      so client rollout couples to `min_binary_version`.
    detect:
    - tools/list
- id: RN-02506-6
  kind: feat
  impact: normal
  subject: a contract can declare its keying rule, its guarantees and where its machine schema lives
  roadmap:
    visibility: shipped
    why: >
      A consumer integrating against a contract has to know three things the
      contract could not say: which fields key a record, what the producer
      guarantees, and where the machine schema lives. All three lived in
      free-text prose, so a consumer inferred them and nothing could check the
      inference — and mis-keying is the one that corrupts data silently rather
      than failing loudly. This is a capability an integrator chooses a tool
      for, not an internal correction, so it belongs on the public roadmap as
      shipped. The `to: all` half belongs with it for the opposite reason: it
      already worked, an external consumer filed a breaking-change request for
      it in July 2026 because nothing said so, and the roadmap saying it ships
      is part of the fix.
  detail: >
    Three facts a consumer needs in order to consume a contract correctly could
    only be written as prose, so nothing could check them and a reader had to
    infer them. They are declared fields now:

    `x_identity` states the producer's own keying rule — which fields key a
    record, and whether a redelivery upserts or appends. This is the
    consequential one: a consumer that mis-keys silently accumulates duplicates
    and nothing anywhere refuses it.

    `x_guarantees` is a closed vocabulary of checkable promises the producer
    makes about its own data. `x_schema_location` names where the machine schema
    lives, which until now was a prose convention automation had to guess.

    Each refuses a malformed value by name, and each says in its own description
    that ABSENT reads as *undeclared* — never as a default, and never as "no
    guarantees made". That reading belongs to the consumer, not to the schema.

    A contract may also be addressed `to: all`. It always could; the
    documentation said otherwise, and an external consumer filed a
    breaking-change request in July 2026 for a capability that already shipped.
    The rule is now stated where an author reads it, and the exchange types that
    genuinely must address exactly one system still refuse `all`.

    All three fields, and the `to: all` rule, are carried as commented guidance
    in the contract template `a2a new contract` scaffolds — so an author meets
    them while writing the descriptor rather than by finding a reference page.
    `x_schema_location` is a plain string and can be set at authoring time with
    `--field`; the other two are an object and an array, so they are filled by
    uncommenting the block.
  affects:
  - schemas
  - cli
  - mcp
  action:
    scope: none
    why: >
      Every field is optional and every existing contract stays valid. Nothing
      to migrate: a contract that declares none of them reads exactly as it did
      before, which is `undeclared` rather than any default.
