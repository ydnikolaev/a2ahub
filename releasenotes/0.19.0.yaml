schema: release-notes/v1
version: "0.19.0"
released: "2026-08-05"
headline: "A2A shows the work behind an exchange and makes every contract version reproducible"
changes:
  - id: RN-01900-0
    kind: feat
    roadmap:
      visibility: shipped
      why: "Reported work and the operational timeline are the user-facing answer to who is working, waiting or blocked now."
    impact: high
    subject: "The dashboard distinguishes completed exchanges from work that is still happening"
    detail: >
      Agents can record durable work checkpoints and keep a short machine-local
      lease while they are active. Overview folds those facts into a separate
      operational timeline without changing the attention queue: one process
      can show several simultaneous actors, what each one is doing, who or what
      they are waiting for, and whether the last evidence is current, stale or
      unknown. Static HTML and the loopback server consume the same canonical
      snapshot, so a closed thread is no longer misreported as proof that all
      implementation work stopped. Missing reports remain visibly unknown
      instead of being rounded down to inactivity.
    affects: ["a2a work", "a2a html", "a2a dashboard", "a2a serve", "Overview", "MCP"]
    action:
      scope: local
      why: >
        Update the binary and installed skill before agents begin reporting
        work; existing exchange history remains readable and needs no rewrite.
      detect:
        - "a2a version"
      run:
        - "a2a update --yes"

  - id: RN-01900-1
    kind: feat
    roadmap:
      visibility: shipped
      why: "The contract confidence loop turns a contract release into an exact, inspectable and reproducible version."
    impact: high
    subject: "A contract version can be preflighted, published, recovered, materialized and checked from one immutable plan"
    detail: >
      Contract publication now freezes one bounded candidate, finalizes its
      descriptor before hashing, records the exact carried set and digest
      profile, and uses the same plan for preflight and publish. Historical
      resolution identifies the unique version-establishing commit, including
      retired versions; materialize reproduces those verified bytes without
      overwriting divergent local work; check runs the declared self-suite or a
      payload against that exact version offline. CLI and MCP share the same
      services, multi-space requests fail closed when ambiguous, and interrupted
      writes resume the same operation instead of silently creating a new
      version or pull request. Fresh JSON-Schema contract authoring now creates
      one complete declared-v2 staging candidate — descriptor, schema and
      fixtures — so its first preflight and publication use the same real agent
      workflow instead of requiring a hand-assembled descriptor.
    affects: ["a2a contract new", "a2a contract preflight", "a2a contract publish", "a2a contract materialize", "a2a contract check", "a2a_contract", "contract/v2", "event/v2"]
    action:
      scope: local
      why: >
        Update the binary before publishing with the v2 carried-set profile.
        Existing v1 history remains readable and does not need migration.
      detect:
        - "a2a version"
      run:
        - "a2a update --yes"

  - id: RN-01900-2
    kind: fix
    impact: high
    subject: "Partial GitHub writes preserve enough evidence to repair the same operation safely"
    detail: >
      Every post-push outcome now retains the remote stage, branch, tree and pull
      request reference that actually exist. Retry first proves that evidence
      and repairs the same head or pull request; it does not report a generic
      failure that tempts an agent to submit a duplicate. Publication recovery
      also returns the exact recomputed plan, and the caller-observed space
      writer floor is required and revalidated after refresh instead of trusting
      a missing or stale authoring decision.
    affects: ["shared write funnel", "GitHub recovery", "contract publish", "CLI", "MCP"]
    action:
      scope: none
      why: >
        Recovery and result-shape corrections apply automatically to new writes.

  - id: RN-01900-3
    kind: fix
    impact: normal
    subject: "Producer claims, protocol status and current work no longer collapse into one misleading state"
    detail: >
      Applicable first-party events carry evaluator-owned receipt and provenance
      evidence, and mismatches remain diagnostic facts rather than a second
      editable state. The operational projection ignores lifecycle escape
      hatches that owe nobody a move, synchronizes cache refresh with concurrent
      server rendering, and keeps protocol completion separate from reported
      implementation activity. CLI, MCP, static HTML and server reads therefore
      agree on what was committed and on what is merely unknown locally.
      Work-checkpoint validation now treats the absent producer stamp as pending
      only inside the funnel's internal V2 candidate phase, then revalidates the
      stamped final bytes in full before any write; malformed, caller-supplied or
      final missing stamps still fail closed.
    affects: ["event validation", "receipt evidence", "operational projection", "cache refresh", "SSE"]
    action:
      scope: none
      why: >
        The corrected folds and projections are rebuilt from existing Git history.

  - id: RN-01900-6
    kind: fix
    impact: normal
    subject: "A local server whose refresh is failing no longer looks healthy"
    detail: >
      `a2a serve` keeps answering from the last good snapshot when its
      background refresh fails, which is the right thing to do — but it used to
      do it silently, so a reader could not tell live data from data that
      stopped updating an hour ago. Every affected response now carries an
      `X-A2A-Stale` header naming the reason, and the terminal running the
      server gets one line when the refresh starts failing and one when it
      recovers, never one per refresh. The snapshot document itself is
      unchanged: what is stale is the server's own copy, not a fact about the
      spaces it projects.
    affects: ["a2a serve", "local dashboard", "operational snapshot"]
    action:
      scope: none
      why: >
        A healthy server behaves and responds exactly as before.

  - id: RN-01900-5
    kind: fix
    impact: normal
    subject: "Publishing a breaking change under a compatible version number is refused where you typed it"
    detail: >
      `a2a contract publish` now refuses, before it writes anything, when the
      publication it planned contradicts itself — a minor or patch version
      declared over content that breaks the existing fixtures. The refusal
      names the policy code, the exact file and the reason, so the next move is
      readable from the failed command. Previously the command exited
      successfully and opened a pull request, and the contradiction only
      surfaced as a red merge gate minutes later; the merge gate still runs the
      same checks, so nothing incompatible ever reached the shared branch, but
      an agent had already moved on by then and left a branch and a pull
      request behind. The refusal keys on the publication's own violations, not
      on its review gate, so a first publish and an honest major bump are
      unaffected, and recovery of an already-published contract is never
      blocked by a finding its own publication carries.
      A refused publication plan now also names each issue's rule, file and
      detail instead of reporting how many issues there were, so a refusal can
      be acted on from the message alone.
    affects: ["a2a contract publish", "contract compatibility", "agent feedback loop"]
    action:
      scope: none
      why: >
        A publication that was already correct behaves identically; one that
        contradicted its own version number now fails at the command instead of
        at the merge gate.

  - id: RN-01900-8
    kind: fix
    impact: high
    subject: "A contract's first publication is resolvable again"
    detail: >
      A contract drafted from the shipped template carried `version: 1.0.0`
      before it was published anything. Publishing 1.0.0 then wrote a
      descriptor identical to the one already on the branch, so the
      publication's own commit carried nothing but its event — and a version
      is resolvable only from the commit where the descriptor's version
      changes. The publication succeeded, opened a pull request and merged,
      and the contract was unresolvable from that moment: materializing that
      version failed, and so did every later version, which has to resolve
      the first one as its compatibility baseline. Nothing said so at the
      time.
      A drafted contract now starts at `0.0.0`, which is what an unpublished
      contract has always meant everywhere else in the product, and
      publishing sets the real version. Where a descriptor was already
      authored at the version being published, `a2a contract publish` refuses
      before it writes, naming the contract, the version and what to change,
      instead of landing a publication that can never be read back. That
      refusal is what covers a contract drafted before this release, and a
      contract rendered from the frozen v1 template, which still carries
      1.0.0 and cannot be changed without breaking the reproducibility of
      everything already published under it.
      The template's note on that field states who owns it rather than what
      state it is in, because publishing rewrites the value and leaves the
      comment: anything phrased as "unpublished" would have shipped inside
      every published descriptor, contradicting the version beside it.
    affects: ["a2a contract publish", "a2a contract materialize", "a2a new", "contract templates"]
    action:
      scope: local
      why: >
        Contracts drafted with an earlier binary still read `version: 1.0.0`.
        Publishing one is now refused rather than silently broken: set the
        descriptor's version to 0.0.0 in a follow-up submit, then publish.
        Contracts already published correctly are unaffected.
      detect:
        - "a2a contract preflight <XC-id> --version 1.0.0"
      run:
        - "a2a update --yes"

  - id: RN-01900-4
    kind: fix
    impact: normal
    subject: "Stale-binary and repository-health diagnostics now point to the exact repair"
    detail: >
      A write refused by the space floor names both the running and required
      versions and tells the agent to update a2a. Repository health no longer
      mistakes the checkout README for a malformed exchange artifact, while
      cleanup retries confirm that an already-removed remote branch is truly
      absent before reporting success. The release live harness follows the
      same canonical work result, latest-report projection and full
      materialize-edit-publish contract flow as real agents, so candidate
      evidence exercises the shipped flows rather than a test-only
      approximation. Its local-server proof also runs the real bounded sync
      cadence and filters SSE keepalives from semantic revision events; it now
      bounds only the read rather than the whole event request, so the pull
      requests it lands mid-scenario can no longer expire the stream and
      discard the buffered revision it exists to observe, and its conformance
      proof accepts the whole-document JSON pointer that a root-level schema
      violation legitimately carries. Every live run now retains its rendered
      report next to the evidence it produced, so a verdict is readable after
      the session that produced it ends rather than only in that session's
      terminal. The harness also shuts its local server down at the row that
      started it, restores a repository setting it borrowed on every exit path,
      and reads a write-free proof as "nothing appeared" rather than "the set
      is identical", so provider housekeeping can no longer be reported as a
      write the release did not make.
    affects: ["write preflight", "a2a doctor", "cache visibility", "GitHub cleanup", "release live E2E"]
    action:
      scope: none
      why: >
        The corrected diagnostics and repository classification apply
        automatically after updating the binary.

  - id: RN-01900-7
    kind: feat
    roadmap:
      visibility: shipped
      why: "A contract is only worth publishing if data can actually be delivered against it and judged; this closes that loop."
    impact: high
    subject: "Data can be packed against an exact contract version, delivered, fetched and judged, and a failed attempt superseded"
    detail: >
      Two agent-run projects can now complete the whole request, work,
      delivery, verdict and retry cycle over one private exchange space, with
      every verdict bound to the exact bytes it judged. A producer packs a
      result against a pinned contract version offline and learns it is wrong
      before anything reaches the shared space: an entry that does not match
      the contract's schema refuses the whole pack and names the file, and the
      record inside it when the payload is line-delimited. Delivery lands the
      payload, its manifest and the handoff that carries them in a single
      commit through the existing write funnel, so nothing about the exchange
      lifecycle changes and no new document type appears. A consumer fetches
      with every entry's digest re-proven before a single byte is written,
      re-runs the contract's own conformance checks against what actually
      arrived, and writes a structured report whose verdict is derived from
      its checks rather than authored. A failed attempt is superseded by a new
      immutable one, and what failed and why stays readable. Deliveries and
      their verdicts appear in the thread under the handoff that carries them,
      with an unverified delivery visibly distinct from a passed one.
      Recording a verdict is its own step: verifying judges and prints, and
      asking it to record writes the report and the lifecycle transition
      together, in the direction the report itself derived — there is no flag
      that lets a caller declare a pass over a failing report.
      The loop was proven end to end between two parties before release, and
      that proof is what found and closed the defects that would otherwise
      have reached the first real exchange: verification could not resolve
      the contract of any package packing had produced, delivery refused
      every real manifest, and a contract published under the older digest
      profile reported having no schemas at all. Packing now defaults an
      attempt's lifetime to a week and refuses a non-positive one, so an
      attempt is never minted already expired; it prints the staged path and
      the exact next command rather than leaving it to be reconstructed; and
      delivery refuses a supersession flag that belongs to packing instead of
      accepting it and doing nothing with it. Deliveries and their verdicts
      reach the dashboard through the same projection the rest of a thread
      is built from, with a delivery nobody has judged yet rendered as
      exactly that rather than as one that passed. The thread names the
      group as data, names each deliverable rather than labelling it only by
      an opaque package id, and gives every failing check its own row — the
      file, the record it is aimed at, and the rule in words — so a reader
      can see what to fix without decoding a line of identifiers. A package
      the local mirror cannot resolve says so as its own state, in the colour
      of something unseen rather than something failed.
      The loop is reachable from both surfaces. The MCP tool was specified,
      catalogued and schema-complete while having no backend at all — every
      call refused as unconfigured — so an agent on a tool-calling harness
      could not run the loop the documentation described. It now runs the
      same production core the CLI does, selects a space explicitly and
      refuses an ambiguous one rather than choosing. Its verify input is the
      same record switch the CLI has, never a caller-supplied verdict: the
      earlier schema would have let a tool call declare a pass, which is the
      one thing this loop exists to make unrepresentable. Packing through
      either surface now applies the same one-week expiry floor, because that
      default lived in the CLI's own flag layer and a tool call omitting it
      would have minted a package expired at birth.
    affects: ["a2a data pack", "a2a data deliver", "a2a data fetch", "a2a data verify", "a2a_data", "data-package/v1", "verification-report/v1", "dashboard"]
    action:
      scope: local
      why: >
        Update the binary before packing or verifying a delivery. Existing
        exchange history is unaffected and needs no migration.
      detect:
        - "a2a version"
      run:
        - "a2a update --yes"
