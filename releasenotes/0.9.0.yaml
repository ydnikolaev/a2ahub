schema: release-notes/v1
version: "0.9.0"
released: "2026-07-26"
headline: "The write path stops trusting itself: a version floor that binds every verb, an MCP session that sees the space instead of its own last write, and an unlocked mutation that no longer compiles"
changes:
  - id: RN-0900-1
    kind: fix
    impact: high
    subject: "`min_binary_version` bound `a2a submit` and nothing else — every lifecycle and contract verb ignored it"
    detail: >
      A space's `min_binary_version` is the one lever an operator has for keeping
      a stale binary out. It was disconnected from almost every write. The funnel
      checks the floor only when a write actually carries it, which is reasonable
      on its own — but three of six write-building sites never set it, and those
      three are all 15 lifecycle verbs, `contract publish/deprecate/retire`, and
      their MCP equivalents. So raising a floor gated `a2a submit` and left every
      other verb writable by any binary, silently, with no error and no warning.
      This is not theoretical. The branch name the funnel uses as its idempotency
      key changed grammar in 0.4.0, and a live space still carries two open pull
      requests for ONE `contract publish` of one artifact — identical contract
      body, same transition, two branch shapes — because a pre-0.4.0 binary was
      allowed to write. Raising the floor is exactly how you prevent that, and it
      was doing nothing on the verb that caused it. Both surfaces are fixed
      together: a floor that binds the CLI but not MCP would only move the stale
      write to the other door. A structural gate now fails the build if a new
      write is added without one.
      Know what the floor still does NOT do, because it is easy to over-read.
      The check runs in the WRITER's own binary; nothing server-side reads the
      field, and the space's CI does not enforce it. So raising your floor binds
      every 0.9.0-or-newer writer on every verb, and every version's `a2a
      submit` — but it cannot retroactively gate an older binary's `contract
      publish`, because that binary's code never populates the field to check.
      The way to close that gap is for everyone to be on 0.9.0, not to trust the
      number in space.yaml.
    affects: [cli, mcp]
    action:
      scope: space
      why: "the guard is in the binary, but it only bites if your space.yaml declares a floor — check yours"
      run: ["a2a doctor"]

  - id: RN-0900-2
    kind: fix
    impact: high
    subject: "An `a2a mcp` session no longer reads a space frozen at the moment it started"
    detail: >
      Two defects met here, and together they meant a long-running MCP session
      could validate a transition against a state the space had never agreed to.
      First, the write funnel checked out an ephemeral branch to commit on and
      never left it; the only code that moved the mirror back lived inside the
      clone-or-fetch step. Second, an MCP server ran that step exactly once, at
      startup, and then served every later tool call from that view — where the
      CLI re-resolves everything on every invocation. So the second write in a
      session folded its legality over a working tree standing on the FIRST
      write's unmerged branch. Both are fixed. The funnel now restores the mirror
      to its base branch before releasing its lock, so a write leaves the mirror
      the way it found it; and the MCP session refreshes the mirror before EVERY
      tool call, in one place rather than in each of ten handlers. That second
      half also closes the read-staleness gap v0.8.0 documented: an MCP session
      now sees what your counterparty published after it started. v0.8.0's own
      release note said the MCP write tools were fine — that sentence was wrong,
      and this is the correction. One limit remains and is deliberate: if the
      refresh fails (an unreachable origin), the session logs a warning and
      serves your last good view rather than refusing to work offline.
    affects: [mcp, cli]
    action:
      scope: local
      why: "the fix is in the binary; nothing in your space changes"
      run: ["a2a update"]

  - id: RN-0900-3
    kind: fix
    impact: normal
    subject: "A mirror mutated without holding its lock is now a compile error rather than a review note"
    detail: >
      The three defects the live matrix found in July — a lost write, a crossed
      write where one system's pull request carried another system's files, and a
      branch forked from a stale head — were one shape: a shared mirror mutated
      by two processes at once. Two of them had been read in the source and
      judged latent before the matrix found them. Every working-tree mutation now
      takes the mirror lock as a parameter, so an unlocked mutation cannot be
      written; a runtime check covers the half a type cannot express, that the
      lock is for THIS mirror; and a structural scan catches a future mutation
      added through a fresh helper that takes no lock. No behaviour changes for a
      correct caller.
    affects: [cli, mcp]
    action:
      scope: none
      why: "an internal invariant — nothing to run, and no behaviour changes for a correct caller"

  - id: RN-0900-4
    kind: fix
    impact: low
    subject: "The live-matrix runbook told you to run a path no checkout carries"
    detail: >
      The committed runbook's commands named `.agents/scripts/live-e2e/...`,
      which `.gitignore` excludes entirely — so every reader was pointed at files
      git does not track, while an untracked local copy drifted from the tracked
      one with nothing able to notice the difference. One tracked home now, and
      the documented paths resolve. Also adds `detached.sh`, which runs the
      matrix detached from whatever launched it: the run takes about an hour, and
      every attempt driven from an agent session had been killed mid-row —
      silently, with no verdict — which read as rate limiting and was not.
    affects: [docs]
    action:
      scope: none
      why: "test infrastructure and its runbook — nothing in the product changes"

  - id: RN-0900-5
    kind: fix
    impact: high
    subject: "A contract could never publish a successor once any version had been deprecated"
    detail: >
      `a2a contract deprecate --version 1.0.0` deprecates a VERSION — that is
      what the flag means and what you intend. Internally the lifecycle recorded
      that state against the whole CONTRACT, and there was no legal way back to
      published, so every later publish was refused as an illegal transition.
      The ordinary life of a live contract is publish 1.0, publish 2.0, deprecate
      1.0, publish 3.0 — and it hit that wall on the last step, permanently. The
      wall only appears once a contract has been in use for a while, which is why
      nothing found it earlier. Publishing now returns the contract to published;
      retire still requires a deprecation first, so nothing else moved. This is an
      interim: the real fix is tracking state per version, so that "1.0.0 is
      deprecated" and "2.0.0 is published" can both be true at once instead of
      competing for one state. That needs its own design and a migration, and is
      filed rather than rushed.
    affects: [cli, mcp]
    action:
      scope: local
      why: "the fix is in the binary; a contract already stuck at deprecated can publish again as soon as you update"
      run: ["a2a update"]

  - id: RN-0900-6
    kind: fix
    impact: normal
    subject: "`a2a mcp` no longer refuses to start when the space is unreachable"
    detail: >
      The server cloned or fetched the space at startup, so a network blip, an
      expired credential, or a laptop with no connection stopped it from starting
      at all — even though the read tools need nothing but the local mirror
      already on disk. You lost your inbox for a reason that had nothing to do
      with reading it. It now degrades instead: the write tools are not
      registered, the read tools serve from the local mirror, and the reason is
      printed so an agent sees why a tool is missing rather than guessing. The
      CLI's read path has behaved this way for several releases; this brings the
      second surface in line.
    affects: [mcp]
    action:
      scope: local
      why: "the fix is in the binary; nothing in your space changes"
      run: ["a2a update"]

  - id: RN-0900-7
    kind: fix
    impact: high
    subject: "Your pull request was refused when your counterparty merged first"
    detail: >
      The space's own validation gate blamed the wrong author. On a pull request
      it checked out the branch ALREADY MERGED into the current base, then diffed
      that against the base as of when the event fired. Those two drift apart the
      moment anybody else merges — and the diff then swept in every commit that
      had landed in between, attributing another system's files to your pull
      request. The result was a refusal naming paths you never touched, in
      exactly the situation a shared space exists for: two systems writing at the
      same time. Observed live on 2026-07-26 — a pull request that changed four
      files, all in its own section, refused with two authorization violations
      naming the other system's section, because the other system merged while it
      was open. The gate now checks out the pull request's own head, so its diff
      means what the authorization check asks: what did THIS author change,
      relative to where they forked. Validating the merged result was never the
      question — the post-merge audit on main is what checks the whole tree.
      NOTE: your space inherits this only when it re-pins the workflow. Run `a2a
      space update` after upgrading; `a2a doctor`'s "space scaffolding current"
      row tells you whether you are behind.
    affects: [space]
    action:
      scope: space
      why: "the fix lives in the reusable workflow your space pins by tag — the space must re-pin to get it"
      run: ["a2a space update"]
      detect: ["a2a doctor"]

  - id: RN-0900-8
    kind: known-issue
    impact: high
    subject: "A just-merged artifact could stay invisible to your reads for five minutes (fixed in 0.9.1)"
    detail: >
      v0.8.0 made every read verb refresh a stale mirror before reading, which
      closed the case where a contract published on the other side was silently
      invisible. It did not close the narrower one, and the narrower one is more
      likely: "stale" was measured against the STATUSLINE's five-minute window,
      because both callers shared one setting. So a mirror fetched moments
      earlier — by your own `a2a submit`, for instance — counted as fresh, and an
      artifact whose pull request merged just after that fetch stayed invisible
      to `a2a inbox`, `outbox` and `show` for up to five minutes. No error: `show`
      answered "artifact not found". Found end to end against a live space on
      2026-07-26, and one explicit `a2a sync` revealed the artifact at once. Five
      minutes is exactly the window in which your counterparty's merge matters
      most, and the documented session-start loop says an empty inbox means
      proceed. If you are on 0.9.0 and a read looks emptier than you expect, run
      `a2a sync` and read again — that is the reliable answer until you upgrade.
    affects: [cli]
    action:
      scope: local
      why: "run `a2a sync` before trusting an empty read on 0.9.0; the fix ships in 0.9.1"
      run: ["a2a sync"]
      detect: ["a2a show <id>"]
