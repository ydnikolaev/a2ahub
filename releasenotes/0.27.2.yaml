schema: release-notes/v1
version: 0.27.2
released: unreleased
headline: a local build owes what it carries, and says when your skill is behind
changes:
- id: RN-02702-0
  kind: fix
  impact: normal
  subject: a2a adapt lists the notes a local build carries ahead of its version
  detail: >
    A binary from `make deliver` is stamped with the last published release
    and embeds the notes written since. `a2a adapt` stopped at the stamp, so a
    repository on such a build was told "nothing to adapt" while the change
    that obliged it was already in the binary.

    `a2a adapt` now lists those notes too. They have no release for
    `adapted_through` to name, so `a2a adapt --done` records their change ids
    under `adapted_ahead` in `.a2a/config.yaml`. A change added to the same note
    later still appears, and a recorded one does not come back when the note is
    released. `--done --json` names them in `recorded_ahead`.
  action:
    scope: none
    why: >
      Nothing is owed. A released binary carries no such note, and an older
      binary reads past the new key.
  roadmap:
    visibility: omit
    why: >
      A correction to the local delivery channel; a reader of the roadmap would
      not plan around it.
- id: RN-02702-1
  kind: feat
  impact: normal
  subject: every verb says when the installed skill differs from the binary's
  detail: >
    `.a2ahub/skill/` is a committed copy, so a new binary changes nothing in it,
    and only `a2a doctor` ever compared the two. Every MCP tool and every CLI verb
    that carries the update notice now adds one line when the installed files
    differ from the tree this binary carries. It compares the files rather than
    the version stamp, so a local build whose skill moved is noticed, and an old
    stamp over an unchanged skill stays quiet. The CLI writes the line to stderr,
    as `skill_notice` under `--json`, and MCP adds it to the text body.
  action:
    scope: local
    why: >
      The manual changed in this release, so an installed skill is behind until it
      is refreshed. If your repository tracks the skill, commit the refreshed
      files; if it ignores the skill, the refresh on disk is the whole step.
    detect: ["! a2a doctor 2>/dev/null | grep -q '^skill manual current: FAIL'"]
    run: ["a2a skill install"]
  roadmap:
    visibility: omit
    why: >
      An advisory for agents already using the tool; it changes no plan.
- id: RN-02702-2
  kind: fix
  impact: high
  subject: contract preflight and publish no longer slow down as a space's history grows
  detail: >
    Reading a contract's publication history started several git processes for
    every event commit in the space, and repeated the whole walk once for each
    published version and again for each step of a publish. On a local space
    with about 440 event commits and 14 versions, `a2a contract preflight` took
    about 20 minutes and `a2a contract publish` about an hour.

    The history is now read with one `git log` and one long-lived
    `git cat-file --batch`, plus a few reads per published version, and a
    publish reads it once. The number of git processes no longer depends on how
    many events the space holds. A walk over 10,000 event commits takes about a
    second. The walk also no longer misses a publish event that git would have
    reported as a rename of a deleted file.
  action:
    scope: none
    why: >
      Nothing is owed. The verbs and their answers are unchanged; only their
      cost is.
  roadmap:
    visibility: omit
    why: >
      A cost fix to existing verbs; it changes no plan.
- id: RN-02702-3
  kind: fix
  impact: normal
  subject: a minor bump of a contract with several schemas is judged by conforms_to
  detail: >
    The compatibility check mapped each prior valid fixture to a schema by file
    name only (`<stem>.json` to `<stem>.schema.json`). A contract with several
    schemas and fixtures named another way could never publish a minor or patch:
    the check refused it as an ambiguous mapping. When only some names matched,
    the rest read as removed schemas and the bump was refused as breaking.

    The check now follows each prior fixture's declared `conforms_to` first, in
    `a2a contract publish` and in `a2a validate --ci` (which also gates a local
    space's land). The name rule applies only to fixtures that declare none. A
    fixture whose declared schema the new version no longer publishes is still a
    breaking change, and the message names that schema.
  action:
    scope: none
    why: >
      Nothing is owed. A contract whose fixtures declare no `conforms_to` is
      judged exactly as before.
  roadmap:
    visibility: omit
    why: >
      A correction to an existing check; it changes no plan.
- id: RN-02702-4
  kind: fix
  impact: high
  subject: contract activate lands when the space says the producer owes it
  detail: >
    A published contract with a registered consumer and real operational items
    is owed an `a2a contract activate`, and `a2a inbox --actionable` and the
    outbox said so. The land check refused every activate as LFC-001, "an
    illegal transition for the subject's current folded state", because it had
    no rule for activate at all. The item stayed urgent with no legal way to
    clear it.

    The land check now asks the same question the fold asks: the contract's
    owner may activate it. A test now asks the land check about every move the
    space can say is owed, so the two cannot disagree again. `a2a thread` and
    the notification index also list the owed activate among an item's next
    moves, where it was missing.
  action:
    scope: none
    why: >
      Nothing new is owed. An activate that was refused before now lands, so
      run it again where a contract is still listed as activation-owed.
  roadmap:
    visibility: omit
    why: >
      A correction to an existing verb; it changes no plan.
- id: RN-02702-5
  kind: fix
  impact: normal
  subject: a mirror lock left by an exited process no longer blocks a space for two minutes
  detail: >
    Every verb on a space takes a short lock on its local mirror. A lock left
    by a process that had already exited was only reclaimed after two minutes,
    and until then every verb failed after a five-second wait without naming
    who held it. `a2a doctor` meanwhile reported the space as "missing or
    unreadable" and told you to restore it, which was false and is the one
    thing that breaks writes in flight.

    A lock whose holder is no longer running on this machine is now reclaimed
    at once. The refusal names the holder's pid, whether it is still running,
    and how long it has held the lock. `a2a doctor` says the mirror is locked
    and that the space is intact. On Windows the two-minute rule still applies.
    A lock file that cannot be read at the moment it is reclaimed is reported
    as an error rather than skipped.

    git's own lock files in a mirror (such as `.git/index.lock`) are a
    different case: they carry no pid and nothing reclaims them, so one left
    by a crashed git blocks the mirror until it is deleted. `a2a doctor` now
    names each such file and its age and says to delete it when no git
    process is running in that mirror, instead of saying it clears by itself.
    Every other verb that gives up waiting on such a file names it the same
    way, where it used to say only "re-run".
  action:
    scope: none
    why: >
      Nothing is owed by upgrading. The a2a lock clears by itself; a leftover
      git lock file, if one exists, is named by `a2a doctor` with what to do.
  roadmap:
    visibility: omit
    why: >
      A correction to existing verbs; it changes no plan.
- id: RN-02702-6
  kind: fix
  impact: low
  subject: preflight of a contract never submitted says to submit it first
  detail: >
    `a2a contract preflight` and `a2a contract publish` of a contract that is
    not in the space yet refused with "contract path is not safely contained",
    which reads as a security fault. The contract simply had no directory in
    the space. The refusal now says the contract is not in the space yet and
    to submit its draft with `a2a submit` first. A symlink or any other unsafe
    path still gets the old refusal.
  action:
    scope: none
    why: >
      Nothing is owed; only the message changed.
  roadmap:
    visibility: omit
    why: >
      A clearer refusal; it changes no plan.
- id: RN-02702-7
  kind: fix
  impact: normal
  subject: a2a show prints the acceptance criteria and expected response, and a2a --help answers
  detail: >
    `a2a show` printed an item's body, state and events but not its
    `acceptance_criteria[]` or `expected_response`, in either output. A
    responder composes one verdict per criterion, so an agent had to read the
    space's files by hand to find them. Both now appear: the criteria as
    `<id>: <text>` lines (an entry without an id by its position, `#0`, `#1`,
    …) and the expected response as its `shape` and `by`. `a2a show --json`
    carries them as `acceptance_criteria` and `expected_response`, and so does
    the MCP `a2a_show` tool.

    `a2a --help`, `a2a -h` and `a2a help` answered "unknown command". They now
    print the verb list, as `a2a` alone does, and `a2a help <verb>` prints that
    verb's own help.
  action:
    scope: none
    why: >
      Nothing is owed. The JSON gains two keys and keeps every existing one.
  roadmap:
    visibility: omit
    why: >
      A gap in an existing verb; it changes no plan.
- id: RN-02702-8
  kind: fix
  impact: low
  subject: a2a skill install no longer writes a macOS .DS_Store into the repository
  detail: >
    A binary built on a Mac from a checkout that held a Finder `.DS_Store`
    under the skill tree embedded that file, and `a2a skill install` wrote it
    into `.a2ahub/skill/` in every repository it ran in. Released binaries were
    not affected; local builds from `make deliver` were. The embedded tree now
    leaves out every dot- and underscore-file.
  action:
    scope: none
    why: >
      Nothing is owed by the tool. A repository that already committed
      `.a2ahub/skill/.DS_Store` can delete it; it will not be written again.
  roadmap:
    visibility: omit
    why: >
      A packaging correction; it changes no plan.
- id: RN-02702-9
  kind: fix
  impact: normal
  subject: a settled item is no longer listed as actionable or counted urgent
  detail: >
    A `p1` or blocking item stayed in `a2a inbox --actionable` and was counted
    urgent by `a2a statusline` while it was live, even when its outcome was
    `settled`: nobody owed a move on it. Every published contract with no
    registered consumer is such an item, so its author saw an urgent line that
    nothing could clear.

    Urgency now also requires an outcome that is not settled. This holds for
    `a2a inbox --actionable`, `a2a statusline`, the inbox and outbox exit
    codes, and the native notifications. A `p1` item waiting on the other side
    is still listed and still urgent.
  action:
    scope: none
    why: >
      Nothing is owed; an item that was wrongly urgent stops being so.
  roadmap:
    visibility: omit
    why: >
      A correction to existing surfaces; it changes no plan.
- id: RN-02702-10
  kind: feat
  impact: normal
  subject: an item whose owing side writes only notes is flagged
  detail: >
    A note never changes an item's state, and it resets the staleness clock,
    so a side that answered with notes instead of the move it owed hid the
    item from `stale` too. Nothing told either side.

    `a2a inbox --actionable` and `a2a statusline` now list such an item with
    the reason `notes-without-move` once the side that owes the next move has
    written three notes since the item last changed state. Both sides see it.
    The dashboard names the reason too. `a2a note` from the side that owes the
    move prints which move it still owes, on stderr; the note is still
    recorded and the exit code is unchanged.
  action:
    scope: none
    why: >
      Nothing is owed by the tool. Where an item is flagged, the side that
      owes the move should make it.
  roadmap:
    visibility: omit
    why: >
      An attention signal on existing data; it changes no plan.
- id: RN-02702-11
  kind: feat
  impact: normal
  subject: every verb says when this repository has adoption steps owed
  detail: >
    The binary is per machine and adoption is per repository, and only `a2a
    update` ran `a2a adapt`, only in the repository it was run in. A binary
    from `make deliver`, or one another repository updated, reached every
    other repository with nothing said, and the steps a release asked for were
    never done there.

    Now every verb that succeeds, and every MCP tool, ends with one `note:` on
    stderr while this repository owes steps: how many and since which
    release, or that it never recorded adoption at all. Under `--json` it is
    an `adoption_notice` object. When the repository adapted through a release
    newer than the binary, the note names the binary's version and path,
    because that is almost always an older `a2a` first in `PATH`. It stops
    once `a2a adapt --done` records the clock, and it never touches stdout or
    the exit code. `a2a doctor` has a new `adoption` row with the same answer.
    It FAILs when `.a2a/config.yaml` is gitignored or untracked, and quotes
    the ignore rule. A re-run of `a2a init`, for example to add a space, no
    longer drops the recorded clock.
  action:
    scope: local
    why: >
      The clock lives in `.a2a/config.yaml`. If the repository ignores or has
      not committed that file, every clone and worktree starts with no record
      and owes every step again. Commit it. For a `/.a2a/*` ignore rule, add
      `!/.a2a/config.yaml` after it. Then run `a2a adapt`, do or verify what
      it lists, and `a2a adapt --done`.
    detect: ["! git rev-parse --is-inside-work-tree >/dev/null 2>&1 || git ls-files --error-unmatch .a2a/config.yaml >/dev/null 2>&1"]
  roadmap:
    visibility: omit
    why: >
      An advisory on an existing mechanism; it changes no plan.
- id: RN-02702-12
  kind: fix
  impact: normal
  subject: adapt's "is the space current" check works, and works with two spaces
  detail: >
    Nine release notes check whether a space is current with `a2a space
    update --dry-run`, and a detect passes when its command exits 0. A dry
    run exits 0 even with a diff pending, so the check passed for a space
    that was behind and fired only on an error. In a repository connected to
    two spaces it always exited 1 ("name one with --space"), so `a2a adapt
    --done` refused there however current the spaces were.

    `a2a space update --check` is a dry run that exits 1 while the space is
    behind and names it on stderr. With no `--space` it checks every
    connected space. Those nine notes now use it. Writing still refuses a
    project with two spaces until you name one. That answers spec 35's open
    `--all` question for the read path only.

    The nine checks are now honest, so a repository whose clock predates
    them can find `a2a adapt --done` refusing one that used to pass: one of
    its spaces really is behind the template, often only by its
    `min_binary_version` floor.
  action:
    scope: none
    why: >
      This change asks nothing new. If `a2a adapt --done` now refuses an
      older "update the space" step, run `a2a space update --check` to see
      which space is behind. Update it with `a2a space update --space <id>`,
      which writes to the space and needs `--approve` in a confirm space,
      then run `a2a adapt --done` again.
  roadmap:
    visibility: omit
    why: >
      A fix to an existing check; it changes no plan.
- id: RN-02702-13
  kind: feat
  impact: normal
  subject: a2a new --to sends the same ask to several systems in one command
  detail: >
    A `work_request`, `question`, `handoff` or `response` addresses exactly
    one system, so sending one task to several repositories meant one
    `a2a new` per target. `a2a new <type> --to a,b,c` now drafts one artifact
    per target, all on one shared thread and identical but for `id` and `to`,
    and ends with the `a2a submit --batch` line that lands them together. Every
    draft is rendered before the first is written, so a refusal leaves nothing
    in staging. The flag takes a comma list or repeats.

    On `announcement`, `decision`, `contract` and `requirement`, which take a
    list, `--to a,b` sets the list on one artifact, and `--to all` drafts the
    broadcast `to: all`. `--field to=all` used to write `to: [all]`, a system
    named "all"; it now writes the broadcast too. One target drafts exactly
    what `--field to=<target>` does. An empty or repeated target, `all` beside
    a named system or on a type that addresses one system, or `--to` together
    with `--field to=` is refused by name. The MCP `a2a_new`
    tool already drafted several items on one thread; it is unchanged.
  action:
    scope: none
    why: >
      Nothing is owed. The flag is new and optional, and the manual that
      describes it is refreshed by RN-02702-1's `a2a skill install`.
  roadmap:
    visibility: shipped
    why: >
      A host agent can hand one task to every repository on its space in one
      command, with each target's done tracked on its own.
- id: RN-02702-14
  kind: fix
  impact: high
  subject: a2a adapt --done names the first-clock step instead of a misleading change id
  detail: >
    A repository that never recorded `adapted_through` could not finish
    `a2a adapt --done`. Its range reached back to v0.2.0, and the walk
    refused on the first old detect that failed, for example RN-01100-1's
    `a2a submit <id>`, a template a shell cannot run, reported as "still
    fires". Obligations from before a repository was onboarded describe
    states it never had (D-044).

    `--done` now refuses such a repository before running any detect, and
    says how to set the first clock: the version that onboarded it, read from
    the skill's PROVENANCE stamp in the commit that first added it, or the
    running binary's version for a repository it onboarded. `a2a adapt` prints
    the same line under its "never recorded" notice. A detect that is a
    template, such as `<id>`, is no longer run anywhere: its obligation is
    recorded on the agent's word and named in the `--done` output and in
    `template_only` under `--json`.
  action:
    scope: none
    why: >
      Nothing is owed. A repository that already set its clock by hand used
      the procedure the refusal now prints.
  roadmap:
    visibility: omit
    why: >
      A correction to the adoption verb's refusal; it changes no plan.
- id: RN-02702-15
  kind: fix
  impact: high
  subject: a2a adapt --done no longer runs released detects that were inverted, that write, or that never exit
  detail: >
    A detect exits 0 once its step is done, and `--done` runs it in your
    tree. Fourteen released detects broke that. Five were inverted, passing
    only in the state they warn about: RN-02507-0, RN-02507-1, RN-02507-7,
    RN-02601-0 and RN-02602-0. Four checked something else, or a file in the
    space repository rather than yours: RN-02506-2, RN-0300-1, RN-0300-3 and
    RN-01100-6. Five ran a verb that is no probe at all. `a2a init` in
    RN-01200-3 rewrites the project, `a2a inbox` in RN-0400-2 and RN-02507-2
    moves your read cursor, `a2a mcp` in RN-01100-7 serves stdio and never
    returns, and `tools/list` in RN-02506-5 is not a command. So `--done`
    refused a repository that owed nothing, or hung.

    Each now carries a read-only probe of the right polarity, or none where
    no honest probe exists, and its obligation is then recorded on the
    agent's word. Seven obligations that had no detect gained one: `a2a space
    update --check` for a space's re-pinned workflow, and the doctor's
    `skill manual current` row for a re-installed skill. A test now refuses
    any new detect that runs a writing or long-running `a2a` verb.
  action:
    scope: none
    why: >
      Nothing to run. A `--done` that refused or hung on one of these ids
      completes on the next run.
  roadmap:
    visibility: omit
    why: >
      Corrected probes inside released notes; no verb or flag changes.
