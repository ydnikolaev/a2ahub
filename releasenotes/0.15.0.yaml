schema: release-notes/v1
version: "0.15.0"
released: "2026-07-29"
headline: "Agent loops survive asynchronous merges and safe public intake, contract publishing is stricter, and notifications reach macOS and VS Code"
changes:
  - id: RN-01500-1
    kind: fix
    impact: high
    subject: "Feedback intake works on a fresh hub and a failed first attempt is safe to retry"
    detail: >
      The intake workflow used labels that a fresh repository did not have, so
      the first valid report stopped before auto-merge. It now creates the fixed
      label set idempotently before applying it.
      A separate failure window could push the deterministic feedback branch
      and then fail while opening the PR. The next attempt found the orphaned
      branch and could not recover. GitHub submissions now refuse before any
      git write when no feedback credential resolves; after proving that no PR
      exists, a retry may replace only that tool-owned branch with an
      exact-SHA force-with-lease. A concurrently changed branch is refused,
      never overwritten.
      The local feedback ledger is also serialized, so two submissions cannot
      race an update and lose one successful filing.
    affects: ["a2a feedback submit"]
    action:
      scope: local
      why: >
        If feedback submission previously failed after pushing, retry it after
        upgrading. For a GitHub hub, provide a dedicated feedback token.
      run:
        - "export A2A_FEEDBACK_TOKEN=<github-token>"
        - "a2a feedback submit <report.yaml>"

  - id: RN-01500-2
    kind: feat
    impact: normal
    subject: "One session can submit every grounded feedback item without batching them into one PR"
    detail: >
      `a2a feedback submit` accepts several report paths, and `--all` selects
      every draft that is not already in the local ledger. All selected reports
      are validated before the first write. Each item still becomes its own PR,
      preserving the intake quarantine and independent triage; if a later item
      fails, earlier successful PRs are reported honestly rather than described
      as rolled back.
    affects: ["a2a feedback submit"]
    action:
      scope: local
      why: >
        Use one invocation after a session that produced several independent,
        evidence-backed reports.
      run:
        - "a2a feedback submit --all"

  - id: RN-01500-3
    kind: feat
    impact: high
    subject: "Pending lifecycle and contract writes have a supported wait path"
    detail: >
      Lifecycle and contract writes now persist the same pending marker as
      submit. `a2a await <artifact-id>` follows that recorded PR, waits for the
      required check and the merge, refreshes the mirror, then clears the
      marker. It refuses a red check, a closed-unmerged PR, cancellation, or a
      timeout; it never merges the PR itself.
      If a follow-up transition is attempted while the previous write is still
      pending, LFC-001 now names the actual PR and the exact await command
      instead of presenting a generic illegal-state refusal.
      Required-check lookup now pages through all GitHub check runs, so the
      waiter does not miss the compound required check when many integrations
      have attached checks to the same commit.
    affects: ["a2a await", "a2a submit", "a2a contract publish", "a2a contract deprecate", "a2a contract retire"]
    action:
      scope: local
      why: >
        Await the recorded write before issuing the next state transition.
      run:
        - "a2a await <artifact-id>"
        - "a2a await <artifact-id> --timeout 20m"

  - id: RN-01500-4
    kind: fix
    impact: normal
    subject: "Every next command printed by a thread is invocable as written"
    detail: >
      The protocol transition is named `acknowledge`, but the CLI command is
      `ack`; thread text printed the protocol word and sent agents to a command
      that did not exist. Text rendering now maps protocol transitions to
      copyable CLI invocations, including the `contract` subcommand for
      contract transitions. JSON keeps the protocol vocabulary unchanged.
    affects: ["a2a thread", "a2a ack"]
    action:
      scope: none
      why: >
        No migration. Commands shown after `next=` can now be copied directly.

  - id: RN-01500-5
    kind: feat
    impact: normal
    subject: "Statusline integrations can consume facts without parsing presentation text"
    detail: >
      `a2a statusline --json` returns the counts, urgent item, stale/update
      facts, severity, and quiet state from the same computed result as the
      text renderer. `--sample` produces a deterministic non-empty result
      without config or network, so shell wiring can be tested before a space
      is connected. `--no-prefix` removes only the leading `a2a: ` from text.
      The default text, quiet behavior, and exit codes are byte-compatible.
    affects: ["a2a statusline"]
    action:
      scope: local
      why: >
        Prefer JSON for a host integration and use sample mode while wiring it.
      run:
        - "a2a statusline --sample"
        - "a2a statusline --json"

  - id: RN-01500-6
    kind: fix
    impact: high
    subject: "The merge gate rejects a hand-authored illegal or unauthorized lifecycle event"
    detail: >
      Pre-write CLI and MCP checks were not a product boundary: a contributor
      could hand-author event YAML and open a PR around them. In v3-pr, each
      changed event now passes event/v1 first and is then checked as a candidate
      against merge-base history, with every changed candidate excluded from
      its own prior. The verdict comes from the same fold legality primitive as
      local writes, including response-scoped verify/dispute and per-version
      contract transitions. Illegal transitions report LFC-001 and unauthorized
      actors LFC-002 in the existing per-path CI result.
    affects: ["a2a validate"]
    action:
      scope: space
      why: >
        Spaces receive this protection after updating their reusable validation
        workflow pin to this release.
      run:
        - "a2a space update"

  - id: RN-01500-7
    kind: fix
    impact: low
    subject: "Pending-marker cache paths reject traversal-shaped identifiers"
    detail: >
      Pending marker reads, writes, removals, and whole-space cleanup now
      require one safe path component for both the space and artifact id.
      Normal IDs are unchanged; malformed values containing separators or
      dot-components fail before touching a path outside the pending cache.
    affects: ["a2a await"]
    action:
      scope: none
      why: >
        Defensive hardening. Valid space and artifact identifiers need no
        migration.

  - id: RN-01500-8
    kind: feat
    impact: normal
    subject: "Release notes can no longer silently lag behind product fixes"
    detail: >
      `make check` now anchors on the newest semver release-notes file and
      rejects later feat, fix, perf, or breaking commits that touch product
      surfaces. The failure lists every uncovered commit. Documentation,
      chores, tests, and refactors without a breaking marker do not create
      noise. The gate is offline and carries teeth proving an uncovered fix
      and a breaking change go red, a notes update clears them, and non-product
      work stays green.
      This is a freshness guarantee, not an automated claim that the prose
      describes every diff correctly; release review still owns that judgment.
    affects: ["make check", "make harness-check"]
    action:
      scope: none
      why: >
        Release operators get an automatic reminder in the normal quality
        gate. Product users need no migration.

  - id: RN-01500-9
    kind: known-issue
    impact: normal
    subject: "The authored per-version live scenario still has no successful exact-tree run"
    detail: >
      The rolling-window scenario is present in the live matrix and drives real
      GitHub with both provisioned identities: several published lines, a
      deprecation, a late adoption, a maintenance publish, acknowledgement,
      retirement while newer lines remain live, and a post-retire publish.
      This backlog wave deliberately did not dispatch it at the release
      operator's request. GitHub CLI authentication was verified separately,
      but that does not substitute for executing this exact-tree scenario.
      Unit, race, merge-gate, and harness tests remain green, but they do not
      substitute for the real Actions/protection/write-funnel path. The known
      issue from 0.13.0 therefore remains open rather than being rounded up to
      verified.
    affects: ["a2a contract publish", "a2a contract deprecate", "a2a contract retire"]
    action:
      scope: none
      why: >
        No user action. The release operator must run the full live matrix with
        the dedicated throwaway-org credentials before calling this row closed.

  - id: RN-01500-10
    kind: fix
    impact: high
    subject: "MCP contract publishing refuses incompatible version claims before opening a PR"
    detail: >
      `a2a_contract publish` now resolves the prior version from git history
      and calls the same publishability and computed-compatibility core as the
      CLI. A breaking schema declared as minor or patch returns POL-007 locally,
      naming the prior fixture that no longer validates, and neither surface
      reaches the write funnel. Major bumps and formats outside the JSON-Schema
      compatibility rule retain their existing behavior.
    affects: ["a2a_contract publish", "a2a contract publish"]
    action:
      scope: none
      why: >
        MCP agents receive the refusal immediately instead of waiting for the
        merge gate. Existing valid publishing flows need no migration.

  - id: RN-01500-11
    kind: fix
    impact: normal
    subject: "Published contracts carry both positive and negative executable examples"
    detail: >
      POL-009 now enforces the plan's format-neutral baseline for every contract:
      at least one schema, valid fixture, and invalid fixture. For JSON-Schema
      contracts, `a2a contract new` and its MCP twin scaffold all three; tests
      compile the starter schema, prove the positive example passes, and prove
      the negative example fails. Other formats still leave deep fixture
      semantics to the producer's CI, but may no longer publish an empty
      baseline.
      A read-only corpus check found no published contract content requiring a
      migration in the public hub or the connected external space.
    affects: ["a2a contract new", "a2a contract publish", "a2a_contract publish", "a2a validate"]
    action:
      scope: local
      why: >
        Before publishing a hand-authored contract, provide schema plus valid
        and invalid fixture examples. For non-JSON formats, keep their semantic
        validation in the producer's CI.

  - id: RN-01500-12
    kind: fix
    impact: low
    subject: "Shell completion includes the full skill command family"
    detail: >
      `a2a skill install` and `a2a skill link` now come from one subcommand
      registry shared with completion. The dispatch parity test renders bash,
      zsh, and fish and verifies every registered family member is present.
    affects: ["a2a completion", "a2a skill link"]
    action:
      scope: local
      why: >
        Regenerate or reload shell completion after upgrading if the current
        shell session cached an older script.

  - id: RN-01500-13
    kind: fix
    impact: high
    subject: "Public feedback intake now has a branch-wide least-privilege merge policy"
    detail: >
      The public product repository had no branch protection while its
      feedback workflow assumed protection would hold auto-merge. The intake
      check was also path-filtered, so it could not safely become a required
      branch-wide context. A universal read-only `merge-policy` now classifies
      every pull request. Ordinary code receives no write privilege; a pull
      request touching the quarantine must be exactly one newly added feedback
      YAML, validated by a pinned release without checking out its head. Only
      then does a separate job receive the closed-enum kind and permission to
      label and arm auto-merge.
      Feedback validation now rejects HTML comments, control bytes, zero-width
      characters, and bidirectional controls as FB-009. This guards the
      human/agent visibility boundary without a brittle blacklist that would
      reject legitimate reports discussing prompt injection.
      The indirect gRPC module is updated to the first release fixing
      GO-2026-6061.
    affects: ["a2a feedback validate", "feedback intake", "public repository CI"]
    action:
      scope: none
      why: >
        No consumer migration. Repository protection and free security signals
        are applied by the release operator after this validator release exists.

  - id: RN-01500-14
    kind: feat
    impact: high
    subject: "Install native macOS and VS Code notifications from the a2a release"
    detail: >
      `a2a notifications install` installs or repairs a version-matched
      companion from the same signed release cohort as the CLI. On macOS 13+
      this is a background-only Swift app with the fixed
      `io.a2ahub.notifier` bundle identity, Notification Center permission,
      and the system Login Items API. The release app is a universal
      Apple-Silicon/Intel binary, hardened, Developer ID signed, notarized, and
      stapled before upload. In VS Code the command installs the matching VSIX
      into the selected CLI/profile and exposes the same current level in the
      status bar plus transition notifications. Installation is per user;
      enrollment is per project, so one machine may watch only the repositories
      the user chooses.
      The terminal statusline remains a separate optional, user-owned surface.
      This command never edits Claude Code, shell, prompt, or provider config.
    affects: ["a2a notifications install", "a2a notifications status", "a2a doctor"]
    action:
      scope: local
      why: >
        Choose either supported surface or both. macOS asks for Notification
        Center and Login Item approval; VS Code may ask to trust the extension
        publisher. Repeat the install command to repair an a2a-owned install.
      run:
        - "a2a notifications install --channel macos"
        - "a2a notifications install --channel vscode"
        - "a2a notifications test --channel all"

  - id: RN-01500-15
    kind: feat
    impact: normal
    subject: "Notification clicks open a trusted local A2A view, including future What’s New"
    detail: >
      macOS and VS Code receive only bounded, sanitized projection data and an
      opaque route minted by the CLI. Open A2A resolves that route from the
      machine-local ledger and opens the existing local HTML dashboard focused
      on the item; artifact text cannot choose a URL, path, or command.
      Update availability is projected into every enabled surface as well.
      An older binary renders future release prose only from a separately
      signed and schema-validated release-notes asset cached from the target
      cohort. If that detail is missing, malformed, unknown, or unverified, the
      card shows the current/latest/floor versions, cache provenance, and a
      trusted release link instead of pretending its embedded notes know the
      future. A click never starts `a2a update`.
    affects: ["a2a notifications open", "a2a html --update", "a2a update"]
    action:
      scope: none
      why: >
        Use Open A2A to inspect the local item or update card. Run the update
        command separately when ready.

  - id: RN-01500-16
    kind: known-issue
    impact: normal
    subject: "Protected signing and interactive platform matrices require release-environment proof"
    detail: >
      Hermetic Go, Swift, and VS Code tests cover projection, leases, routing,
      permission denial, install repair, rollback, profile ownership, and both
      macOS architecture slices. Local builds cannot prove the protected
      Developer ID/notary secret path or replace clean-machine interaction
      tests for Notification Center, Focus, Login Items, VS Code Restricted
      Mode, profiles, disablement, and remote windows. Those release checks
      remain explicit and must not be inferred from unit-test success.
    affects: ["macOS notifications", "VS Code notifications", "release workflow"]
    action:
      scope: none
      why: >
        Release operators run the signed clean-macOS and interactive VS Code
        matrices before describing those platform paths as verified.

  - id: RN-01500-17
    kind: fix
    impact: normal
    subject: "The shipped skill no longer tells MCP agents to avoid contract publishing"
    detail: >
      The MCP contract publisher now runs the same computed compatibility
      check as the CLI, but the hand-maintained skill and troubleshooting page
      still described the old limitation and sent agents back to the CLI.
      Release review now removes that stale warning. The review checklist also
      covers the hand-maintained notifications, thread, and contract-version
      pages added since its original file list, so future releases cannot tick
      a completeness claim over a partial inventory.
    affects: ["a2ahub skill", "a2a_contract publish", "release review"]
    action:
      scope: none
      why: >
        MCP and CLI contract publishing now refuse incompatible version claims
        at the command boundary from the same compatibility core.
