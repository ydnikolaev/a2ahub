schema: release-notes/v1
version: "0.14.0"
released: "2026-07-28"
headline: "The agent loop now survives asynchronous merges and first-run feedback intake: commands are copyable, pending writes are awaitable, status is machine-readable, and hand-authored illegal events are stopped at merge"
changes:
  - id: RN-01400-1
    kind: fix
    impact: high
    subject: "Feedback intake works on a fresh hub and a failed first attempt is safe to retry"
    detail: >
      The intake workflow used labels that a fresh repository did not have, so
      the first valid report stopped before auto-merge. It now creates the fixed
      label set idempotently before applying it.
      A separate failure window could push the deterministic feedback branch
      and then fail while opening the PR. The next attempt found the orphaned
      branch and could not recover. GitHub submissions now refuse before any
      git write when no feedback credential resolves; after proving that no PR
      exists, a retry may replace only that tool-owned branch with an
      exact-SHA force-with-lease. A concurrently changed branch is refused,
      never overwritten.
      The local feedback ledger is also serialized, so two submissions cannot
      race an update and lose one successful filing.
    affects: ["a2a feedback submit"]
    action:
      scope: local
      why: >
        If feedback submission previously failed after pushing, retry it after
        upgrading. For a GitHub hub, provide a dedicated feedback token.
      run:
        - "export A2A_FEEDBACK_TOKEN=<github-token>"
        - "a2a feedback submit <report.yaml>"

  - id: RN-01400-2
    kind: feat
    impact: normal
    subject: "One session can submit every grounded feedback item without batching them into one PR"
    detail: >
      `a2a feedback submit` accepts several report paths, and `--all` selects
      every draft that is not already in the local ledger. All selected reports
      are validated before the first write. Each item still becomes its own PR,
      preserving the intake quarantine and independent triage; if a later item
      fails, earlier successful PRs are reported honestly rather than described
      as rolled back.
    affects: ["a2a feedback submit"]
    action:
      scope: local
      why: >
        Use one invocation after a session that produced several independent,
        evidence-backed reports.
      run:
        - "a2a feedback submit --all"

  - id: RN-01400-3
    kind: feat
    impact: high
    subject: "Pending lifecycle and contract writes have a supported wait path"
    detail: >
      Lifecycle and contract writes now persist the same pending marker as
      submit. `a2a await <artifact-id>` follows that recorded PR, waits for the
      required check and the merge, refreshes the mirror, then clears the
      marker. It refuses a red check, a closed-unmerged PR, cancellation, or a
      timeout; it never merges the PR itself.
      If a follow-up transition is attempted while the previous write is still
      pending, LFC-001 now names the actual PR and the exact await command
      instead of presenting a generic illegal-state refusal.
      Required-check lookup now pages through all GitHub check runs, so the
      waiter does not miss the compound required check when many integrations
      have attached checks to the same commit.
    affects: ["a2a await", "a2a submit", "a2a contract publish", "a2a contract deprecate", "a2a contract retire"]
    action:
      scope: local
      why: >
        Await the recorded write before issuing the next state transition.
      run:
        - "a2a await <artifact-id>"
        - "a2a await <artifact-id> --timeout 20m"

  - id: RN-01400-4
    kind: fix
    impact: normal
    subject: "Every next command printed by a thread is invocable as written"
    detail: >
      The protocol transition is named `acknowledge`, but the CLI command is
      `ack`; thread text printed the protocol word and sent agents to a command
      that did not exist. Text rendering now maps protocol transitions to
      copyable CLI invocations, including the `contract` subcommand for
      contract transitions. JSON keeps the protocol vocabulary unchanged.
    affects: ["a2a thread", "a2a ack"]
    action:
      scope: none
      why: >
        No migration. Commands shown after `next=` can now be copied directly.

  - id: RN-01400-5
    kind: feat
    impact: normal
    subject: "Statusline integrations can consume facts without parsing presentation text"
    detail: >
      `a2a statusline --json` returns the counts, urgent item, stale/update
      facts, severity, and quiet state from the same computed result as the
      text renderer. `--sample` produces a deterministic non-empty result
      without config or network, so shell wiring can be tested before a space
      is connected. `--no-prefix` removes only the leading `a2a: ` from text.
      The default text, quiet behavior, and exit codes are byte-compatible.
    affects: ["a2a statusline"]
    action:
      scope: local
      why: >
        Prefer JSON for a host integration and use sample mode while wiring it.
      run:
        - "a2a statusline --sample"
        - "a2a statusline --json"

  - id: RN-01400-6
    kind: fix
    impact: high
    subject: "The merge gate rejects a hand-authored illegal or unauthorized lifecycle event"
    detail: >
      Pre-write CLI and MCP checks were not a product boundary: a contributor
      could hand-author event YAML and open a PR around them. In v3-pr, each
      changed event now passes event/v1 first and is then checked as a candidate
      against merge-base history, with every changed candidate excluded from
      its own prior. The verdict comes from the same fold legality primitive as
      local writes, including response-scoped verify/dispute and per-version
      contract transitions. Illegal transitions report LFC-001 and unauthorized
      actors LFC-002 in the existing per-path CI result.
    affects: ["a2a validate"]
    action:
      scope: space
      why: >
        Spaces receive this protection after updating their reusable validation
        workflow pin to this release.
      run:
        - "a2a space update"

  - id: RN-01400-7
    kind: fix
    impact: low
    subject: "Pending-marker cache paths reject traversal-shaped identifiers"
    detail: >
      Pending marker reads, writes, removals, and whole-space cleanup now
      require one safe path component for both the space and artifact id.
      Normal IDs are unchanged; malformed values containing separators or
      dot-components fail before touching a path outside the pending cache.
    affects: ["a2a await"]
    action:
      scope: none
      why: >
        Defensive hardening. Valid space and artifact identifiers need no
        migration.

  - id: RN-01400-8
    kind: known-issue
    impact: normal
    subject: "The authored per-version live scenario still has no successful exact-tree run"
    detail: >
      The rolling-window scenario is present in the live matrix and drives real
      GitHub with both provisioned identities: several published lines, a
      deprecation, a late adoption, a maintenance publish, acknowledgement,
      retirement while newer lines remain live, and a post-retire publish.
      This release session could not dispatch it because the dedicated
      A2A_LIVE_E2E credentials are not configured and the local GitHub CLI
      credential is invalid.
      Unit, race, merge-gate, and harness tests remain green, but they do not
      substitute for the real Actions/protection/write-funnel path. The known
      issue from 0.13.0 therefore remains open rather than being rounded up to
      verified.
    affects: ["a2a contract publish", "a2a contract deprecate", "a2a contract retire"]
    action:
      scope: none
      why: >
        No user action. The release operator must run the full live matrix with
        the dedicated throwaway-org credentials before calling this row closed.
