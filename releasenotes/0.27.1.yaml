schema: release-notes/v1
version: 0.27.1
released: '2026-10-30'
headline: a contract schema may name itself, and a build from source says it is one
changes:
- id: RN-02701-0
  kind: fix
  impact: normal
  subject: a contract schema whose root $id names the document itself is no longer refused
  detail: >
    `a2a contract publish` and `a2a validate` refused every `$id` that was
    not a bare `#` fragment in a published contract schema, including the
    root one. JSON Schema uses
    a root `$id` to name the document, so a schema
    with `"$id": "urn:example:orders:v1"` at its top was rejected as if it
    reached outside itself, and the only way through was to delete the
    identifier.

    A root `$id` that is an absolute URI with no fragment is now accepted.
    A non-fragment `$id` below the root, a root `$id` with a fragment, and every
    non-fragment `$ref` are still refused, because each of those can make
    the schema depend on a document the space does not carry. The refusal
    now names the offending keyword and where it sits: `<key> at <pointer>`,
    or `at the document root`.
  action:
    scope: none
    why: >
      Nothing is owed. A schema published with its root `$id` removed is
      still valid; putting the identifier back is optional.
  roadmap:
    visibility: omit
    why: >
      A narrower refusal of one schema keyword; no reader of the roadmap
      would plan around it.
- id: RN-02701-1
  kind: feat
  impact: low
  subject: a binary built from source names itself, and so does every write it makes
  detail: >
    A binary installed from the repository's own checkout with
    `make deliver` reports `a2a <version> (local, <commit>)`, where the
    version is that of the last published release. `make deliver` installs
    only a commit whose exact bytes have already passed the repository's
    gate.

    Every write to a space now carries an `A2A-Built-By:` paragraph in its
    commit message naming the binary that made it: `a2a 0.27.1 (<commit>)`
    from a release, `a2a <version> (local, <commit>)` from a build delivered
    from source. A reader of the space's history can tell a write made by an
    unpublished build from one made by a release. A binary that does not
    know its commit writes no such paragraph. The note is never part of the
    event data, so the event bytes are those a release would write.

    `a2a update` neither replaces such a binary nor offers to. It names how
    to get new code from source and how to return to a release.
    `a2a doctor` says the binary is a local build, and when a space's
    `min_binary_version` floor fails, it says the floor is met by
    delivering a newer commit.

    Apart from that paragraph, a released binary behaves exactly as before.
  action:
    scope: none
    why: >
      Nothing is owed. A tool that reads a space's commit messages sees one
      more paragraph above the funnel's own trailers; the event data is
      unchanged.
  roadmap:
    visibility: omit
    why: >
      A maintainer's delivery channel; a reader of the roadmap sees no new
      capability.
- id: RN-02701-2
  kind: feat
  impact: normal
  subject: a session can block until another system's move that concerns it lands
  detail: >
    `a2a wait` blocks until another system's event that concerns this system
    lands in a configured space, prints one line per event (space, event id,
    actor, transition, subject and why it matched) and exits 0. "Concerns
    me" covers what `a2a inbox --actionable` cannot show: an acknowledge, a
    note or a close on an artifact this system authored, and any move on a
    thread it takes part in. `--subject` and `--thread` narrow the wait to
    one artifact or one thread.

    It exits 124 when `--timeout` (default 30 minutes) passes with every
    space observed and nothing landed, and 3 when a space could not be
    observed, so silence there proves nothing. A local space is watched
    by reading its bare repository's `main`, with no network; a GitHub space
    is fetched on an interval that grows from 30 seconds to 5 minutes while
    nothing changes. A cursor under `.a2a/cache/wait/` makes re-running it
    lossless. The printed line never carries a note's or an artifact's text,
    and an event whose content disagrees with its file's path is reported by
    path, never printed. When it cannot watch a space it says what it tried,
    what it found and what to run next.
  action:
    scope: none
    why: >
      Nothing is owed. To be woken instead of polling, run it as a background
      command and re-run it after it exits; the skill's watch-loop page has
      the recipe.
  roadmap:
    visibility: shipped
    why: >
      An agent can now hear a counterparty's move without a person relaying
      it or a timer polling for it.
- id: RN-02701-3
  kind: feat
  impact: normal
  subject: a local space can be deleted, and connecting one no longer leaves a stray clone
  detail: >
    `a2a space delete --local <id>` removes a local space. Without
    `--approve` it changes nothing and shows the repository, its commits and
    every other participant; with it, it removes the repository and
    disconnects this project. It refuses a repository `a2a space init
    --local` did not make. Renaming a local space is a re-create; the
    onboarding page has the four steps.

    `a2a init` now records where the space's mirror lives, so a read before
    `a2a connect` clones where every later read looks, and the first
    `connect` says it cloned rather than "repaired". A clone an older
    version left behind is removed when it is provably the superseded one.
    `init` also prints which of the files it wrote to commit, and its hint
    no longer mentions credentials for a local space.

    A project config whose space `id` or `mirror_location` is not a single
    name (for example `../..`) is now refused when it is loaded, because
    `connect` and `disconnect` delete the directory that name points to.
    `connect` and `disconnect` also refuse a project config they cannot
    read instead of treating it as empty and writing over it, and `init`
    and `connect` refuse a space id that is not a single name before they
    write anything.
  action:
    scope: none
    why: >
      Nothing is owed. A project set up before this version may hold a stale
      clone under `.a2a/cache/mirrors/`; the next `a2a connect` removes it
      when it can prove it is the superseded one, and names it otherwise.
  roadmap:
    visibility: shipped
    why: >
      The local space, new in 0.27.0, gets its missing lifecycle step.
- id: RN-02701-4
  kind: policy
  impact: low
  subject: this release was proved without the GitHub live matrix
  detail: >
    This release changes the commit messages the shared write funnel writes
    (every write gains an `A2A-Built-By:` paragraph), the contract
    validator, and two verbs that run against a space (`a2a wait`, and the
    local space's `connect` and `delete`). It was cut on the provider-deferred
    tier, by the operator's written authorization: the logic tier, the full
    container suite and the release preflight were run; the live provider was
    not.

    Not proven for this release: branch protection blocking until green,
    `enforce_admins` binding a participant while skipping an admin, a
    cross-section authorization decision surviving a privileged re-trigger,
    GitHub serving a check computed against a stale ref, a direct push to
    `main` being refused, the shipped Actions workflow running
    `a2a validate --ci`, compound check-run name resolution, and a space's own
    CI having no unexplained failures. The last live run against GitHub is
    dated 2026-08-02 (v0.18.2). A space on your own disk does not depend on
    any of these rows; a GitHub space does.
  affects:
  - a2a binary
  action:
    scope: none
    why: >
      Nothing to do. Recorded so the omission is readable rather than assumed.
