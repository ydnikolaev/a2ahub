schema: release-notes/v1
version: 0.27.1
released: unreleased
headline: a contract schema may name itself, and a build from source says it is one
changes:
- id: RN-02701-0
  kind: fix
  impact: normal
  subject: a contract schema whose root $id names the document itself is no longer refused
  detail: >
    `a2a contract publish` and `a2a validate` refused every `$id` that was
    not a bare `#` fragment in a published contract schema, including the
    root one. JSON Schema uses
    a root `$id` to name the document, so a schema
    with `"$id": "urn:example:orders:v1"` at its top was rejected as if it
    reached outside itself, and the only way through was to delete the
    identifier.

    A root `$id` that is an absolute URI with no fragment is now accepted.
    A non-fragment `$id` below the root, a root `$id` with a fragment, and every
    non-fragment `$ref` are still refused, because each of those can make
    the schema depend on a document the space does not carry. The refusal
    now names the offending keyword and where it sits: `<key> at <pointer>`,
    or `at the document root`.
  action:
    scope: none
    why: >
      Nothing is owed. A schema published with its root `$id` removed is
      still valid; putting the identifier back is optional.
  roadmap:
    visibility: omit
    why: >
      A narrower refusal of one schema keyword; no reader of the roadmap
      would plan around it.
- id: RN-02701-1
  kind: feat
  impact: low
  subject: a binary built from source names itself, and so does every write it makes
  detail: >
    A binary installed from the repository's own checkout with
    `make deliver` reports `a2a <version> (local, <commit>)`, where the
    version is that of the last published release. `make deliver` installs
    only a commit whose exact bytes have already passed the repository's
    gate. Every write such a binary makes to a space carries an
    `A2A-Built-By: <that same string>` paragraph in its commit message,
    so a reader of the space's history can tell a write made by an
    unpublished build from one made by a release. The note is never part of
    the event data, so the event bytes are those a release would write.

    `a2a update` neither replaces such a binary nor offers to. It names how
    to get new code from source and how to return to a release.
    `a2a doctor` says the binary is a local build, and when a space's
    `min_binary_version` floor fails, it says the floor is met by
    delivering a newer commit.

    A released binary behaves exactly as before and writes no such note.
  action:
    scope: none
    why: >
      Nothing is owed. Only a binary built with `make deliver` behaves
      differently, and only on the machine that built it.
  roadmap:
    visibility: omit
    why: >
      A maintainer's delivery channel; a reader of the roadmap sees no new
      capability.
- id: RN-02701-2
  kind: feat
  impact: normal
  subject: a session can block until another system's move that concerns it lands
  detail: >
    `a2a wait` blocks until another system's event that concerns this system
    lands in a configured space, prints one line per event (space, event id,
    actor, transition, subject and why it matched) and exits 0. "Concerns
    me" covers what `a2a inbox --actionable` cannot show: an acknowledge, a
    note or a close on an artifact this system authored, and any move on a
    thread it takes part in. `--subject` and `--thread` narrow the wait to
    one artifact or one thread.

    It exits 124 when `--timeout` (default 30 minutes) passes with every
    space observed and nothing landed, and 3 when a space could not be
    observed, so silence there proves nothing. A local space is watched
    by reading its bare repository's `main`, with no network; a GitHub space
    is fetched on an interval that grows from 30 seconds to 5 minutes while
    nothing changes. A cursor under `.a2a/cache/wait/` makes re-running it
    lossless. The printed line never carries a note's or an artifact's text.
  action:
    scope: none
    why: >
      Nothing is owed. To be woken instead of polling, run it as a background
      command and re-run it after it exits; the skill's watch-loop page has
      the recipe.
  roadmap:
    visibility: shipped
    why: >
      An agent can now hear a counterparty's move without a person relaying
      it or a timer polling for it.
