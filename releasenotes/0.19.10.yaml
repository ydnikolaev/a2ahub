schema: release-notes/v1
version: "0.19.10"
released: "2026-08-08"
headline: "The domain says what a state means, and every surface reads the same answer"
changes:
  - id: RN-01910-0
    kind: feat
    roadmap:
      visibility: shipped
      why: "An agent reading a state now gets the domain's own answer to what it means and what produced it, instead of each surface deciding separately — which is the difference between a protocol and a set of conventions."
    impact: normal
    subject: "An artifact now reports what its state MEANS, and which event put it there"
    detail: >
      Four surfaces each decided, separately, what a state was worth telling you
      about it. The dashboard did it from three lists of state names with no
      notion of artifact type, and being type-blind is what made them wrong.
      A retired contract was filed as cancelled — so an orderly retirement and
      an abandoned artifact rendered as the same event, when retiring a contract
      is how a contract's life is supposed to end. And `accepted` was one entry
      for every type, though on a handoff it is where the exchange ENDS (it is
      what a passing verification produces) and on a question it is the middle
      of the work. One list could not be right for both.
      The domain answers now, and every surface reads that answer instead of
      computing its own. `a2a inbox`, `a2a outbox`, `a2a thread --json` and the
      MCP read tools carry two new fields per artifact: `outcome` — one of open,
      settled, refused, withdrawn, superseded — and `terminal`, whether any move
      can still follow.
      They are deliberately different questions, and the difference is not
      pedantry: a rejected decision is `refused` AND non-terminal, because it can
      still be superseded. A failed handoff is the same shape, and the producer
      is the one who owes the resubmission.
      Alongside them, three fields answer "since when, and who": `state_since`,
      `state_by` and `state_event` name the event that produced the current
      state. That is NOT the artifact's latest event. A `note` changes nothing
      about state, and the dashboard had been reading the newest event of any
      kind under a "moved" label — so an artifact looked like it had moved when
      somebody had only commented. Both clocks are now carried, separately.
      Events themselves say which kind they are. `transition_free` marks an
      event that changes no state — a note anywhere, and an acknowledgement of
      a broadcast. It is not something a reader can work out from the
      transition name: acknowledging a requirement moves it, acknowledging a
      broadcast does not, so the same word means both. It appears on
      `a2a thread --json`, `a2a show --json` and the dashboard.
    action:
      scope: none
      why: >
        Nothing to do. The new fields are additive on read surfaces. If you
        parse `a2a inbox --json` or `a2a thread --json`, prefer `outcome` and
        `terminal` over matching state names yourself — matching names is what
        every surface used to do, and it is what got `retired` and handoff
        `accepted` wrong.
  - id: RN-01910-2
    kind: feat
    roadmap:
      visibility: omit
      why: "A hidden machine-consumed surface whose only consumer is a repo gate. Naming it on the public roadmap would advertise an interface no agent or operator is meant to call directly."
    impact: low
    subject: "`a2a __catalog --vocabulary --json` publishes the domain's own vocabulary"
    detail: >
      The hidden `__catalog` verb gained a machine-readable mode listing every
      outcome, every state per artifact type, and every transition name — all
      derived from the transition table rather than written out.
      It exists so a check can police what the dashboard is allowed to spell
      without carrying its own copy of the list. A copy is correct the day it
      is written and silently wrong the day a state is added, which is how
      `canceled` — spelled with one `l`, matching nothing the protocol can
      ever produce — sat inside the dashboard's own "is this cancelled" list
      until a check derived from the binary found it.
      The plain `a2a __catalog` output is unchanged.
    action:
      scope: none
      why: >
        Nothing to do. This is an internal surface; the flag is stable if you
        want to read it, but nothing in normal operation calls it.
  - id: RN-01910-3
    kind: fix
    impact: normal
    subject: "The session the tool already detected now reaches the record"
    detail: >
      When an agent acts, a2a can tell which agent session it is — that is how
      several events get correlated back to one conversation. The value was
      detected and then dropped on the floor: no struct on the authoring path
      had a field for it, no event writer carried it, and the policy check that
      bounds its length had nothing to check, because nothing could produce one.
      A session id did get written in exactly one place — the work-checkpoint
      path — which mints its own instead of asking detection. So the value
      existed twice and neither copy was the real one.
      Drafts and events now carry `actor.session` and `actor.model` when the
      environment supplies them. An explicit `--field actor.session=` still
      wins: naming it yourself is adding information, not contradicting the
      environment.
      One asymmetry is deliberate. `a2a submit` records the actor from the
      DRAFT it is submitting, not whoever ran the command — a submit event says
      who authored the artifact, and re-resolving would credit the wrong party.
    action:
      scope: none
      why: >
        Nothing to do. If your harness exports a session id, new drafts and
        events pick it up; existing records are untouched.
  - id: RN-01910-4
    kind: fix
    impact: low
    subject: "A template's own actor kind is no longer overwritten by a default nobody chose"
    detail: >
      The decision template declares `kind: human` for its actor, with a note
      saying why: approving a decision is a human gate, so a decision usually
      carries a human actor. Drafting one overwrote that with `agent` every
      time — not because anything had decided the actor was an agent, but
      because `agent` is what the resolver falls back to when nothing names a
      kind.
      A fallback and a choice are different things, and the draft could not
      tell them apart. Now it can: an explicit `--actor-kind`, or a detected
      agent, still wins over whatever the template declares, and a bare
      default leaves the template's own value standing.
    action:
      scope: none
      why: >
        Nothing to do. `a2a new decision` now keeps `kind: human` unless you
        say otherwise; every other template already declared `agent`, so
        nothing changes for them.
  - id: RN-01910-5
    kind: fix
    impact: normal
    subject: "Five schema-legal envelope fields you could not actually set"
    detail: >
      `effort_estimate`, `supersedes`, `origin`, `migrated_from` and — on most
      types — `expected_response` are legal on every artifact and appear in no
      template. Setting one with `--field` was refused for not being in the
      template, and putting it in the template was not an option either: every
      draft would then carry an unfilled placeholder, which submit refuses.
      Neither end could move, so the fields stayed unusable.
      What a draft may contain is the schema's answer, not the template's — a
      template is one convenience over the schema. `--field` now adds a key the
      schema allows AND that you are entitled to set, so the field appears only
      when you ask for it and no other draft changes.
      Three of the five stay unavailable, each for its own reason:
      `migrated_from` is stamped by the tool during a migration and is not
      yours to type; `origin` and `expected_response` are a list and a block,
      and `--field` sets single values only. The two that were genuinely yours
      to state — `effort_estimate` and `supersedes` — now work.
      A name the schema does not have is still refused, so a typo stays a typo.
    action:
      scope: none
      why: >
        Nothing to do. `a2a new question --field origin=...` and the other four
        now work; drafts you do not ask for them on are unchanged.
  - id: RN-01910-6
    kind: fix
    impact: high
    subject: "A decision or handoff whose counterparty left the space can now be closed by its sender"
    detail: >
      Three situations left a sender with nothing they could legally do.
      A decision waiting on approvers who have all left the space stayed
      `proposed` forever: approving and rejecting belong to the approvers, and
      the proposer had no move at all. A handoff whose receiver left stayed
      `submitted` or `acknowledged` the same way — including handoffs carrying
      committed payload bytes, which is the case that hurts.
      The tooling already knew what should happen. When every counterparty has
      left, the "whose move is it" answer transfers to the sender and says they
      owe a cancel-or-re-route decision. That was a promise the transition
      table could not keep: it named the sender and then refused every move
      the sender could make.
      A proposer can now withdraw or supersede their own proposed decision,
      and a producer can supersede a submitted or acknowledged handoff.
      Withdraw and supersede stay separate on purpose — "no longer needed" and
      "replaced by this one" are different statements, and forcing one to
      stand in for the other is the kind of substitution this work exists to
      remove.
    action:
      scope: none
      why: >
        Nothing to do. If you have a decision or handoff stuck because the
        other side left, `a2a withdraw` or `a2a supersede` now works on it.
  - id: RN-01910-7
    kind: fix
    impact: high
    subject: "An artifact addressed to several systems now lets every one of them act"
    detail: >
      A requirement, contract, decision or announcement may be addressed to
      more than one system — nothing in the schema limits it, and only the
      four exchange types do. When one was, the tooling told all of the
      addressees the move was theirs and then accepted it from the first one
      only. The other named systems saw `your_move: true`, tried the move
      they had been told they owed, and were refused.
      One `a2a thread --json` object could carry three systems under
      "waiting on" and one under "next actions" at the same time. Every
      addressee named on an artifact can now act on it.
      The same narrowing sat on a second, quieter path: attaching a note.
      A note is open to either party by design — it changes no state, and
      commenting is how a party says something the transitions have no word
      for. On a multi-addressee artifact only the first addressee could leave
      one, so a system that had just been allowed to acknowledge was refused
      when it tried to explain itself.
      The check that exists to catch precisely this disagreement could not
      see it: its probe addressed a single system, so the two sides agreed
      trivially. It now probes three.
    action:
      scope: none
      why: >
        Nothing to do. If you were named on a multi-addressee artifact and
        your acknowledgement, decline or note was refused, it works now.
  - id: RN-01910-9
    kind: fix
    impact: normal
    subject: "A blocked question or work request can now be cancelled"
    detail: >
      A blocked exchange is the one most likely to be abandoned — the work
      stopped because something outside it did not arrive — and it was the
      one state from which cancelling was refused. Every other live state
      accepted it: draft, submitted, acknowledged, accepted, in progress.
      So a requester who no longer needed a blocked request had two options,
      both wrong. Wait for a party that is by definition not the one who can
      unblock it, or reach for `supersede`, which states "replaced by this
      other artifact" — a different claim, recorded permanently, about work
      that was simply no longer needed.
      `a2a cancel` now works from `blocked` on questions and work requests.
    action:
      scope: none
      why: >
        Nothing to do. A blocked request you had left open because you could
        not close it honestly can now be cancelled.
  - id: RN-01910-8
    kind: feat
    roadmap:
      visibility: shipped
      why: "An agent asking any surface whose move it is now gets the same answer with the same justification, which is what makes the answer worth acting on."
    impact: normal
    subject: "`a2a inbox` and `a2a outbox` now say who owes the next move, which move, and why"
    detail: >
      The answer was already being computed for these commands — it decides
      whether `--actionable` lists an artifact at all — and then thrown away.
      So `a2a thread --json` showed the conclusion and the reasoning behind
      it, while `a2a inbox --json` showed neither for the same artifact.
      Both now carry `waiting_on`, `expected_transition` and `why`. The last
      one matters most: "nobody owes anything" is a claim the tooling has to
      justify rather than something that falls out of a filter, and a surface
      that shows a verdict while withholding its reason republishes the
      ambiguity the verdict exists to remove.
    action:
      scope: none
      why: >
        Nothing to do. The three fields are additive. If you were parsing
        `--actionable` to guess why something appeared, read `why` instead.
  - id: RN-01910-10
    kind: fix
    impact: high
    subject: "A deprecation you are registered for no longer disappears from your exchange feed"
    detail: >
      When a contract you consume is deprecated, the announcement is
      addressed to you two ways: by the recipient list frozen at deprecation
      time, and by the live registry of who actually consumes the contract.
      The second is the one that matters — a system that adopted the contract
      after the announcement was written is not in the frozen list, and
      `a2a contract retire` still refuses to retire until that system has
      acknowledged.
      The exchange feed used a third rule of its own. It required the
      announcement's `ack_requested` flag before considering anyone at all,
      and the registry-matched half of the addressing carries no such
      qualifier. So a deprecation published without the flag was filed as
      delivered and archived out of the consumer's feed, while the retire it
      was blocking named that same consumer as the reason.
      The feed asks the same relation as every other surface now, so the
      announcement stays in front of the system that owes the acknowledgement.
      Two more answers stop disagreeing as a consequence: `a2a inbox --json`
      now justifies "nobody owes anything" the way `a2a thread --json`
      already did, and the departed-counterparty verdict — the sender owes a
      cancel-or-re-route decision when every addressee has left — is the same
      on both.
    action:
      scope: none
      why: >
        Nothing to do. If a deprecation vanished from your exchange view
        while a retire was blocked on your acknowledgement, it is visible
        again.
  - id: RN-01910-11
    kind: fix
    impact: normal
    subject: "A response now says who owes the next move, on every surface that lists it"
    detail: >
      A response artifact answers somebody else's question or work request, and
      it carries no addressee of its own — so who owes the verify is resolved
      from the PARENT it answers. `a2a thread --json` did that. `a2a inbox
      --json` did not: it had no parent in hand, and the answer degraded to
      "nobody owes anything" rather than to an error. One artifact, two
      answers, on two commands reading the same data.
      Both surfaces resolve the parent now. `a2a outbox --json` also carries
      `waiting_on`, `expected_transition` and `why` for the first time — they
      were promised when the fields were added and only the inbox had been
      wired.
      Alongside, one string stops reaching readers. When an artifact is in a
      state no obligation is defined for — a declined request you are still
      listed on — the justification read "this should be unreachable" and
      named an internal function. That sentence was written for a surface
      where it was true and became visible on one where it is not; the state
      is now described plainly, and the claim it used to make is proven by a
      test instead of narrated to a user.
    action:
      scope: none
      why: >
        Nothing to do. If you parse `a2a outbox --json`, three fields that
        were always absent may now be present; they are the same fields
        `a2a inbox --json` already carried.
  - id: RN-01910-1
    kind: fix
    impact: normal
    subject: "The reason code an agent is required to supply when refusing now reaches the reader"
    detail: >
      Declining a request requires a machine-readable `reason_code` — the MCP
      tool refuses the call without one, and both event schemas define the
      field. It was written into the event and then read by nobody: the cache
      that builds every read surface never decoded it, so the only thing a
      receiver could act on was the prose note beside it.
      That is exactly the substitution the code exists to prevent, and it had
      been true since the field was introduced. `a2a thread --json` and
      `a2a show --json` now both carry `reason_code` on the event that supplied
      one — `show` in particular, since that is the command you run to find out
      why something was refused.
    action:
      scope: none
      why: >
        Nothing to do. Existing declines already carry the code in their
        committed events, so it becomes visible with no migration and no
        re-authoring.
