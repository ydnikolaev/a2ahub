schema: release-notes/v1
version: "0.19.10"
released: "2026-08-08"
headline: "The domain says what a state means, and every surface reads the same answer"
changes:
  - id: RN-01910-0
    kind: feat
    roadmap:
      visibility: shipped
      why: "An agent reading a state now gets the domain's own answer to what it means and what produced it, instead of each surface deciding separately — which is the difference between a protocol and a set of conventions."
    impact: normal
    subject: "An artifact now reports what its state MEANS, and which event put it there"
    detail: >
      Four surfaces each decided, separately, what a state was worth telling you
      about it. The dashboard did it from three lists of state names with no
      notion of artifact type, and being type-blind is what made them wrong.
      A retired contract was filed as cancelled — so an orderly retirement and
      an abandoned artifact rendered as the same event, when retiring a contract
      is how a contract's life is supposed to end. And `accepted` was one entry
      for every type, though on a handoff it is where the exchange ENDS (it is
      what a passing verification produces) and on a question it is the middle
      of the work. One list could not be right for both.
      The domain answers now, and every surface reads that answer instead of
      computing its own. `a2a inbox`, `a2a outbox`, `a2a thread --json` and the
      MCP read tools carry two new fields per artifact: `outcome` — one of open,
      settled, refused, withdrawn, superseded — and `terminal`, whether any move
      can still follow.
      They are deliberately different questions, and the difference is not
      pedantry: a rejected decision is `refused` AND non-terminal, because it can
      still be superseded. A failed handoff is the same shape, and the producer
      is the one who owes the resubmission.
      Alongside them, three fields answer "since when, and who": `state_since`,
      `state_by` and `state_event` name the event that produced the current
      state. That is NOT the artifact's latest event. A `note` changes nothing
      about state, and the dashboard had been reading the newest event of any
      kind under a "moved" label — so an artifact looked like it had moved when
      somebody had only commented. Both clocks are now carried, separately.
      Events themselves say which kind they are. `transition_free` marks an
      event that changes no state — a note anywhere, and an acknowledgement of
      a broadcast. It is not something a reader can work out from the
      transition name: acknowledging a requirement moves it, acknowledging a
      broadcast does not, so the same word means both. It appears on
      `a2a thread --json`, `a2a show --json` and the dashboard.
    action:
      scope: none
      why: >
        Nothing to do. The new fields are additive on read surfaces. If you
        parse `a2a inbox --json` or `a2a thread --json`, prefer `outcome` and
        `terminal` over matching state names yourself — matching names is what
        every surface used to do, and it is what got `retired` and handoff
        `accepted` wrong.
  - id: RN-01910-2
    kind: feat
    roadmap:
      visibility: omit
      why: "A hidden machine-consumed surface whose only consumer is a repo gate. Naming it on the public roadmap would advertise an interface no agent or operator is meant to call directly."
    impact: low
    subject: "`a2a __catalog --vocabulary --json` publishes the domain's own vocabulary"
    detail: >
      The hidden `__catalog` verb gained a machine-readable mode listing every
      outcome, every state per artifact type, and every transition name — all
      derived from the transition table rather than written out.
      It exists so a check can police what the dashboard is allowed to spell
      without carrying its own copy of the list. A copy is correct the day it
      is written and silently wrong the day a state is added, which is how
      `canceled` — spelled with one `l`, matching nothing the protocol can
      ever produce — sat inside the dashboard's own "is this cancelled" list
      until a check derived from the binary found it.
      The plain `a2a __catalog` output is unchanged.
    action:
      scope: none
      why: >
        Nothing to do. This is an internal surface; the flag is stable if you
        want to read it, but nothing in normal operation calls it.
  - id: RN-01910-3
    kind: fix
    impact: normal
    subject: "The session the tool already detected now reaches the record"
    detail: >
      When an agent acts, a2a can tell which agent session it is — that is how
      several events get correlated back to one conversation. The value was
      detected and then dropped on the floor: no struct on the authoring path
      had a field for it, no event writer carried it, and the policy check that
      bounds its length had nothing to check, because nothing could produce one.
      A session id did get written in exactly one place — the work-checkpoint
      path — which mints its own instead of asking detection. So the value
      existed twice and neither copy was the real one.
      Drafts and events now carry `actor.session` and `actor.model` when the
      environment supplies them. An explicit `--field actor.session=` still
      wins: naming it yourself is adding information, not contradicting the
      environment.
      One asymmetry is deliberate. `a2a submit` records the actor from the
      DRAFT it is submitting, not whoever ran the command — a submit event says
      who authored the artifact, and re-resolving would credit the wrong party.
    action:
      scope: none
      why: >
        Nothing to do. If your harness exports a session id, new drafts and
        events pick it up; existing records are untouched.
  - id: RN-01910-4
    kind: fix
    impact: low
    subject: "A template's own actor kind is no longer overwritten by a default nobody chose"
    detail: >
      The decision template declares `kind: human` for its actor, with a note
      saying why: approving a decision is a human gate, so a decision usually
      carries a human actor. Drafting one overwrote that with `agent` every
      time — not because anything had decided the actor was an agent, but
      because `agent` is what the resolver falls back to when nothing names a
      kind.
      A fallback and a choice are different things, and the draft could not
      tell them apart. Now it can: an explicit `--actor-kind`, or a detected
      agent, still wins over whatever the template declares, and a bare
      default leaves the template's own value standing.
    action:
      scope: none
      why: >
        Nothing to do. `a2a new decision` now keeps `kind: human` unless you
        say otherwise; every other template already declared `agent`, so
        nothing changes for them.
  - id: RN-01910-5
    kind: fix
    impact: normal
    subject: "Five schema-legal envelope fields you could not actually set"
    detail: >
      `effort_estimate`, `supersedes`, `origin`, `migrated_from` and — on most
      types — `expected_response` are legal on every artifact and appear in no
      template. Setting one with `--field` was refused for not being in the
      template, and putting it in the template was not an option either: every
      draft would then carry an unfilled placeholder, which submit refuses.
      Neither end could move, so the fields stayed unusable.
      What a draft may contain is the schema's answer, not the template's — a
      template is one convenience over the schema. `--field` now adds a key the
      schema allows AND that you are entitled to set, so the field appears only
      when you ask for it and no other draft changes.
      Three of the five stay unavailable, each for its own reason:
      `migrated_from` is stamped by the tool during a migration and is not
      yours to type; `origin` and `expected_response` are a list and a block,
      and `--field` sets single values only. The two that were genuinely yours
      to state — `effort_estimate` and `supersedes` — now work.
      A name the schema does not have is still refused, so a typo stays a typo.
    action:
      scope: none
      why: >
        Nothing to do. `a2a new question --field origin=...` and the other four
        now work; drafts you do not ask for them on are unchanged.
  - id: RN-01910-6
    kind: fix
    impact: high
    subject: "A decision or handoff whose counterparty left the space can now be closed by its sender"
    detail: >
      Three situations left a sender with nothing they could legally do.
      A decision waiting on approvers who have all left the space stayed
      `proposed` forever: approving and rejecting belong to the approvers, and
      the proposer had no move at all. A handoff whose receiver left stayed
      `submitted` or `acknowledged` the same way — including handoffs carrying
      committed payload bytes, which is the case that hurts.
      The tooling already knew what should happen. When every counterparty has
      left, the "whose move is it" answer transfers to the sender and says they
      owe a cancel-or-re-route decision. That was a promise the transition
      table could not keep: it named the sender and then refused every move
      the sender could make.
      A proposer can now withdraw or supersede their own proposed decision,
      and a producer can supersede a submitted or acknowledged handoff.
      Withdraw and supersede stay separate on purpose — "no longer needed" and
      "replaced by this one" are different statements, and forcing one to
      stand in for the other is the kind of substitution this work exists to
      remove.
    action:
      scope: none
      why: >
        Nothing to do. If you have a decision or handoff stuck because the
        other side left, `a2a withdraw` or `a2a supersede` now works on it.
  - id: RN-01910-7
    kind: fix
    impact: high
    subject: "An artifact addressed to several systems now lets every one of them act"
    detail: >
      A requirement, contract, decision or announcement may be addressed to
      more than one system — nothing in the schema limits it, and only the
      four exchange types do. When one was, the tooling told all of the
      addressees the move was theirs and then accepted it from the first one
      only. The other named systems saw `your_move: true`, tried the move
      they had been told they owed, and were refused.
      One `a2a thread --json` object could carry three systems under
      "waiting on" and one under "next actions" at the same time. Every
      addressee named on an artifact can now act on it.
      The same narrowing sat on a second, quieter path: attaching a note.
      A note is open to either party by design — it changes no state, and
      commenting is how a party says something the transitions have no word
      for. On a multi-addressee artifact only the first addressee could leave
      one, so a system that had just been allowed to acknowledge was refused
      when it tried to explain itself.
      The check that exists to catch precisely this disagreement could not
      see it: its probe addressed a single system, so the two sides agreed
      trivially. It now probes three.
    action:
      scope: none
      why: >
        Nothing to do. If you were named on a multi-addressee artifact and
        your acknowledgement, decline or note was refused, it works now.
  - id: RN-01910-9
    kind: fix
    impact: normal
    subject: "A blocked question or work request can now be cancelled"
    detail: >
      A blocked exchange is the one most likely to be abandoned — the work
      stopped because something outside it did not arrive — and it was the
      one state from which cancelling was refused. Every other live state
      accepted it: draft, submitted, acknowledged, accepted, in progress.
      So a requester who no longer needed a blocked request had two options,
      both wrong. Wait for a party that is by definition not the one who can
      unblock it, or reach for `supersede`, which states "replaced by this
      other artifact" — a different claim, recorded permanently, about work
      that was simply no longer needed.
      `a2a cancel` now works from `blocked` on questions and work requests.
    action:
      scope: none
      why: >
        Nothing to do. A blocked request you had left open because you could
        not close it honestly can now be cancelled.
  - id: RN-01910-8
    kind: feat
    roadmap:
      visibility: shipped
      why: "An agent asking any surface whose move it is now gets the same answer with the same justification, which is what makes the answer worth acting on."
    impact: normal
    subject: "`a2a inbox` and `a2a outbox` now say who owes the next move, which move, and why"
    detail: >
      The answer was already being computed for these commands — it decides
      whether `--actionable` lists an artifact at all — and then thrown away.
      So `a2a thread --json` showed the conclusion and the reasoning behind
      it, while `a2a inbox --json` showed neither for the same artifact.
      Both now carry `waiting_on`, `expected_transition` and `why`. The last
      one matters most: "nobody owes anything" is a claim the tooling has to
      justify rather than something that falls out of a filter, and a surface
      that shows a verdict while withholding its reason republishes the
      ambiguity the verdict exists to remove.
    action:
      scope: none
      why: >
        Nothing to do. The three fields are additive. If you were parsing
        `--actionable` to guess why something appeared, read `why` instead.
  - id: RN-01910-10
    kind: fix
    impact: high
    subject: "A deprecation you are registered for no longer disappears from your exchange feed"
    detail: >
      When a contract you consume is deprecated, the announcement is
      addressed to you two ways: by the recipient list frozen at deprecation
      time, and by the live registry of who actually consumes the contract.
      The second is the one that matters — a system that adopted the contract
      after the announcement was written is not in the frozen list, and
      `a2a contract retire` still refuses to retire until that system has
      acknowledged.
      The exchange feed used a third rule of its own. It required the
      announcement's `ack_requested` flag before considering anyone at all,
      and the registry-matched half of the addressing carries no such
      qualifier. So a deprecation published without the flag was filed as
      delivered and archived out of the consumer's feed, while the retire it
      was blocking named that same consumer as the reason.
      The feed asks the same relation as every other surface now, so the
      announcement stays in front of the system that owes the acknowledgement.
      Two more answers stop disagreeing as a consequence: `a2a inbox --json`
      now justifies "nobody owes anything" the way `a2a thread --json`
      already did, and the departed-counterparty verdict — the sender owes a
      cancel-or-re-route decision when every addressee has left — is the same
      on both.
    action:
      scope: none
      why: >
        Nothing to do. If a deprecation vanished from your exchange view
        while a retire was blocked on your acknowledgement, it is visible
        again.
  - id: RN-01910-11
    kind: fix
    impact: normal
    subject: "A response now says who owes the next move, on every surface that lists it"
    detail: >
      A response artifact answers somebody else's question or work request, and
      it carries no addressee of its own — so who owes the verify is resolved
      from the PARENT it answers. `a2a thread --json` did that. `a2a inbox
      --json` did not: it had no parent in hand, and the answer degraded to
      "nobody owes anything" rather than to an error. One artifact, two
      answers, on two commands reading the same data.
      Both surfaces resolve the parent now. `a2a outbox --json` also carries
      `waiting_on`, `expected_transition` and `why` for the first time — they
      were promised when the fields were added and only the inbox had been
      wired.
      Alongside, one string stops reaching readers. When an artifact is in a
      state no obligation is defined for — a declined request you are still
      listed on — the justification read "this should be unreachable" and
      named an internal function. That sentence was written for a surface
      where it was true and became visible on one where it is not; the state
      is now described plainly, and the claim it used to make is proven by a
      test instead of narrated to a user.
    action:
      scope: none
      why: >
        Nothing to do. If you parse `a2a outbox --json`, three fields that
        were always absent may now be present; they are the same fields
        `a2a inbox --json` already carried.
  - id: RN-01910-12
    kind: feat
    roadmap:
      visibility: shipped
      why: "A request that names bytes can now declare them in the envelope instead of describing them in prose, which is the difference between a reader fetching what you meant and a reader guessing."
    impact: normal
    subject: "A work request can carry the bytes it is about, and a reference that does not resolve is refused"
    detail: >
      A request that is *about* some bytes had no way to carry them unless
      those bytes were a dataset conforming to a pinned contract and were
      answering a specific work request. Anything else — a transcript, a
      bundle accompanying a question, a sample nobody is promising to judge —
      could only be described in prose with a digest quoted beside it. A
      reader then had a pointer they could not resolve, and the party who
      wrote it never found out.
      `schemas/envelope/v2/work_request.schema.json` is new and declares an
      `attachments[]` block: a content-addressed reference, its `sha256:`
      digest, an optional contract to conform to, what verification is being
      asked for (`required`, `offered` or `none` — and `none` means no
      verdict is defined, which is a different claim from unverified), and
      how long the bytes are retained.
      `a2a attach <draft> --from <file-or-dir> --verification
      required|offered|none` writes the entry, mints the content-addressed
      reference and computes the digest. `verification` has no default and
      the command refuses without it: defaulting it would claim somebody
      promised a verdict on bytes nobody promised to judge, and separating
      that claim from the bytes themselves is the whole point.
      And the reference now has to resolve. `a2a validate` refuses an
      artifact whose BODY names a `sha256:` that no declared attachment
      carries — locally, before any pull request, which is what makes the
      difference: the failure this is written from took six days to surface
      because nothing local could see it. The set of digests checked is
      scanned out of the body rather than declared, so it cannot drift from
      what an author actually wrote. A body that merely lists what looks
      like a file tree with nothing attached gets a WARNING, never a
      refusal — only checkable facts refuse.
      What does NOT work yet: `a2a new work_request` still writes
      `envelope/v1`, so a draft carrying attachments has to be authored by
      hand for now; and three read surfaces still need teaching —
      `verification: none` renders as a missing package rather than "no
      verdict is defined", a lapsed retention reads as a failed fetch rather
      than a dead reference, and submit does not yet prove an attachment is
      fetchable from the space rather than from the author's machine.
      The field lands on a schema that is itself NEW rather than widening one
      already shipped, deliberately. Every released binary carries its own
      embedded copy of the schemas, and each concrete type closes itself
      against unknown properties — so adding a field to a schema an older
      binary already knows would make it refuse a legal document it believes
      it understands. An unknown TYPE is refused honestly instead, and only
      for an author who chose the newer generation.
    action:
      scope: none
      why: >
        Nothing to do. Existing `envelope/v1` work requests are untouched and
        stay valid, and the new refusal only fires on a body that names a
        digest — an artifact that names none is unaffected. Before a space
        can accept `envelope/v2` work requests it must be running a binary
        that knows the type: the CI workflow a space pins decides that, not
        the author's local install.
  - id: RN-01910-13
    kind: fix
    impact: high
    subject: "A blocked request names who is actually blocking it"
    detail: >
      When work is blocked, somebody has to unblock it — and the tooling named
      the wrong party. The answer was always "the system this was addressed
      to", regardless of who the block was actually waiting on. So a requester
      blocked on a third party was told the recipient owed the move, the
      recipient was told the same thing, and neither was the party who could
      resolve it.
      A partial answer can now name its blocker (`blocked_by`), and that name
      is what the tooling reports. An artifact that names nobody answers
      exactly as before.
      One limit, stated because it is real: the party now named still has no
      move of their own to make — `unblock` remains the recipient's act. So
      the record stops pointing at the wrong system, and routing an act to the
      right one is a further step.
    action:
      scope: none
      why: >
        Nothing to do. Existing blocked artifacts are unaffected until a
        response names a blocker.
  - id: RN-01910-14
    kind: fix
    impact: normal
    subject: "A disputed response can be replaced by its author"
    detail: >
      A rejected decision and a failed handoff can both be superseded — the
      producer replaces them and the exchange goes on. A DISPUTED response
      could not. It was the only refused state with no exit at all, so the
      author of disputed work could not resubmit it, could not replace it, and
      could not contest the dispute. The exchange simply stopped, in the one
      state whose entire purpose is disagreement.
      `a2a supersede` now works on a disputed response, matching how the other
      two refusals already end.
    action:
      scope: none
      why: >
        Nothing to do. If a response of yours was disputed and you had no way
        forward, you can supersede it now.
  - id: RN-01910-15
    kind: feat
    roadmap:
      visibility: shipped
      why: "A partial answer that cannot say what is missing forces the reader to guess, and a closure that silently drops what was still open is how commitments disappear — both are now sayable and one of them is now refused."
    impact: normal
    subject: "A partial answer can say what is unmet, what blocks it, and on whose authority"
    detail: >
      Answering "partially" was a single word with no way to qualify it.
      There was nowhere to record which acceptance criteria were not met,
      what would unblock them, how much was attempted, or — the case that
      forced this — that every criterion WAS answered while the supplier is
      not entitled to make the values binding. That last one had no
      expression at all: an author had to either misreport a met criterion as
      unmet, or drop the caveat and overclaim.
      `envelope/v2` responses carry `unmet[]`, `blocked_by`, `attempted`,
      `standing` and `residue`. A `partial` must now carry at least one of
      them — naming none is refused, because "partial" alone tells a reader
      nothing they can act on.
      `unmet[]` is an INDEX into the parent's acceptance criteria, never a
      restatement in prose. A restatement drifts from the criterion the
      moment either is edited, and then two documents disagree about what was
      asked.
      And a closure now has to account for what it closes over: ending an
      exchange that carries an unmet criterion requires saying where that
      criterion went. Both anchor cases for this were work requests closed
      three weeks early with open items named in the closing note — items
      that a week later existed on no surface at all.
      Two of these refusals shipped able to be described and unable to fire,
      and that is worth saying because this note described them first: the
      rule that checks an unmet index against the parent needed a lookup the
      tooling could not do, and the closure rule never received the closing
      event. Both are wired now, so `a2a submit` refuses what this paragraph
      says it refuses. An unmet index that names a criterion the parent does
      not have is caught on the author's machine; note that at merge time the
      index check does not yet run, so it warns you early rather than
      guarding the gate.
    action:
      scope: none
      why: >
        Nothing to do. `envelope/v1` responses are unchanged and stay valid.
        The new refusals apply to `envelope/v2` responses only.
  - id: RN-01910-16
    kind: feat
    roadmap:
      visibility: shipped
      why: "A consumer deciding whether to build against an interface needs to know whether it is a promise; today that answer lives in prose if it exists at all."
    impact: normal
    subject: "A work request can declare what it IS — adoptable, pinnable, or explicitly none of those"
    detail: >
      Whether something is a binding interface, a draft to react to, or a
      bundle nobody is promising to keep, was carried in prose — and in the
      case this comes from, in three different places, none of which owned
      it: a fenced block, the body of a field that answers a different
      question, and an acceptance criterion binding both parties. Someone
      looked for a field in three places and found none.
      `binding` is a field now. It is either the explicit sentinel `none` or
      an object saying what class the artifact is, what compatibility is
      claimed, and whether it may be adopted or pinned. The sentinel is not a
      shorthand for leaving it out: declaring nothing and declaring that
      NOTHING IS CLAIMED are different statements, and only the second is
      something a reader can rely on.
      A declared `compatibility_status: none` is held to the same standard as
      the bare sentinel — it cannot present as adoptable and pinnable while
      claiming no compatibility.
    action:
      scope: none
      why: >
        Nothing to do. The field is optional and `envelope/v1` work requests
        are unaffected.
  - id: RN-01910-17
    kind: feat
    roadmap:
      visibility: shipped
      why: "An agent that cannot find the instrument for the situation it is in will improvise one, and improvising is what this whole release is written against."
    impact: low
    subject: "The loops route to every instrument the protocol actually has"
    detail: >
      Five acts existed in the protocol and in no loop an agent reads:
      withdrawing, cancelling, the responder's half of a dispute, starting
      accepted work, and unblocking. Two more shipped in this release —
      attaching bytes, and naming what blocks a partial answer — and needed
      the same.
      `start` was the worst of them, and not for being missing: the loops use
      `a2a work start` nearby for an unrelated command family, so the silence
      taught that no lifecycle `start` exists between accepting work and
      answering it.
      The autonomy section is rewritten to what the tooling can actually
      answer. One of the five human gates is machine-readable and four are
      not, and it now says so instead of implying a clean split — an agent
      told it can check something it cannot will either invent a check or
      stop asking.
      Alongside, a coverage check: every combination of artifact type, role
      and phase either has a step or is declared empty with a reason read off
      the transition table. Its first run found that the loops had never
      explained how to abandon or retire anything.
    action:
      scope: none
      why: >
        Nothing to do. This is guidance an agent reads, not behaviour it
        invokes; no command changed.
  - id: RN-01910-1
    kind: fix
    impact: normal
    subject: "The reason code an agent is required to supply when refusing now reaches the reader"
    detail: >
      Declining a request requires a machine-readable `reason_code` — the MCP
      tool refuses the call without one, and both event schemas define the
      field. It was written into the event and then read by nobody: the cache
      that builds every read surface never decoded it, so the only thing a
      receiver could act on was the prose note beside it.
      That is exactly the substitution the code exists to prevent, and it had
      been true since the field was introduced. `a2a thread --json` and
      `a2a show --json` now both carry `reason_code` on the event that supplied
      one — `show` in particular, since that is the command you run to find out
      why something was refused.
    action:
      scope: none
      why: >
        Nothing to do. Existing declines already carry the code in their
        committed events, so it becomes visible with no migration and no
        re-authoring.
  - id: RN-01910-18
    kind: fix
    impact: normal
    subject: "Recording a triage verdict no longer rewrites the report it is judging"
    detail: >
      `a2a feedback triage --apply` changed two fields and rewrote the whole
      record to do it: every top-level key was reordered alphabetically and
      every value re-quoted or re-folded. Nothing about the report changed and
      every byte did, so a reporter's own submitted text stopped being the text
      the corpus carried.
      That matters beyond tidiness, because the feedback corpus exists in two
      copies — where reports arrive and where verdicts are written — and the
      rule reconciling them is that a record's body is authored in the first
      and its status and resolution in the second. Reformatting made every
      record look like its body had changed too, so the reconciliation refused
      records nothing was wrong with.
      A verdict now rewrites the `status` line and replaces, or inserts, the
      `resolution` block, and leaves the rest of the file exactly as submitted.
      A resolution a YAML block scalar cannot carry without altering it — one
      ending in a newline, for instance — is now refused by name before
      anything is written, rather than being silently truncated.
      The observable effect on the public corpus is that a triage diff is now
      two fields wide instead of whole-file: a record's key order and the
      quoting and folding of every value it arrived with are preserved, so
      reading what a verdict changed no longer means reading the whole record.
    affects: ["a2a feedback triage --apply"]
    action:
      scope: none
      why: >
        Nothing to do. Records already triaged keep their current content; the
        change applies to verdicts recorded from here on.
  - id: RN-01910-19
    kind: fix
    impact: high
    subject: "`a2a new` no longer picks an enum value you did not choose"
    detail: >
      A template's pipe-alternatives placeholder — `<release|deprecation|…>` —
      was filled with its FIRST alternative whenever you did not pass one. So a
      fresh announcement arrived as `category: release`, a fresh question as
      `category: clarification`, and, worst of the six, a fresh response as
      `result: answered` before anybody had answered anything. Nothing
      downstream could tell that from a choice you had made.
      The placeholder now survives rendering, and both validators refuse it: V1
      `a2a validate` rejects it as a schema enum violation, and
      `a2a validate --ci` / `a2a submit` refuse it as an unfilled placeholder.
      Six of the eight artifact types are affected — announcement, contract,
      question, requirement and work_request carry `category`; response carries
      `result`. `decision` and `handoff` have no enum placeholder.
    affects: ["a2a new", "a2a validate", "a2a submit", "artifact templates"]
    action:
      scope: local
      why: >
        Pass the value you mean. A draft you would previously have submitted
        without choosing is now refused until you do — which is the point, but
        it will refuse scripts that relied on the silent default.
      run:
        - "a2a new announcement --field category=notice"
        - "a2a new response --field result=delivered <parent-id>"
  - id: RN-01910-20
    kind: fix
    impact: normal
    subject: "`--field` stops accepting a value for a field it cannot actually set"
    detail: >
      `a2a new --field <key>=<value>` appends a single scalar for a key the
      template does not carry, so it correctly refuses array- and object-typed
      fields — it has no way to write them. That refusal was keyed on the
      schema's inline `type`, and read nothing at all for a field declared
      through a `$ref`. On an envelope/v2 contract, `generated_from` is exactly
      that: `--field generated_from=…` was accepted, a bare string was written
      into a slot the schema declares as an object with required sub-fields,
      and the draft failed later at validate — far from the command that had
      accepted it.
      Local `$ref`s now resolve, so the refusal fires where it always should
      have, at the surface you typed.
    affects: ["a2a new --field"]
    action:
      scope: none
      why: >
        Nothing to do. The accepted-then-invalid drafts this produced were
        already being rejected at validate; the refusal simply arrives at the
        point of entry now.
  - id: RN-01910-21
    kind: fix
    impact: high
    subject: "A packed data directory passes `a2a validate --ci` instead of being refused by it"
    detail: >
      `a2a data pack` writes a package whose README.md carries no frontmatter —
      it cannot, because the package's digest is computed over exactly those
      bytes and adding any would break verification for everyone who fetches
      it. `a2a validate --ci` then treated that README as an exchange artifact
      and rejected it with POL-002. The tool's own output failed the tool's own
      check, and a real integration pull request sat open because of it.
      Artifact discovery now recognises a data package's path shape and leaves
      its payload alone, the same way it already recognises a contract
      descriptor. The exemption is not a blanket skip of the system's section:
      a genuinely malformed artifact elsewhere under the same system is still
      refused.
    affects: ["a2a validate --ci", "a2a data pack", "space CI"]
    action:
      scope: none
      why: >
        Nothing to do. A package that was previously blocked at CI will pass on
        the next run with no change to the package itself.
  - id: RN-01910-22
    kind: fix
    impact: normal
    subject: "A closed, cancelled or superseded artifact explains itself instead of falling back to boilerplate"
    detail: >
      Seventeen resting states — a cancelled question, a retired contract, an
      accepted handoff, a superseded anything — had no entry in the table that
      answers "whose move is it", and fell through to generic text that named
      the kind and state back at you and said nothing else. Each now carries a
      real reason: settled by the sender's own act; the sunset already ran; the
      successor carries its own pendency.
      `a2a inbox --json` and `a2a thread --json` report a different `why` for
      those artifacts as a result. The obligation is unchanged — nobody owed a
      move before and nobody owes one now; what changed is that the answer says
      why.
      Alongside it, one transition was removed: a disputed response could in
      principle be superseded, but no shipped command could ever reach that,
      and the real remedy already exists one level up — a dispute reopens the
      parent, where a fresh response is owed.
    affects: ["a2a inbox", "a2a thread", "the dashboard"]
    action:
      scope: none
      why: >
        Nothing to do. No stored state changes; the same artifacts read back
        with a better explanation.
  - id: RN-01910-23
    kind: fix
    impact: normal
    subject: "A response citing an acceptance criterion that does not exist is refused on every path, not some"
    detail: >
      A partial response names which of the parent's acceptance criteria are
      unmet, by index. An index the parent does not have is refused — but only
      on two of the paths that submit one. The check was attached to individual
      call sites rather than to the thing they all build, so a path that
      constructed its own resolver silently skipped it, including the
      merge-time check a space pins in its own CI.
      Counting a parent's criteria is now a property of the resolver itself,
      held in place by the compiler, so a submit path gets the check by
      existing rather than by remembering.
    affects: ["a2a respond", "a2a submit", "a2a validate --ci", "contract and work write paths"]
    action:
      scope: none
      why: >
        Nothing to do — unless you have a draft with an out-of-range `unmet[]`
        index that previously slipped through one of those paths, which will
        now be refused with REF-018 and needs the index corrected.
  - id: RN-01910-24
    kind: policy
    impact: low
    subject: "How long a feedback submit waits for a concurrent one is now a pinned decision"
    detail: >
      Two `a2a feedback submit` runs on the same machine serialise through a
      lock on the local ledger. The loser waits two seconds and is then told to
      retry, rather than blocking indefinitely — a deliberate choice, because a
      human is usually watching and an actionable refusal beats an unbounded
      wait.
      That two seconds had never been asserted anywhere, so it was one edit away
      from becoming whatever a test found convenient. It is now pinned by its
      own check: raising it is a decision about how long an operator waits, and
      has to be made as one.
    affects: ["a2a feedback submit"]
    action:
      scope: none
      why: >
        Nothing to do. The wait is unchanged at two seconds; what changed is
        that it can no longer drift silently.
  - id: RN-01910-25
    kind: fix
    impact: high
    subject: "You are no longer told to close a delivery whose bytes are not in the space"
    detail: >
      Once a question or work_request reached `responded`, the sender was told
      they owed a `close` — unconditionally, whether or not the delivery that
      response claims actually resolves. That produced the worst kind of wrong
      answer: a delivery's response merged while its payload pull request stayed
      open and red, the thread advanced to `verify:<consumer>` for a package
      `a2a data fetch` correctly refuses as absent, and both ends reported
      success.
      The next move is now conditional on the bytes existing. When the package a
      delivery names cannot be resolved in the space, the move is named against
      the responder — who can still act — rather than the sender, who cannot
      verify what is not there. `a2a inbox --json`, `a2a thread --json` and the
      dashboard all read this from the same place, so they cannot disagree
      about it.
      The correlation runs through the handoff that carries the package, since
      that is the only artifact which structurally names one — and that is also
      the limit, stated here rather than discovered: this catches the case
      where the handoff arrived and its package did not. It does NOT catch the
      case where neither arrived, because `result: delivered` on its own claims
      no bytes — it is the ordinary result word for a work_request — so a space
      cannot tell "delivered, bytes pending" from "delivered, no bytes were
      ever involved" until a response can name its own package.
    affects: ["a2a inbox", "a2a thread", "the dashboard", "whose-move-is-it"]
    action:
      scope: none
      why: >
        Nothing to do. Existing threads re-read with the corrected next move; no
        stored state changes.
  - id: RN-01910-26
    kind: schema
    impact: normal
    subject: "An event that verifies or closes can record a verdict per acceptance criterion"
    detail: >
      `event/v2` gains `verdicts[]` — for each of the parent's acceptance
      criteria, by index, what the verdict was and who caused it. It uses the
      same index grammar an incomplete response already uses for `unmet[]`, and
      the same range check, so the two cannot drift apart. An index that does
      not resolve in the parent is refused as `REF-019`.
      Read the limits before relying on it, because they are real: the two
      transitions this is required on — verify and close — are still written as
      `event/v1` by the current binary, so nothing it writes today carries the
      field; the range check has no wired call site yet; and while the field is
      decoded, no surface renders it. It is a wire contract you can author
      against and a validator that is proven reachable — not yet a working
      feature end to end.
    affects: ["event/v2", "a2a verify", "a2a close"]
    action:
      scope: none
      why: >
        Nothing to do. The field is optional on every event the binary
        currently produces.
  - id: RN-01910-27
    kind: break
    impact: high
    subject: "`a2a feedback triage` checks the hub before it tells you the inbox is clean"
    detail: >
      Triage read only the local tree. So it printed `inbox clean` while
      reports sat unread on the hub the tool itself submits to — which is
      exactly what happened: three of them, for up to three days, one of them
      blocking a live delivery.
      Run from a git work tree, triage now resolves the hub of record first and
      REFUSES rather than reporting, naming both the drift and the hub, when
      the hub carries a report this tree does not have, when the comparison
      cannot be completed at all, or when no hub is configured. `inbox clean`
      is reachable only after the hub is confirmed current — or when the
      directory is not a git work tree, where there is no hub to diverge from.
      Read the cost before you upgrade: **bare `triage` from a work tree now
      needs the network**, and refuses without it. That is deliberate — an
      unchecked "clean" is the failure this replaces — but it is a change in
      what an offline invocation does. `a2a feedback triage --apply` and every
      other feedback verb are unaffected; only the listing form checks.
    affects: ["a2a feedback triage"]
    action:
      scope: local
      why: >
        If you triage offline, expect a refusal that names the reason instead
        of a listing. Run `make feedback-sync` (or work from a non-work-tree
        copy) when you need the queue without reaching the hub.
      run:
        - "make feedback-sync"
  - id: RN-01910-28
    kind: feat
    impact: normal
    roadmap:
      visibility: shipped
      why: >
        The dashboard is where a human decides whether a delivery is
        trustworthy, and until now it could not see what the delivery
        referenced at all. The capability is the visibility.
    subject: "The dashboard shows what a work request attached, and `a2a show` stops deriving it separately"
    detail: >
      A work request can declare attachments — bytes it references by digest,
      with a role, a verification claim and a retention window. Until now only
      `a2a show` rendered them, from its own decode of the raw frontmatter, and
      the dashboard showed nothing at all.
      The claim is now derived once, where the artifact is read, and every
      surface reads the same value: `a2a show`, `a2a show --json` (a new
      `attachments` key, present only when there are any), the MCP show tool,
      and the dashboard's artifact page.
      That also fixes a rendering that could not happen. A lapsed retention was
      supposed to name its date instead of leaking an internal error — the code
      for it existed, but the field it needs, `expires_at`, was never read back
      off a committed artifact, so the case was unreachable outside a
      hand-built test. It reaches a real draft now, and the lapse is judged
      against the reader's own clock.
    affects: ["a2a show", "a2a show --json", "the dashboard", "a2a_show (MCP)"]
    action:
      scope: none
      why: >
        Nothing to do. The JSON key is additive and omitted when an artifact
        has no attachments, so an existing consumer sees no change.
  - id: RN-01910-29
    kind: feat
    impact: normal
    roadmap:
      visibility: shipped
      why: >
        A verb the product ships that cannot be used on anything the product
        writes is not a capability, it is a promise. This closes the gap
        between the two.
    subject: "`a2a new work_request` writes the generation `a2a attach` requires"
    detail: >
      `a2a attach` carries bytes with a work request — the case the tool was
      built for. It refuses any draft that is not an `envelope/v2`
      work_request, because `attachments` exists only on that generation. And
      `a2a new work_request` wrote `envelope/v1`. So attaching bytes to a
      drafted request meant hand-editing the `schema:` line first, and the
      refusal's own advice — "run `a2a new work_request`, which authors
      envelope/v2 by default" — was not true.
      It is now. `a2a new work_request` writes `envelope/v2`, and
      `a2a template show work_request` shows the same document, from the same
      decision, so the template an agent reads and the draft the tool renders
      cannot disagree. A v2 draft is a strict superset of a v1 one — the two
      fields it adds, `attachments` and `binding`, are both optional — so
      nothing an author could write before stops being writable.
      `binding` (what an artifact IS, and whether it may be adopted or pinned)
      is offered as commented guidance rather than a filled-in block,
      deliberately: leaving it out means "undeclared", which is a different
      statement from declaring no binding at all, and the tool should not make
      that statement on an author's behalf. To declare it in one flag:
      `a2a new work_request --field binding=none`.
      Other artifact types are unchanged. `announcement` in particular keeps
      writing `envelope/v1`: its v2 template describes a work checkpoint, not a
      general announcement, so switching it would render the wrong document.
    affects: ["a2a new work_request", "a2a template show work_request", "a2a attach"]
    action:
      scope: none
      why: >
        Nothing to do. Existing v1 work requests stay valid and are still
        accepted everywhere; only what a FRESH draft declares has changed.
  - id: RN-01910-30
    kind: feat
    impact: normal
    roadmap:
      visibility: shipped
      why: >
        Two systems each reported success while the bytes one of them promised
        were not there to fetch. The protocol's job is to make that
        unsayable, not to detect it afterwards.
    subject: "A response cannot claim a delivery whose bytes the space does not have"
    detail: >
      When a work request is completed by a body of work rather than an
      answer, the response points at the handoff, and the handoff lists what
      was delivered. Until now nothing checked that the listed data packages
      actually resolve — so a response could merge saying `delivered` while
      the package it stood for was still an open pull request, and both ends
      reported success.
      Submitting such a response is now refused, naming the handoff and the
      deliverable that does not resolve. The check reads the space's own
      committed history, never the author's working copy, so "it resolves on
      my machine" cannot pass it.
      It is narrow on purpose. `delivered` is the ordinary word for finishing
      a request, and most responses that use it involve no data package at
      all — those are untouched. The refusal applies only to a response that
      references a handoff which itself declares a data deliverable.
      `a2a respond` gained `--ref <artifact-id>` (repeatable) to carry that
      reference: the envelope always had a `refs` field, and no lifecycle verb
      could write it, because `--field` cannot fill a list.
      Known gap, deliberate: the MCP respond tool has no equivalent input yet,
      so an MCP-authored response cannot carry refs. The refusal itself is in
      the shared write path, so nothing is left unchecked.
    affects: ["a2a respond", "a2a respond --ref", "submitting a response"]
    action:
      scope: none
      why: >
        Nothing to do unless you author a response that references a handoff
        with a data deliverable. If you do and it is refused, the package has
        not landed yet — merge it first, then resubmit.
  - id: RN-01910-31
    kind: feat
    impact: normal
    roadmap:
      visibility: shipped
      why: >
        A producer could not publish an artefact that says "do not build
        against this" — the exact thing most worth saying. Now they can, and
        the system enforces it rather than trusting the reader.
    subject: "A contract can declare itself non-adoptable, and adoption refuses it"
    detail: >
      Some contracts exist to be read, not adopted: a review bundle, an agreed
      definition with no machine-checkable grammar. Publishing one was
      impossible — every contract must carry a schema plus valid and invalid
      fixtures, and these have nothing to put there — so producers either
      faked a schema or sent the thing outside the protocol.
      Contracts gain an optional `x_binding` declaration: either the single
      word `none`, or four fields saying what the artefact is
      (`artifact_class`), what compatibility it claims
      (`compatibility_status`), and whether it may be adopted or pinned
      against. Leaving it out means undeclared, which is deliberately
      different from declaring `none`.
      Two things follow. `a2a contract adopt` refuses a contract that declares
      itself non-adoptable, before it resolves `--major`, so the flag cannot
      route around it — and since adopt is what writes the dependency pin,
      refusing it is what stops the pin. And a contract that claims no
      compatibility at all may publish without schemas or fixtures, because
      there is nothing to check.
      The relaxation is narrower than the refusal on purpose: a contract may
      be unadoptable while still naming a real compatibility claim, and that
      claim still needs its baseline.
      Known limit, stated rather than implied: no surface displays these
      fields yet, so a consumer learns a contract is unadoptable by being
      refused at adopt rather than by reading it.
    affects: ["a2a contract adopt", "a2a contract publish", "a2a validate --ci"]
    action:
      scope: none
      why: >
        Nothing to do. The field is optional and absent from every existing
        contract; a contract that does not declare it behaves exactly as
        before.
  - id: RN-01910-32
    kind: feat
    impact: normal
    roadmap:
      visibility: shipped
      why: >
        A verification that says "looks good" tells the next reader nothing
        about which promises were actually checked. Per-criterion is the
        difference between a record and an impression.
    subject: "`a2a verify` records a verdict per acceptance criterion"
    detail: >
      Verifying a response was an all-or-nothing act: the judgement of each
      individual acceptance criterion lived in prose, if anywhere, so a reader
      could not tell which promises were met, which were not warranted, and
      which were simply never exercised.
      `a2a verify` now takes `--verdict <index>:<verdict>:<cause_owner>`,
      repeatable — one entry per criterion, indexed into the parent's own
      `acceptance_criteria` list, with `met`, `unmet`, `not_warranted` or
      `not_exercised` and the party the shortfall belongs to. The verdicts are
      written onto the verification event itself and shown per criterion in the
      thread and on the dashboard.
      An index that does not exist on the parent is refused at merge, so a
      verdict cannot quietly point at nothing.
      This applies once your space's `min_binary_version` has reached the
      contract-publication floor; below it, verification records exactly as it
      did before and the flag is refused rather than silently dropped.
      Known limit: the standalone `a2a close` verb does not yet carry verdicts —
      only verification does, including the same-PR close it performs for you.
    affects: ["a2a verify", "a2a verify --verdict", "a2a thread", "the dashboard"]
    action:
      scope: none
      why: >
        Nothing to do. The flag is optional; a verification without it records
        an empty verdict list and behaves as before.
  - id: RN-01910-33
    kind: feat
    impact: normal
    roadmap:
      visibility: shipped
      why: >
        The deadlock this epic was cut from: a contract was published, a
        consumer built against it, and the record said nobody owed anything
        while the endpoint did not exist. Now somebody owes it, by name,
        without anyone having to volunteer a field.
    subject: "A published contract with a registered consumer names who owes the operational half"
    detail: >
      Publishing an interface is not the same as making it usable. An endpoint
      has to exist, credentials have to be issued, a registration has to
      happen — and none of that was anywhere in the record, so a consumer
      could adopt a contract, build a client, and wait indefinitely while
      every surface reported that nothing was outstanding.
      A published contract that has at least one registered consumer now
      produces an owed move on the producer, shown wherever open items are.
      This does NOT require the producer to have declared anything: the
      obligation is derived from facts the space already holds — the contract
      is published, and somebody adopted it. An operational half nobody has
      spoken about is exactly the case worth surfacing.
      Producers can be specific. A contract may declare `x_operational` — named
      items such as an endpoint or a credential channel, each `ready` or
      `absent`, each with an optional target date. Leaving it out means
      undeclared, which is a different statement from declaring the parts are
      absent, and the tool never fills it in for you.
      `a2a contract activate --version <v> --satisfies <item>` is how a
      producer records that a named item now exists. It refuses to activate an
      item the contract never declared, a version that was never published, or
      a contract belonging to another system.
      This applies once your space's `min_binary_version` has reached the
      contract-publication floor; below it no derived row appears and threads
      read exactly as they did.
    affects: ["a2a contract activate", "a2a inbox", "a2a thread", "the dashboard", "a2a_contract (MCP)"]
    action:
      scope: none
      why: >
        Nothing to do. Existing contracts gain no obligation until they have a
        registered consumer, and the declaration is optional.
  - id: RN-01910-34
    kind: fix
    impact: normal
    roadmap:
      visibility: shipped
      why: >
        A refusal that holds on one interface and not the other is not a
        refusal — it is a suggestion with a workaround.
    subject: "MCP now refuses to adopt a contract that declares itself non-adoptable"
    detail: >
      A contract can declare that it must not be adopted, and adopting one is
      what pins a dependency against it. `a2a contract adopt` refused such a
      contract from the moment the declaration shipped. The MCP tool did not:
      the same action wrote the same dependency entry and never looked at the
      declaration, so an agent working over MCP could pin what an agent at the
      command line could not.
      Both surfaces refuse now, with the same message. The check also runs
      before the version is resolved, so supplying an explicit major no longer
      skips reading the contract's own declaration.
    affects: ["a2a_contract (MCP)"]
    action:
      scope: none
      why: >
        Nothing to do. If an MCP-driven adoption starts being refused, the
        contract was always declaring itself non-adoptable and the refusal was
        missing.
  - id: RN-01910-35
    kind: feat
    impact: normal
    roadmap:
      visibility: shipped
      why: >
        An agent that has to write a field by hand in prose is telling you the
        field is missing. Refusing the prose is how that stops being invisible.
    subject: "A body that hand-writes a field as `key = value` prose is refused"
    detail: >
      When a field an agent needs does not exist, the agent writes it into the
      body anyway — a fenced block of `key = value` lines that reads as
      machine-readable and is not. It happened on a real request, and nothing
      caught it: the declaration sat in prose while every surface reported the
      artifact carried no such claim.
      Submitting or validating an artifact whose body hand-writes a line naming
      a field that IS declared on that artifact's own schema is now refused,
      naming the key and telling the author to declare it where it belongs.
      The check derives its list from the artifact's own type, so a field added
      to the schema tomorrow is covered the same day — nothing to keep in step
      by hand. It is line-anchored, so ordinary prose mentioning something like
      `x = y` mid-sentence does not trip it.
    affects: ["a2a validate", "a2a submit", "a2a validate --ci"]
    action:
      scope: local
      why: >
        If a draft is refused, the body is declaring something the schema has a
        real field for — move it into the frontmatter. A body that refers to a
        field name in ordinary prose is unaffected.
