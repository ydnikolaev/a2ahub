schema: release-notes/v1
version: 0.25.8
released: "2026-08-29"
headline: a refusal names the side that failed
changes:
- id: RN-02508-0
  kind: fix
  impact: normal
  subject: verify-published blamed the space for a file missing from your own --local tree
  detail: >
    `a2a contract verify-published --local <XC-id>=<dir>` reported `unmeasured`
    with a diagnostic prefixed `space:` when the missing file was in the LOCAL
    subject the caller had just named. The space had the file; the pointed-at
    directory did not.

    A reader acts on the label, and the reporter did: they concluded the
    published tree was broken, wrote that down as a finding, and only recovered
    it by pointing `--local` at a directory that does have `contract.md` and
    watching the same run turn `matched`.

    One function read both sides and hardcoded one label. The side was already
    in scope and unused, so the label is now DERIVED from it: a fault in the
    caller-supplied subject reads `local:` and names the inspected path, and
    `space:` appears only when the space itself could not be read.

    Second half, from the same report: a local subject that EXISTS but holds no
    envelope now gets its own refusal — `candidate is not a published-shaped
    tree: no contract.md envelope at <path>` — instead of a generic stat error
    naming a constant you never typed. That generic error read as "you forgot a
    flag" when the real answer was "your subject is the wrong shape", which is
    what a producer whose generator emits its own layout needs to be told once.

    Reported from a live space as fb-20260829-e756c0, same class as
    fb-20260827-4b121a.

    ONE CONSEQUENCE BEYOND THE REPORTED VERB, named here rather than discovered.
    The label is derived from which tree is being read, and the same reader
    serves `a2a contract publish` and `preflight`. So a failure reading a
    `--staging` tree now says `local:` as well — the flag differs, the side does
    not. Both verbs also gain the not-published-shaped refusal when the tree they
    were pointed at holds no envelope.
  affects:
  - cli
  action:
    scope: none
    why: >
      Nothing is owed. No verb gains or loses a capability; only refusal TEXT
      changes, and it changes to stop misdirecting you. If you previously chased
      a `space:` diagnostic from `verify-published --local` and found nothing
      wrong with the published tree, this is why.

      The one case worth a look: a script that greps these diagnostics for the
      literal `space:` will stop matching when the fault is on your side — of
      `verify-published --local` and of `contract publish --staging` alike. That
      is the bug being fixed, so matching on it was always matching on a lie, but
      a grep that relied on it will now find nothing rather than find the wrong
      thing.
