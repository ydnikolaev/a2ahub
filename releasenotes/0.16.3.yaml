schema: release-notes/v1
version: "0.16.3"
released: "2026-07-30"
headline: "Statusline refresh now survives the one-shot command, while the merge gate becomes deterministic and cache-aware"
changes:
  - id: RN-01603-1
    kind: fix
    impact: normal
    subject: "A stale statusline launches one durable refresh for the next render"
    detail: >
      The prompt-facing statusline still reads local cache only and keeps its
      existing text, JSON, and exit-code contract. When that cache is stale, it
      now atomically claims a short-lived local lease and starts the canonical
      `a2a sync` command as a detached process. The refresh can finish after the
      one-shot statusline process exits, concurrent prompt renders do not start
      a herd of duplicate syncs even while recovering an expired lease, and the
      next render sees the refreshed mirror. The previous in-process goroutine
      could be terminated by normal CLI exit or race a test fixture's cleanup.
    affects: ["statusline", "local cache", "sync"]
    action:
      scope: local
      why: >
        Update if statusline is embedded in a shell or agent prompt; no config
        change is required.
      detect:
        - "a2a version"
      run:
        - "a2a update --yes"

  - id: RN-01603-2
    kind: fix
    impact: low
    subject: "The ordinary CI gate no longer depends on ambient Git identity or a cold duplicate Go cache"
    detail: >
      Git-backed tests now receive a process-local fixture identity, the
      checkout-owned validation runner has a documented scoped-test entrypoint,
      GitHub's setup-go cache feeds the exact build cache consumed by
      `make check`, and workflow syntax validation fails closed with pinned
      actionlint. The public-only classification backstop no longer rejects the
      private source repository, and CodeQL has the read scope its analyze step
      needs under restrictive workflow permissions. CodeQL execution is scoped
      to the public repository where code scanning is enabled; private CI keeps
      its gosec, govulncheck, and gitleaks gates without spending minutes on an
      upload GitHub will refuse. Lifecycle wire parity retains every case while
      reusing one immutable repository fixture.
    affects: ["contributors", "GitHub Actions", "make check"]
    action:
      scope: none
      why: >
        No user action is required; maintainers get faster and more trustworthy
        merge evidence.

  - id: RN-01603-3
    kind: fix
    impact: normal
    subject: "Standing known issues no longer disappear on the next update"
    detail: >
      Current limitations now live once in a schema-validated standing list
      instead of being copied into every version file. `a2a whatsnew`, its MCP
      twin, the HTML release view, and the authored GitHub Release body append
      that list independently of the selected version range, including when
      there are no newer change entries. The existing release-array machine
      shape remains unchanged, and a resolved issue is removed in one place.
    affects: ["a2a whatsnew", "a2a_whatsnew", "release notes", "release workflow"]
    action:
      scope: none
      why: >
        No user action is required; current limitations now remain visible
        until their fixes actually ship.
