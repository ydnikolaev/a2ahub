schema: release-notes/v1
version: 0.25.7
released: 2026-08-29
headline: every question has one answerer, and the answer is printed
changes:
- id: RN-02507-0
  kind: feat
  impact: high
  subject: a2a adapt — what your repository still owes, not what your binary crossed
  detail: >
    `a2a whatsnew` answers "what changed". Nothing answered "what have I not
    done about it yet", and those two diverge the moment a repository sits
    still while binaries move.

    `a2a adapt` walks from `adapted_through` in your project's own
    `.a2a/config.yaml` — not from the version your binary replaced — and
    prints only what OBLIGES you. A change whose `action.scope` is `none` is
    context and stays in `whatsnew`. Over the current corpus that is the
    difference between 172 items and 44.

    The list is ordered so the first item is always one you can act on alone,
    and it exits non-zero while anything remains, so a harness can gate on it.
    `a2a adapt --done` records that you adapted — in the REPOSITORY, so a
    teammate's agent neither redoes finished work nor skips work it wrongly
    believes done. It runs every pending `detect:` first and refuses if one
    still fires; when the pending set carries no `detect:` at all it records
    AND SAYS the record is unverified, rather than implying a check it did
    not perform.

    `a2a update` now prints this instead of the raw digest. `a2a whatsnew` is
    unchanged.
  affects:
  - cli
  - mcp
  roadmap:
    visibility: shipped
    why: >
      A new top-level verb an agent has to know exists to use — it answers a
      question nothing else answers, and a reader who does not know its name
      cannot discover it from the verb they would otherwise reach for
      (`whatsnew`, which deliberately keeps printing everything).
  action:
    scope: local
    why: >
      Your repository has no `adapted_through` yet, so the first run walks from
      the oldest release this binary carries and says so. Run it once, do the
      work it names, and record it.
    detect:
    - test -f .a2a/config.yaml && ! grep -q '^adapted_through:' .a2a/config.yaml
    run:
    - a2a adapt
- id: RN-02507-1
  kind: fix
  impact: high
  subject: publishing a contract while a staging tree exists is refused instead of silently taking the mirror
  detail: >
    `a2a contract publish <id> --bump <b>` with a staging tree present and no
    `--staging` used to fall back to the landed mirror bytes — publishing the
    PREVIOUS version's content under the new number, with no indication that
    the candidate you had staged was ignored.

    It is now refused, naming the staging path it found and the exact flag to
    pass. `a2a new contract` writes that tree and nothing removes it, so this
    reaches any project that has ever drafted the contract locally.

    Separately, a bump whose mutations touch no normative artifact is refused
    as well: a version that changes nothing means nothing to a consumer. Pass
    `--allow-empty-bump` when it is deliberate.
  affects:
  - cli
  - mcp
  action:
    scope: local
    why: >
      A publish command in your own scripts or CI that passes `--bump` or
      `--version` without `--staging` will now be refused wherever a staging
      tree exists. The refusal names the flag to add.
    detect:
    - grep -rn 'contract publish' --include=Makefile --include=*.sh . 2>/dev/null | grep -v -- '--staging' | grep -q .
    run:
    - a2a contract publish <id> --bump minor --staging .a2a/staging/<system>/provides/<slug>
- id: RN-02507-2
  kind: fix
  impact: high
  subject: a response filed as a plain document is refused, and already-stranded threads can be repaired
  detail: >
    A response whose envelope schema requires `parent` used to land as a file:
    the document appeared and the parent question learned nothing. The
    receiving agent was left in a terminal state — verify and dispute both
    resolved to a state with no legal move — having done nothing wrong.

    The write funnel now refuses such a write, below both surfaces, so the CLI
    and the MCP write path cannot diverge on it. The guard is derived from the
    envelope schemas' own `required` arrays, so a kind that later gains
    `parent` is covered with no code change.

    `a2a respond --response <RS-id>` adopts an orphan already filed: the parent
    moves and your existing body is kept.

    The response template says all of this at the `parent:` field, so a draft
    scaffolded by `a2a new response` carries the guidance where the choice
    between `a2a respond` and `a2a submit` is actually made.
  affects:
  - cli
  - mcp
  action:
    scope: local
    why: >
      A thread whose response was filed before this release may already be
      stranded — the response exists, the parent never moved. Repair it once
      per affected thread; nothing repairs itself.
    detect:
    - a2a inbox --json | grep -q '"kind":"response"'
    run:
    - a2a respond --response <RS-id>
- id: RN-02507-3
  kind: feat
  impact: normal
  subject: a refusal names where you are standing and what to run from there
  detail: >
    `a2a validate --ci` outside a space checkout used to name a missing file.
    It now names the precondition, says the current directory is a participant
    project rather than a space checkout, and names each connected space's
    synced mirror as the checkout to run in.

    `--space <id>` removes the directory change entirely: the same validation
    runs against that space's synced mirror from where you already are. An
    unknown id is refused naming the ids that ARE connected.
  affects:
  - cli
  roadmap:
    visibility: shipped
    why: >
      `--space <id>` is public command surface a producer will reach for from a
      participant checkout, and it cannot be discovered from the refusal alone
      by anyone who never hits the refusal.
  action:
    scope: none
    why: >
      Additive. The existing invocation behaves as before wherever it already
      worked; only the refusal text and the new flag are new.
- id: RN-02507-4
  kind: feat
  impact: normal
  subject: doctor tells a producer which VERSION its undeclared consumers pinned
  detail: >
    `a2a doctor` in a producer's project now reports a system whose committed
    artifacts show it consuming a contract you provide without declaring it —
    and names the version that system pinned. Retire is per-version, so
    "consumes something" was not actionable. The retire notice carries the
    version per observed consumer for the same reason.

    Observed consumption still gates nothing and refuses nothing; it is
    reported so the decision is not made blind.
  affects:
  - cli
  - mcp
  roadmap:
    visibility: omit
    why: >
      Not a capability a reader goes looking for: it is one more advisory row on
      `doctor`, a surface they already run, with no new verb, flag or argument
      to learn. A roadmap entry would describe a report line rather than
      something anyone can decide to use.
  action:
    scope: none
    why: >
      A new advisory row on a surface you already read. Nothing to run, nothing
      refuses differently, and a participant whose registry cannot be parsed is
      excluded rather than reported against.
- id: RN-02507-5
  kind: fix
  impact: normal
  subject: a notify route that can match nothing says so, and an unreadable manifest is refused
  detail: >
    A notification route selecting on a kind or state the model does not carry
    used to be silently unsatisfiable. Every `fold.Kind` and `fold.State` is
    now selectable by a route or carries a written reason, and no second
    kind/state vocabulary may exist beside the one the fold owns.

    A manifest whose raw bytes do not re-decode is now refused rather than
    treated as a manifest declaring no selectors — an empty selector list and
    an unreadable one had been the same answer.
  affects:
  - cli
  action:
    scope: none
    why: >
      Routes that were already satisfiable are unaffected. A route that could
      never match is now visible at render time rather than silently quiet.
- id: RN-02507-6
  kind: feat
  impact: high
  subject: a2a docs — the workflow page an agent is told to read, printed from the binary
  detail: >
    The agent corpus points at a workflow page dozens of times — see the send
    loop, read the contract-change loop, the escalation ladder covers this.
    Every one of those was a pointer with no path behind it. The pages already
    shipped inside the binary; nothing could read them out.

    `a2a docs` lists the topics; `a2a docs <topic>` prints that page. The topic
    ids ARE the embedded manifest's own section ids, read at run time, so a
    page added to the tree is a topic the next release accepts and no second
    list can disagree with it. An unknown topic refuses NAMING the vocabulary
    it holds, rather than telling you to read the docs.

    It resolves nothing — no project config, no connected space, no working
    directory — because every precondition it acquired would be a state in
    which the agent that needs it most cannot call it: the one working inside
    another team's repository, with no a2ahub checkout. That is also why
    `a2a_docs` sits on the degraded MCP surface, reachable by a session with no
    usable space at all.
  affects:
  - cli
  - mcp
  roadmap:
    visibility: shipped
    why: >
      A new top-level verb whose entire value is being discoverable. An agent
      that does not know the name cannot reach the pages, which is the exact
      condition the verb exists to end.
  action:
    scope: none
    why: >
      Nothing to run and nothing refuses differently. The pages you could
      already open in a checkout are now also readable without one.
- id: RN-02507-7
  kind: feat
  impact: high
  subject: a2a contract verify-published — one call for "does everything I publish still match my code"
  detail: >
    Answering that question meant running `contract verify-export` once per
    contract, per space, passing each version by hand — a consumer wrote 137
    lines of bash to do it, and that script got three things wrong: it
    hardcoded a path layout a2a already owns, it checked one space, and it
    asked the caller for the version.

    `a2a contract verify-published` reports one row per contract your system
    provides, across EVERY connected space, each row carrying `matched`,
    `drifted`, `not-published-yet`, or `unmeasured` when the comparison could
    not be made. The version is resolved from the published descriptor, so
    passing the wrong one is not a mistake you can make. It aggregates the same
    comparison `verify-export` runs; nothing about the digest logic is
    re-implemented.

    Two asymmetries worth knowing before you gate on it. A run that finds ZERO
    contracts prints that denominator rather than refusing — publishing nothing
    yet is a state no action of yours can exit. A stale or absent mirror DOES
    refuse, naming `a2a sync`, because that one you can satisfy, and answering
    "everything matches" from an unrefreshed mirror is the failure the verb
    exists to prevent.

    Name the local subject a contract is checked against with `--local
    <XC-id>=<project-relative-path>`, repeatable, once per contract. A contract
    with no override reports `unmeasured` and SAYS which flag would measure it,
    rather than being silently skipped or quietly compared against a default —
    a row you did not ask for must not read as a row that passed. An override
    given as an empty path resolves the same as no override at all, so there is
    one way to mean "no subject" rather than two that can disagree.

    On MCP the same map is the `local_subjects` object, NOT `local`: that key is
    already published as a string for `action=verify-export`, and one grouped
    tool cannot advertise a name at two types without promising a shape one of
    its actions cannot honour.

    The MCP action resolves one space per call where the CLI aggregates all;
    the gap is recorded rather than hidden.
  affects:
  - cli
  - mcp
  roadmap:
    visibility: shipped
    why: >
      A new contract subcommand that replaces hand-rolled scripts already in
      use. A producer running one of those scripts cannot discover the verb
      from the verb they are currently calling.
  action:
    scope: local
    why: >
      If you gate on a hand-rolled published-contract check, replace it: the
      verb resolves the layout, the versions and every connected space itself,
      and the three things such scripts get wrong are the three it fixes.
    detect:
    - grep -rl 'verify-export' --include='*.sh' --include='Makefile' . 2>/dev/null | head -1 | grep -q .
    run:
    - a2a contract verify-published
- id: RN-02507-8
  kind: feat
  impact: normal
  subject: a2a contract verify-export --json — the result it already computed, readable
  detail: >
    `verify-export` computed a structured result and printed a human summary.
    The result itself was reachable from no terminal: a harness gating on
    which artifact drifted had to parse prose, or re-derive the comparison
    itself.

    `--json` emits it. Same comparison, same verdict, same exit code — only
    the render is new.
  affects:
  - cli
  roadmap:
    visibility: shipped
    why: >
      A flag on a verb producers already gate on in CI. Someone parsing the
      human summary today cannot discover from that summary that a structured
      form exists.
  action:
    scope: none
    why: >
      Additive. The existing invocation prints exactly what it printed before.
- id: RN-02507-9
  kind: fix
  impact: normal
  subject: a descriptor-only mismatch names the fields that differ instead of printing nothing
  detail: >
    When a candidate's descriptor differed from the published one but no
    carried FILE did, the comparison exited non-zero and printed no line
    naming anything — a refusal whose subject the caller had to guess at, on
    the one input where guessing is hardest, because the bytes that moved are
    frontmatter rather than a file you can diff.

    It now prints one line per changed frontmatter field.
  affects:
  - cli
  action:
    scope: none
    why: >
      Output only, on a path that already refused. Nothing that passed before
      refuses now.
- id: RN-02507-10
  kind: feat
  impact: normal
  subject: a verb's usage line names the workflow page for that verb
  detail: >
    The one surface an agent hits at the moment it does not know something is
    the usage line it gets back from a bare or malformed invocation. That line
    named flags and never named a workflow, so it ANSWERED the shallow
    question and left the real one unasked — the agent proceeded confidently,
    and no gap was ever felt.

    Every verb that has a workflow page now prints one more line:
    `workflow: run `a2a docs <topic>` for the walkthrough`. Nothing else
    changes — same flags, same exit codes, same refusals.

    Which verbs have a page is DERIVED, not listed: a verb qualifies when a
    page in the shipped docs manifest's loop corpus names it, or when it owns
    a manifest section of its own. 51 of 68 verbs qualify today. A verb with
    no page prints no line rather than pointing at something that would not
    help.

    The topic is a real argument to `a2a docs`, so the pointer resolves from
    the binary you are already running — a page you can read without knowing
    a file path, which is exactly what an agent that has not read the docs
    cannot supply.
  affects:
  - cli
  roadmap:
    visibility: shipped
    why: >
      It changes what every verb prints, and its whole value is being seen by
      a reader who did not go looking. A roadmap entry is how someone who
      already knows the CLI learns the pointer now exists.
  action:
    scope: none
    why: >
      One additional line on usage output. Nothing to run; a harness that
      matches usage text exactly may see one more line than before.
