schema: release-notes/v1
version: 0.26.0
released: "2026-08-30"
headline: what could not be determined is said out loud
changes:
- id: RN-02600-0
  kind: fix
  impact: high
  subject: a credential written as `password=…` went out to Telegram verbatim
  detail: >
    The outbound notifier redacted a closed set of provider token shapes — an
    AWS key id, a GitHub PAT, a PEM block, a Slack token and their siblings —
    and nothing else. The generic assignment shapes a human actually types
    (`password=abc`, `token: hunter2words`, `secret = s3cr3t`,
    `api_key: abc123`) were not in that set, so they were forwarded as written.

    The same strings WERE redacted from the local operational snapshot, which
    never leaves the machine. Two byte-identical copies of a keyword heuristic
    lived in `internal/cache` and `internal/operational` guarding the local
    view, while the one edge that transmits consulted the narrower predicate.
    The guard was on the wrong side of the boundary.

    The heuristics now have one home and the outbound edge calls it. "bearer"
    used as an English word does not trigger it — the shape is the assignment
    (`bearer:`, `bearer=`), not the bare word, so ordinary prose about who
    bears a cost still goes through.

    ONE CONSEQUENCE BEYOND THE OUTBOUND EDGE, named here rather than
    discovered. This does NOT change what `a2a validate` refuses. That gate's
    contract is a fixture corpus and it is deliberately narrower: a value
    shaped like `API_KEY=<your-key-here>` is a documented placeholder a
    repository is entitled to commit, and refusing it would break spaces whose
    own docs show an example. Redacting one benign line on the way out costs a
    `[redacted]`; refusing one benign line at the gate costs you a commit.
  affects:
  - cli
  - space
  action:
    scope: none
    why: >
      Nothing is owed, and nothing you already committed becomes invalid. If a
      notification you sent before this version quoted a config line, assume
      its value was delivered as written and rotate that credential — the
      redaction starts here, it is not retroactive.
- id: RN-02600-1
  kind: feat
  impact: normal
  subject: a read verb now says when it could not determine which files it skipped
  detail: >
    `a2a inbox`, `a2a outbox`, `a2a search` and `a2a thread` already told you
    when a malformed file dropped out of their output. What they did not tell
    you was when that report ITSELF could not be produced — the read failed and
    the failure was dropped, so you lost two facts at once: that the listing
    might be missing rows, and that nothing could find out which.

    It now says so on stderr, with what it attempted, what it found, and what
    to do about it. In `--json` mode it emits one JSON object on the same
    channel the existing skipped-file advisory already uses, so a consumer
    parsing stderr meets the shape it expects rather than prose in the middle
    of a stream.

    stdout is byte-identical either way. A pipeline reading the item array sees
    exactly what it saw before.

    THE MCP READ TOOLS SAY IT TOO, and by the same words. `a2a_inbox`,
    `a2a_outbox` and `a2a_search` had the same wholesale discard, and that
    surface has no stderr channel to put an advisory on — so the fact rides the
    structured result itself, as a warning whose severity is `unmeasured`
    rather than a violation claiming something was found. The sentence, the
    reason and the next step now have ONE definition below both surfaces
    instead of a copy on each, with a test pinning them together, so the two
    cannot drift into telling you different things about the same failure.
  affects:
  - cli
  - mcp
  roadmap:
    visibility: shipped
    why: >
      A read verb that cannot compute its own completeness report and says
      nothing is indistinguishable, to an agent, from one that found nothing
      to report. That difference decides whether the agent trusts the listing
      it just received, so it belongs on the public record rather than only in
      the diff.
  action:
    scope: none
    why: >
      Nothing is owed. If you script against these verbs and treat any stderr
      output as failure, note that this is an advisory and the exit code is
      unchanged — the same rule the existing skipped-file note already follows.
- id: RN-02600-2
  kind: fix
  impact: normal
  subject: "a failed file read named a path and an errno, but never the command"
  detail: >
    Every bounded file read in the CLI flows through one function, and both of
    its error returns handed the operating system's own message straight to
    stderr. You got a path and an errno with no indication of which command
    was running or which read had failed — and no `cli:` prefix, so it did not
    even look like it came from this binary.

    The error is now wrapped with the command surface and the path it was
    reading. Callers that distinguish "this file is genuinely absent" from
    "this file could not be read" still can: the wrap preserves the underlying
    error, which is what lets `contract verify` keep treating a descriptor
    deleted in a pull request as nothing-to-check rather than a hard failure.
  affects:
  - cli
  action:
    scope: none
    why: >
      Nothing is owed. The one case worth a look: a script matching these
      messages against the raw `open <path>: <errno>` shape will stop matching.
      The path and the errno are both still in the text, now behind a
      `cli: cannot read <path>: ` prefix.
- id: RN-02600-3
  kind: fix
  impact: high
  subject: "`a2a contract preflight` exited 0 over a plan `publish` would refuse"
  detail: >
    Preflight's whole purpose is previewing the plan `publish` would execute.
    It never read that plan's violations. Publish refused on exactly that
    field, three lines above the same helper it shares with preflight — so
    the two verbs disagreed about the identical candidate, and the one you
    run FIRST was the one that said yes.

    An agent scripting `a2a contract preflight; echo $?` read a clean exit
    over content the publish step would then refuse. Preflight now refuses at
    its own equivalent point, and prints the gate a human decision would be
    required at, which the plain-text render had been dropping while the JSON
    branch carried it.

    THIS IS A BEHAVIOUR CHANGE AND IT WILL BE VISIBLE. A candidate carrying
    violations previously exited 0 from preflight and now exits 1. If a
    script of yours branches on that exit code, it starts taking the other
    branch — for candidates it should already have been refusing.

    Alongside it, `a2a work status` and `a2a feedback triage --apply` stop
    returning 0 over an objection they had already computed, and every
    JSON-carrying verb now DECLARES its verdict-to-exit-code mapping in
    `schemas/verdict-exit-codes.yaml`, where a gate checks the declaration
    against the verb rather than against anyone's memory. `a2a show` still
    exits 0 over a REF-004 warning — because it declares that, not because
    nobody looked.

    One verb declares a third code: `a2a work status` exits 3 when the lease
    store itself could not be read. An empty listing that nothing could
    measure is not a clean one, and it no longer reports as one.

    THE REGISTRY'S OWN EXEMPTION HAS A SIZE, and the honest reading of that
    number is on the record: rows that name no source file are skipped by the
    check that compares a declaration against the code, so the count of them is
    seeded as a ceiling that reds if it grows. It is NOT zero, and four
    `a2a contract` sub-verbs sit inside it with declarations that do not yet
    match what their code returns. Ship what is measured, and say what is not.
  affects:
  - cli
  action:
    scope: local
    detect:
    - "grep -rn 'contract preflight' -- <your scripts and CI workflows>"
    - "a2a contract preflight --space <space> --json <candidate>; echo $?"
    why: >
      If you script `a2a contract preflight` and treat exit 0 as "proceed",
      re-read that branch: a violation-carrying candidate now exits 1 there,
      as it always did at `publish`. Nothing you have already published
      changes. Scripts treating any non-zero as one undifferentiated failure
      keep working, but 3 now means "could not measure", not "objections" —
      worth distinguishing before you retry.
- id: RN-02600-4
  kind: feat
  impact: normal
  subject: a2a installs as a plugin, and every release now carries `.mcpb` bundles
  detail: >
    Until this version, using a2a with an agent host meant configuring an MCP
    server by hand, and the instructions for doing so lived in four places that
    could disagree with each other and with the binary.

    One directory — `plugins/a2ahub/` — is now a plugin for three hosts at
    once: Claude Code (via `.claude-plugin/plugin.json` and a marketplace
    catalogue at the repository root), Agent Plugins v1, which Codex prefers
    over its own format, and Antigravity CLI. The skill tree they install is a
    symlink to the one that already shipped, so there is no second copy to
    drift. DeepSeek Harness gets a tier-1 bundle under `integrations/dsh/` with
    no JavaScript in it.

    Every release also builds six `.mcpb` bundles, one per platform, each a zip
    holding a manifest and the same binary the release already publishes. A
    `server.json` describes them for the official MCP Registry.

    THE REGISTRY LISTING IS NOT LIVE, and that is deliberate rather than
    unfinished. `.github/workflows/publish-mcp.yml` ships disarmed — it runs
    only when someone starts it by hand — because a listing widens the set of
    people running a write-capable MCP surface against their own GitHub
    credential, and that is a decision a person makes once rather than
    something a tag push performs.

    ONE THING THE BUNDLE NEEDED THAT NOTHING ELSE DID. `a2a mcp` finds your
    space by looking at the directory it was started in, which every
    editor-shaped host supplies. The bundle format has no way to say what that
    directory is, so a bundle host launches the binary next to the bundle,
    where no space exists. `A2A_PROJECT_ROOT` names the directory instead, and
    the bundle asks you to pick it at install time. If your host gives the
    server a working directory — Claude Code, Codex, dsh all do — you never
    need this.

    That variable is CHECKED rather than trusted, because its value arrives
    from a prompt: a relative path, a path that is not there, or a file where a
    directory belongs is refused BY NAME at startup. The alternative is the
    failure this paragraph exists to remove — a server that starts and then
    reports a missing config file under a path you never typed.
  affects:
  - cli
  - mcp
  roadmap:
    visibility: shipped
    why: >
      How a tool is installed is part of what the tool is. These manifests are
      the difference between "configure an MCP server by hand from a README"
      and "install it", and the disarmed registry workflow is a public promise
      about what does NOT happen automatically — both belong on the record
      rather than only in the diff.
  action:
    scope: none
    why: >
      Nothing is owed. Existing installations are untouched: the manifests are
      a new way in, not a replacement for the one you used. If you want the
      plugin form, install it; if you do not, nothing changes.
- id: RN-02600-5
  kind: feat
  impact: low
  subject: dsh is a surface a2a knows, and the messages that list surfaces stop being typed out
  detail: >
    `internal/surface`'s registry gains a third row, so `a2a skill link
    --surface dsh` links into `.dsh/skills` and `a2a doctor` recognises a
    project driven by dsh instead of reporting no agent surface at all. Both
    facts — that `.dsh/skills` is a project skill root, and that dsh reads
    `AGENTS.md` as always-on context — were verified against dsh's own source
    at a pinned commit rather than against its documentation.

    THE MESSAGES THAT NAME THE KNOWN SURFACES CHANGED TEXT, which is the only
    part of this that can reach a script. Three of them listed "claude, codex"
    or ".claude/ or .codex/" as literals typed beside the registry, so the
    moment a third row existed they described a2a as knowing less than it did.
    They are computed from the registry now, and two tests walk that registry
    independently of the code that renders it, so a fourth surface cannot leave
    them stale again.
  affects:
  - cli
  roadmap:
    visibility: shipped
    why: >
      Which agent runtimes a2a can install itself into is a question people ask
      before adopting it, so the answer belongs in the public record. The
      derivation matters publicly too: it is the reason the answer will still
      be right the next time the list grows.
  action:
    scope: local
    detect:
    - "grep -rn 'known: claude, codex' -- <your scripts and CI workflows>"
    - "grep -rn '\\.claude/ or \\.codex/' -- <your scripts and CI workflows>"
    why: >
      Only if you match on the literal text of `a2a skill link` or `a2a doctor`
      output. Those two strings now name every known surface rather than two of
      them, so an exact-match grep stops matching. Exit codes and behaviour are
      unchanged.
