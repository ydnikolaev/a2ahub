schema: release-notes/v1
version: 0.27.0
released: unreleased
headline: a space can live on your own disk, and a data handoff can run in three commands
changes:
- id: RN-02700-0
  kind: feat
  impact: normal
  subject: three composite data verbs run a whole handoff, writing exactly the full flow's events
  detail: >
    A data handoff used to be a chain of single-step commands across two
    systems: the consumer files a work request, the producer acknowledges, accepts, packs,
    delivers and responds, and the consumer fetches, verifies, acknowledges
    and closes or disputes. Each step is still there and still works the same.

    `a2a data request --producer <system> --contract <XC>@<version>` files the
    work request. `a2a data deliver --for <XW> --from <dir> --profile <p>
    --format <f>` answers it end to end on the producer side.
    `a2a data verify --for <XW> --record` judges the latest delivery on the
    consumer side and closes the request on a pass or disputes it on a
    failure. Each composite verb runs the unchanged single-step verbs in
    order, so the space receives the same events, in the same order, as the
    single-step chain would write; no schema, fold or lifecycle rule
    changed. A re-run after an interruption resumes from the first step not
    yet recorded instead of writing a step twice, and each wait on a pending
    merge gives up after `--timeout`. A run that stops names the re-run that
    picks it up, and `--help` on each data sub-verb names the workflow page in
    the skill reference that walks through it.

    The `a2a_data` MCP tool accepts the same three: `action: request`, and a
    `for` field on `deliver` and `verify`.
  action:
    scope: none
    why: >
      Nothing is owed. The single-step verbs are unchanged, and the composite
      verbs are opt-in.
  roadmap:
    visibility: shipped
    why: >
      The handoff an agent actually runs is now three commands, which is the
      difference a reader of the roadmap would notice.
- id: RN-02700-1
  kind: feat
  impact: normal
  subject: a space can be a bare git repository on this machine, with no GitHub
  detail: >
    `a2a space init <id> --local` creates a space as a bare git repository,
    by default under `$HOME/.local/share/a2a`, or wherever `--dir` points.
    `a2a connect` and `a2a init --space` accept its path, ask for no GitHub
    credential, and point at the new `a2a space join`, which writes this
    system's participant row and section in one write. Every write verb then
    works against it as it does against a GitHub space.

    A local space lands a validated write at once, as a merge commit on its
    default branch, with a compare-and-swap on the branch ref, so two writers
    racing for one space never overwrite each other. A pre-receive hook
    refuses a push that did not come through that path, so a plain
    `git push` cannot bypass validation. `a2a doctor` checks the hook, the
    git version (2.38 or newer), the history shape and that the directory is
    writable, and reports the GitHub-only checks as not applicable. When `space init --local`
    or `space join` refuses, the message says what it tried, what it found and
    the command to run next.

    A local space has no pull-request review, so its `gates:` setting decides
    who may land a gated write. Under `confirm`, the default, a first contract
    publish, a breaking version, an approve or reject, and a change to
    `space.yaml` each need `--approve`, and the landed commit records the gate
    it passed. Under `autonomous` they land without it. A classification or
    secret refusal stays a refusal in both modes. `a2a space set gates` and
    `a2a space set flow` change the setting, and `a2a doctor` shows it.
  action:
    scope: none
    why: >
      Nothing is owed. Spaces on GitHub behave exactly as before, and a local
      space is opt-in.
  roadmap:
    visibility: shipped
    why: >
      An operator with several repositories can now exchange contracts and
      data between them with no GitHub account.
- id: RN-02700-2
  kind: feat
  impact: normal
  subject: feedback can be filed with no GitHub credential and delivered later
  detail: >
    With no GitHub credential, or with `--inbox`, `a2a feedback submit` files
    the validated report offline into this machine's inbox,
    `$HOME/.local/share/a2a/feedback/inbox/`, in the hub's own format.
    `a2a feedback status` says the report is in the local inbox, with no
    network read, and a later `a2a feedback submit --all` on a machine with a
    credential delivers every filed report once, from the bytes that were
    filed. A malformed credential setting is still refused rather than hidden
    behind a local filing.
  action:
    scope: none
    why: >
      Nothing is owed. With a working credential, submit behaves exactly as
      before.
  roadmap:
    visibility: shipped
    why: >
      An agent working against a local space no longer drops an a2a defect
      because it has no token to report it with.
