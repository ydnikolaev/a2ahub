schema: release-notes/v1
version: 0.27.0
released: "2026-10-29"
headline: a space can live on your own disk, and a data handoff can run in three commands
changes:
- id: RN-02700-0
  kind: feat
  impact: normal
  subject: three composite data verbs run a whole handoff, writing exactly the full flow's events
  detail: >
    A data handoff used to be a chain of single-step commands across two
    systems: the consumer files a work request, the producer acknowledges, accepts, packs,
    delivers and responds, and the consumer fetches, verifies, acknowledges
    and closes or disputes. Each step is still there and still works the same.

    `a2a data request --producer <system> --contract <XC>@<version>` files the
    work request. `a2a data deliver --for <XW> --from <dir> --profile <p>
    --format <f>` answers it end to end on the producer side.
    `a2a data verify --for <XW> --record` judges the latest delivery on the
    consumer side and closes the request on a pass or disputes it on a
    failure. Each composite verb runs the unchanged single-step verbs in
    order, so the space receives the same events, in the same order, as the
    single-step chain would write; no schema, fold or lifecycle rule
    changed. A re-run after an interruption resumes from the first step not
    yet recorded instead of writing a step twice, and each wait on a pending
    merge gives up after `--timeout`. A run that stops names the re-run that
    picks it up, and `--help` on each data sub-verb names the workflow page in
    the skill reference that walks through it.

    The `a2a_data` MCP tool accepts the same three: `action: request`, and a
    `for` field on `deliver` and `verify`.
  action:
    scope: none
    why: >
      Nothing is owed. The single-step verbs are unchanged, and the composite
      verbs are opt-in.
  roadmap:
    visibility: shipped
    why: >
      The handoff an agent actually runs is now three commands, which is the
      difference a reader of the roadmap would notice.
- id: RN-02700-1
  kind: feat
  impact: normal
  subject: a space can be a bare git repository on this machine, with no GitHub
  detail: >
    `a2a space init <id> --local` creates a space as a bare git repository,
    by default under `$HOME/.local/share/a2a`, or wherever `--dir` points.
    `a2a connect` and `a2a init --space` accept its path, ask for no GitHub
    credential, and point at the new `a2a space join`, which writes this
    system's participant row and section in one write. Every write verb then
    works against it as it does against a GitHub space.

    A local space lands a validated write at once, as a merge commit on its
    default branch, with a compare-and-swap on the branch ref, so two writers
    racing for one space never overwrite each other. A pre-receive hook
    refuses a push that did not come through that path, so a plain
    `git push` cannot bypass validation. The space pins `core.hooksPath` in
    its own git config, so a global or system `core.hooksPath` cannot route a
    push around the hook. `a2a doctor` checks the hook git actually runs, the
    git version (2.38 or newer), the history shape and that the directory is
    writable, and reports the GitHub-only checks as not applicable. A local
    space that was moved or deleted is reported as missing, with where to
    restore it. It is never mistaken for a GitHub space that wants a token,
    and `a2a mcp` still starts and serves its read tools. A `repo_url` path that
    is missing or is not a git repository is refused when the space is
    opened, instead of being treated as a GitHub space. When `space init --local`
    or `space join` refuses, the message says what it tried, what it found and
    the command to run next.

    A local space has no pull-request review, so its `gates:` setting decides
    who may land a gated write. Under `confirm`, the default, a first contract
    publish, a breaking version, an approve or reject, and a change to
    `space.yaml` each need `--approve` (`approve: true` on the MCP
    `a2a_lifecycle` and `a2a_contract` tools), and the landed commit records
    the gate it passed. Under `autonomous` they land without it. A classification or
    secret refusal stays a refusal in both modes. Resetting, deleting or
    moving the version of a published contract is gated too, and `a2a submit`
    cannot carry the approval, so under `confirm` such a raw write is refused:
    retire a contract with `a2a contract retire`, or switch the space to
    `autonomous` first. `a2a space set gates` and `a2a space set flow` change
    the setting, and `a2a doctor` shows it. `space init --local` declares the
    express flow unless `--flow full` says otherwise.

    `a2a version --json` now reports, for each connected space, its `gates`,
    `flow` and `lands_synchronously`, read from the local mirror with no
    network call, so an agent can learn at session start how its writes will
    land. A value it cannot read is `null`, never a guessed `false`.
  action:
    scope: none
    why: >
      Nothing is owed. Spaces on GitHub behave exactly as before, and a local
      space is opt-in.
  roadmap:
    visibility: shipped
    why: >
      An operator with several repositories can now exchange contracts and
      data between them with no GitHub account.
- id: RN-02700-2
  kind: feat
  impact: normal
  subject: feedback can be filed with no GitHub credential and delivered later
  detail: >
    With no GitHub credential, or with `--inbox`, `a2a feedback submit` files
    the validated report offline into this machine's inbox,
    `$HOME/.local/share/a2a/feedback/inbox/`, in the hub's own format.
    `a2a feedback status` says the report is in the local inbox, with no
    network read, and a later `a2a feedback submit --all` on a machine with a
    credential delivers every filed report once, from the bytes that were
    filed. A malformed credential setting, or a `cmd:` credential command
    that fails or prints nothing, is still refused rather than hidden behind a
    local filing. The error names the command's exit status and never echoes
    what it printed. `a2a feedback submit <draft>` of a report already filed
    to the inbox sends the filed bytes. If the draft was edited since, it is
    refused with `inbox-conflict`, and a changed report is filed under a new id.
  action:
    scope: none
    why: >
      Nothing is owed. With a working credential, submit behaves exactly as
      before.
  roadmap:
    visibility: shipped
    why: >
      An agent working against a local space no longer drops an a2a defect
      because it has no token to report it with.
- id: RN-02700-3
  kind: fix
  impact: normal
  subject: superseding an approved or rejected decision was refused at merge
  detail: >
    `a2a supersede` of an approved or a rejected decision wrote its event,
    and the space's required check (`a2a validate --ci`) then refused the
    pull request with LFC-002, saying the actor was not authorized. The rule
    for these two transitions also judges the successor decision, and the
    check never looked it up, so it judged them against no successor and
    refused every one. The CLI's own pre-write check did look it up, which
    is why the command itself accepted the write.

    The check now reads the successor from the target branch as it was
    before the pull request, the same tree the superseded decision is judged
    from. A successor that is approved only inside the same pull request is
    not yet something the space agreed to, so that supersede is refused with
    LFC-005. A successor that does not exist is refused with LFC-005 too,
    with the advisory LFC-006 beside it saying the precondition could not be
    evaluated.
    Neither is ever reported as LFC-002 again.
  affects: ["a2a validate --ci", "a2a supersede"]
  action:
    scope: space
    why: >
      A GitHub space picks the fix up with `a2a space update` after this
      release, which moves its workflow pin. A pull request already refused
      this way can be re-run once the pin moves; nothing in it needs an edit.
    detect: ["a2a space update --dry-run"]
    run: ["a2a space update"]
  roadmap:
    visibility: omit
    why: >
      A defect fix in an existing verb; the roadmap names capabilities, not
      repairs.
- id: RN-02700-4
  kind: fix
  impact: normal
  subject: a contract reset to 0.0.0 no longer lets a breaking change through as a minor
  detail: >
    The required check judged a contract's compatibility against the
    version in its descriptor at the tip of the target branch. A descriptor
    reset to 0.0.0, the version a never-published contract carries, made
    that baseline 0.0.0, so a later write that published 1.1.0 over a
    published 1.0.0 looked like a major bump and skipped the breaking-change
    check: a breaking change could land as a minor version.

    The baseline is now the newest version actually published, read from
    the space's history of publish events, the same reader `a2a contract
    publish` plans from. A descriptor with no publish event in history is
    still judged against its own version, as before. `a2a contract publish`
    also refuses an explicit target version of 0.0.0, which publishes
    nothing.
  affects: ["a2a validate --ci", "a2a contract publish"]
  action:
    scope: space
    why: >
      A GitHub space picks the fix up with `a2a space update` after this
      release. No artifact already merged is judged again.
    detect: ["a2a space update --dry-run"]
    run: ["a2a space update"]
  roadmap:
    visibility: omit
    why: >
      A defect fix in an existing check; the roadmap names capabilities, not
      repairs.
- id: RN-02700-5
  kind: fix
  impact: normal
  subject: the binary and every space's validate workflow build on a Go toolchain
    with fourteen fewer called vulnerabilities
  detail: >
    `make release-preflight` refused this cut on fourteen vulnerabilities
    `govulncheck` reports as reachable from this code. The toolchain moves from
    go1.26.6 to go1.26.10, which fixes the standard-library ones in `net/http`,
    `net/textproto`, `crypto/tls`, `crypto/x509`, `html/template` (reached
    through the local dashboard server) and `os`. `golang.org/x/net` moves to
    v0.60.0 and `google.golang.org/grpc` to v1.83.1 (reached through Sigstore
    verification of a release). The accepted-findings list stays empty.

    The reusable validate workflow names the toolchain explicitly, because a
    space repository has no `go.mod`; it moves with `go.mod`, which
    `workflow-lint` asserts.
  affects:
  - a2a binary
  - a2a-validate-reusable.yml
  action:
    scope: space
    why: No action for an existing space pinned to an earlier release; a space
      adopts the new toolchain when its workflow pin moves to this release.
  roadmap:
    visibility: omit
    why: >
      A dependency security fix; the roadmap names capabilities, not repairs.
