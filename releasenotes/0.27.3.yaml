- id: RN-02703-17
  kind: fix
  impact: normal
  subject: a2a new fills space from the recipient when several spaces are connected
  detail: >
    With several spaces connected the draft kept `space: <space-id>`. It is now
    filled when this system shares exactly one space with every recipient, and
    refused with a hint to use `--field space=<id>` when it shares more than
    one.
  action:
    scope: none
    why: >
      Only for a script that drafts for a recipient shared across two spaces: it
      now exits 2 and must pass `--field space=<id>`.
  roadmap:
    visibility: omit
    why: >
      A correction of existing behaviour; a reader of the roadmap would not plan
      around it.
