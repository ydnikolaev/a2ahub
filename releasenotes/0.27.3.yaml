- id: RN-02703-19
  kind: policy
  impact: low
  subject: this release was proved without the GitHub live matrix
  detail: >
    This release changes the shared write funnel, the contract size limit and how
    a lifecycle verb finds its target space. It was cut on the provider-deferred
    tier, by the operator's written authorization: the logic tier, the full
    container suite and the release preflight were run; the live matrix was not.

    Not proven for this release: branch protection blocking until green,
    `enforce_admins` binding a participant while skipping an admin, a
    cross-section authorization decision surviving a privileged re-trigger,
    GitHub serving a check computed against a stale ref, a direct push to
    `main` being refused, the shipped Actions workflow running
    `a2a validate --ci`, compound check-run name resolution, and a space's own
    CI having no unexplained failures. The last live run against GitHub is
    dated 2026-08-02 (v0.18.2). A space on your own disk does not depend on
    any of these rows; a GitHub space on the pull-request path does.
  affects:
  - a2a binary
  action:
    scope: none
    why: >
      Nothing to do. Recorded so the omission is readable rather than assumed.
