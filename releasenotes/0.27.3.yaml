schema: release-notes/v1
version: 0.27.3
released: "2026-11-10"
headline: a contract can carry its generated files, and a landed write is visible at once
changes:
- id: RN-02703-0
  kind: fix
  impact: high
  subject: a contract can carry a generated file up to 8 MiB
  detail: >
    A contract file was limited to 1 MiB, so a generated manifest could not be
    published and the contract's own set no longer matched what it carried. The
    per-file limit is now 8 MiB, and the 16 MiB limit on the whole contract
    stays. An older binary refuses to read a contract carrying a larger file, so
    the space's minimum binary version moves with this release.
  action:
    scope: none
    why: >
      An older binary reports the space is ahead and asks for an update, which
      is the normal path.
  roadmap:
    visibility: omit
    why: >
      A correction of existing behaviour; a reader of the roadmap would not plan
      around it.
- id: RN-02703-1
  kind: fix
  impact: high
  subject: a landed write is visible to the next read
  detail: >
    On a space where the write lands synchronously, `a2a contracts` and other
    reads did not show the write until `a2a sync`, which read as an unfinished
    publication. A landed write now refreshes the local mirror.
  action:
    scope: none
    why: >
      Nothing is owed.
  roadmap:
    visibility: omit
    why: >
      A correction of existing behaviour; a reader of the roadmap would not plan
      around it.
- id: RN-02703-2
  kind: fix
  impact: normal
  subject: a contract's companion files are no longer reported as undecodable
  detail: >
    An ordinary Markdown file under a contract's `artifacts/`, `schema/` or
    `fixtures/` printed `could not be decoded` on every read and held the
    doctor's visibility scan at UNVERIFIED. These files are no longer read as
    exchange artifacts. A malformed artifact elsewhere is still reported.
  action:
    scope: none
    why: >
      Nothing is owed.
  roadmap:
    visibility: omit
    why: >
      A correction of existing behaviour; a reader of the roadmap would not plan
      around it.
