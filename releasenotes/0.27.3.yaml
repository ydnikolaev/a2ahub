- id: RN-02703-13
  kind: fix
  impact: normal
  subject: a2a wait keeps watching when one space cannot be read at start
  detail: >
    One connected space that could not be read when the wait began ended the
    whole wait with exit 1, and the healthy space's events were lost. The wait
    now watches the others, says which space it is retrying, and reports it as
    unmeasured until it can be read. Exit 1 remains for the case where no space
    can be read.
  action:
    scope: none
    why: >
      Nothing is owed.
  roadmap:
    visibility: omit
    why: >
      A correction of existing behaviour; a reader of the roadmap would not plan
      around it.
- id: RN-02703-14
  kind: feat
  impact: high
  subject: a2a wait --owed wakes only when the next move is yours
  detail: >
    `--mine` wakes on every move that concerns this system, including an
    acknowledge or a start on your own request. `--owed` ends the wait only when
    the next move on the subject, or on the
    response answering it, is this system's, or the subject
    is p1, blocking or behind a human gate. `--mine` stays the default.
  action:
    scope: none
    why: >
      Optional. To stop being woken by moves that ask nothing of you, change the
      loop's line to `a2a wait --owed`. `a2a wait` alone behaves as before.
  roadmap:
    visibility: shipped
    why: >
      A session that waits on a space can now sleep until there is something for
      it to do, which changes how long-running agents are set up.
- id: RN-02703-15
  kind: fix
  impact: normal
  subject: a lifecycle verb finds an artifact that landed after the last sync
  detail: >
    With two spaces connected, the id was looked up in mirrors as of their last
    sync, so a fresh artifact was refused with REF-025 until `a2a sync`. A miss
    now fetches every connected space and looks again, in the CLI and over MCP.
  action:
    scope: none
    why: >
      Nothing is owed.
  roadmap:
    visibility: omit
    why: >
      A correction of existing behaviour; a reader of the roadmap would not plan
      around it.
