schema: release-notes/v1
version: "0.23.0"
released: "2026-08-13"
headline: "The transport registry gets a real caller, and the dashboard starts explaining whose move it is"
changes:
  - id: RN-02300-0
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        Spec 05a's AC-8 promises that a second transport driver costs "a
        registry entry plus conformance tests". The registry existed and was
        tested, and had zero production callers — the delivery path built its
        driver directly, so the promise was false as wired.
    impact: normal
    subject: "a data package's declared transport_driver now selects the driver that moves its bytes"
    detail: >
      `transport_driver` was written at exactly one site and read by nobody.
      `DeliverDataPackage` now decodes that one field and looks the driver up
      in the registry, and `internal/space` registers its own space-git driver
      lazily. A manifest naming an unregistered driver is refused by name.

      Registration is a `sync.OnceValue` rather than an `init`: this repository
      bans init functions, and the ban is right — a registry populated at
      import time is precisely the implicit ordering with invisible side
      effects that rule exists to prevent.

      Found by the phase's own audit, which was right to call the promise
      overstated. The read half stays unwired and is stated rather than
      claimed: `a2a data fetch` still resolves directly, and a second driver
      would need a read hook that lands with `data-package/v2` — the wire enum
      is frozen in v1 regardless.
    affects: [contracts]
    action:
      scope: none
      why: "No action. No command, flag or lifecycle changed; a manifest that was already valid still delivers exactly as before."

  - id: RN-02300-1
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The first dashboard-coherence slice is user-visible and additive: it
        proves the complete domain-to-card path before the remaining views are
        rebuilt on the same contract. Hiding it would leave the current
        binary's changed dashboard and JSON surface undocumented.
    impact: normal
    subject: "Overview attention cards say whose turn it is, what move is expected, and why"
    detail: >
      Attention cards now carry the pendency verdict the domain already
      computed: waiting systems, expected transition and any human gate. A
      bilingual sentence explains the active reason in the card body; the
      rule citation remains available under Technical detail instead of being
      presented as the explanation.

      The reason codes and pendency-row identity are typed and enumerated from
      their domain homes. Inbox and outbox JSON gain `human_gate` only when a
      gate exists; existing fields keep their values and empty rows keep the
      key omitted. The browser no longer infers this gate from a coincidental
      reason string, and the vocabulary gate now refuses the equivalent
      inline state-classification chain as well as a hand-built list.

      This is the first slice of the dashboard-coherence work, not a claim
      that every dashboard family has already been rebuilt. The existing 4
      MiB shell ceiling remains in force; measured headroom requires the next
      mapping phase to add honest item-family admission bounds.
    affects: [dashboard, "a2a inbox", "a2a outbox", MCP]
    action:
      scope: none
      why: "No action. Regenerate a dashboard with the current binary to see the clearer attention cards; existing JSON consumers may ignore the additive human_gate key."

  - id: RN-02300-2
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        The attention-card audit found that the browser could still classify
        two raw reason strings and that dashboard thread construction could
        evaluate the same pendency relation a second time. Both violated the
        single-answer contract behind the first coherence slice.
    impact: normal
    subject: "dashboard rows, threads and prompts now share one attention verdict"
    detail: >
      Cache now builds the dashboard exchange and thread projections from one
      folded snapshot and evaluates each artifact's pendency verdict once.
      Missing or cross-thread response parents take one explicit degraded
      fallback, so the carried owner agrees with the matching legal action.

      Overdue and activation-needed status are carried as semantic booleans;
      the browser no longer recovers them by matching raw reason-code strings.
      The vocabulary gate also distinguishes a carried outcome operand from a
      state operand and refuses unknown state comparisons even when only one
      known state appears beside the typo.
    affects: [dashboard]
    action:
      scope: none
      why: "No action. Existing inbox/outbox JSON remains compatible; regenerate the dashboard to consume the corrected projection."

  - id: RN-02300-3
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        Dashboard ordering and Overview counts are product semantics, not
        browser formatting. Publishing the new domain answers and their
        catalogue now records the contract before the view-model phase wires
        them into the visible screen.
    impact: normal
    subject: "dashboard attention order and Overview KPI membership now have one domain owner"
    detail: >
      Cache now returns the complete six-tier attention order and the exact
      object sets behind Need you, No human move, You await and Lines off
      current. Counts are the lengths of those sets, so a tile and the list it
      opens cannot describe different objects. Dependency reads are bounded,
      strict and degradation-aware instead of silently treating a partial scan
      as a complete total.

      The hidden binary vocabulary catalogue also adds the typed reason,
      pendency-rule and human-gate families without changing its existing
      outcome, state, transition or human-gate fields. The dashboard mapping
      phase consumes these answers next; this release entry does not claim the
      old browser formulas have already been removed.
    affects: [dashboard]
    action:
      scope: none
      why: "No action. These are additive read-model and catalogue contracts; existing command output remains compatible."

  - id: RN-02300-4
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The local dashboard was one monolithic source file, so independent
        view work could not be reviewed or delivered without overlapping the
        whole screen. The extraction is intentionally behavior-preserving but
        materially changes the product's implementation boundary.
    impact: normal
    subject: "dashboard views now have independent component and lifecycle boundaries"
    detail: >
      The local dashboard now composes one shell, nine view components, one
      root modal engine and one live-transport component. The root keeps
      normalized data, shared UI state, hydration and navigation; each view
      owns its own presentation mapping. Component discovery and the public
      Guide projection derive from the root import graph instead of a second
      registry.

      Rendered behavior is unchanged: the generated embedded template matches
      the reviewed sources, the public site builds, and the existing browser
      contract passes across desktop/mobile, light/dark and Russian/English.
    affects: [dashboard]
    action:
      scope: none
      why: "No action. Regenerate the dashboard with the current binary; routes, data and visible behavior remain compatible."

  - id: RN-02300-5
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The served dashboard previously had no exact JSON twin and its live
        invalidation identity covered only the operational revision. A
        non-operational dashboard change could therefore be missed or require a
        second encoding path.
    impact: normal
    subject: "served dashboards expose one exact digest-coherent JSON view"
    detail: >
      The loopback server now serves the exact compact JSON bytes embedded in
      the dashboard shell at /api/v1/dashboard. Conditional requests, SSE
      invalidations and retained generations share the exact view-model digest,
      while the semantic generation key also observes non-operational content.
      Root, snapshot and dashboard responses share one bounded writer pool and
      retain the last good generation when rendering or size validation fails.

      The separate `a2a html --json` command remains byte-compatible: its
      existing two-space-indented output and trailing newline are unchanged.
    affects: [dashboard, serve]
    action:
      scope: none
      why: "No action. Existing dashboard URLs and CLI JSON output remain compatible; live clients may adopt the additive dashboard route."

  - id: RN-02300-6
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The dashboard already computed more domain truth than its JSON model
        admitted, and its repeated collections had no honest cardinality
        contract. P7 is the additive transport contract the rebuilt views use.
    impact: normal
    subject: "dashboard payloads carry one bounded copy of every domain answer"
    detail: >
      Dashboard assembly now reads one folded snapshot and one dependency
      projection, maps each active item once, and reuses those objects for
      attention sets, thread open items and detail admission. Rule identity,
      the server-composed reason sentence, operational readiness, source
      synchronization, dependency degradations and document byte facts no
      longer fall through mapper gaps.

      Every repeated root and nested collection now carries shown, total and
      truncated facts from the same stable prefix that produced it. Need-you
      objects win scarce detail slots, and the largest saturated fixture stays
      below the existing 2 MiB DATA and 4 MiB shell ceilings. The later view
      phases consume these additive fields; this entry does not claim those
      screen rewrites are already complete.
    affects: [dashboard, "a2a html --json", serve]
    action:
      scope: none
      why: "No action. Existing JSON fields keep their values; consumers may ignore the additive facts and windows until they adopt the rebuilt views."

  - id: RN-02300-7
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        Eleven status families were interpreted by scattered browser tables or
        had no complete human wording at all. The payload now carries one
        authoritative bilingual presentation dictionary before the view
        families migrate to it.
    impact: normal
    subject: "dashboard status words now come from one complete RU/EN vocabulary"
    detail: >
      The binary catalogue preserves its established fields and adds
      owner-derived freshness, reason, rule, work-mode, dependency,
      consistency, operational and live-transport sets. One 71-entry dashboard
      dictionary covers the exact eleven-family universe, with complete RU and
      EN labels and explanations, six closed tones, six non-colour cues and a
      separate fallback that never echoes unknown input.

      The browser has one resolver and one calm-policy seam. Calm treatment
      changes only chroma while words and cues remain intact; policy never
      travels in the payload. Existing per-view lookup tables are removed by
      their P9-P14 owners, and P16 freezes the final monopoly rather than this
      foundation claiming that migration early.
    affects: [dashboard]
    action:
      scope: none
      why: "No action. The table and catalogue keys are additive; regenerated dashboards carry the vocabulary automatically."

  - id: RN-02300-8
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The bundled dashboard is the executable showroom and the offline
        browser fixture. Missing declared states made green UI tests weaker
        than the vocabulary contract they claimed to demonstrate.
    impact: normal
    subject: "the bundled dashboard demo now exercises every renderable vocabulary value and every bounded collection"
    detail: >
      The demo now carries all 91 fixture-instantiable family/value pairs,
      including every one of the 25 lifecycle transitions, while the five
      browser-local transport states remain covered by their live-client
      scenarios. Work, consistency and document previews deliberately cross
      their server limits, so the visible sample proves shown, total and
      truncated facts instead of presenting a prefix as complete.

      Fixture coverage is derived from the binary catalogue rather than a
      copied list. The committed compact dashboard data, indented CLI JSON and
      embedded template are regenerated projections of that same model, and
      the gate fails by the exact missing family/value when a future catalogue
      addition lacks a visible fixture carrier.
    affects: [dashboard, "a2a html --demo", "a2a html --json"]
    action:
      scope: none
      why: "No action. Regenerate a demo dashboard with the current binary to inspect the expanded state and bounds coverage."

  - id: RN-02300-9
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The dashboard's principal screens previously disagreed about status,
        order, counts and detail content even when they described the same
        carried object. The rebuilt view families make those answers visible
        from one model and one card route.
    impact: normal
    subject: "the local dashboard now keeps one bilingual card, one status vocabulary and one explicit refresh path"
    detail: >
      Overview, Exchange, Threads, Contracts, Map and Spaces now consume the
      server-carried sets, ordering, reasons, windows and byte bounds directly.
      Seven canonical card kinds render the same ordered RU/EN facts from every
      entry point; the map's parallel detail dialog is removed, unknown values
      never leak raw, and one resolver owns status words, cues and chroma.
      Release sequences preserve the carried server order; the remaining
      browser sorts are bounded, named presentation-only layout operations.
      Portable schemas now freeze the seven card object shapes, including the
      nested thread facts, while deliberately leaving the local dashboard
      envelope outside the public contract.
      The loopback server's CSP admits the bundled component evaluator while
      continuing to deny remote scripts, styles, images and non-self
      connections.

      Live SSE messages now announce a newer digest without replacing the
      screen. Refresh dashboard performs one conditional fetch and one atomic
      hydrate, preserving the selected view, filters, hash, focus, scroll and
      mounted card state; a removed card remains readable with an exact gone
      banner over retained last-good data. File and non-loopback dashboards
      remain inert. The external GitHub provider/API tier is deliberately
      deferred; deterministic Open on GitHub links still use only the carried
      repository and revision and perform no network request.
    affects: [dashboard, serve, "a2a html"]
    action:
      scope: none
      why: "No action. Regenerate or reopen the dashboard to use the coherent views and explicit refresh control."

  - id: RN-02300-10
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The plan assigns notification fan-out to the hub, which is a v2
        service, so until it exists no always-on party tells a human that a
        move needs them — every local surface is silent while the machine is
        asleep. §15 records the interim explicitly: the space-CI
        Actions-to-Telegram fallback may ship instead. This is the first
        wave of that epic.
    impact: normal
    subject: "a space's notification routes are declared, validated and refused when malformed"
    detail: >
      `notification_routes` has shipped in the space template since it was
      written, and nothing validated it: the manifest schema does not declare
      the key, and `additionalProperties: true` accepted anything at all. A
      route with a typo in it was silence, discovered only by a notification
      that never arrived.

      The shape is now enforced by the space's own pull-request gate. Every
      route must name a channel, a chat and at least one event; unknown keys,
      wrong types, values outside an enum, a duplicate event, a chat that is
      not a numeric string, and more than sixteen routes are each refused with
      the path that is wrong. A route whose `for` names a participant the
      manifest does not list, or that duplicates another route's target, is
      refused as well, and a manifest carrying anything shaped like a Telegram
      bot token is refused outright.

      Validation lives in the policy layer rather than in the schema, because
      `manifest/v1`'s bytes are frozen: they decide whether documents already
      committed to shared spaces are valid. The open schema accepts the key on
      every binary already deployed, so adopting this needs no upgrade, no
      floor bump and no workflow bump — only a route worth adding.

      The agent-prompt tables and the bilingual dashboard vocabulary also moved
      out of the presentation package into their own, so a caller that is not a
      browser can quote the same words and the same legal moves. Nothing
      rendered changes.
    affects: ["space.yaml", "a2a validate", dashboard]
    action:
      scope: none
      why: "No action. A space with no notification_routes, or with an empty list, is unaffected; the key is optional and defaults to none."

  - id: RN-02300-11
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The routes were declared but nothing read them. This is the verb that
        turns a push into the messages those routes describe, and the sender
        that puts them on the wire.
    impact: normal
    subject: "`a2a notify` turns a push into chat messages, from the repository alone"
    detail: >
      `a2a notify render` reads a space checkout and prints, as JSON, the
      messages a push would produce: one per configured route per qualifying
      artifact, carrying the type, who sent it to whom, whose move it is now,
      priority and deadline, the artifact's own text, and — for a route that
      names a participant — a copy-paste block that hands the move to an agent.

      It needs no local cache. A CI runner has none, so the facts come from the
      repository itself, folded through the same machinery every other read
      surface uses rather than a second implementation that could disagree with
      it. `--only <id,id>` renders exactly the artifacts you name, however old
      or settled, which is how a layout gets reviewed on real documents.

      `a2a notify send` reads that array and delivers it. A failed send fails
      the command: a notification that silently did not fire is the same defect
      as a check that silently passed. A missing token is refused before
      anything is sent, naming the variable that is missing; Telegram's own
      rate limiting is honoured and then, if it persists, reported rather than
      swallowed.

      Messages render two ways over one set of facts — HTML by default, and
      Telegram's newer rich blocks per route — so a newer chat capability can
      never become a second version of what a message says. `--dry-run` prints
      exactly what would be sent without sending it.

      Anything shaped like a credential is stripped from an artifact's text
      before it can reach a chat, and the bot token cannot appear in any
      output. It is held in a type that prints as [redacted], and no error
      that touched a URL carrying it is ever wrapped or reformatted — both the
      network layer and the request builder embed the full address in their
      own error text, and Telegram's addresses carry the token, so those
      errors are replaced rather than passed along.
    affects: ["a2a notify"]
    action:
      scope: none
      why: "No action. The verb is inert without a configured notification route; delivery from CI arrives with the workflow in a later change."

  - id: RN-02300-12
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The verb existed and nothing ran it. This is the delivery plane — the
        workflow a space adds with one line — and the setup flow that connects
        a bot to it without the token ever passing through an agent.
    impact: normal
    subject: "a space can be told to notify Telegram, in one line and one secret"
    detail: >
      A space repository gains chat notifications by adding one `uses:` line
      and one Actions secret. It carries no notification logic, no pinned
      binary and no fetch token: everything lives in a reusable workflow in
      a2ahub, referenced by release tag, so a fix reaches every space through a
      version bump instead of an edit in each one. `a2a space init` writes the
      caller for new spaces; `a2a space update` adds it to existing ones.

      The job is silent until a route is configured, and loud when one is
      broken: a route whose secret is missing fails the run rather than
      quietly sending nothing. What was sent — and, on a dry run, exactly what
      it would have looked like — is printed in the run's own summary, so a
      layout can be reviewed before it reaches a chat and a failure can be read
      without opening Telegram.

      `a2a notify setup` walks a human through creating the bot, handing over
      its token, choosing a chat, and proving the whole path works. The token
      is typed at the terminal with the screen echo off, passed straight to
      GitHub's secret store, and never written down anywhere else — no agent
      involved in the conversation ever sees it. The setup reports success only
      after a real run actually delivered a message; a green run that sent
      nothing is reported as unproven, because it is.

      `a2a doctor` gains three checks for a configured space: whether every
      route is well-formed, whether the secrets they name exist (presence only
      — no secret's value is ever read), and whether the last delivery
      succeeded. A channel that has gone quiet is now diagnosable instead of
      merely silent.

      The MCP surface gains an `a2a_notify` tool with the same five actions,
      and it is registered but NOT wired: every call answers that notify
      operations are not available. It is listed here because an agent
      enumerating tools will find it and needs to know to use the CLI verbs
      instead — a tool that is present and always refuses, with nothing saying
      why, is worse than one that is absent.
    affects: ["space.yaml", "a2a space init", "a2a space update", "a2a notify", "a2a doctor", MCP]
    action:
      scope: space
      why: "Optional per space. Existing spaces gain nothing until an operator runs `a2a space update` and then `a2a notify setup`. A space that does neither is unchanged."

  - id: RN-02300-13
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        `make release-preflight` refused this cut on six CALLED standard-library
        vulnerabilities. The toolchain a space runs is named literally inside
        the reusable workflows, so a fix in `go.mod` reaches a space only if
        those move with it — and nothing asserted that they did.
    impact: normal
    subject: "every space validates and notifies on a Go toolchain with six fewer called vulnerabilities"
    detail: >
      The toolchain moves from go1.26.5 to go1.26.6, which fixes all six
      standard-library vulnerabilities `govulncheck` reports as reachable from
      this code: quadratic path resolution in `net/url`, JavaScript regexp
      context tracking in `html/template`, post-handshake message flooding in
      `crypto/tls`, a missing `ReadHeaderTimeout` on the unencrypted HTTP/2
      check in `net/http`, unbounded recursion in `encoding/asn1` (reached
      through detached cosign verification), and ASCII-only punycode labels in
      `x/net/idna`. The accepted-findings list stays empty: every called
      vulnerability is a hard red again.

      A space repository has no `go.mod`, so the two reusable workflows name
      the toolchain version explicitly while repo-local jobs read the file.
      That split had no reader, and bumping one without the other would have
      left every space on the vulnerable toolchain silently. `workflow-lint`
      now refuses any explicit `go-version:` that `go.mod` does not name.
    affects: ["a2a-validate-reusable.yml", "a2a-notify-reusable.yml"]
    action:
      scope: space
      why: "No action for an existing space pinned to an earlier release; a space adopts the new toolchain when its workflow pin moves to this release."

  - id: RN-02300-14
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        A space that publishes a second contract version could be refused by
        its own first publication's leftover branch. Only branch pruning hid
        it, so whether it bit depended on a repository setting nobody had
        connected to contract publishing.
    impact: normal
    subject: "publishing a second contract version is no longer blocked by the first publication's surviving branch"
    detail: >
      The remote publication-head probe aborted its whole listing on the first
      error from any head, before it had asked whether that head was even
      relevant. So a first publish's merged-but-unpruned branch could refuse
      every later publish with a recompute conflict, and a space with branch
      pruning turned off, or merely slow, would hit it while a space with
      pruning on would not.

      The probe now skips a head whose recorded target version already resolves
      in the space's authoritative published history — the same question the
      publisher already asks and trusts one step earlier. A head that is
      genuinely in conflict, and not already published, still fails the probe
      exactly as before, and a skipped head is never eligible for the
      exact-intent repair path.
    affects: ["a2a contract publish"]
    action:
      scope: none
      why: "No action. Nothing about a published contract's content or its history changes; a publish that used to be refused now proceeds."

  - id: RN-02300-15
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        Onboarding recommends two automations that make the loop run without a
        human, and nothing verified either one. The recommendation was the only
        thing standing between a space and never having them.
    impact: normal
    subject: "`a2a doctor` names the two automations it cannot see, instead of staying silent about them"
    detail: >
      A new `automation coverage` row names both automations the onboarding
      recommends — a harness session-start hook, and a scheduled poll workflow
      in the participant's own repository — states that doctor cannot observe
      either, says why, and tells you to check them by hand.

      It never FAILs, and that is the design rather than a shortfall. The
      session-start hook lives in your agent harness's own configuration, which
      a2a does not read or write; the poll workflow lives in your repository,
      not the space, so it is outside every path doctor looks at. A FAIL would
      claim doctor had seen a broken state it structurally cannot see.
    affects: ["a2a doctor"]
    action:
      scope: none
      why: "No action. The row is informational; if you have not set up either automation, `onboarding.md` §8.6 describes both."

  - id: RN-02300-16
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        Every space's required merge check compiled the validator from source
        on every pull request. That cost about three minutes per PR and made
        each space resolve, verify and compile a2ahub's whole module graph —
        including cryptographic libraries the validator never executes.
    impact: normal
    subject: "a space's merge check now runs a signed release binary instead of compiling one"
    detail: >
      The reusable validation workflow downloads the signed `a2a-linux-amd64`
      for the release its pin names, and verifies that binary's keyless
      Sigstore signature before placing it anywhere executable. The certificate
      identity and OIDC issuer are the same pair `a2a update` already verifies
      with, so both paths accept exactly the same signer.

      The integrity property is unchanged in kind. What `go install` bought was
      not a checksum but a public, append-only log anyone can inspect after the
      fact; Sigstore's transparency log plus the release workflow's own
      identity is the same guarantee. Verifying a checksum file fetched from
      the same release would NOT have been — whoever could replace the binary
      could replace the checksums beside it.

      A space still needs no token: the assets are public and the proof is a
      public log entry. Nothing in a space changes until its workflow pin moves
      to this release or later.
    affects: ["a2a-validate-reusable.yml"]
    action:
      scope: space
      why: "No action for a space pinned to an earlier release; a space adopts this when its workflow pin moves. Spaces that mirror the workflow rather than calling it must adopt the cosign step themselves."

  - id: RN-02300-17
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        A publication head's proof is recomputed by whichever binary is
        checking, against a value recorded by whichever binary published. When
        those differ, the check failed with the same message a tampered head
        produces, and nothing distinguished an upgrade from an attack.
    impact: normal
    subject: "a contract-publication conflict now says whether it is a version boundary or a real disagreement"
    detail: >
      A recovered publication head now records the version of the binary that
      minted it, and the refusal distinguishes three cases: the same binary
      recomputing its own head, which is the only one that may indicate
      tampering; a head recorded before this field existed; and a head minted
      by a different version, which names both versions so it is clear which
      upgrade crossed the boundary.

      All three remain refusals — a head whose proof cannot be established is
      not a head to trust — but only one of them accuses anyone.

      Heads written by earlier releases keep working: the new field is optional
      on read, and its absence is reported as a compatibility state rather than
      folded into a conflict.
    affects: ["a2a contract publish"]
    action:
      scope: none
      why: "No action. Existing publication heads decode unchanged; a conflict message may now name two versions where it previously did not."
