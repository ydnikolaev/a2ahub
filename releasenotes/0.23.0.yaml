schema: release-notes/v1
version: "0.23.0"
released: "2026-08-13"
headline: "The transport registry gets a real caller, and the dashboard starts explaining whose move it is"
changes:
  - id: RN-02300-0
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        Spec 05a's AC-8 promises that a second transport driver costs "a
        registry entry plus conformance tests". The registry existed and was
        tested, and had zero production callers — the delivery path built its
        driver directly, so the promise was false as wired.
    impact: normal
    subject: "a data package's declared transport_driver now selects the driver that moves its bytes"
    detail: >
      `transport_driver` was written at exactly one site and read by nobody.
      `DeliverDataPackage` now decodes that one field and looks the driver up
      in the registry, and `internal/space` registers its own space-git driver
      lazily. A manifest naming an unregistered driver is refused by name.

      Registration is a `sync.OnceValue` rather than an `init`: this repository
      bans init functions, and the ban is right — a registry populated at
      import time is precisely the implicit ordering with invisible side
      effects that rule exists to prevent.

      Found by the phase's own audit, which was right to call the promise
      overstated. The read half stays unwired and is stated rather than
      claimed: `a2a data fetch` still resolves directly, and a second driver
      would need a read hook that lands with `data-package/v2` — the wire enum
      is frozen in v1 regardless.
    affects: [contracts]
    action:
      scope: none
      why: "No action. No command, flag or lifecycle changed; a manifest that was already valid still delivers exactly as before."

  - id: RN-02300-1
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The first dashboard-coherence slice is user-visible and additive: it
        proves the complete domain-to-card path before the remaining views are
        rebuilt on the same contract. Hiding it would leave the current
        binary's changed dashboard and JSON surface undocumented.
    impact: normal
    subject: "Overview attention cards say whose turn it is, what move is expected, and why"
    detail: >
      Attention cards now carry the pendency verdict the domain already
      computed: waiting systems, expected transition and any human gate. A
      bilingual sentence explains the active reason in the card body; the
      rule citation remains available under Technical detail instead of being
      presented as the explanation.

      The reason codes and pendency-row identity are typed and enumerated from
      their domain homes. Inbox and outbox JSON gain `human_gate` only when a
      gate exists; existing fields keep their values and empty rows keep the
      key omitted. The browser no longer infers this gate from a coincidental
      reason string, and the vocabulary gate now refuses the equivalent
      inline state-classification chain as well as a hand-built list.

      This is the first slice of the dashboard-coherence work, not a claim
      that every dashboard family has already been rebuilt. The existing 4
      MiB shell ceiling remains in force; measured headroom requires the next
      mapping phase to add honest item-family admission bounds.
    affects: [dashboard, "a2a inbox", "a2a outbox", MCP]
    action:
      scope: none
      why: "No action. Regenerate a dashboard with the current binary to see the clearer attention cards; existing JSON consumers may ignore the additive human_gate key."

  - id: RN-02300-2
    kind: fix
    roadmap:
      visibility: shipped
      why: >
        The attention-card audit found that the browser could still classify
        two raw reason strings and that dashboard thread construction could
        evaluate the same pendency relation a second time. Both violated the
        single-answer contract behind the first coherence slice.
    impact: normal
    subject: "dashboard rows, threads and prompts now share one attention verdict"
    detail: >
      Cache now builds the dashboard exchange and thread projections from one
      folded snapshot and evaluates each artifact's pendency verdict once.
      Missing or cross-thread response parents take one explicit degraded
      fallback, so the carried owner agrees with the matching legal action.

      Overdue and activation-needed status are carried as semantic booleans;
      the browser no longer recovers them by matching raw reason-code strings.
      The vocabulary gate also distinguishes a carried outcome operand from a
      state operand and refuses unknown state comparisons even when only one
      known state appears beside the typo.
    affects: [dashboard]
    action:
      scope: none
      why: "No action. Existing inbox/outbox JSON remains compatible; regenerate the dashboard to consume the corrected projection."

  - id: RN-02300-3
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        Dashboard ordering and Overview counts are product semantics, not
        browser formatting. Publishing the new domain answers and their
        catalogue now records the contract before the view-model phase wires
        them into the visible screen.
    impact: normal
    subject: "dashboard attention order and Overview KPI membership now have one domain owner"
    detail: >
      Cache now returns the complete six-tier attention order and the exact
      object sets behind Need you, No human move, You await and Lines off
      current. Counts are the lengths of those sets, so a tile and the list it
      opens cannot describe different objects. Dependency reads are bounded,
      strict and degradation-aware instead of silently treating a partial scan
      as a complete total.

      The hidden binary vocabulary catalogue also adds the typed reason,
      pendency-rule and human-gate families without changing its existing
      outcome, state, transition or human-gate fields. The dashboard mapping
      phase consumes these answers next; this release entry does not claim the
      old browser formulas have already been removed.
    affects: [dashboard]
    action:
      scope: none
      why: "No action. These are additive read-model and catalogue contracts; existing command output remains compatible."
