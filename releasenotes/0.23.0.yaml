schema: release-notes/v1
version: 0.23.0
released: "2026-08-20"
headline: The transport registry gets a real caller, and the dashboard starts
  explaining whose move it is
changes:
- id: RN-02300-0
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      Spec 05a's AC-8 promises that a second transport driver costs "a registry
      entry plus conformance tests". The registry existed and was tested, and
      had zero production callers — the delivery path built its driver directly,
      so the promise was false as wired.
  impact: normal
  subject: a data package's declared transport_driver now selects the driver that
    moves its bytes
  detail: >
    `transport_driver` was written at exactly one site and read by nobody. `DeliverDataPackage`
    now decodes that one field and looks the driver up in the registry, and `internal/space`
    registers its own space-git driver lazily. A manifest naming an unregistered
    driver is refused by name.

    Registration is a `sync.OnceValue` rather than an `init`: this repository
    bans init functions, and the ban is right — a registry populated at import
    time is precisely the implicit ordering with invisible side effects that rule
    exists to prevent.

    Found by the phase's own audit, which was right to call the promise overstated.
    The read half stays unwired and is stated rather than claimed: `a2a data fetch`
    still resolves directly, and a second driver would need a read hook that lands
    with `data-package/v2` — the wire enum is frozen in v1 regardless.
  affects:
  - contracts
  action:
    scope: none
    why: No action. No command, flag or lifecycle changed; a manifest that was
      already valid still delivers exactly as before.
- id: RN-02300-1
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The first dashboard-coherence slice is user-visible and additive: it proves
      the complete domain-to-card path before the remaining views are rebuilt
      on the same contract. Hiding it would leave the current binary's changed
      dashboard and JSON surface undocumented.
  impact: normal
  subject: Overview attention cards say whose turn it is, what move is expected,
    and why
  detail: >
    Attention cards now carry the pendency verdict the domain already computed:
    waiting systems, expected transition and any human gate. A bilingual sentence
    explains the active reason in the card body; the rule citation remains available
    under Technical detail instead of being presented as the explanation.

    The reason codes and pendency-row identity are typed and enumerated from their
    domain homes. Inbox and outbox JSON gain `human_gate` only when a gate exists;
    existing fields keep their values and empty rows keep the key omitted. The
    browser no longer infers this gate from a coincidental reason string, and
    the vocabulary gate now refuses the equivalent inline state-classification
    chain as well as a hand-built list.

    This is the first slice of the dashboard-coherence work, not a claim that
    every dashboard family has already been rebuilt. The existing 4 MiB shell
    ceiling remains in force; measured headroom requires the next mapping phase
    to add honest item-family admission bounds.
  affects:
  - dashboard
  - a2a inbox
  - a2a outbox
  - MCP
  action:
    scope: none
    why: No action. Regenerate a dashboard with the current binary to see the
      clearer attention cards; existing JSON consumers may ignore the additive
      human_gate key.
- id: RN-02300-2
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      The attention-card audit found that the browser could still classify two
      raw reason strings and that dashboard thread construction could evaluate
      the same pendency relation a second time. Both violated the single-answer
      contract behind the first coherence slice.
  impact: normal
  subject: dashboard rows, threads and prompts now share one attention verdict
  detail: >
    Cache now builds the dashboard exchange and thread projections from one folded
    snapshot and evaluates each artifact's pendency verdict once. Missing or cross-thread
    response parents take one explicit degraded fallback, so the carried owner
    agrees with the matching legal action.

    Overdue and activation-needed status are carried as semantic booleans; the
    browser no longer recovers them by matching raw reason-code strings. The vocabulary
    gate also distinguishes a carried outcome operand from a state operand and
    refuses unknown state comparisons even when only one known state appears beside
    the typo.
  affects:
  - dashboard
  action:
    scope: none
    why: No action. Existing inbox/outbox JSON remains compatible; regenerate
      the dashboard to consume the corrected projection.
- id: RN-02300-3
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      Dashboard ordering and Overview counts are product semantics, not browser
      formatting. Publishing the new domain answers and their catalogue now records
      the contract before the view-model phase wires them into the visible screen.
  impact: normal
  subject: dashboard attention order and Overview KPI membership now have one
    domain owner
  detail: >
    Cache now returns the complete six-tier attention order and the exact object
    sets behind Need you, No human move, You await and Lines off current. Counts
    are the lengths of those sets, so a tile and the list it opens cannot describe
    different objects. Dependency reads are bounded, strict and degradation-aware
    instead of silently treating a partial scan as a complete total.

    The hidden binary vocabulary catalogue also adds the typed reason, pendency-rule
    and human-gate families without changing its existing outcome, state, transition
    or human-gate fields. The dashboard mapping phase consumes these answers next;
    this release entry does not claim the old browser formulas have already been
    removed.
  affects:
  - dashboard
  action:
    scope: none
    why: No action. These are additive read-model and catalogue contracts; existing
      command output remains compatible.
- id: RN-02300-4
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The local dashboard was one monolithic source file, so independent view
      work could not be reviewed or delivered without overlapping the whole screen.
      The extraction is intentionally behavior-preserving but materially changes
      the product's implementation boundary.
  impact: normal
  subject: dashboard views now have independent component and lifecycle boundaries
  detail: >
    The local dashboard now composes one shell, nine view components, one root
    modal engine and one live-transport component. The root keeps normalized data,
    shared UI state, hydration and navigation; each view owns its own presentation
    mapping. Component discovery and the public Guide projection derive from the
    root import graph instead of a second registry.

    Rendered behavior is unchanged: the generated embedded template matches the
    reviewed sources, the public site builds, and the existing browser contract
    passes across desktop/mobile, light/dark and Russian/English.
  affects:
  - dashboard
  action:
    scope: none
    why: No action. Regenerate the dashboard with the current binary; routes,
      data and visible behavior remain compatible.
- id: RN-02300-5
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The served dashboard previously had no exact JSON twin and its live invalidation
      identity covered only the operational revision. A non-operational dashboard
      change could therefore be missed or require a second encoding path.
  impact: normal
  subject: served dashboards expose one exact digest-coherent JSON view
  detail: >
    The loopback server now serves the exact compact JSON bytes embedded in the
    dashboard shell at /api/v1/dashboard. Conditional requests, SSE invalidations
    and retained generations share the exact view-model digest, while the semantic
    generation key also observes non-operational content. Root, snapshot and dashboard
    responses share one bounded writer pool and retain the last good generation
    when rendering or size validation fails.

    The separate `a2a html --json` command remains byte-compatible: its existing
    two-space-indented output and trailing newline are unchanged.
  affects:
  - dashboard
  - serve
  action:
    scope: none
    why: No action. Existing dashboard URLs and CLI JSON output remain compatible;
      live clients may adopt the additive dashboard route.
- id: RN-02300-6
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The dashboard already computed more domain truth than its JSON model admitted,
      and its repeated collections had no honest cardinality contract. P7 is the
      additive transport contract the rebuilt views use.
  impact: normal
  subject: dashboard payloads carry one bounded copy of every domain answer
  detail: >
    Dashboard assembly now reads one folded snapshot and one dependency projection,
    maps each active item once, and reuses those objects for attention sets, thread
    open items and detail admission. Rule identity, the server-composed reason
    sentence, operational readiness, source synchronization, dependency degradations
    and document byte facts no longer fall through mapper gaps.

    Every repeated root and nested collection now carries shown, total and truncated
    facts from the same stable prefix that produced it. Need-you objects win scarce
    detail slots, and the largest saturated fixture stays below the existing 2
    MiB DATA and 4 MiB shell ceilings. The later view phases consume these additive
    fields; this entry does not claim those screen rewrites are already complete.
  affects:
  - dashboard
  - a2a html --json
  - serve
  action:
    scope: none
    why: No action. Existing JSON fields keep their values; consumers may ignore
      the additive facts and windows until they adopt the rebuilt views.
- id: RN-02300-7
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      Eleven status families were interpreted by scattered browser tables or had
      no complete human wording at all. The payload now carries one authoritative
      bilingual presentation dictionary before the view families migrate to it.
  impact: normal
  subject: dashboard status words now come from one complete RU/EN vocabulary
  detail: >
    The binary catalogue preserves its established fields and adds owner-derived
    freshness, reason, rule, work-mode, dependency, consistency, operational and
    live-transport sets. One 71-entry dashboard dictionary covers the exact eleven-family
    universe, with complete RU and EN labels and explanations, six closed tones,
    six non-colour cues and a separate fallback that never echoes unknown input.

    The browser has one resolver and one calm-policy seam. Calm treatment changes
    only chroma while words and cues remain intact; policy never travels in the
    payload. Existing per-view lookup tables are removed by their P9-P14 owners,
    and P16 freezes the final monopoly rather than this foundation claiming that
    migration early.
  affects:
  - dashboard
  action:
    scope: none
    why: No action. The table and catalogue keys are additive; regenerated dashboards
      carry the vocabulary automatically.
- id: RN-02300-8
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The bundled dashboard is the executable showroom and the offline browser
      fixture. Missing declared states made green UI tests weaker than the vocabulary
      contract they claimed to demonstrate.
  impact: normal
  subject: the bundled dashboard demo now exercises every renderable vocabulary
    value and every bounded collection
  detail: >
    The demo now carries all 91 fixture-instantiable family/value pairs, including
    every one of the 25 lifecycle transitions, while the five browser-local transport
    states remain covered by their live-client scenarios. Work, consistency and
    document previews deliberately cross their server limits, so the visible sample
    proves shown, total and truncated facts instead of presenting a prefix as
    complete.

    Fixture coverage is derived from the binary catalogue rather than a copied
    list. The committed compact dashboard data, indented CLI JSON and embedded
    template are regenerated projections of that same model, and the gate fails
    by the exact missing family/value when a future catalogue addition lacks a
    visible fixture carrier.
  affects:
  - dashboard
  - a2a html --demo
  - a2a html --json
  action:
    scope: none
    why: No action. Regenerate a demo dashboard with the current binary to inspect
      the expanded state and bounds coverage.
- id: RN-02300-9
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The dashboard's principal screens previously disagreed about status, order,
      counts and detail content even when they described the same carried object.
      The rebuilt view families make those answers visible from one model and
      one card route.
  impact: normal
  subject: the local dashboard now keeps one bilingual card, one status vocabulary
    and one explicit refresh path
  detail: >
    Overview, Exchange, Threads, Contracts, Map and Spaces now consume the server-carried
    sets, ordering, reasons, windows and byte bounds directly. Seven canonical
    card kinds render the same ordered RU/EN facts from every entry point; the
    map's parallel detail dialog is removed, unknown values never leak raw, and
    one resolver owns status words, cues and chroma. Release sequences preserve
    the carried server order; the remaining browser sorts are bounded, named presentation-only
    layout operations. Portable schemas now freeze the seven card object shapes,
    including the nested thread facts, while deliberately leaving the local dashboard
    envelope outside the public contract. The loopback server's CSP admits the
    bundled component evaluator while continuing to deny remote scripts, styles,
    images and non-self connections.

    Live SSE messages now announce a newer digest without replacing the screen.
    Refresh dashboard performs one conditional fetch and one atomic hydrate, preserving
    the selected view, filters, hash, focus, scroll and mounted card state; a
    removed card remains readable with an exact gone banner over retained last-good
    data. File and non-loopback dashboards remain inert. The external GitHub provider/API
    tier is deliberately deferred; deterministic Open on GitHub links still use
    only the carried repository and revision and perform no network request.
  affects:
  - dashboard
  - serve
  - a2a html
  action:
    scope: none
    why: No action. Regenerate or reopen the dashboard to use the coherent views
      and explicit refresh control.
- id: RN-02300-10
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The plan assigns notification fan-out to the hub, which is a v2 service,
      so until it exists no always-on party tells a human that a move needs them
      — every local surface is silent while the machine is asleep. §15 records
      the interim explicitly: the space-CI Actions-to-Telegram fallback may ship
      instead. This is the first wave of that epic.
  impact: normal
  subject: a space's notification routes are declared, validated and refused when
    malformed
  detail: >
    `notification_routes` has shipped in the space template since it was written,
    and nothing validated it: the manifest schema does not declare the key, and
    `additionalProperties: true` accepted anything at all. A route with a typo
    in it was silence, discovered only by a notification that never arrived.

    The shape is now enforced by the space's own pull-request gate. Every route
    must name a channel, a chat and at least one event; unknown keys, wrong types,
    values outside an enum, a duplicate event, a chat that is not a numeric string,
    and more than sixteen routes are each refused with the path that is wrong.
    A route whose `for` names a participant the manifest does not list, or that
    duplicates another route's target, is refused as well, and a manifest carrying
    anything shaped like a Telegram bot token is refused outright.

    Validation lives in the policy layer rather than in the schema, because `manifest/v1`'s
    bytes are frozen: they decide whether documents already committed to shared
    spaces are valid. The open schema accepts the key on every binary already
    deployed, so adopting this needs no upgrade, no floor bump and no workflow
    bump — only a route worth adding.

    The agent-prompt tables and the bilingual dashboard vocabulary also moved
    out of the presentation package into their own, so a caller that is not a
    browser can quote the same words and the same legal moves. Nothing rendered
    changes.
  affects:
  - space.yaml
  - a2a validate
  - dashboard
  action:
    scope: none
    why: No action. A space with no notification_routes, or with an empty list,
      is unaffected; the key is optional and defaults to none.
- id: RN-02300-11
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The routes were declared but nothing read them. This is the verb that turns
      a push into the messages those routes describe, and the sender that puts
      them on the wire.
  impact: normal
  subject: '`a2a notify` turns a push into chat messages, from the repository
    alone'
  detail: >
    `a2a notify render` reads a space checkout and prints, as JSON, the messages
    a push would produce: one per configured route per qualifying artifact, carrying
    the type, who sent it to whom, whose move it is now, priority and deadline,
    the artifact's own text, and — for a route that names a participant — a copy-paste
    block that hands the move to an agent.

    It needs no local cache. A CI runner has none, so the facts come from the
    repository itself, folded through the same machinery every other read surface
    uses rather than a second implementation that could disagree with it. `--only
    <id,id>` renders exactly the artifacts you name, however old or settled, which
    is how a layout gets reviewed on real documents.

    `a2a notify send` reads that array and delivers it. A failed send fails the
    command: a notification that silently did not fire is the same defect as a
    check that silently passed. A missing token is refused before anything is
    sent, naming the variable that is missing; Telegram's own rate limiting is
    honoured and then, if it persists, reported rather than swallowed.

    Messages render two ways over one set of facts — HTML by default, and Telegram's
    newer rich blocks per route — so a newer chat capability can never become
    a second version of what a message says. `--dry-run` prints exactly what would
    be sent without sending it.

    Anything shaped like a credential is stripped from an artifact's text before
    it can reach a chat, and the bot token cannot appear in any output. It is
    held in a type that prints as [redacted], and no error that touched a URL
    carrying it is ever wrapped or reformatted — both the network layer and the
    request builder embed the full address in their own error text, and Telegram's
    addresses carry the token, so those errors are replaced rather than passed
    along.
  affects:
  - a2a notify
  action:
    scope: none
    why: No action. The verb is inert without a configured notification route;
      delivery from CI arrives with the workflow in a later change.
- id: RN-02300-12
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The verb existed and nothing ran it. This is the delivery plane — the workflow
      a space adds with one line — and the setup flow that connects a bot to it
      without the token ever passing through an agent.
  impact: normal
  subject: a space can be told to notify Telegram, in one line and one secret
  detail: >
    A space repository gains chat notifications by adding one `uses:` line and
    one Actions secret. It carries no notification logic, no pinned binary and
    no fetch token: everything lives in a reusable workflow in a2ahub, referenced
    by release tag, so a fix reaches every space through a version bump instead
    of an edit in each one. `a2a space init` writes the caller for new spaces;
    `a2a space update` adds it to existing ones.

    The job is silent until a route is configured, and loud when one is broken:
    a route whose secret is missing fails the run rather than quietly sending
    nothing. What was sent — and, on a dry run, exactly what it would have looked
    like — is printed in the run's own summary, so a layout can be reviewed before
    it reaches a chat and a failure can be read without opening Telegram.

    `a2a notify setup` walks a human through creating the bot, handing over its
    token, choosing a chat, and proving the whole path works. The token is typed
    at the terminal with the screen echo off, passed straight to GitHub's secret
    store, and never written down anywhere else — no agent involved in the conversation
    ever sees it. The setup reports success only after a real run actually delivered
    a message; a green run that sent nothing is reported as unproven, because
    it is.

    `a2a doctor` gains three checks for a configured space: whether every route
    is well-formed, whether the secrets they name exist (presence only — no secret's
    value is ever read), and whether the last delivery succeeded. A channel that
    has gone quiet is now diagnosable instead of merely silent.

    The MCP surface gains an `a2a_notify` tool with the same five actions, and
    it is registered but NOT wired: every call answers that notify operations
    are not available. It is listed here because an agent enumerating tools will
    find it and needs to know to use the CLI verbs instead — a tool that is present
    and always refuses, with nothing saying why, is worse than one that is absent.
  affects:
  - space.yaml
  - a2a space init
  - a2a space update
  - a2a notify
  - a2a doctor
  - MCP
  action:
    scope: space
    why: Optional per space. Existing spaces gain nothing until an operator runs
      `a2a space update` and then `a2a notify setup`. A space that does neither
      is unchanged.
- id: RN-02300-13
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      `make release-preflight` refused this cut on six CALLED standard-library
      vulnerabilities. The toolchain a space runs is named literally inside the
      reusable workflows, so a fix in `go.mod` reaches a space only if those move
      with it — and nothing asserted that they did.
  impact: normal
  subject: every space validates and notifies on a Go toolchain with six fewer
    called vulnerabilities
  detail: >
    The toolchain moves from go1.26.5 to go1.26.6, which fixes all six standard-library
    vulnerabilities `govulncheck` reports as reachable from this code: quadratic
    path resolution in `net/url`, JavaScript regexp context tracking in `html/template`,
    post-handshake message flooding in `crypto/tls`, a missing `ReadHeaderTimeout`
    on the unencrypted HTTP/2 check in `net/http`, unbounded recursion in `encoding/asn1`
    (reached through detached cosign verification), and ASCII-only punycode labels
    in `x/net/idna`. The accepted-findings list stays empty: every called vulnerability
    is a hard red again.

    A space repository has no `go.mod`, so the two reusable workflows name the
    toolchain version explicitly while repo-local jobs read the file. That split
    had no reader, and bumping one without the other would have left every space
    on the vulnerable toolchain silently. `workflow-lint` now refuses any explicit
    `go-version:` that `go.mod` does not name.
  affects:
  - a2a-validate-reusable.yml
  - a2a-notify-reusable.yml
  action:
    scope: space
    why: No action for an existing space pinned to an earlier release; a space
      adopts the new toolchain when its workflow pin moves to this release.
- id: RN-02300-14
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      A space that publishes a second contract version could be refused by its
      own first publication's leftover branch. Only branch pruning hid it, so
      whether it bit depended on a repository setting nobody had connected to
      contract publishing.
  impact: normal
  subject: publishing a second contract version is no longer blocked by the first
    publication's surviving branch
  detail: >
    The remote publication-head probe aborted its whole listing on the first error
    from any head, before it had asked whether that head was even relevant. So
    a first publish's merged-but-unpruned branch could refuse every later publish
    with a recompute conflict, and a space with branch pruning turned off, or
    merely slow, would hit it while a space with pruning on would not.

    The probe now skips a head whose recorded target version already resolves
    in the space's authoritative published history — the same question the publisher
    already asks and trusts one step earlier. A head that is genuinely in conflict,
    and not already published, still fails the probe exactly as before, and a
    skipped head is never eligible for the exact-intent repair path.
  affects:
  - a2a contract publish
  action:
    scope: none
    why: No action. Nothing about a published contract's content or its history
      changes; a publish that used to be refused now proceeds.
- id: RN-02300-15
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      Onboarding recommends two automations that make the loop run without a human,
      and nothing verified either one. The recommendation was the only thing standing
      between a space and never having them.
  impact: normal
  subject: '`a2a doctor` names the two automations it cannot see, instead of staying
    silent about them'
  detail: >
    A new `automation coverage` row names both automations the onboarding recommends
    — a harness session-start hook, and a scheduled poll workflow in the participant's
    own repository — states that doctor cannot observe either, says why, and tells
    you to check them by hand.

    It never FAILs, and that is the design rather than a shortfall. The session-start
    hook lives in your agent harness's own configuration, which a2a does not read
    or write; the poll workflow lives in your repository, not the space, so it
    is outside every path doctor looks at. A FAIL would claim doctor had seen
    a broken state it structurally cannot see.
  affects:
  - a2a doctor
  action:
    scope: none
    why: No action. The row is informational; if you have not set up either automation,
      `onboarding.md` §8.6 describes both.
- id: RN-02300-16
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      Every space's required merge check compiled the validator from source on
      every pull request. That cost about three minutes per PR and made each space
      resolve, verify and compile a2ahub's whole module graph — including cryptographic
      libraries the validator never executes.
  impact: normal
  subject: a space's merge check now runs a signed release binary instead of compiling
    one
  detail: >
    The reusable validation workflow downloads the signed `a2a-linux-amd64` for
    the release its pin names, and verifies that binary's keyless Sigstore signature
    before placing it anywhere executable. The certificate identity and OIDC issuer
    are the same pair `a2a update` already verifies with, so both paths accept
    exactly the same signer.

    The integrity property is unchanged in kind. What `go install` bought was
    not a checksum but a public, append-only log anyone can inspect after the
    fact; Sigstore's transparency log plus the release workflow's own identity
    is the same guarantee. Verifying a checksum file fetched from the same release
    would NOT have been — whoever could replace the binary could replace the checksums
    beside it.

    A space still needs no token: the assets are public and the proof is a public
    log entry. Nothing in a space changes until its workflow pin moves to this
    release or later.
  affects:
  - a2a-validate-reusable.yml
  action:
    scope: space
    why: No action for a space pinned to an earlier release; a space adopts this
      when its workflow pin moves. Spaces that mirror the workflow rather than
      calling it must adopt the cosign step themselves.
- id: RN-02300-17
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      A publication head's proof is recomputed by whichever binary is checking,
      against a value recorded by whichever binary published. When those differ,
      the check failed with the same message a tampered head produces, and nothing
      distinguished an upgrade from an attack.
  impact: normal
  subject: a contract-publication conflict now says whether it is a version boundary
    or a real disagreement
  detail: >
    A recovered publication head now records the version of the binary that minted
    it, and the refusal distinguishes three cases: the same binary recomputing
    its own head, which is the only one that may indicate tampering; a head recorded
    before this field existed; and a head minted by a different version, which
    names both versions so it is clear which upgrade crossed the boundary.

    All three remain refusals — a head whose proof cannot be established is not
    a head to trust — but only one of them accuses anyone.

    Heads written by earlier releases keep working: the new field is optional
    on read, and its absence is reported as a compatibility state rather than
    folded into a conflict.
  affects:
  - a2a contract publish
  action:
    scope: none
    why: No action. Existing publication heads decode unchanged; a conflict message
      may now name two versions where it previously did not.
- id: RN-02300-18
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      A dashboard unification removed the Exchange master/detail pane while leaving
      the selection state that fed it in place, so the screen kept recording which
      row you picked and had nowhere to show it. Opening a row went to a dialog
      that repeated the list row it came from.
  impact: normal
  subject: picking a row in Exchange opens its detail beside the list again, instead
    of a dialog that repeats the row
  detail: >
    Exchange rows select into an inline detail pane, the way Contracts and Threads
    already did. The pane is in the page, not a dialog: it traps no focus, locks
    no scrolling and paints no backdrop, so reading a document no longer covers
    the list it came from.

    The card dialog is unchanged and still opens from Overview and from a `#card=`
    link, which is what a saved link keeps doing. Its own frame no longer paints
    a focus ring around itself when it opens, and its padding is sized for card
    content rather than for a layout it no longer has.

    A selection now survives an in-place refresh together with the filter, the
    space and the scroll offset — and a selected row that disappears from the
    newer data closes the pane rather than leaving it describing something the
    data no longer carries.

    Known limit, measured rather than assumed: selecting a row still returns the
    page to the top. That is not new here and not specific to Exchange — Contracts,
    which never lost its pane, does the same. It is the shared re-render dropping
    the scroll offset, and it is recorded for a fix in the shell rather than patched
    per screen.
  affects:
  - a2a dashboard
  action:
    scope: none
    why: No action. Deep links, the card dialog and every existing route behave
      as before.
- id: RN-02300-19
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      A dashboard unification flattened every screen to the same shape: cards
      printed a filled-in "not recorded" sentence for facts the snapshot did not
      carry, rows lost the density that let a reader scan them, and Exchange lost
      its facet filters entirely.
  impact: normal
  subject: dashboard screens stop printing placeholder sentences for facts the
    snapshot does not carry
  detail: >
    A fact that is not in the snapshot is now absent from the card rather than
    present as "Not recorded." — an empty row taught nothing and cost a line of
    attention on every card. Facts that ARE carried read the same as before.

    Overview's process cards regained their grouping and their author lines, and
    the reader's own turn moved back out of the card into the list chrome, where
    it belongs: a card can be shared, and whose move it is depends on who is looking.

    Exchange regained both facet axes — direction and open/closed — plus the type
    filter and the deadline chip, and its rows are readable at a glance again:
    badge, state, priority, deadline-or-age, title, and who is handing to whom.
    The detail that used to crowd the row now lives in the pane beside it.

    Threads, Spaces and the map were re-read against Contracts, the one screen
    that never regressed. Versions and the timeline card needed no change, which
    was measured rather than assumed.

    Two counts on Exchange can disagree when a collection is truncated: the direction
    chips report the whole carried window, the new axes report what is in the
    current view. The sentence directly below the chips states the bound, and
    neither number is invented.
  affects:
  - a2a dashboard
  action:
    scope: none
    why: No action. Every route, deep link and card door behaves as before.
- id: RN-02300-20
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      The dashboard's card evidence had drifted from what the cards actually render:
      a suite of golden fixtures pinned sentences a later rule banned, so the
      tests froze the defect instead of catching it, and four card kinds carried
      region markers that could never resolve.
  impact: normal
  subject: the dashboard's card evidence now describes what the cards render
  detail: >
    Every card kind exposes its summary region, so a card's short form and its
    full form can be told apart and compared. Four kinds previously marked that
    region only while their own dialog was open, which never happened — a row
    is a card's short form whether or not anything is open, and it is now marked
    that way.

    The remaining placeholder sentences are gone from every screen this release
    touched, and the assertions that had pinned them now assert the absence instead.

    A dialog that merely repeats the row it was opened from is now a test failure
    rather than a thing a reader has to notice.

    Contracts is unchanged throughout, deliberately: it is the reference the other
    screens were re-read against, and its card content is byte-for-byte what it
    was.
  affects:
  - a2a dashboard
  action:
    scope: none
    why: No action. This release changes what the tests know, not what the dashboard
      does, beyond the copy fixes described above.
- id: RN-02300-21
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      The dashboard opens Exchange on "all directions" — that is what the screen's
      own state asks for on a cold load. The re-composition dropped that option
      from the chips but left the request in place, so the screen quietly answered
      a narrower question than it was asked.
  impact: normal
  subject: Exchange opens on everything again, not silently on incoming only
  detail: >
    Opening Exchange showed only incoming documents while the screen's own state
    asked for all of them. Nothing said so: the "All" chip was gone, no other
    chip looked selected, and the shorter list read as "this is what there is".
    On a real project that was two rows where the previous release showed five.

    "All" is back as the first direction and is honoured again. Its count is what
    it can actually see, and it reports no window bound of its own — three separate
    bounds do not add up to one, and a total nobody sent is not a number worth
    printing.

    The narrower reading of a value a screen does not recognise is the same defect
    class this release fixes elsewhere by refusing outright. Here the value was
    always legitimate; it was the screen that stopped understanding it.
  affects:
  - a2a dashboard
  action:
    scope: none
    why: No action. If you had selected a direction, that selection still applies;
      only the default reading changed back.
- id: RN-02300-22
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      A card could say "still open" while nothing and nobody was waiting. Measured
      on a real space: seven documents carried that outcome and one of them was
      open.
  impact: normal
  subject: a document's outcome now answers about THAT document, not about its
    (kind, state) pair
  detail: >
    `fold.OutcomeOf(kind, state)` is a pure function of two inputs, and for two
    pairs the true answer needs a third that only the envelope carries: an announcement's
    `ack_requested`, and whether a published contract has a registered consumer.
    `internal/pendency` already answered both correctly per document, so neither
    side was wrong — the seam between them was.

    `OutcomeOf` keeps its exact signature and answer. `OutcomeOfDocument` takes
    the caller-resolved fact, which is `LegalNextFor`'s own shipped shape for
    the identical question. The liveness half moved in the same change: `exchangeActive`
    short-circuited every kind but published announcements to "active", so a published
    contract nobody consumes stayed in the exchange feed forever.

    The deprecation acknowledgement set is now resolved space-wide rather than
    from the local system's registry alone, so the author of a deprecation sees
    a late adopter who has not acknowledged.
  action:
    scope: none
    why: No action. Nothing you author changes; a card that used to say a document
      was open with nobody waiting now says it is settled.
- id: RN-02300-23
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      `envelope/v2/response` has declared `unmet`, `standing` and `blocked_by`
      since the incompleteness work shipped, and no command could produce any
      of them.
  impact: normal
  subject: a response can finally say which acceptance criteria it did not satisfy
  detail: >
    `a2a respond` gains `--unmet`, `--standing` and `--blocked-by`, and fresh
    responses render `envelope/v2`. The MCP tool moves with the CLI — the two
    are independent readers, so a fix on one side is not a fix.

    A partial answer that names nothing is now refusable rather than the only
    shape available: the schema requires a `partial` or `cannot` to carry either
    the unmet set with what would unblock it, or a non-authoritative standing.
  action:
    scope: local
    why: Use `--unmet`, `--standing` or `--blocked-by` on `a2a respond` when an
      answer falls short. A response that satisfies everything needs none of them.
- id: RN-02300-24
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      Two responses differing only in which criteria they failed derived the same
      idempotency key, so a corrected response could be treated as a repeat of
      the first and its correction never committed.
  impact: normal
  subject: a response's idempotency key now includes what the response says it
    failed
  detail: >
    The key folded in parents, result, fields, body and refs — everything the
    operation IS — and not the shortfall facts. Adding them widened the signature
    rather than adding a second entry point, deliberately: a key without these
    facts is not a narrower key, it is a colliding one, and leaving a callable
    narrow form would have left the defect reachable by accident.

    A caller that declares none of the three derives exactly the key it derived
    before, so no in-flight operation is disturbed.
  action:
    scope: none
    why: No action. A response that declares none of the three derives exactly
      the key it derived before, so no operation in flight is disturbed.
- id: RN-02300-25
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      An agent connected to several spaces over MCP had its write tools bound
      to the first one, while the CLI resolves the target per invocation.
  impact: normal
  subject: an MCP write can no longer be silently prepared against the wrong space
  detail: >
    Server construction is per-space now, and a write that cannot name its target
    while several spaces are connected is REFUSED, naming the connected spaces
    — no default, because a default is how this defect gets recreated one layer
    up. A single-space session is unchanged.

    Partial, and stated as such: several write tools' inputs carry no field that
    could name a space at all, so a call cannot express the target even in principle.
    That is a tool-contract change and is not in this release.
  action:
    scope: space
    why: If your MCP session connects to more than one space, a write that cannot
      name its target is now refused rather than prepared against the first one.
      Name the space, or connect one.
- id: RN-02300-26
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      A validation error code could ship documented nowhere, fire on no production
      path, and judge merged history no one may edit — and nothing said so.
  impact: low
  subject: every validation error code is now checked for prose, reachability
    and scope
  detail: >
    A new gate reads the error registry and refuses a code that appears in no
    shipped prose, that no test proves fires through a production entry point,
    or that rejects post-merge without a stated reason that it may judge artifacts
    predating it.

    Against the shipped corpus it found 26 gaps over 22 codes. They are declared
    in the registry with reasons and owners rather than closed silently, so the
    gate is green and BLOCKS the next code from joining them. Codes that predate
    the prose rule carry that as their stated reason, because applying a rule
    retroactively to history nobody may edit is the very thing the rule forbids.
  action:
    scope: none
    why: No action for a space. This gate runs in this repository and constrains
      what a future validation code may ship without.
- id: RN-02300-27
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      A verdict named the criterion it judged by counting to it — a 0-based ordinal
      into a list the author cannot see while composing the flags, range-checked
      only. An off-by-one that stays in range binds every verdict to the wrong
      criterion and merges green.
  impact: normal
  subject: a criterion can carry a name, and a verdict can use it
  detail: >
    `a2a verify` and `a2a close` now print each binding — the criterion's own
    first characters beside the verdict — before anything is minted. That alone
    would have caught the reported incident at composition.

    Acceptance criteria may also carry an id. Where a parent declares them, `--verdict
    ac3:met:seomatrix` names the criterion instead of counting to it, and an id
    that resolves to nothing is refused locally, naming what the parent does declare.
    The array is homogeneous: all ordinals or all ids, because a mixed array has
    no single addressing mode.

    Artifacts already written keep the ordinal form and stay valid. The older
    envelope generation is immutable history and is not touched.
  action:
    scope: local
    why: Give acceptance criteria ids if you want verdicts to name them. Existing
      criteria keep working unchanged, addressed by position.
- id: RN-02300-28
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      Measured on a real space: five work_requests declared 21 acceptance criteria
      between them and six were ever judged. Two closes carried an empty verdict
      list over parents declaring seven and eight.
  impact: normal
  subject: closing an exchange now has to judge every criterion it was given
  detail: >
    A verify or close over a parent that declares criteria must name a verdict
    for each, or it is refused at the merge gate — with the missing ones named.
    The enum already carries `not_warranted` and `not_exercised`, so a criterion
    that did not apply still gets a verdict and nobody is forced to claim something
    false.

    Exchanges already closed stay closed and stay green: the rule refuses at the
    write gate and returns no verdict against merged history, which no verb can
    rewrite.
  action:
    scope: space
    why: A close over a parent that declares acceptance criteria must now carry
      a verdict for each. Use `not_warranted` or `not_exercised` for one that
      did not apply. Exchanges already closed are unaffected.
- id: RN-02300-29
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      A handoff is the artifact that says what was built and how to verify it.
      Every one in a real space carried the five required headings and nothing
      under any of them, and all were accepted.
  impact: normal
  subject: a handoff whose required sections say nothing is refused
  detail: >
    The five sections the domain requires must carry content. The check measures
    emptiness, never quality — there is no length floor, because a floor turns
    an empty handoff into a padded one, which reads as answered.

    The section list comes from the handoff template itself, so a section added
    there is enforced the day it lands. Refused at the merge gate, silent against
    handoffs already merged.
  action:
    scope: space
    why: Fill the five sections of a handoff before submitting it. Handoffs already
      merged are unaffected.
- id: RN-02300-30
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      Two contracts from the same producer looked identical on screen while one
      of them declared, in machine-readable form, that its endpoint does not exist
      yet.
  impact: normal
  subject: the Contracts screen says whether a contract's operational half exists
  detail: >
    A contract card now states one of three things: the operational half is ready,
    it is declared absent (and `a2a contract activate` is what clears it), or
    it was never declared at all. Those are three different facts and the screen
    no longer collapses them into one.

    A new warning fires when a contract invites a runtime pin against an operational
    half it declares absent. A warning rather than a refusal: publishing a promise
    before activating it is a designed sequence, so the pair is a claim ahead
    of the facts, not an invalid document.
  action:
    scope: local
    why: Declare `x_operational` on a contract whose endpoint is not up yet, and
      run `a2a contract activate` when it is. A contract that declares nothing
      reads as "not declared" rather than as ready.
- id: RN-02300-31
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      Every protection built on the consumer registry — the activation debt, the
      retire gate, the deprecation notice — was inert for a space's central dependency,
      because the consuming side never registered and nothing said so.
  impact: normal
  subject: doctor names a contract you consume but never adopted
  detail: >
    `a2a doctor` reports a contract this system has verify-passed conforming deliveries
    against while its own registry does not list it, with the delivery count and
    the exact `a2a contract adopt` that fixes it.

    Detection only, and a warning: consuming without adopting is a real risk rather
    than an error, and the operator may have reasons. Whether such a delivery
    should REGISTER a consumer is a separate question and is not answered here
    — the retire precondition is unchanged.
  action:
    scope: local
    why: Run `a2a doctor`. If it names a contract you consume but never adopted,
      run `a2a contract adopt <id>` — that is what puts you on the deprecation
      notice and behind the retire gate.
- id: RN-02300-32
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      An MCP session connected to more than one space could not write at all —
      the safe answer to a wrong-space write was to refuse every write, and it
      stayed that way because the remaining half was read as a tool-contract
      change that needed its own design round.
  impact: normal
  subject: an MCP write in a multi-space session names its own target space
  detail: >
    Each write tool now resolves which connected space it targets, per call,
    before it reads any mirror. `a2a_submit` takes it from the draft envelope's
    own `space:` field. `a2a_lifecycle` and `a2a_exchange` derive it from the
    artifact ids the call already carries — the connected space whose mirror
    holds them. `a2a_contract`'s `deprecate`, `retire`, `adopt` and `activate`
    take the explicit `space` input their `publish`/`preflight`/`materialize`/
    `check` siblings already take, because a contract's committed path carries
    no artifact id and cannot be derived from one.

    No tool's input schema changed: `a2a_contract` already advertised `space`,
    and the other three read facts the call was already sending.

    There is still no default. A call that cannot name or derive its target is
    refused, naming every connected space, and a batch whose ids span two spaces
    is refused naming both — one call targets one space. A session connected to
    a single space behaves exactly as before.
  action:
    scope: local
    why: If you connect a second space and an MCP write is refused, the message
      names what it needed. For `a2a_submit` the fix is the draft's `space:`
      field; for the contract sub-verbs, pass `"space"`.
- id: RN-02300-33
  kind: fix
  impact: normal
  subject: the Exchange filter chips count what they will actually show
  detail: >
    The Exchange screen carries four filter axes — direction, state, type,
    deadline — and three of them already counted the way the row reads: "how
    many would I see if I pressed this", with every other selected axis
    honoured. Direction did not. With Open (1) selected, Incoming still read 12
    and Outgoing 13, so the two rows of chips described two different screens
    and only one of them was on the page.

    Every chip now applies the same predicates the rows do, omitting only its
    own axis. Pinned across the whole cross-product of the four axes rather
    than at the single case that was wrong.
  action:
    scope: none
    why: The screen counts correctly on the next render; nothing to run.
- id: RN-02300-34
  kind: fix
  impact: normal
  subject: the Exchange feed is ordered once, on the server, newest first
  detail: >
    The archive reached the dashboard in no order at all — one axon snapshot
    interleaved a 28.07 document between two from 17.08 — so the window cut kept
    an arbitrary subset instead of the newest records, and the header's promise
    of "latest on top" was false. Direction is also a selection ACROSS inbox,
    outbox and archive, so their concatenation showed three ordered runs and no
    order: "2 weeks, 3 weeks, 1 day, 1 day".

    The feed order is now decided in one place and before any window is cut:
    newest first by the creation key the view model already declares, with the
    per-space committed sequence breaking ties on the same instant. Each item
    carries its place in the merged feed as `feedRank`, an additive optional
    member, so the browser restores the server's order by reading one integer
    instead of re-deriving the rule — which is how a newest-by-activity re-sort
    got in once before.
  action:
    scope: none
    why: >
      A truncated archive window now keeps the newest records rather than an
      arbitrary subset; if you were reading the archive through a bounded
      snapshot, what it shows may differ from before.
- id: RN-02300-35
  kind: fix
  impact: low
  subject: every event history on the dashboard reads newest first
  detail: >
    An artifact's "Event history" shipped a "newest first" hint over an
    oldest-first list — worse than either order alone, because a reader who
    trusts the hint reads the sequence backwards without noticing. The thread
    timeline and both contract histories had the same order and no hint at all.

    All four now render newest first and say so where the reader can see it.
    The reversal is display-only: the projection still sorts events ascending
    so a causal chain stays reconstructible, and `a2a html --json` keeps
    reading forwards.
  action:
    scope: none
    why: Reading order only; no data or command changed.
- id: RN-02300-36
  kind: fix
  impact: high
  subject: an agent driving the loop through MCP can record a verdict at all
  detail: >
    `verify` and `close` on the MCP surface hardcoded `event/v1` and the surface
    had no way to express a per-criterion judgement, so an agent that ran the
    exchange through MCP produced a permanently EMPTY verification record — and
    REF-023, the rule that refuses an incomplete one, could never fire on
    anything that surface wrote.

    Both verbs now select `event/v2` in a space whose `min_binary_version` is at
    or above the publication floor, and accept `verdicts` in the same two shapes
    the CLI does: a 0-based index, or a criterion id when the parent declares
    them. A bare index against an id-declaring parent is refused by name, as is
    an unresolvable id, and supplying verdicts below the floor is refused rather
    than silently dropped.

    Two calls naming the same targets with different judgements now also mint
    different operation keys. Before, they collided on one branch and the second
    was discarded as a repeat — the same defect the CLI fixed for itself.
  action:
    scope: none
    why: >
      Nothing you already do changes. A space below the publication floor keeps
      getting `event/v1` exactly as before.
- id: RN-02300-37
  kind: policy
  impact: normal
  subject: naming a criterion by id in `unmet[]` is now judged, not silently accepted
  detail: >
    A response may name an unsatisfied criterion by its id (`{criterion: ac2}`)
    as well as by index. The validators only read the index form, so for an
    id-form response two REJECT-severity rules did nothing at all: REF-018 never
    asked whether the named ids resolve, and LFC-004 never asked whether a
    closing transition left one uncovered by `residue[]`.

    Both now judge either form, and `residue[]` too. If you have been writing
    the id form, refusals you should have been getting will start arriving.
  action:
    scope: space
    why: >
      A response whose `unmet[]` names a criterion id the parent does not
      declare is now refused. That record was always wrong; it was not being
      caught.
- id: RN-02300-38
  kind: break
  impact: normal
  subject: a batch verify, close or respond refuses a judgement set that cannot bind to every target
  detail: >
    `a2a verify R1 R2 --verdict …` resolved the flags against the FIRST target's
    parent and reused the result for every other one. When the parents declared
    different criteria, an index in range for one silently meant a different
    criterion for the next — and the pre-mint echo, which exists so you can see
    what you are asserting, showed only the first parent.

    Each target is now resolved and echoed against its own parent. A set that
    cannot bind identically across the batch is refused by name, saying which
    target disagreed and how.
  action:
    scope: local
    why: >
      A batch over parents with different criteria is now refused where it used
      to succeed. Split it into one invocation per parent; the records it was
      writing before were bound to criteria you never saw.
- id: RN-02300-39
  kind: feat
  impact: normal
  subject: '`a2a new` can mint stable criterion ids, and the verdict flags say what they refer to'
  detail: >
    `a2a new --acceptance-criterion <text>` (repeatable) drafts
    `acceptance_criteria[]` as `{id, text}` with ids `ac1..acN` for the types
    that render `envelope/v2`. Every later reference — a verdict, an `unmet[]`
    entry, a `residue[]` row — can then name the criterion instead of counting
    to it, which is what makes a mis-binding impossible rather than merely
    visible.

    Types pinned to `envelope/v1` keep the bare-string form; their arrays are
    frozen bytes and stay ordinal.

    `--verdict` and `--unmet` help now state that a bare index is 0-based and
    that a criterion id is accepted, which the reporter of the original defect
    asked for and which no help text or skill page said.
  action:
    scope: none
    why: >
      Additive. A hand-written bare-string array still validates and still
      resolves by index.
- id: RN-02300-40
  kind: fix
  impact: high
  subject: '`a2a verify` and `a2a close` now refuse a bad verdict set at submit, not at merge'
  detail: >
    A `verify`/`close` submission carries event files exclusively, and the
    submit-time validator ran its referential pass over drafts only — so the
    loop never executed and the submission was written unjudged. REF-019 (a
    verdict index outside the parent's criteria range) and REF-023 (a verdict
    set that does not name every declared criterion) were built as write gates
    and fired only later, at the merge check.

    Both now run at `a2a submit`, on the CLI and through MCP. The architecture
    plan's own validation matrix has specified this since it was written —
    "lifecycle legality of accompanying events" at the pre-write point — so this
    closes a divergence from the specification rather than adding a rule.

    `skill/a2ahub/troubleshooting.md` stated that REF-023 refuses at submit.
    That sentence was false from the day it was written; it is true now, and the
    page also documents REF-019, which an agent can now meet in its own loop.
  action:
    scope: local
    why: >
      A verdict set that used to submit clean and fail at merge is now refused
      immediately. That is the point — but a loop that treated exit 0 from
      `a2a verify` as "accepted" will now see a non-zero exit and a REF-019 or
      REF-023 message instead. Read the criteria the parent declares and name
      every one of them.
- id: RN-02300-41
  kind: fix
  impact: normal
  subject: 'Both surfaces answer the same way about a parent''s acceptance criteria'
  detail: >
    The MCP surface could not count a parent's criteria at all: its mirror
    resolver implemented none of the three capabilities the referential rules
    ask for, so those rules degraded to "cannot check" and an incomplete verdict
    set submitted clean there even after the CLI began refusing it.

    The resolution moved into `internal/cache`, which both surfaces already
    read, and both now delegate to it. Neither surface imports the other. Both
    also carry compile-time assertions, so a future surface missing the
    capability is a build error rather than a rule that silently stops applying
    — the failure mode that had hidden this class five times.
  action:
    scope: none
    why: >
      No interface changed. An MCP-driven loop simply starts receiving the same
      refusals the CLI gives, with byte-identical text.
- id: RN-02300-42
  kind: fix
  impact: low
  subject: 'Two conditionally-required schema failures report the code they mean'
  detail: >
    A missing field required by a conditional — `waiting_on` for a waiting work
    checkpoint, `session` on a work actor, `conforms_to` for a fixture role —
    resolved to the generic "required field missing" code instead of the
    conditional one, whenever the failing schema pointer sat one level deeper
    than expected or was reached through a `$ref`. The classifier now matches
    the construct rather than one spelling of its path.
  action:
    scope: none
    why: >
      The refusal already happened; only the code and message it carried were
      less precise than the registry intends.
- id: RN-02300-43
  kind: feat
  impact: normal
  subject: 'The local dashboard names what each card fact is, and says so on hover'
  detail: >
    The render-observe pass over every screen lands its fifth slice: a shared
    InfoTooltip, and card-fact attribution across the design-source components
    so each rendered value is traceable to the model field it came from rather
    than to a layout accident. The view vocabulary and the cache reads behind
    those facts move with them, and the UI-contract tests assert the attribution
    instead of the markup that used to carry it.

    One defect the pass found and closed: `ArtifactDetail`'s own `item` branch
    had stopped running in production once the card manifest routed that kind to
    `ExchangeView`, so a passing assertion was reading code no reader could
    reach. The dead markup is gone and the facts are attributed on the surface
    that actually ships.

    What the operator accepted rather than fixed, so a reader is not surprised:
    copy at six sites is unapproved, some sentences read oddly when every clause
    blanks, one card-spec contradicts itself between prose and table, four
    card-specs disagree on placement, Overview is 1.55x the donor's height at an
    identical process count, and Exchange shows three rows where the donor shows
    five.
  action:
    scope: none
    why: >
      Presentation only. No command, flag, schema or stored shape changes, and
      the dashboard is rendered fresh from the mirror on every run.
