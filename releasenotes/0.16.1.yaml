schema: release-notes/v1
version: "0.16.1"
released: "2026-07-30"
headline: "Contract history documentation now matches the shipped Git-backed behavior"
changes:
  - id: RN-01601-1
    kind: fix
    impact: normal
    subject: "Contract digests and version history no longer require unstable paths or a future commit SHA"
    detail: >
      The normative contract now states the behavior the product already
      implements: a contract digest is computed from contract-root-relative
      paths plus file-byte hashes, so identical contract trees have the same
      identity in different checkouts. An `id@version` lookup walks committed
      descriptor history and derives the introducing commit from Git rather
      than expecting a publish event to predict the SHA of its own future
      commit. The optional event `commit` field remains readable for legacy
      and reserved data, but current writers do not populate it and current
      version resolution does not depend on it. Existing spaces and artifacts
      require no migration.
    affects: ["contract digest", "contract version history", "event/v1 schema metadata"]
    action:
      scope: none
      why: >
        This release corrects the public protocol description and schema
        metadata to match existing runtime behavior; commands, stored data,
        and compatibility are unchanged.

  - id: RN-01601-2
    kind: fix
    impact: normal
    subject: "The project front door now explains the work a2ahub makes possible"
    detail: >
      The README no longer opens with implementation vocabulary, copies a
      command catalogue, or carries two MCP limitations that the product
      already fixed. It now starts from the coordination failure a2ahub
      solves, then names the concrete capabilities: readable work chains,
      computed next moves, versioned consumer-aware contracts, the validated
      Git write funnel, the local dashboard, notifications, CLI, and MCP.
      A deterministic release gate keeps the file below its compact size
      ceiling, requires exits to the canonical documentation, and rejects the
      known retired guidance; release review still owns the human judgement
      about clarity and tone.
    affects: ["README", "first-time evaluation", "release gate"]
    action:
      scope: none
      why: >
        Existing users need no action. New readers can evaluate the project
        without learning its command surface first.

  - id: RN-01601-3
    kind: fix
    impact: normal
    subject: "GitHub Releases now show the authored release notes instead of commit noise"
    detail: >
      The release workflow now renders the same versioned YAML corpus used by
      `a2a whatsnew` into a concise GitHub Release page with changes, known
      issues, actions, install guidance, and verification links. GoReleaser
      receives that file through its canonical custom-release-notes option and
      replaces stale bodies on retry. A post-publish assertion byte-compares
      the visible GitHub body with the rendered SSOT. This removes the generic
      platform table, raw commit list, and unsafe quarantine-removal advice
      that previously obscured why a release mattered.
    affects: ["GitHub Releases", "a2a whatsnew", "release workflow"]
    action:
      scope: none
      why: >
        Release readers and updating agents now receive two projections of one
        authored source rather than unrelated summaries.

  - id: RN-01601-4
    kind: policy
    impact: normal
    subject: "Release verification is selected by behavioral impact, not by the size of the version number"
    detail: >
      Full GitHub live verification remains mandatory when an exact public
      candidate changes runtime, funnel, validator, lifecycle, contract
      constraints, or space behavior. A targeted cell remains a diagnostic
      rerun, not proof for a shared-core change. Presentation-only candidates
      may now omit GitHub live when the exact public diff proves that no
      executable or protocol behavior moved; they still require the full
      hermetic gate, release preflight, immutable candidate, and a written
      reason. v0.16.1 uses that presentation-only tier. The latest full
      baseline, v0.16.0, passed 50 of 50 declared live cells; that is complete
      coverage of the declared matrix, not every theoretically possible state.
    affects: ["release runbook", "GitHub Actions usage", "release lead time"]
    action:
      scope: none
      why: >
        This patch changes public explanation, release rendering, comments,
        schema annotations, and version pins, but no a2a runtime or space
        policy behavior exercised by the live matrix.

  - id: RN-01601-5
    kind: known-issue
    impact: normal
    subject: "The macOS companion remains ad-hoc signed and may require manual approval"
    detail: >
      The release cohort authenticates the exact macOS app and ad-hoc signing
      protects its bundle integrity, but the app is not identified or
      notarized through a paid Apple Developer account. A quarantined download
      may require one explicit System Settings → Privacy & Security → Open
      Anyway decision. Interactive Notification Center, Focus, Login Items,
      VS Code trust/profile, and remote-window checks remain release-environment
      evidence rather than claims inferred from hermetic tests.
    affects: ["macOS notifications", "VS Code notifications"]
    action:
      scope: none
      why: >
        Keep Gatekeeper enabled and approve only the A2A Notifier version
        obtained through the verified a2a release cohort.
