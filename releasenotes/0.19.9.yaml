schema: release-notes/v1
version: "0.19.9"
released: "2026-08-07"
headline: "A settled contract stops asking you to do something about it"
changes:
  - id: RN-01909-0
    kind: fix
    impact: high
    subject: "\"Whose move is it\" is one answer now, and a published contract is nobody's move"
    detail: >
      A contract you published and your consumer adopted sat in the thread view
      and on the dashboard as an open item waiting on you, forever, with an
      agent prompt offered for a turn that was not yours. Nothing was wrong with
      the contract. The reason it never cleared is that two different questions
      had been collapsed into one.
      An artifact can be ALIVE — still existing, still able to move — without
      anything being PENDING on anyone. A published contract is the standing
      case: its owner may always publish a successor or deprecate it, and
      neither is a move someone is waiting for. The thread view computed "who is
      waiting" by listing every legal next move and naming whoever may make it,
      so the owner's permanent right to publish read as a permanent debt owed to
      themselves. `a2a inbox --actionable` answered the same question separately,
      with its own five conditions, so the two surfaces could and did disagree.
      There is now one relation, asked by every surface, that answers who owes
      the next move, which transition they owe, and WHY — and "nobody" is a
      verdict it has to justify rather than something that falls out of a
      predicate. Its rows come from the domain's own per-type transition tables,
      and a gate refuses to let a state exist that no row covers, so a new state
      cannot quietly inherit the wrong answer.
      What you will see change: settled work drops off open items and stops
      counting toward a thread's open count, so `settled` and `your_move` mean
      what they say; `a2a thread --json` gained `expected_transition` and `why`
      on each open item; and a plain announcement that requested no
      acknowledgement no longer sits in `--actionable` waiting for one. (A
      DEPRECATION announcement is the exception, and RN-01909-3 explains why:
      a consumer registered against the contract being deprecated still owes
      that acknowledgement, flag or no flag, because it is what unblocks the
      retire.)
      The dashboard's agent prompt is gated on the same relation. It used to be
      built from every move the protocol would ACCEPT, so a settled contract
      handed an agent "publish, deprecate" as though one of them were due — and
      the thread view and the exchange rows built it separately, so the same
      artifact could prompt on one surface and stay quiet on the other. One gate
      now answers for both, and it asks whether the move is owed, not whether it
      is legal.
      Nothing was removed from the record. Every legal move a settled artifact
      still has is listed exactly as before under `next_actions` — the change is
      that it is no longer counted as a debt, and no longer read to an agent as
      an instruction. Everything that happened is still in the transcript,
      permanently, because it is in git.
    affects: ["a2a thread", "a2a inbox --actionable", "a2a html", "a2a outbox"]
    roadmap:
      visibility: shipped
      why: >
        It repairs a question the tool already claimed to answer, on surfaces
        that already exist, rather than opening a capability area.
    action:
      scope: none
      why: >
        Nothing to do. Threads you had been watching sit open for no reason
        should settle by themselves on the next read; if one still names a
        system you think is done, its `why` now says which rule put it there.
  - id: RN-01909-1
    kind: fix
    impact: normal
    subject: "A rejected handoff tells its producer to resubmit, instead of disappearing"
    detail: >
      When a receiver rejects a handoff, the protocol puts the producer on the
      hook: resubmit as a new handoff superseding the rejected one. That move
      was never reported. The thread view decided which artifacts to consider
      before it asked whose move it was, and its list of live states for a
      handoff stopped at `acknowledged` — so a rejected handoff was dropped from
      open items entirely, and the system that owed the resubmission was simply
      never told.
      The rule was always right; nothing ever asked it. A rejected handoff now
      appears as an open item pending on its producer, with `supersede` as the
      transition owed.
      Found by a new conformance path that drives a real rejection and then asks
      whose move it is. It could not have been found by testing the rejection
      transition on its own, because the transition was never the broken part.
    affects: ["a2a thread", "a2a inbox --actionable", "a2a html"]
    action:
      scope: none
      why: >
        Nothing to do. If a handoff of yours was rejected and then went quiet,
        it will reappear as yours to answer on the next read — the record kept
        it the whole time, only the reminder was missing.
  - id: RN-01909-2
    kind: fix
    impact: normal
    subject: "Fulfilling a requirement no longer breaks the thread you fulfilled it on"
    detail: >
      A requirement's only prescribed fulfilment path is to author a response
      naming it as parent and submit that. Doing so permanently flagged the
      requirement's own thread as carrying an illegal transition, and a flagged
      conversation never renders clean again.
      Nothing was wrong with the response or the submission. The thread reader
      gathered a response's events into its parent's stream, and then evaluated
      them against the PARENT's type — so the response's own `submit` was asked
      of a requirement, which has no such move. Only two events genuinely belong
      to a parent (a verification and a dispute), and now only those two cross
      over.
      The same wave also corrected the requirement's own pending answer. It had
      been telling the RECEIVING system to emit the satisfy event, which the
      protocol reserves for the requester — so the surface named a move the tool
      would then refuse. Before a response exists, the receiver owes the work
      (and the tool says so plainly, without pretending it is a transition on
      the requirement); once one lands, the requester owes the satisfy.
      Both were found by conformance paths that walk a whole requirement
      exchange end to end, not by testing either transition alone — neither
      transition was the broken part.
    affects: ["a2a thread", "a2a inbox --actionable", "a2a html"]
    action:
      scope: none
      why: >
        Nothing to do, and nothing to re-file. The flag was computed at read
        time, never stored, so an affected requirement thread reads clean on the
        next look; the response you already submitted stands.
  - id: RN-01909-3
    kind: fix
    impact: normal
    subject: "Three answers about whose move it is, corrected: deprecation acks, departed systems, and human-gated approvals"
    detail: >
      Two independent reviews read the pending-move rules against the domain
      specification, and each finding was then re-checked against the source
      before being believed. Three were real, and all three had the same shape —
      the rule was right and the answer was not.
      A deprecation announcement that did not explicitly request acknowledgements
      told its registered consumers they owed nothing, while the retire check
      refused to retire the contract until those same consumers acknowledged.
      Two parts of the tool disagreed about one question. Requesting
      acknowledgement governs who is addressed by NAME; a system registered as a
      consumer of the contract being deprecated owes the acknowledgement
      regardless, because that is the acknowledgement the retire waits on.
      A counterparty that has LEFT the space kept owing its move forever. It can
      no longer write, so no legal act could ever clear the row, and no agent had
      an action that removed it. Such a system is now excluded, and the pending
      move transfers to the sender as a cancel-or-re-route decision — the item
      stays visible, with an owner who can actually act on it, instead of
      freezing.
      Approving a decision is a human gate: the event has to arrive through a
      pull request under the approving human's own account, and an agent that
      emits it directly is ignored. The pending answer named the approver's
      system without saying any of that, so an agent reading it would try a move
      the tool refuses. Open items now carry `human_gate` when the move they
      name is gated, so an agent can escalate instead of failing. `a2a html`
      carries it too now — see RN-01909-4; when this entry was first written it
      did not, and saying so was better than a claim the dashboard could not
      honour.
    affects: ["a2a thread", "a2a inbox --actionable", "a2a html"]
    action:
      scope: none
      why: >
        Nothing to do. If a deprecation of yours seemed stuck — the retire
        refusing while nobody appeared to owe anything — the consumer blocking it
        is now named. Items owed by a departed system move to you on the next
        read.
  - id: RN-01909-4
    kind: fix
    impact: normal
    subject: "The dashboard says which version was published, who adopted it, and why nobody owes a move"
    detail: >
      The local dashboard was answering less than the tool knew, in four
      separate places, and every one of them had the data already.
      A contract with three publications rendered three identical lines —
      "published the contract", three times — with nothing saying which version
      each created and every link resolving to the version-less contract. The
      events carried their version the whole time; only the view dropped it.
      Rows now read "published contract 1.0.1", and the one that publishes the
      contract ITSELF, carrying no version, is finally distinguishable from the
      two that publish versions.
      A counterparty adopting a contract was invisible on its thread. It now
      appears beside the artifact, naming each consumer and the version it
      actually pinned — which is the number that says whether a deprecation
      still has anybody to wait for. It is deliberately not a timeline entry:
      adoption is a registry fact, not something that happened on this thread,
      and the timeline only ever shows what happened.
      Open items now carry the reason behind them. "Nobody owes a move here" is
      a conclusion the tool is willing to justify, and the dashboard was showing
      the conclusion while withholding the justification. It also now marks a
      move as human-gated where it is one, so an agent reading the dashboard
      stops being told to make a move the protocol would ignore.
      Finally, work-progress rows show the same faces and profile links as every
      other surface, and the cards on the overview page match the ones in
      Threads, Contracts and Exchange in heading size, padding and inner
      structure.
    affects: ["a2a html", "a2a dashboard"]
    action:
      scope: none
      why: >
        Nothing to do. The dashboard is rendered fresh from your local cache
        every time, so the next `a2a html` shows all of it.
  - id: RN-01909-5
    kind: fix
    impact: high
    subject: "Who acted is now read from the environment, not typed in by the agent"
    detail: >
      Every artifact and event records an actor, permanently, in a log nobody
      can rewrite. Until now that field was whatever the caller said it was,
      and two different wrong answers were reaching it.
      The first was a person's OS username recorded under a claim that a
      machine acted — `kind: agent, name: yuranikolaev` — because the OS user
      was the last fallback and nothing above it had answered. The second is
      worse and was found in a live space: `kind: agent, name: codex` on a
      contract publish that codex did not perform. The name had been typed at
      the command line, nothing verified it, and the event carries no
      provenance for it. The commit author is the synthetic identity the write
      funnel always stamps, so git cannot settle it either.
      The authoring templates invited exactly this. Eight of them shipped the
      line `actor: {kind: agent, name: <agent-name>, ...}`, and an agent asked
      to fill in its own name will sometimes fill in a different one.
      So the order is inverted. When the environment identifies the coding
      agent that is running, that verdict wins outright over any flag, env var,
      harness default or config value — an agent can be talked into naming the
      wrong tool, an environment cannot. Detection is wired only for vendors
      whose environment has actually been read on a real machine; every other
      vendor ships a recognized id with no detector, so `A2A_ACTOR_AGENT=<id>`
      records it correctly today rather than a detector guessing wrongly.
      An explicit `--actor-kind human` still suppresses detection, because a
      person saying "this was me" is a claim about something else entirely.
      The human an agent acted FOR is not written into the event at all. It is
      derived when reading, from the space manifest's `owners` for the acting
      system — where it already lives, and where it stays correct when the
      owner changes.
    affects: ["a2a new", "a2a submit", "a2a lifecycle verbs", "a2a contract", "a2a mcp"]
    action:
      scope: local
      why: >
        Nothing to do for most invocations — the next write simply records a
        truer actor. Two cases are worth knowing about. If you keep a work
        stream open across this upgrade, its reporter identity is immutable for
        the life of that work id, so a checkpoint written after the upgrade can
        be refused for changing the reporter name; pass `--actor-name <the
        original>` to finish it, or start a new work id. And if you author
        envelopes by hand, stop filling in `actor.name` — the templates no
        longer ask you to, and a value you type there is exactly how the wrong
        attribution above happened.
  - id: RN-01909-6
    kind: fix
    impact: low
    subject: "Three tests stopped spending a production timeout to prove the rule it enforces"
    detail: >
      Nothing about the shipped tool changes. This is recorded because the
      files touched are production files, and a release note that stayed silent
      about them would leave the next reader wondering what moved.
      Three bounds — the cache's mirror-sync budget, the mirror lock's wait, and
      the git index-lock retry — could only be reached by tests that spent them.
      Each test asserts a SHAPE: the wait ends, and it ends with a typed
      contention error rather than a hang. None of them asserts the number of
      seconds. So the bound became a parameter whose production default is the
      same constant it always was, and the tests hand in a short one:
      13.05s to 0.48s, 6.16s to 0.39s, 3.03s to 0.32s.
      Each test's upper bound was rebased onto its own budget at the same time.
      Left pointing at the production constants they would have become 20s and
      10s ceilings on runs that finish in a third of a second — unreachable, and
      therefore asserting nothing. That is how a faster suite quietly becomes a
      weaker one.
    affects: []
    action:
      scope: none
      why: >
        Nothing to do. The timeouts a2a actually enforces are unchanged; only
        the tests that prove them are cheaper to run.
  - id: RN-01909-7
    kind: fix
    impact: high
    subject: "The dashboard names the agent that acted, and stops calling a healthy contract unfinished work"
    detail: >
      Four things the local dashboard was saying that were not true, all found
      by reading the rendered page against a real space rather than its JSON.
      An act now shows BOTH identities. The system owner's face and name lead,
      and the agent that performed the write sits as a badge on the avatar with
      a popover naming it. Before this, one of the two was always hidden: the
      thread view overwrote the recorded actor with the owner, so a publish by
      an agent read as though a person had made it, while the overview card did
      the opposite and printed a bare OS username.
      Whether a badge appears depends on what the event recorded. Events written
      before this release mostly carry an OS username, which names no agent and
      gets no badge; every event written from now on records the detected agent,
      so its badge follows automatically.
      The network map no longer describes a published contract as unfinished
      work. It had been aggregating everything still OPEN — which a published
      contract is, since it can always be deprecated — and labelling that set
      with the vocabulary of things somebody owes a move on. The same panel then
      said «кого ждут: никого». Now the map says "live work", counts separately
      how many of those documents actually owe a move, and colours only those.
      A contract's thread shows who adopted it. `a2a contract adopt` writes the
      consumer's registry and emits no event, so a counterparty's most
      consequential act had no place in any chronology and a contract's thread
      read as its owner talking to themselves. The row is derived from the
      consumer's own registry and says so — it is not styled as an event,
      because there is no event.
      A contract version's package is now a collapsible tree with per-format
      icons instead of two flat path lists, its prose folds through the same
      disclosure component the rest of the dashboard uses, and an overview card
      with nothing to report is short instead of four lines of "none".
    affects: ["a2a html"]
    action:
      scope: none
      why: >
        Nothing to do. The dashboard is rendered fresh from your local cache
        every time, so the next `a2a html` shows all of it. Agent badges appear
        on events written by this release onward; older events keep whatever
        actor they recorded, because the log is append-only.
