schema: release-notes/v1
version: 0.24.0
released: "2026-08-21"
headline: Verdicts stop being read off claims, and the checks that would have
  noticed are driven by something
changes:
- id: RN-02400-0
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      The notify workflow shipped in v0.23.0 with an input whose type could not
      express what its own comment promised, so every space that updated had a
      failing notify job. This is the release that fixes it, and a space on
      v0.23.0 needs a second `a2a space update` to pick the fix up — the
      workflow at that tag is immutable.
  impact: high
  subject: the notify workflow's optional limit input means unset when unset
  detail: >
    `limit` was `type: number, required: false` with no default, beside a
    comment stating "Empty means: let the CLI's own default decide". A number
    type has no empty member. GitHub resolves the unset input to `0`, the guard
    tested for non-emptiness, `"0"` is non-empty, and every push failed with
    `--limit must be positive`.

    It is now `type: string` with an explicit empty default and a two-stage
    guard: empty is skipped, a positive integer is forwarded, anything else is
    refused before `a2a` is invoked. The validation is hoisted above the
    range-mode branch, so `limit: 0` is refused under `--all` too.

    The gate that judges these workflows gained a fifth invariant, and it reads
    BOTH reusable workflows: a `required: false` input over a non-string type
    must carry a default, and its description may not claim emptiness over a
    type with no empty member.
  affects:
  - ci
  action:
    scope: space
    why: >
      A space already updated to v0.23.0 must run `a2a space update` again once
      this release is tagged. A space that cannot wait can set `limit:`
      explicitly in its own `a2a-notify.yml` caller — one line, no release
      needed.
- id: RN-02400-1
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      `a2a update` runs as the OLD binary, so anything it writes from its own
      embedded tree is the previous version's content. The skill refresh did
      exactly that and stamped the result with the NEW version.
  impact: high
  subject: a2a update refreshes the skill with the binary it just installed
  detail: >
    The refresh wrote the old process's embedded skill tree and stamped it with
    the version just installed, and the installer begins by removing the
    existing tree. So update did not merely fail to refresh the skill — it
    actively rewrote it to the previous version's content under the new
    version's stamp. The defect dates to 2026-07-23; v0.23.0 made it visible by
    adding a reference page the older tree lacks.

    The refresh now execs the swapped binary, the way the post-update digest
    twenty lines above it already did.

    `a2a doctor`'s matching check no longer reads only the version stamp. It
    compares the installed TREE against the binary's own embedded one and can
    now FAIL, naming what is missing, modified or unexpected. Before this it
    returned a pass in every branch — it could not fail at all, which is why a
    downgraded tree looked healthy for a month.
  affects:
  - cli
  action:
    scope: local
    why: >
      Run `a2a skill install` once after updating to repair a tree an earlier
      `a2a update` downgraded. `a2a doctor` now tells you whether you need to.
- id: RN-02400-2
  kind: schema
  roadmap:
    visibility: shipped
    why: >
      A data delivery is one submit; the response announcing it is a second,
      independent pull request. Nothing in a space distinguished "delivered,
      bytes pending" from "delivered, no bytes were ever involved", so a
      response could announce a package whose payload had not landed.
  impact: normal
  subject: a response can name the delivery it announces, and an unlanded package
    is refused
  detail: >
    `respond --delivers <DP-id>` records which data package a response
    announces. The write funnel resolves every named package against the
    space's main branch and refuses the response when one has not landed,
    naming the package and REF-024. Both write surfaces inherit the refusal,
    because it lives below them rather than in either one.

    A response carrying no `delivers` is untouched. `delivered` is the ordinary
    result word for any work request, and the declared conformance paths use it
    with no package anywhere near them — an earlier, cruder version of this
    check reddened five of them and was reverted.

    Two responses on one parent that differ only in the package they announce
    are two distinct acts and now derive distinct operation keys. A response
    carrying no packages derives exactly the key it derived before this field
    existed, so nothing already committed changes branch.

    The guide card in `a2a html`'s local dashboard, and the same card on the
    public features page, name `respond --delivers` where they described
    `--ref` as the delivery claim. `--ref` still records the handoff that
    carried the payload; what changed is that the package has its own field
    and its own refusal.
  affects:
  - contracts
  - cli
  action:
    scope: none
    why: >
      No action. The flag is optional and additive; every existing response and
      every already-merged artifact is unaffected.
- id: RN-02400-3
  kind: policy
  roadmap:
    visibility: shipped
    why: >
      A consumer was only ever visible to `retire` if it DECLARED itself. A
      system demonstrably eating a contract through verify-passed deliveries,
      while declaring nothing, was invisible to the rule and never learned the
      contract was going away.
  impact: normal
  subject: consumption observed from committed artifacts informs retire and
    deprecate
  detail: >
    `retire` now names systems whose consumption is observed but undeclared,
    and PROCEEDS — observed consumption informs, and gates nothing. No new
    refusal, no new code, no path that can block on it alone.

    The other half is the one that matters to the consumer: a deprecation
    announcement now reaches the inbox of a system with observed-but-undeclared
    consumption, so it finds out before the contract is gone. Both surfaces
    report it; a rule one surface can express and the other cannot is a shape
    this release is partly about removing.

    With no deprecation announcement present, observed consumption changes
    nothing anywhere.
  affects:
  - contracts
  action:
    scope: none
    why: >
      No action. Declaring consumption in `consumes.yaml` remains the right
      thing to do and is what makes the observation unnecessary.
- id: RN-02400-4
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      Four independent readers of a feedback record compared key blocks byte
      for byte, so a comment on a line made them disagree about the line while
      agreeing about the value it carries.
  impact: normal
  subject: a feedback record's meaning is its values, and every reader agrees
  detail: >
    A record submitted from the authoring template could carry the template's
    own scaffolding comment on its `id:` line. Four readers — the sync, the
    corpus check, the intake policy and the publisher — compared sections
    byte-wise and refused a record nothing was wrong with.

    Submission now normalizes the record so the scaffolding never reaches it,
    and every reader compares values. One shared adversarial corpus is asked of
    all of them, so two implementations of one guarantee cannot drift apart
    quietly.
  affects:
  - cli
  action:
    scope: none
    why: >
      No action. Records already submitted are unaffected; the readers now
      agree about them either way.
- id: RN-02400-5
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      `notify setup` named a repository derived from the local git remote
      without ever proving the checkout was a space, so an agent could relay a
      secret-setting command for the wrong repository to a human.
  impact: normal
  subject: notify setup proves its checkout before it names a repository
  detail: >
    Setup now proves the checkout is a space before any line naming a
    repository is printed, using the same read `notify verify` already
    performed — the two verbs could previously reach opposite conclusions from
    one file.

    "This is not a space checkout" and "this space has no route yet" stay
    distinct: the first tells you to change directory, the second to wait for a
    pull request, and the second still exits zero. A space checkout with no
    `origin` remote keeps printing the visible placeholder rather than
    refusing.
  affects:
  - cli
  action:
    scope: none
    why: No action. The refusal only fires where the previous behaviour was wrong.
- id: RN-02400-6
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      `a2a submit` is documented as "validate + open a PR". It validated the
      descriptor and then carried fifteen sidecar files it never validated, so
      the space's own required check was the first thing to judge them — and it
      judged a declared, frontmatter-free companion as a malformed artifact.
  impact: normal
  subject: submit validates every file it carries, and the space's check judges
    the same set
  detail: >
    A contract's descriptor can declare companion files — a changelog, a schema,
    notes — that are not envelope artifacts and carry no frontmatter. `submit`
    carried them unvalidated; `validate --ci` then met one and refused it as a
    broken artifact. Same binary on both sides, disagreeing about the same file.

    One classifier now decides what a carried file IS, and both surfaces and both
    validation modes ask it. The set of paths `submit` carries equals the set
    `validate --ci` classifies — asserted as a set equality, because a check on
    one file cannot see a divergence.

    `submit` also judges membership in both directions before any pull request
    opens: a carried file the descriptor does not declare is refused, and a
    declared entry whose file is missing is refused. On refusal it prints the
    carried list with each file's classification, which previously appeared only
    on success.

    `validate --all` now reports on what `submit` would carry rather than on
    top-level drafts alone — in the reported shape, 27 paths where it had been
    12 — so it is a genuine dry run of the refusals.

    An already-merged companion is never re-judged: the undeclared refusal fires
    at the pull-request gate only.

    A re-publication is not caught in this either. It carries only what changed,
    and a companion that did not change is already in the space — the check asks
    the space before calling a declared entry missing, so publishing 1.1.0 of a
    contract whose schema is unchanged submits exactly as it did before. Where a
    verb cannot see the space at all — `validate --all` runs against staging and
    works with no space connected — it reports the half it can prove and stays
    silent on the half it cannot, rather than guessing.
  affects:
  - contracts
  - cli
  action:
    scope: none
    why: >
      No action. A contract whose descriptor already declares its companions
      submits exactly as before; one that carries an undeclared file now learns
      so locally instead of from its space's CI.
- id: RN-02400-7
  kind: feat
  roadmap:
    visibility: shipped
    why: >
      The MCP surface could not author the field the CLI had just gained, which
      is the recurring shape where one surface can express a rule and the other
      cannot.
  impact: low
  subject: the MCP surface can name a delivered package too
  detail: >
    `a2a_lifecycle_respond` accepts the same `delivers` the CLI's `--delivers`
    writes, and the event it produces is byte-identical to the CLI's for the
    same inputs.

    The refusal was never asymmetric — it lives below both surfaces at the write
    funnel, so an MCP caller announcing an unlanded package was already refused.
    What was missing was the ability to announce a landed one.
  affects:
  - cli
  action:
    scope: none
    why: No action. The field is optional and additive on both surfaces.
- id: RN-02400-8
  kind: fix
  roadmap:
    visibility: shipped
    why: >
      The notify workflow compiled the binary from a remote module reference
      while its sibling downloaded a signed release asset and verified the
      signature. Notify's own comments cited that sibling as its model — a claim
      about a file that had changed the same day.
  impact: normal
  subject: the notify workflow installs the same signed, verified binary its
    sibling installs
  detail: >
    A space's notify job no longer resolves or compiles anything. It downloads
    the published linux binary and its signature bundle for the pinned release
    and verifies them with `cosign verify-blob`, using the same identity and
    issuer the validate workflow uses — compared character for character rather
    than described as equivalent.

    A signature that does not verify fails the job on the first attempt, is not
    retried, and leaves no installed binary behind.

    The job also stops needing a Go toolchain at all, which removes the module
    graph resolution that dominated its runtime.
  affects:
  - ci
  action:
    scope: space
    why: >
      Picked up by `a2a space update` after this release, in the same update
      that carries the notify limit fix.
- id: RN-02400-9
  kind: policy
  roadmap:
    visibility: shipped
    why: >
      A rule that nothing exercises is indistinguishable from a rule that is
      wrong. This release found one that had been shipped, unit-proven and never
      executed against the real binary, and closed the state rather than the
      instance.
  impact: low
  subject: every refusal this tool can produce is exercised, or carries a written
    reason why not
  detail: >
    The refusal a response earns for announcing an unlanded data package was
    built in August to close a reported defect, proven by unit tests, and driven
    by no end-to-end path — so nothing ever confirmed it fires through the
    binary you actually run.

    A gate now refuses any rejecting error code that no declared conformance
    path provokes, unless the registry carries a written reason. Fifty codes
    carry one today and the gate prints that count on every run, so the debt is
    visible and re-derivable rather than remembered. Retiring one is a one-line
    change: drive it from a declared path, delete its reason.

    Nothing about how the tool behaves changes. What changes is what a refusal
    means when you meet it: either something ran it end to end, or the reason it
    did not is written down where you can read it.
  affects:
  - contracts
  action:
    scope: none
    why: >
      No action. This governs how refusals are proven, not what they refuse.
