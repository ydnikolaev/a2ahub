schema: release-notes/v1
version: "0.24.0"
released: "2026-08-13"
headline: "The dashboard starts explaining whose move it is instead of making the reader reverse-engineer the protocol"
changes:
  - id: RN-02400-0
    kind: feat
    roadmap:
      visibility: shipped
      why: >
        The first dashboard-coherence slice is user-visible and additive: it
        proves the complete domain-to-card path before the remaining views are
        rebuilt on the same contract. Hiding it until the whole epic closes
        would leave the current binary's changed dashboard and JSON surface
        undocumented.
    impact: normal
    subject: "Overview attention cards say whose turn it is, what move is expected, and why"
    detail: >
      Attention cards now carry the pendency verdict the domain already
      computed: waiting systems, expected transition and any human gate. A
      bilingual sentence explains the active reason in the card body; the
      rule citation remains available under Technical detail instead of being
      presented as the explanation.

      The reason codes and pendency-row identity are typed and enumerated from
      their domain homes. Inbox and outbox JSON gain `human_gate` only when a
      gate exists; existing fields keep their values and empty rows keep the
      key omitted. The browser no longer infers this gate from a coincidental
      reason string, and the vocabulary gate now refuses the equivalent
      inline state-classification chain as well as a hand-built list.

      This is the first slice of the dashboard-coherence work, not a claim
      that every dashboard family has already been rebuilt. The existing 4 MiB
      shell ceiling remains in force; measured headroom requires the next
      mapping phase to add honest item-family admission bounds.
    affects: [dashboard, "a2a inbox", "a2a outbox", MCP]
    action:
      scope: none
      why: "No action. Regenerate a dashboard with the current binary to see the clearer attention cards; existing JSON consumers may ignore the additive human_gate key."
